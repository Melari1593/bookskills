<style>

  --surface: #ffffff;
  --ink: #1d2230;
  --muted: #5d6475;
  --line: #d9dce4;

  --edge-hi: rgba(15, 111, 116, .85);

  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --k-chapter: #1d2230; --k-ingredient: #0f8a6b; --k-ingredient_class: #57a773;
  --k-anatomy: #c2477a; --k-mechanism: #6b4fbb; --k-condition: #d0612f;
  --k-product: #2f78c4; --k-technique: #a07a12; --k-regulation: #7a5c45;
  --k-concept: #4a8fa3; --k-organization: #8a8f9c; --k-region: #b84343;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1e28; --ink: #e7e9ef; --muted: #9aa1b2; --line: #2c3241;
  --accent: #5cc4c6; --accent-soft: #173a3d; --edge: rgba(200, 210, 235, .13); --edge-hi: rgba(92, 196, 198, .9);
  --k-chapter: #e7e9ef; --k-ingredient: #3cc49b; --k-ingredient_class: #86d39b;
  --k-anatomy: #ec7aa8; --k-mechanism: #a58cf0; --k-condition: #f08a55;
  --k-product: #69a8ee; --k-technique: #dbb54a; --k-regulation: #c19a7c;
  --k-concept: #7cc0d4; --k-organization: #a9aebb; --k-region: #ea7676;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e28; --ink: #e7e9ef; --muted: #9aa1b2; --line: #2c3241;
  --accent: #5cc4c6; --accent-soft: #173a3d; --edge: rgba(200, 210, 235, .13); --edge-hi: rgba(92, 196, 198, .9);
  --k-chapter: #e7e9ef; --k-ingredient: #3cc49b; --k-ingredient_class: #86d39b;
  --k-anatomy: #ec7aa8; --k-mechanism: #a58cf0; --k-condition: #f08a55;
  --k-product: #69a8ee; --k-technique: #dbb54a; --k-regulation: #c19a7c;
  --k-concept: #7cc0d4; --k-organization: #a9aebb; --k-region: #ea7676;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); margin: 0; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font: 700 20px/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 small { display: block; font: 400 12px/1.4 var(--body); color: var(--muted); letter-spacing: 0; }
.stats { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.search { position: relative; margin-left: auto; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--body); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; z-index: 5; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; max-height: 320px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.results li button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 0; background: none; color: var(--ink); font: 13px var(--body); border-radius: 4px; cursor: pointer; }
.results li button:hover, .results li button:focus { background: var(--accent-soft); outline: none; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.bench { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

canvas.dragging { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 12px var(--body); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip:focus-visible { outline: 2px solid var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.tools button, .tools select { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 12px var(--body); cursor: pointer; max-width: 220px; }
aside { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 18px 20px 28px; min-width: 0; }
.eyebrow { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.summary cite { display: block; font: 11px var(--mono); font-style: normal; color: var(--muted); margin-top: 2px; }
.rel { margin: 0 0 10px; }
.rel b { font: 500 12px var(--mono); color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.links button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; padding: 2px 7px; font: 12.5px var(--body); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.links button:hover, .links button:focus-visible { border-color: var(--accent); outline: none; }
.empty { color: var(--muted); }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .app { height: auto; }
  .search { max-width: none; margin-left: 0; }
  .legend { flex-wrap: nowrap; overflow-x: auto; left: 0; right: 0; bottom: 8px; max-width: none; padding: 0 12px; }
  .chip { flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header>
    <h1>Harry's Cosmeticology<small>Grafo de conocimiento · Vol. 1, Vol. 2 y Sostenibilidad (9.ª ed., 2015)</small></h1>
    <div class="stats" id="stats"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar concepto, ingrediente, capítulo…" autocomplete="off" aria-label="Buscar en el grafo">
      <ul class="results" id="results" hidden></ul>
    </div>
  </header>
  <main>
    <div class="bench">
      <canvas id="cv" aria-label="Grafo de conceptos; arrastra para mover, rueda o pellizco para acercar"></canvas>
      <div class="tools">
        <select id="community" aria-label="Enfocar comunidad"><option value="">Todas las comunidades</option></select>
        <button id="fit" type="button">Encuadrar</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
const G = /*__GRAPH__*/null;
const KIND_ES = { chapter: "Capítulo", ingredient: "Ingrediente", ingredient_class: "Familia de ingredientes", anatomy: "Anatomía", mechanism: "Mecanismo", condition: "Afección", product: "Producto", technique: "Técnica", regulation: "Regulación", concept: "Concepto", organization: "Organización", region: "Región" };
const REL_ES = { covers: "trata", part_of: "parte de", is_a: "es un(a)", contains: "contiene", treats: "trata (afección)", improves: "mejora", protects_against: "protege contra", causes: "causa", contributes_to: "contribuye a", inhibits: "inhibe", activates: "activa", increases: "aumenta", decreases: "disminuye", regulates: "regula", used_in: "se usa en", measured_by: "se mide con", produced_by: "producido por", derived_from: "derivado de", interacts_with: "interactúa con", requires: "requiere", conceptually_related_to: "relacionado con", semantically_similar_to: "similar a", contrasts_with: "contrasta con" };
const BOOK_ES = { v1: "Vol. 1", v2: "Vol. 2", sus: "Sostenibilidad" };

const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
let colors = {};
function readColors() {
  const c2 = getComputedStyle(document.documentElement);
  colors = { edge: c2.getPropertyValue("--edge").trim(), hi: c2.getPropertyValue("--edge-hi").trim(), ink: c2.getPropertyValue("--ink").trim(), muted: c2.getPropertyValue("--muted").trim(), bg: c2.getPropertyValue("--bg").trim(), surface: c2.getPropertyValue("--surface").trim() };
  for (const k of Object.keys(KIND_ES)) colors[k] = c2.getPropertyValue("--k-" + k).trim();
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });
new MutationObserver(() => { readColors(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const nodes = G.nodes, byId = new Map(nodes.map((n, i) => (n.i = i, [n.id, n])));
const edges = G.edges.filter(e => byId.has(e.source) && byId.has(e.target)).map(e => ({ ...e, s: byId.get(e.source), t: byId.get(e.target) }));
const adj = new Map(nodes.map(n => [n.id, []]));
for (const e of edges) { adj.get(e.source).push(e); adj.get(e.target).push(e); }
const commLabel = new Map(G.communities.map(c => [c.id, c.label]));
const chapterLabel = new Map(nodes.filter(n => n.kind === "chapter").map(n => [n.sources[0], n.label]));
document.getElementById("stats").textContent = `${G.meta.nodes} nodos · ${G.meta.edges} aristas · ${G.meta.communities} comunidades`;

// ---------- layout: seed by community on a spiral, then a force simulation
const comms = [...new Set(nodes.map(n => n.community))];
const cIndex = new Map(comms.map((c, i) => [c, i]));
nodes.forEach(n => {
  const ci = cIndex.get(n.community), a = ci * 2.399, r = 90 * Math.sqrt(ci + 1);
  n.x = Math.cos(a) * r + (Math.random() - .5) * 60; n.y = Math.sin(a) * r + (Math.random() - .5) * 60;
  n.vx = 0; n.vy = 0; n.r = 2.5 + Math.sqrt(n.degree) * (n.kind === "chapter" ? 1.4 : 1.1);
});
let alpha = 1;
function tick() {
  const N = nodes.length, k = 900 * alpha;
  for (let i = 0; i < N; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < N; j++) {
      const b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + .01;
      if (d2 > 90000) continue;
      const f = k / d2; dx *= f; dy *= f; a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
    }
  }
  for (const e of edges) {
    const a = e.s, b = e.t, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = e.relation === "covers" ? 110 : 45, str = (e.relation === "covers" ? .012 : .05) * alpha;
    const f = (d - rest) * str / d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const n of nodes) { n.vx -= n.x * .002 * alpha; n.vy -= n.y * .002 * alpha; n.x += n.vx; n.y += n.vy; n.vx *= .55; n.vy *= .55; }
  alpha *= .985;
}

// ---------- view
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, view = { x: 0, y: 0, k: 1 };
function resize() { const r = cv.getBoundingClientRect(); dpr = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; draw(); }
new ResizeObserver(resize).observe(cv);
const hiddenKinds = new Set(); let focusComm = null, selected = null, hover = null;
const visible = n => !hiddenKinds.has(n.kind) && (focusComm === null || n.community === focusComm || (selected && isNeighbor(n)));
let neighborSet = new Set();
function isNeighbor(n) { return neighborSet.has(n.id); }

function draw() {
  if (!W) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.translate(W / 2 + view.x, H / 2 + view.y); ctx.scale(view.k, view.k);
  const sel = selected;
  ctx.lineWidth = 1 / view.k;
  ctx.strokeStyle = colors.edge; ctx.beginPath();
  for (const e of edges) {
    if (!visible(e.s) || !visible(e.t)) continue;
    if (sel && (e.s === sel || e.t === sel)) continue;
    ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y);
  }
  ctx.stroke();
  if (sel) {
    ctx.strokeStyle = colors.hi; ctx.lineWidth = 1.6 / view.k; ctx.beginPath();
    for (const e of adj.get(sel.id)) { if (!visible(e.s) || !visible(e.t)) continue; ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); }
    ctx.stroke();
  }
  for (const n of nodes) {
    if (!visible(n)) continue;
    const dim = sel && n !== sel && !neighborSet.has(n.id);
    ctx.globalAlpha = dim ? .28 : 1;
    ctx.fillStyle = colors[n.kind] || colors.muted;
    ctx.beginPath();
    const r = Math.max(n.r, 2.6 / view.k);
    if (n.kind === "chapter") ctx.rect(n.x - r, n.y - r, r * 2, r * 2); else ctx.arc(n.x, n.y, r, 0, 6.2832);
    ctx.fill();
    if (n === sel || n === hover) { ctx.lineWidth = 2.5 / view.k; ctx.strokeStyle = colors.hi; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  const fs = 12 / view.k; ctx.font = `500 ${fs}px "IBM Plex Sans", system-ui, sans-serif`; ctx.textBaseline = "middle";
  const thresh = view.k > 2.2 ? 0 : view.k > 1.3 ? 8 : view.k > .8 ? 18 : 34;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const show = n === sel || n === hover || (sel ? neighborSet.has(n.id) : n.degree >= thresh);
    if (!show) continue;
    const label = n.label.length > 42 ? n.label.slice(0, 40) + "…" : n.label;
    ctx.lineWidth = 3 / view.k; ctx.strokeStyle = colors.bg; ctx.strokeText(label, n.x + n.r + 3 / view.k, n.y);
    ctx.fillStyle = colors.ink; ctx.fillText(label, n.x + n.r + 3 / view.k, n.y);
  }
}

function fit(list) {
  const pts = (list || nodes).filter(visible); if (!pts.length || !W) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of pts) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const k = Math.min(W / (x1 - x0 + 80), H / (y1 - y0 + 80), 3);
  view = { k, x: -(x0 + x1) / 2 * k, y: -(y0 + y1) / 2 * k }; draw();
}

let running = true;
function loop() { for (let i = 0; i < 3 && alpha > .02; i++) tick(); draw(); if (alpha > .02) requestAnimationFrame(loop); else { running = false; fit(); } }
for (let i = 0; i < 60; i++) tick();
requestAnimationFrame(() => { resize(); fit(); loop(); });

// ---------- interaction
const toWorld = (px, py) => [(px - W / 2 - view.x) / view.k, (py - H / 2 - view.y) / view.k];
function pick(px, py) {
  const [x, y] = toWorld(px, py); let best = null, bd = Infinity;
  for (const n of nodes) { if (!visible(n)) continue; const d = (n.x - x) ** 2 + (n.y - y) ** 2, rr = Math.max(n.r, 6 / view.k) ** 2; if (d < rr && d < bd) { bd = d; best = n; } }
  return best;
}
let drag = null; const pointers = new Map();
cv.addEventListener("pointerdown", ev => { cv.setPointerCapture(ev.pointerId); pointers.set(ev.pointerId, [ev.offsetX, ev.offsetY]); drag = { x: ev.offsetX, y: ev.offsetY, vx: view.x, vy: view.y, moved: false, dist: null }; cv.classList.add("dragging"); });
cv.addEventListener("pointermove", ev => {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (drag && pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (drag.dist) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / drag.dist); drag.dist = d; drag.moved = true; return;
  }
  if (drag) { const dx = ev.offsetX - drag.x, dy = ev.offsetY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; view.x = drag.vx + dx; view.y = drag.vy + dy; draw(); return; }
  const h = pick(ev.offsetX, ev.offsetY); if (h !== hover) { hover = h; cv.title = h ? h.label : ""; draw(); }
});
cv.addEventListener("pointerup", ev => { pointers.delete(ev.pointerId); cv.classList.remove("dragging"); if (drag && !drag.moved) { const n = pick(ev.offsetX, ev.offsetY); select(n); } if (!pointers.size) drag = null; });
function zoomAt(px, py, f) { const k = Math.min(8, Math.max(.08, view.k * f)); f = k / view.k; view.x = px - W / 2 - (px - W / 2 - view.x) * f; view.y = py - H / 2 - (py - H / 2 - view.y) * f; view.k = k; draw(); }
cv.addEventListener("wheel", ev => { ev.preventDefault(); zoomAt(ev.offsetX, ev.offsetY, Math.exp(-ev.deltaY * .0015)); }, { passive: false });
document.getElementById("fit").onclick = () => fit(focusComm !== null ? nodes.filter(n => n.community === focusComm) : null);

// legend (kind filters)
const legend = document.getElementById("legend");
const kindCounts = {}; nodes.forEach(n => kindCounts[n.kind] = (kindCounts[n.kind] || 0) + 1);
Object.keys(KIND_ES).filter(k => kindCounts[k]).forEach(k => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:var(--k-${k});${k === "chapter" ? "border-radius:2px" : ""}"></span>${KIND_ES[k]} <span style="color:var(--muted)">${kindCounts[k]}</span>`;
  b.onclick = () => { const on = hiddenKinds.has(k); on ? hiddenKinds.delete(k) : hiddenKinds.add(k); b.setAttribute("aria-pressed", String(on)); draw(); };
  legend.appendChild(b);
});
const csel = document.getElementById("community");
G.communities.filter(c => c.size >= 4).forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.label} (${c.size})`; csel.appendChild(o); });
csel.onchange = () => { focusComm = csel.value === "" ? null : +csel.value; fit(focusComm !== null ? nodes.filter(n => n.community === focusComm) : null); };

// search
const q = document.getElementById("q"), results = document.getElementById("results");
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
q.addEventListener("input", () => {
  const s = norm(q.value.trim()); results.innerHTML = "";
  if (s.length < 2) { results.hidden = true; return; }
  const hits = nodes.filter(n => norm(n.label).includes(s) || n.aliases.some(a => norm(a).includes(s))).sort((a, b) => (norm(a.label).startsWith(s) ? 0 : 1) - (norm(b.label).startsWith(s) ? 0 : 1) || b.degree - a.degree).slice(0, 14);
  for (const n of hits) { const li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.innerHTML = `<span class="dot" style="background:var(--k-${n.kind})"></span>`; b.append(n.label); b.onclick = () => { select(n, true); results.hidden = true; q.value = ""; }; li.appendChild(b); results.appendChild(li); }
  results.hidden = !hits.length;
});
q.addEventListener("keydown", ev => { if (ev.key === "Enter") results.querySelector("button")?.click(); if (ev.key === "Escape") results.hidden = true; });

// panel
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function srcName(f) { const b = (f || "").split("-")[0]; return `${BOOK_ES[b] || b} · ${chapterLabel.get(f) || f}`; }
function select(n, center) {
  selected = n || null; neighborSet = new Set();
  if (n) { neighborSet.add(n.id); for (const e of adj.get(n.id)) { neighborSet.add(e.source); neighborSet.add(e.target); } }
  if (n && center) { const k = Math.max(view.k, 1.4); view = { k, x: -n.x * k, y: -n.y * k }; }
  renderPanel(); draw();
}
function renderPanel() {
  const n = selected;
  if (!n) {
    const top = nodes.filter(m => m.kind !== "chapter").slice(0, 16);
    const chs = nodes.filter(m => m.kind === "chapter").sort((a, b) => a.sources[0].localeCompare(b.sources[0], undefined, { numeric: true }));
    const btn = m => `<button type="button" data-id="${esc(m.id)}"><span class="dot" style="background:var(--k-${m.kind});${m.kind === "chapter" ? "border-radius:2px" : ""}"></span>${esc(m.label)}</button>`;
    panel.innerHTML = `<p class="eyebrow">Vista general</p><h2>Tres libros, un mapa</h2><p class="empty">Toca un nodo o búscalo arriba para leer qué dice el libro y con qué se relaciona. Los cuadrados son capítulos; los círculos, conceptos coloreados por tipo.</p>`
      + `<h3>Conceptos más conectados</h3><div class="links">${top.map(btn).join("")}</div>`
      + `<h3>Capítulos</h3><div class="links">${chs.map(btn).join("")}</div>`;
    return;
  }
  const groups = new Map();
  for (const e of adj.get(n.id)) {
    const out = e.source === n.id, other = out ? e.t : e.s;
    const key = out ? REL_ES[e.relation] || e.relation : `← ${REL_ES[e.relation] || e.relation}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ other, e });
  }
  const order = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
  let h = `<p class="eyebrow"><span class="dot" style="background:var(--k-${n.kind})"></span>${KIND_ES[n.kind] || n.kind} · ${esc(commLabel.get(n.community) || "")}</p>`;
  h += `<h2>${esc(n.label)}</h2>`;
  if (n.aliases.length) h += `<p class="aliases">También: ${esc(n.aliases.slice(0, 8).join(", "))}</p>`;
  if (n.authors) h += `<p class="aliases">Autores: ${esc(n.authors.join(", "))}</p>`;
  h += `<div class="meta"><span>${n.degree} conexiones</span><span>${n.sources.length} ${n.sources.length === 1 ? "capítulo" : "capítulos"}</span></div>`;
  if (n.summaries.length) { h += `<h3>Qué dice el libro</h3>`; for (const s of n.summaries.slice(0, 6)) h += `<p class="summary">${esc(s.text)}<cite>${esc(srcName(s.source))}</cite></p>`; }
  if (order.length) {
    h += `<h3>Relaciones</h3>`;
    for (const [rel, list] of order) {
      h += `<div class="rel"><b>${esc(rel)}</b><div class="links">`;
      for (const { other, e } of list.sort((a, b) => b.other.degree - a.other.degree).slice(0, 40)) h += `<button type="button" data-id="${esc(other.id)}" title="${esc((e.evidence || [])[0] || e.confidence)}"><span class="dot" style="background:var(--k-${other.kind})"></span>${esc(other.label)}</button>`;
      h += `</div></div>`;
    }
  }
  if (n.kind !== "chapter" && n.sources.length) { h += `<h3>Aparece en</h3>`; h += `<div class="links">` + n.sources.map(f => { const ch = nodes.find(m => m.kind === "chapter" && m.sources[0] === f); return ch ? `<button type="button" data-id="${esc(ch.id)}"><span class="dot" style="background:var(--k-chapter);border-radius:2px"></span>${esc(srcName(f))}</button>` : ""; }).join("") + `</div>`; }
  panel.innerHTML = h;
  panel.scrollTop = 0;
}
panel.addEventListener("click", ev => { const b = ev.target.closest("button[data-id]"); if (b) select(byId.get(b.dataset.id), true); });
select(null);
addEventListener("keydown", ev => { if (ev.key === "Escape" && document.activeElement !== q) select(null); });
</script>
