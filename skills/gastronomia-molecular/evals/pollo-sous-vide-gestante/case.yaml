schema_version: "1.1"
name: pollo-sous-vide-gestante
expected_outcome: |
  Desaconseja 57 °C para pollo en el embarazo, da una combinación segura de tiempo y temperatura de fuente oficial, aclara que el tiempo cuenta desde que el centro alcanza la temperatura, menciona Listeria o Salmonella y da indicaciones de enfriamiento o servicio inmediato.
