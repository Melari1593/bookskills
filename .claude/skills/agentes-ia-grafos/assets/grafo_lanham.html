<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo del libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-x:auto;white-space:nowrap}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Agentes de IA en acción como grafo", "subtitle": "Micheal Lanham, 2.ª edición (Manning), traducción al español: capítulos, secciones, patrones clave y apéndices", "language": "es", "itemLabel": "Patrón clave", "itemLabelPlural": "Patrones y conceptos", "resourceLabel": "Apéndice", "resourceLabelPlural": "Apéndices", "searchHint": "Buscar: ReAct, handoff, grounding, 9.2…"}, "blocks": {"fund": {"name": "Fundamentos: agentes, LLM y prompts"}, "mcp": {"name": "Herramientas y MCP"}, "multi": {"name": "Sistemas multiagente"}, "cap": {"name": "Razonamiento y memoria"}, "calidad": {"name": "Evaluación y producción"}, "avanz": {"name": "Bucles y agente cognitivo"}, "prac": {"name": "Consejos prácticos"}}, "chapters": [{"num": 1, "title": "El auge de los agentes de IA", "block": "fund", "summary": "Define qué es un agente frente a un asistente o un LLM, el ciclo percibir-planificar-actuar-aprender, MCP, las cinco capas funcionales y los tres patrones multiagente que ordenan todo el libro.", "sections": [{"num": "1.1.1", "title": "Patrones de agente, asistente y LLM", "summary": "Cuatro formas de usar un LLM, desde el chat directo hasta el agente autónomo que decide sus pasos."}, {"num": "1.1.2", "title": "Pensar como agentes: percibir-planificar-actuar-aprender", "summary": "La agencia se apoya en un ciclo que recibe un objetivo, arma un plan, ejecuta y revisa el resultado.", "items": ["spal"]}, {"num": "1.1.3", "title": "Los agentes actúan con herramientas", "summary": "Una herramienta se registra con una descripción y el agente la invoca como si fuera una función.", "items": ["uso_herr"]}, {"num": "1.2", "title": "Introducción al Model Context Protocol", "summary": "Primer vistazo a MCP: el agente descubre y usa las herramientas que expone un servidor.", "items": ["mcp"]}, {"num": "1.3.1", "title": "La persona del agente", "summary": "Las cinco capas funcionales; la persona (prompt de sistema) es la capa central que define rol y reglas.", "items": ["cinco_capas"]}, {"num": "1.3.2", "title": "Herramientas y acciones del agente", "summary": "Capa que conecta al agente con el mundo exterior y sostiene a las capas superiores."}, {"num": "1.3.3", "title": "Razonamiento y planificación del agente", "summary": "Capa que descompone objetivos y decide el orden de las tareas."}, {"num": "1.3.4", "title": "Conocimiento y memoria del agente", "summary": "Diferencia entre conocimiento externo estático y memoria de interacciones pasadas."}, {"num": "1.3.5", "title": "Evaluación y retroalimentación del agente", "summary": "Mecanismos externos (por ejemplo, LLM como juez y grounding) que mejoran la precisión."}, {"num": "1.4.1", "title": "La línea de ensamblaje del flujo de agentes", "summary": "Agentes especializados en secuencia; el patrón multiagente más simple.", "items": ["patrones_multi"]}, {"num": "1.4.2", "title": "Orquestaciones de agentes (hub-and-spoke)", "summary": "Un agente central delega en agentes trabajadores y decide cuándo terminar."}, {"num": "1.4.3", "title": "Colaboración entre agentes (equipos de agentes)", "summary": "Agentes pares que se comunican y critican entre sí, con más costo y latencia."}, {"num": "1.5", "title": "Próximos pasos", "summary": "Hoja de ruta del libro organizada por las cinco capas."}]}, {"num": 2, "title": "Componentes principales: LLM, prompting y agentes", "block": "fund", "summary": "Cómo funciona un LLM (tokens, muestreo), cómo controlarlo con prompts y cómo convertir un prompt en un agente con el OpenAI Agents SDK, con salidas tipadas, tracing y herramientas.", "sections": [{"num": "2.1.1", "title": "LLM: máquinas probabilísticas de tokens", "summary": "El modelo predice y muestrea el siguiente token a partir de probabilidades aprendidas."}, {"num": "2.1.2", "title": "¿Qué es un token?", "summary": "La tokenización y por qué la longitud en tokens difiere de la longitud del texto."}, {"num": "2.1.3", "title": "Ajuste de temperatura, top-p y más", "summary": "Parámetros de generación que equilibran creatividad, consistencia y costo.", "items": ["muestreo"]}, {"num": "2.2.1", "title": "Técnicas principales de prompts", "summary": "Persona clara, instrucciones al inicio, delimitadores, ejemplos y cadena de pensamiento.", "items": ["persona_prompt"]}, {"num": "2.2.2", "title": "Pensar como un LLM", "summary": "Redactar el prompt como instrucciones para alguien nuevo en la tarea."}, {"num": "2.2.3", "title": "Errores comunes en los prompts", "summary": "Exceso de complejidad, contradicciones, delimitadores ambiguos y salidas variables."}, {"num": "2.3.1", "title": "Construcción de un agente mínimo", "summary": "Primer agente planificador de investigación con el Agents SDK."}, {"num": "2.3.2", "title": "Modelo del agente y otros parámetros", "summary": "Elegir modelo y fijar parámetros según el perfil de la tarea."}, {"num": "2.3.3", "title": "Entradas y salidas tipadas", "summary": "Esquemas Pydantic que reemplazan el análisis frágil de texto entre agentes.", "items": ["salida_tipada"]}, {"num": "2.3.4", "title": "Tracing de agentes", "summary": "Revisar cada llamada al LLM en la página de trazas.", "items": ["tracing"]}, {"num": "2.4.1", "title": "Dotar de herramientas a los agentes", "summary": "Funciones locales como herramientas; el agente gana autonomía real.", "items": ["function_tool"]}, {"num": "2.4.2", "title": "Tracing del uso de herramientas", "summary": "Las trazas muestran el encadenamiento de herramientas y los cuellos de botella."}]}, {"num": 3, "title": "Acciones con Model Context Protocol para agentes de IA", "block": "mcp", "summary": "MCP como estándar para conectar agentes con herramientas, datos y otros agentes: arquitectura, componentes, transportes, servidores estándar y cómo convertir herramientas propias en servidores.", "sections": [{"num": "3.1.1", "title": "El problema de estandarización que resuelve MCP", "summary": "Integraciones fragmentadas, acceso a datos inconsistente y seguridad desigual antes de MCP."}, {"num": "3.1.2", "title": "Arquitectura de MCP: clientes, servidores y servicios", "summary": "El agente es un cliente; el servidor expone servicios de forma uniforme.", "items": ["mcp_arq"]}, {"num": "3.1.3", "title": "Componentes: herramientas, recursos y prompts", "summary": "Los tres tipos de capacidad que ofrece un servidor MCP.", "items": ["mcp_comp"]}, {"num": "3.1.4", "title": "Patrones de despliegue de MCP", "summary": "Servidores locales, remotos o híbridos según sensibilidad y carga."}, {"num": "3.1.5", "title": "MCP impulsa las capas funcionales", "summary": "MCP no es solo herramientas: también sirve a razonamiento, memoria y evaluación."}, {"num": "3.2.1", "title": "Programación de un servidor MCP para Claude", "summary": "La herramienta del capítulo 2 envuelta en un servidor y usada desde Claude Desktop."}, {"num": "3.2.2", "title": "Uso de MCP Inspector", "summary": "Explorar y probar las herramientas de un servidor antes de conectarlo a un agente."}, {"num": "3.2.3", "title": "Tipos de transporte en MCP", "summary": "STDIO como subproceso local frente a SSE sobre HTTP, multicliente.", "items": ["transporte"]}, {"num": "3.2.4", "title": "Del escritorio a los agentes", "summary": "Asistente interactivo con supervisión frente a agente programático y autónomo."}, {"num": "3.3.1", "title": "Servidores MCP locales vía STDIO", "summary": "El agente lanza el servidor como subproceso y descubre sus herramientas."}, {"num": "3.3.2", "title": "Servidores MCP locales vía SSE", "summary": "El mismo servidor como servicio HTTP; cambia solo el constructor."}, {"num": "3.3.3", "title": "Conexión a los servidores MCP estándar", "summary": "Servidores de referencia (sistema de archivos, búsqueda, etc.) listos para usar."}, {"num": "3.4.1", "title": "Conversión de herramientas en un servidor MCP", "summary": "Separar las herramientas del agente en un servidor propio reutilizable.", "items": ["tools_a_mcp"]}, {"num": "3.4.2", "title": "Consumo de servidores MCP local o remoto", "summary": "Consumir el servidor propio por STDIO o SSE sin tocar la lógica del agente."}]}, {"num": 4, "title": "Arquitectura y construcción de sistemas multiagente", "block": "multi", "summary": "Patrones de mando, control, comunicación y coordinación entre agentes; cómo dividir un agente en un flujo, transferir el control con handoffs y proteger el flujo con guardrails.", "sections": [{"num": "4.1.1", "title": "Patrones de toma de decisiones y control", "summary": "Flujo, orquestador y gestor-trabajador: quién decide y quién controla.", "items": ["mando_control"]}, {"num": "4.1.2", "title": "Comunicación: memoria compartida, mensajes y MCP", "summary": "Canales de comunicación entre agentes y por qué conviene limitar lo que ve cada uno."}, {"num": "4.1.3", "title": "Estrategias de coordinación multiagente", "summary": "Ocho formas de coordinar: secuencial, paralelo, jerárquico, debate, votación, roles, bifurcación y red entre pares.", "items": ["estrategias_coord"]}, {"num": "4.2.1", "title": "Transformación de agentes en flujos de agentes", "summary": "Dividir un agente monolítico con muchos servidores en roles especializados."}, {"num": "4.2.2", "title": "Construcción de un flujo de agente a agente", "summary": "Encadenar agentes como prompts encadenados, cada uno con sus herramientas."}, {"num": "4.2.3", "title": "Agencia y toma de decisiones en flujos", "summary": "Reemplazar decisiones del LLM por puntos de decisión programados.", "items": ["decision_det"]}, {"num": "4.3.1", "title": "Flujo de agente a agente con handoffs", "summary": "El agente transfiere el control a otro sin código de orquestación.", "items": ["handoff"]}, {"num": "4.3.2", "title": "Visualización de flujos de agentes", "summary": "Grafo del flujo y trazas para ver bucles y cadenas ocultas."}, {"num": "4.3.3", "title": "Monitoreo del handoff", "summary": "Registrar qué datos pasan de un agente a otro."}, {"num": "4.4.1", "title": "Guardrails de entrada y salida", "summary": "Validadores que rechazan o corrigen datos y disparan excepciones (tripwires).", "items": ["guardrail"]}, {"num": "4.4.2", "title": "Agentes como guardrails", "summary": "Un LLM valida con políticas en lenguaje natural."}, {"num": "4.4.3", "title": "Guardrails en flujos con transferencia", "summary": "Validar cada paso y reintentar cuando el guardrail se activa."}]}, {"num": 5, "title": "Razonamiento y planificación de agentes", "block": "cap", "summary": "Descomposición y planificación en LLM; CoT, ReAct, Tree-of-Thought y Reflexion aplicados a agentes, cómo elegir entre ellos y el servidor MCP de Sequential Thinking como bloc de notas de razonamiento.", "sections": [{"num": "5.1.1", "title": "Razonamiento Chain-of-Thought", "summary": "Pasos de razonamiento explícitos, más fáciles de depurar, a cambio de tokens y latencia.", "items": ["cot"]}, {"num": "5.1.2", "title": "Razonar, actuar, observar: ReAct", "summary": "Alterna razonamiento y llamadas a herramientas en un bucle.", "items": ["react"]}, {"num": "5.1.3", "title": "Planificación con LLM", "summary": "El modelo redacta un plan estratégico y lo revisa con la retroalimentación."}, {"num": "5.2.1", "title": "Aplicación de CoT a un agente", "summary": "Instrucciones paso a paso en la persona del agente."}, {"num": "5.2.2", "title": "Implementación de ReAct con agentes", "summary": "El agente usa herramientas para el paso de acción y observa el resultado."}, {"num": "5.3.1", "title": "Tree-of-Thought", "summary": "Búsqueda deliberada sobre varias ramas de razonamiento, con poda.", "items": ["tot"]}, {"num": "5.3.2", "title": "Reflexion", "summary": "Bucle de autocrítica: evaluar la salida, generar retroalimentación y reintentar.", "items": ["reflexion"]}, {"num": "5.3.3", "title": "Selección del patrón adecuado", "summary": "Qué patrón usar según la tarea y cómo combinarlos."}, {"num": "5.4.1", "title": "El servidor de Sequential Thinking", "summary": "Una sola herramienta MCP para escribir, revisar y ramificar pensamientos.", "items": ["seq_thinking"]}, {"num": "5.4.2", "title": "Problemas de viaje en el tiempo con Sequential Thinking", "summary": "Retoma el problema difícil del capítulo con el servidor."}, {"num": "5.4.3", "title": "Razonamiento avanzado con Sequential Thinking", "summary": "Combina CoT, ReAct, ToT y Reflexion con seguimiento de pensamientos."}]}, {"num": 6, "title": "Memoria y RAG de conocimiento para agentes", "block": "cap", "summary": "Recuperación para llevar información externa al contexto: TF-IDF, embeddings, bases vectoriales, búsqueda híbrida, y memoria de agentes con MCP (grafos, sistemas híbridos, compresión y olvido).", "sections": [{"num": "6.1.1", "title": "Fundamentos de RAG", "summary": "Indexar documentos, recuperar fragmentos relevantes y añadirlos al prompt.", "items": ["rag"]}, {"num": "6.1.2", "title": "Búsqueda semántica e indexación de documentos", "summary": "Cómo transformar documentos para buscarlos por significado o por palabras."}, {"num": "6.1.3", "title": "Búsqueda por similitud vectorial", "summary": "TF-IDF y similitud coseno como primer motor de búsqueda."}, {"num": "6.2.1", "title": "Desmitificación de los embeddings", "summary": "Vectores semánticos frente a TF-IDF: qué captura cada uno.", "items": ["embeddings"]}, {"num": "6.2.2", "title": "Consulta de embeddings desde Chroma DB", "summary": "Una base vectorial local para búsqueda por similitud."}, {"num": "6.3.1", "title": "Búsqueda y relevancia", "summary": "Por qué la búsqueda vectorial sola falla con términos exactos, números y jerga."}, {"num": "6.3.2", "title": "Agente RAG de búsqueda vectorial", "summary": "Un agente que consulta un índice vectorial como herramienta."}, {"num": "6.3.3", "title": "Agente RAG de búsqueda híbrida", "summary": "Vectorial más palabras clave, fusionadas por rango.", "items": ["hibrida"]}, {"num": "6.4.1", "title": "Forma de la memoria y función del agente", "summary": "Memoria sensorial, de trabajo y a largo plazo; episódica, semántica y procedimental."}, {"num": "6.4.2", "title": "Base de datos de grafos para memoria vía MCP", "summary": "Entidades, relaciones y observaciones para preguntas de varios saltos.", "items": ["memoria_grafo"]}, {"num": "6.4.3", "title": "Sistemas de memoria híbridos con MCP", "summary": "Combinar memoria de grafos y semántica desde las instrucciones del agente."}, {"num": "6.4.4", "title": "Memoria aumentada semántica: semántica, episódica y procedimental", "summary": "Aplicaciones de cada tipo de memoria a agentes."}, {"num": "6.4.5", "title": "Compresión y olvido de la memoria", "summary": "Agrupar, resumir y podar recuerdos para controlar costo y ruido.", "items": ["compresion"]}]}, {"num": 7, "title": "Agentes robustos con evaluación y retroalimentación", "block": "calidad", "summary": "Cómo medir y mejorar agentes: desarrollo guiado por pruebas (TDAD), agentes evaluadores, de grounding y críticos con rúbricas, y observabilidad y experimentos con Arize Phoenix.", "sections": [{"num": "7.1", "title": "Introducción a la evaluación y retroalimentación", "summary": "Mapa de evaluaciones: red team, benchmarks, retroalimentación humana y evaluadores automáticos."}, {"num": "7.2.1", "title": "TDAD en la práctica", "summary": "Definir benchmarks (incluidos casos negativos) antes de construir el agente.", "items": ["tdad"]}, {"num": "7.2.2", "title": "Programación y prueba del agente RAG", "summary": "Código mínimo para responder y medir contra los benchmarks."}, {"num": "7.2.3", "title": "Refactorización del agente", "summary": "Cambios mínimos en prompt, herramientas o modelo hasta aprobar; repetir pruebas por estocasticidad."}, {"num": "7.2.4", "title": "Agente evaluador", "summary": "Un LLM califica respuestas complejas con salida tipada (aprobado y retroalimentación).", "items": ["agente_evaluador"]}, {"num": "7.3.1", "title": "El agente de grounding", "summary": "Verifica que la respuesta esté respaldada por el contexto o las citas.", "items": ["grounding"]}, {"num": "7.3.2", "title": "Grounding del agente RAG", "summary": "Aplicar la verificación al agente RAG y devolver retroalimentación."}, {"num": "7.3.3", "title": "Agentes de grounding como guardrails", "summary": "Bloquear o regenerar respuestas no fundamentadas."}, {"num": "7.3.4", "title": "El rol de las rúbricas en la evaluación", "summary": "Convertir calidad subjetiva en criterios y escalas."}, {"num": "7.3.5", "title": "Agente crítico basado en rúbricas", "summary": "Bucle generar-criticar hasta una puntuación mínima o un límite de intentos.", "items": ["rubrica_critico"]}, {"num": "7.4.1", "title": "Conexión con Phoenix", "summary": "Instrumentar el agente con OpenTelemetry hacia Phoenix.", "items": ["phoenix"]}, {"num": "7.4.2", "title": "Metadatos y seguimiento de sesiones", "summary": "Etiquetar trazas para filtrar y analizar por cohortes."}, {"num": "7.4.3", "title": "Experimentación con evaluadores", "summary": "Conjuntos de datos a partir de trazas reales y experimentos con evaluadores."}, {"num": "7.4.4", "title": "Retroalimentación mediante anotaciones", "summary": "Capturar retroalimentación humana estructurada sobre las trazas."}]}, {"num": 8, "title": "Despliegue de agentes y sistemas agentuales", "block": "calidad", "summary": "Llevar agentes a producción: formas de consumo (embebido, API, eventos), contenedores y Docker Compose, decisiones de arquitectura (canales, estado, versiones, observabilidad, confiabilidad, costos) y seguridad y gobernanza.", "sections": [{"num": "8.1.1", "title": "Agentes de voz en tiempo real en aplicaciones web", "summary": "Agente embebido en el navegador con WebRTC o WebSocket.", "items": ["consumo"]}, {"num": "8.1.2", "title": "Alojamiento de agentes a través de una API", "summary": "Envolver el agente en un servicio web con FastAPI."}, {"num": "8.1.3", "title": "Consumo de un servicio de agente desde una aplicación web", "summary": "Una interfaz web que llama al agente alojado."}, {"num": "8.2.1", "title": "Contenerización de un microservicio de agente", "summary": "Empaquetar el agente con sus dependencias en un contenedor."}, {"num": "8.2.2", "title": "Orquestación con Docker Compose", "summary": "Levantar interfaz, agentes y servicios de herramientas con un solo comando.", "items": ["compose"]}, {"num": "8.2.3", "title": "Externalización de microservicios locales", "summary": "Túneles para compartir prototipos locales sin desplegar en la nube."}, {"num": "8.3.1", "title": "Entorno de ejecución: edge, API o eventos", "summary": "Dónde vive el agente define latencia, costo y complejidad."}, {"num": "8.3.2", "title": "Los tres «cables» de comunicación", "summary": "Tiempo real, HTTP con streaming o bus de mensajes."}, {"num": "8.3.3", "title": "Topologías multiagente que escalan", "summary": "Puerta de entrada ligera que enruta a trabajadores especializados."}, {"num": "8.3.4", "title": "Estado, memoria e idempotencia", "summary": "Separar estado de corto y largo plazo; llamadas repetibles sin efectos duplicados.", "items": ["idempotencia"]}, {"num": "8.3.5", "title": "Ingeniería de lanzamientos para agentes", "summary": "Versionar prompts, herramientas y modelos y promover con controles."}, {"num": "8.3.6", "title": "La observabilidad importa", "summary": "Trazas de extremo a extremo, métricas y registros con PII enmascarada."}, {"num": "8.3.7", "title": "Patrones de confiabilidad", "summary": "Timeouts, fallbacks, disyuntores y presupuestos.", "items": ["confiabilidad"]}, {"num": "8.3.8", "title": "Control de costos y enrutamiento de modelos", "summary": "Costo relativo al valor; enrutar por intención, recortar contexto y usar caché."}, {"num": "8.4.1", "title": "Modelo rápido de amenazas", "summary": "Nombrar activos y superficies de ataque de un sistema agentual."}, {"num": "8.4.2", "title": "Identidad y acceso", "summary": "Mínimo privilegio para personas, servicios y agentes."}, {"num": "8.4.3", "title": "Gestión de secretos y configuración", "summary": "Secretos inyectados en ejecución, nunca dentro de la imagen."}, {"num": "8.4.4", "title": "Seguridad de herramientas: sandboxing", "summary": "Aislar herramientas y controlar su salida de red."}, {"num": "8.4.5", "title": "Defensas contra inyección de prompts y exfiltración", "summary": "Tratar toda entrada como no confiable; contratos de herramientas y jerarquía de instrucciones.", "items": ["defensa_inyeccion"]}, {"num": "8.4.6", "title": "Seguridad y aplicación de políticas", "summary": "Cumplimiento de políticas más allá de la moderación de contenido."}]}, {"num": 9, "title": "Comprensión del bucle agentual", "block": "avanz", "summary": "Las tres capas del bucle agentual (bucle interno, bucle de tareas y metabucle), con un agente de investigación profunda, un agente de tareas repetitivas y bucles de orquestación y colaboración.", "sections": [{"num": "9.1.1", "title": "Capa 1: el bucle interno", "summary": "El ciclo percibir-planificar-actuar-aprender repetido hasta cumplir el objetivo.", "items": ["tres_capas"]}, {"num": "9.1.2", "title": "Capa 2: el bucle de tareas", "summary": "Objetivo, plan, estado y decisión se sacan del agente y los controla el código."}, {"num": "9.1.3", "title": "Capa 3: el metabucle", "summary": "Un agente, no el código, controla el plan y el estado."}, {"num": "9.2.1", "title": "Estado inicial y plan", "summary": "Objetos de estado y plan externos que se comparten entre iteraciones.", "items": ["estado_externo"]}, {"num": "9.2.2", "title": "Adición de las herramientas", "summary": "Servidores MCP de búsqueda y archivos para el agente de investigación."}, {"num": "9.2.3", "title": "Salida del cuerpo de la iteración", "summary": "Resultado tipado de cada ciclo: hallazgos, preguntas de seguimiento y confianza."}, {"num": "9.2.4", "title": "La compuerta de terminación", "summary": "Condiciones de salida en capas: límites, presupuesto, objetivo, calidad y estancamiento.", "items": ["compuerta"]}, {"num": "9.2.5", "title": "Programación del bucle de investigación profunda", "summary": "Controlador del bucle, agente, servidores y código de salida juntos."}, {"num": "9.2.6", "title": "Síntesis de la salida final", "summary": "Un agente sintetizador convierte los hallazgos en un informe."}, {"num": "9.2.7", "title": "Cuándo utilizar un bucle agentual", "summary": "Criterios para decidir si una tarea necesita iterar."}, {"num": "9.2.8", "title": "Agente de bucle para tareas repetitivas", "summary": "Cola de trabajo con reintentos, seguimiento de estado y ejecución en paralelo."}, {"num": "9.3", "title": "Capa 3: bucles de orquestación multiagente", "summary": "Un orquestador LLM delega en trabajadores, evalúa y decide si iterar.", "items": ["metabucle_orq"]}, {"num": "9.4", "title": "Bucles agentuales colaborativos", "summary": "Agentes pares con estado compartido y rondas de aporte, crítica y síntesis.", "items": ["bucle_colab"]}]}, {"num": 10, "title": "El agente cognitivo que piensa, monitorea y se adapta", "block": "avanz", "summary": "Por qué apilar patrones no basta: define cognición y metacognición para agentes y construye una arquitectura modular (espacio de trabajo, percepción, planificación, ejecución, evaluación, atención y memoria) con monitoreo metacognitivo.", "sections": [{"num": "10.1.1", "title": "Cinco modos de fallo de agentes no cognitivos", "summary": "Respuesta errónea con seguridad, disco rayado, plan rígido, conjetura sobrecomprometida y composición superficial.", "items": ["modos_fallo"]}, {"num": "10.1.2", "title": "De las primitivas de razonamiento a la arquitectura cognitiva", "summary": "CoT, ReAct, ToT y Reflexion como piezas que hay que componer."}, {"num": "10.1.3", "title": "Definición de cognición para agentes", "summary": "Calidad del modelo interno de la tarea: descomponer, combinar herramientas, actualizar."}, {"num": "10.1.4", "title": "Definición de metacognición para agentes", "summary": "Supervisar el propio razonamiento: confianza, estancamiento y límites del conocimiento.", "items": ["metacognicion"]}, {"num": "10.1.5", "title": "Tres fundamentos teóricos", "summary": "Sociedad de la mente (Minsky), espacio de trabajo global (Baars) y sistema 1/sistema 2 (Kahneman)."}, {"num": "10.2.1", "title": "Visión general de la arquitectura", "summary": "Los siete componentes y sus conexiones."}, {"num": "10.2.2", "title": "El espacio de trabajo cognitivo", "summary": "Estado compartido que todos los módulos leen y escriben.", "items": ["espacio_trabajo"]}, {"num": "10.2.3", "title": "El módulo de percepción", "summary": "Convierte la consulta en una representación estructurada de la tarea."}, {"num": "10.2.4", "title": "El módulo de planificación", "summary": "Elige una estrategia entre varias según la tarea."}, {"num": "10.2.5", "title": "El módulo de ejecución", "summary": "Ejecuta el paso del plan con herramientas MCP o funciones."}, {"num": "10.2.6", "title": "El módulo de evaluación", "summary": "Núcleo metacognitivo: revisa si el enfoque está funcionando."}, {"num": "10.2.7", "title": "El módulo de atención", "summary": "Decide qué módulo recibe el control a continuación.", "items": ["modulo_atencion"]}, {"num": "10.2.8", "title": "Módulo de memoria y servidor de memoria MCP", "summary": "Grafo de conocimiento persistente con recuperación previa y registro de experiencias."}, {"num": "10.3.1", "title": "El bucle cognitivo", "summary": "La arquitectura dentro de cada iteración del bucle de capa 2."}, {"num": "10.3.2", "title": "Agente cognitivo completo con MCP", "summary": "Ensamblaje de todos los módulos en un sistema ejecutable."}, {"num": "10.3.3", "title": "Demostración: el ciclo cognitivo en acción", "summary": "Una consulta donde un agente ReAct plano fallaría."}, {"num": "10.3.4", "title": "Ejecución condicionada por confianza", "summary": "Solo se presenta la respuesta si la confianza lo justifica.", "items": ["gating_confianza"]}, {"num": "10.3.5", "title": "Detección de estancamiento y cambio de estrategia", "summary": "Detecta iteraciones sin progreso y cambia de enfoque."}, {"num": "10.3.6", "title": "Conciencia de los límites del conocimiento", "summary": "Reconocer lo que no se sabe y degradar con elegancia."}, {"num": "10.3.7", "title": "Comportamientos emergentes", "summary": "Curiosidad, persistencia adaptativa, profundidad selectiva y degradación elegante."}, {"num": "10.4.1", "title": "Métricas de eficiencia cognitiva", "summary": "Cuatro métricas para vigilar en producción."}, {"num": "10.4.2", "title": "Antes y después: medición del efecto", "summary": "Comparar un agente ReAct estándar con el agente cognitivo."}, {"num": "10.4.3", "title": "El camino hacia agentes más generales", "summary": "La generalidad como problema de arquitectura, no solo de escala."}]}, {"num": 11, "title": "Consejos para construir sistemas agentuales", "block": "prac", "summary": "Listas de verificación prácticas por cada una de las cinco capas y guías específicas para un agente de atención al cliente, un sistema RAG y un agente de investigación profunda.", "sections": [{"num": "11.1.1", "title": "La capa central: persona", "summary": "La persona como contrato: rol, límites y una salida explícita de «no lo sé».", "items": ["persona_contrato"]}, {"num": "11.1.2", "title": "Herramientas y acciones", "summary": "Herramientas de responsabilidad única, bien nombradas y tipadas; planificar ante fallos."}, {"num": "11.1.3", "title": "Razonamiento y planificación", "summary": "Planificar antes de actuar, limitar iteraciones y autoevaluar antes de terminar."}, {"num": "11.1.4", "title": "Conocimiento y memoria", "summary": "Recuperación como componente central; separar memoria de sesión y de largo plazo."}, {"num": "11.1.5", "title": "Evaluación y retroalimentación", "summary": "Trazar todo, automatizar evaluaciones, incluir revisión humana y guardrails."}, {"num": "11.2", "title": "Agente de atención al cliente", "summary": "Alcance estrecho, grounding, escalamiento a humanos y mínimo privilegio.", "items": ["agente_soporte"]}, {"num": "11.3", "title": "Sistema de agentes RAG", "summary": "Roles modulares (triaje, recuperador, generador y crítico) y medición de recall y precisión.", "items": ["rag_modular"]}, {"num": "11.4", "title": "Sistema de agentes de investigación profunda", "summary": "Planificador que delega en trabajadores sin estado, con citas obligatorias y pasada crítica.", "items": ["investigacion_2n"]}]}], "items": {"spal": {"title": "Ciclo percibir-planificar-actuar-aprender", "summary": "Bucle interno con el que un agente avanza hacia un objetivo de forma autónoma.", "formula": "percibir → planificar → actuar → aprender (↺)"}, "uso_herr": {"title": "Uso de herramientas (function calling)", "summary": "El agente actúa fuera de su modelo llamando funciones descritas por un esquema.", "formula": "descripción JSON → registro → invocación"}, "mcp": {"title": "Model Context Protocol (MCP)", "summary": "Protocolo abierto (JSON-RPC 2.0) para que un agente descubra y use herramientas sin integración a medida.", "formula": "agente → list_tools → servidor MCP"}, "cinco_capas": {"title": "Cinco capas funcionales del agente", "summary": "Marco que organiza el diseño de agentes y la estructura del libro.", "formula": "persona · herramientas · razonamiento · memoria · evaluación"}, "patrones_multi": {"title": "Patrones multiagente: flujo, orquestación y colaboración", "summary": "Tres formas básicas de combinar agentes: en cadena, con un centro que delega o como pares."}, "muestreo": {"title": "Parámetros de muestreo", "summary": "Controles que regulan variabilidad, longitud y costo de la salida del LLM.", "formula": "temperatura · top-p · max_tokens · penalizaciones"}, "persona_prompt": {"title": "Persona e ingeniería de prompts", "summary": "Instrucciones de sistema estructuradas que hacen predecible al agente."}, "salida_tipada": {"title": "Salida tipada (output_type)", "summary": "Esquema estricto de entrada/salida que estabiliza flujos con LLM estocásticos.", "formula": " <script>

const M=Object.assign({title:"Grafo del libro",subtitle:"",language:"es",itemLabel:"Concepto clave",itemLabelPlural:"Conceptos",resourceLabel:"Apéndice",resourceLabelPlural:"Apéndices",searchHint:"Buscar…",pageLabel:"Página",chapterLabel:"Capítulo",sectionLabel:"Sección"},GRAPH.meta||{});

const firstBlock=Object.keys(BLOCKS)[0];

Object.entries(GRAPH.items||{}).forEach(([id,it])=>{

});

// ---------- prerequisite trace ----------
function trace(id){
  const start=byId[id], set=new Set([id]), q=[];

      n.x=w/2+Math.cos(a)*r+(Math.random()-.5)*30; n.y=h/2+Math.sin(a)*r+(Math.random()-.5)*30;}
  });
  if(view==="ch"){
    const depth={},seen=new Set();
    const dep=c=>{c=String(c);if(depth[c]!=null)return depth[c];if(seen.has(c))return 0;seen.add(c);
      return depth[c]=(CH_DEP[c]||[]).reduce((m,p)=>Math.max(m,dep(p)+1),0);};
    const rows={};curNodes.forEach(n=>{const d=dep(n.num);(rows[d]=rows[d]||[]).push(n);});
    const rowH=w<720?96:92, maxPer=w<720?3:6; let y=50;
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(d=>{const arr=rows[d].sort((a,b)=>a.idx-b.idx);
      for(let k=0;k<arr.length;k+=maxPer){const part=arr.slice(k,k+maxPer);
        const sp=Math.min(w<720?125:250,(w-24)/part.length);
        part.forEach((n,i)=>{n.fx=w/2+(i-(part.length-1)/2)*sp;n.fy=y;n.wrap=Math.max(11,Math.min(22,Math.floor(sp/7.2)));});
        y+=rowH;}});
  } else curNodes.forEach(n=>{n.fx=null;n.fy=null;});
  linkSel=gL.selectAll("path").data(curLinks,d=>d.source+">"+d.target).join("path")
    .attr("class",d=>"link "+d.kind).attr("marker-end",d=>d.kind==="req"?"url(#arr)":null);
  nodeSel=gN.selectAll("g.node").data(curNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button")
      .attr("aria-label",d=>d.label);
    g.append("path").attr("class","shape");
    g.append("text").attr("class","num");
    g.append("text").attr("class","lbl");
    return g;
  });
  nodeSel.select(".shape").attr("fill",col).attr("d",d=>{
    const r=R(d);
    if(d.type==="eq") return `M0,${-r*1.25}L${r*1.25},0L0,${r*1.25}L${-r*1.25},0Z`;
    if(d.type==="apx") return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;
    return d3.arc()({innerRadius:0,outerRadius:r,startAngle:0,endAngle:2*Math.PI});
  });
  nodeSel.select(".num").text(d=>d.type==="ch"?d.num:d.type==="apx"?d.num:"").attr("text-anchor","middle").attr("dy","0.36em")
    .style("font-size",d=>d.type==="apx"?"9px":null);
  const lbl=nodeSel.select(".lbl").text(null).selectAll("tspan").remove();
  nodeSel.select(".lbl").each(function(d){
    const t=d3.select(this), txt=d.type==="sec"?d.num+" "+d.label:d.type==="apx"?d.short:d.label;
    if(view==="ch"){
      t.attr("x",0).attr("y",R(d)+15).attr("dy",null).attr("text-anchor","middle");
      const words=txt.split(" "),lines=[];let cur="";
      words.forEach(wd=>{if((cur+" "+wd).trim().length>(d.wrap||19)&&cur){lines.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});lines.push(cur);
      lines.forEach((ln,i)=>t.append("tspan").attr("x",0).attr("dy",i?"1.1em":0).text(ln));
    } else t.attr("x",R(d)+5).attr("y",0).attr("dy","0.35em").attr("text-anchor",null).text(txt);
  });
  nodeSel.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);}})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  if(sim) sim.stop();
  const ld={contains:34,defines:22,data:70,req:view==="all"?110:90};
  const ls={contains:.7,defines:.9,data:.08,req:view==="all"?.04:.35};
  const lsf=l=>view==="all"&&l.kind==="req"&&l.lvl==="eq"?.008:ls[l.kind];
  sim=d3.forceSimulation(curNodes)
    .force("link",d3.forceLink(curLinks).id(d=>d.id).distance(l=>ld[l.kind]).strength(lsf))
    .force("charge",d3.forceManyBody().strength(d=>view==="all"?(d.type==="ch"?-260:-45):-320))
    .force("collide",d3.forceCollide(d=>R(d)+(view==="all"?3:22)))
    .force("x",d3.forceX(w/2).strength(.04)).force("y",d3.forceY(h/2).strength(.05))
    .on("tick",ticked).on("end",()=>{curNodes.forEach(n=>posCache[n.id]={x:n.x,y:n.y});});
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){sim.stop();for(let i=0;i<300;i++)sim.tick();ticked();}
  setTimeout(fit, view==="ch"?150:view==="all"?1400:900);
  labelLOD(d3.zoomTransform(svg.node()).k);
  applyHighlight();
}
function ticked(){
  linkSel.attr("d",d=>{
    const s=d.source,t=d.target;
    if(d.kind!=="req") return `M${s.x},${s.y}L${t.x},${t.y}`;
    const dx=t.x-s.x,dy=t.y-s.y,dist=Math.hypot(dx,dy)||1,r=R(t)+(t.type==="eq"?4:3);
    const tx=t.x-dx/dist*r, ty=t.y-dy/dist*r;
    return `M${s.x},${s.y}Q${(s.x+tx)/2+dy*.12},${(s.y+ty)/2-dx*.12} ${tx},${ty}`;
  });
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function labelLOD(k){
  if(!nodeSel) return;
  nodeSel.select(".lbl").style("display",d=>{
    if(selected&&(d.id===selected||(traceOn&&curTrace&&curTrace.read.has(d.id)))) return null;
    if(d.type==="ch"||view!=="all") return null;
    if(d.type==="eq"||d.type==="apx") return k>1.1?null:"none";
    return k>1.8?null:"none";
  });
}
function fit(sub){
  const set=(Array.isArray(sub)?sub:curNodes).filter(n=>n.x!=null);
  if(!set.length) return;
  let w=svg.node().clientWidth,h=svg.node().clientHeight,ox=0;
  const panelOpen=panel.classList.contains("open"), mobile=w<720;
  if(panelOpen&&!mobile){w-=400;} if(panelOpen&&mobile){h*=.4;}
  let oy=0; if(mobile&&!panelOpen){h-=56;}
  const xs=set.map(n=>n.x),ys=set.map(n=>n.y);
  const padR=view==="ch"?60:150, padB=view==="ch"?50:30;
  const x0=Math.min(...xs)-(view==="ch"?60:30),x1=Math.max(...xs)+padR,y0=Math.min(...ys)-30,y1=Math.max(...ys)+padB;
  const k=Math.min(2.2,.92*Math.min(w/(x1-x0),h/(y1-y0)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k));
}
d3.select("#zin").on("click",()=>svg.transition().call(zoom.scaleBy,1.4));
d3.select("#zout").on("click",()=>svg.transition().call(zoom.scaleBy,1/1.4));
d3.select("#fit").on("click",()=>fit());
svg.on("click",()=>closePanel());

// ---------- highlight ----------
let curTrace=null;
function applyHighlight(){
  if(!nodeSel) return;
  nodeSel.classed("sel",d=>d.id===selected);
  if(!selected){nodeSel.classed("dim",false);linkSel.classed("dim",false).classed("hot",false);labelLOD(d3.zoomTransform(svg.node()).k);return;}
  let keep;
  if(traceOn&&curTrace){keep=curTrace.read;}
  else{keep=new Set([selected]);byId[selected].out.concat(byId[selected].inn).forEach(l=>{keep.add(l.source.id||l.source);keep.add(l.target.id||l.target);});}
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",d=>!(keep.has(d.source.id)&&keep.has(d.target.id)))
    .classed("hot",d=>traceOn&&d.kind==="req"&&keep.has(d.source.id)&&keep.has(d.target.id));
  labelLOD(d3.zoomTransform(svg.node()).k);
}

// ---------- panel ----------
const panel=document.getElementById("panel");
const kindName={ch:M.chapterLabel,sec:M.sectionLabel,eq:M.itemLabel,apx:M.resourceLabel};
function item(id,prefix){
  const n=byId[id];
  const t=n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label;
  return `<li><button data-go="${esc(id)}"><span class="dot" style="background:${col(n)}"></span><span>${esc(t)}</span></button></li>`;
}
function list(title,ids,ordered){
  if(!ids.length) return "";
  ids=[...new Set(ids)].sort((a,b)=>byId[a].order-byId[b].order);
  return `<div class="p-sec"><h3>${title}</h3>${ordered?'<ol class="p-list path">':'<ul class="p-list">'}${ids.map(i=>item(i)).join("")}${ordered?"</ol>":"</ul>"}</div>`;
}
function select(id,center){
  selected=id;traceOn=false;curTrace=null;
  const n=byId[id];
  if(!curNodes.includes(n)){view=n.type==="ch"?"ch":n.type==="eq"?"eq":"all";hidden.delete(n.block);syncViewBtns();syncLegend();render();setTimeout(()=>centerOn(id),view==="all"?1500:1000);}
  else if(center) centerOn(id);
  const outT=k=>n.out.filter(l=>l.kind===k).map(l=>l.target.id||l.target);
  const inT=k=>n.inn.filter(l=>l.kind===k).map(l=>l.source.id||l.source);
  let html=`<button class="close" aria-label="Cerrar">×</button>
   <div class="p-kind"><span class="dot" style="background:${col(n)}"></span>${esc(kindName[n.type])} · ${esc(BLOCKS[n.block].name)}</div>
   <div class="p-title">${esc(n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label)}</div>`;
  const meta=[];
  if(n.page) meta.push(M.pageLabel+" "+n.page);
  if(n.type==="sec") meta.push(M.chapterLabel+" "+n.ch+": "+byId["ch"+n.ch].label);
  if(n.type==="eq"){if(n.ref)meta.push(M.itemLabel+" "+n.ref);if(n.home)meta.push(M.sectionLabel+" "+byId[n.home].num);}
  if(meta.length) html+=`<div class="p-meta">${esc(meta.join(". "))}</div>`;
  if(n.formula) html+=`<div class="formula" style="color:${col(n)}"><span style="color:var(--ink)">${esc(n.formula)}</span></div>`;
  if(n.desc) html+=`<p class="p-desc">${esc(n.desc)}</p>`;
  if(n.type!=="apx") html+=`<button class="trace-btn" id="traceBtn" aria-pressed="false">Trazar prerrequisitos</button><div id="pathBox"></div>`;
  if(n.type==="ch") html+=list("Secciones",outT("contains"),true)+list(M.itemLabelPlural+" clave",outT("contains").flatMap(s=>byId[s].out.filter(l=>l.kind==="defines").map(l=>l.target.id||l.target)))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"));
  if(n.type==="sec") html+=list(M.itemLabelPlural+" que presenta",outT("defines"))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"))+list(M.resourceLabelPlural+" que consulta",outT("data"));
  if(n.type==="eq") html+=list("Se deriva de o usa",outT("req"))+list("Base de",inT("req"))+list("Dónde se presenta",inT("defines"));
  if(n.type==="apx") html+=list("Se consulta en",inT("data"));
  panel.innerHTML=html;panel.classList.add("open");
  panel.querySelector(".close").onclick=closePanel;
  panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  const tb=document.getElementById("traceBtn");
  if(tb) tb.onclick=()=>{traceOn=!traceOn;tb.setAttribute("aria-pressed",traceOn);tb.textContent=traceOn?"Quitar trazado":"Trazar prerrequisitos";
    curTrace=traceOn?trace(id):null;
    const box=document.getElementById("pathBox");
    if(traceOn){const ids=[...curTrace.read].filter(x=>x!==id&&byId[x].type!=="eq");
      box.innerHTML=ids.length?list("Ruta de lectura sugerida, en orden del libro",ids,true):'<p class="empty">No depende de otros temas: es un punto de partida.</p>';
      box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}
    else box.innerHTML="";
    applyHighlight();
    if(traceOn) fit(curNodes.filter(x=>curTrace.read.has(x.id)));};
  document.getElementById("hint").style.opacity=0;
  applyHighlight();
}
function closePanel(){panel.classList.remove("open");selected=null;traceOn=false;curTrace=null;applyHighlight();}
function centerOn(id){
  const n=byId[id];if(n.x==null) return;
  const w=svg.node().clientWidth,h=svg.node().clientHeight,k=Math.max(1.3,d3.zoomTransform(svg.node()).k);
  const mobile=w<720, cx=mobile?w/2:(w-400)/2, cy=mobile?h*.28:h/2;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(cx-k*n.x,cy-k*n.y).scale(k));
}

// ---------- controls ----------
function syncViewBtns(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewBtns();closePanel();render();});
const legend=document.getElementById("legend");
function syncLegend(){
  legend.innerHTML=Object.entries(BLOCKS).map(([k,v])=>`<button data-b="${k}" aria-pressed="${!hidden.has(k)}"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}</button>`).join("")+
  `<div class="shapes"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#172A3A"/></svg>${esc(M.chapterLabel.toLowerCase())} o ${esc(M.sectionLabel.toLowerCase())}</span><span><svg width="12" height="12"><path d="M6 0L12 6L6 12L0 6Z" fill="#172A3A"/></svg>${esc(M.itemLabel.toLowerCase())}</span>${hasRes?`<span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#172A3A"/></svg>${esc(M.resourceLabel.toLowerCase())}</span>`:""}</div>`;
  legend.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);syncLegend();render();});
}
syncLegend();
// search
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(t.length<2){res.style.display="none";return;}
  const hits=nodes.filter(n=>norm((n.num||"")+" "+n.label+" "+(n.formula||"")+" "+(n.desc||"")).includes(t))
    .sort((a,b)=>(norm(a.label).includes(t)?0:1)-(norm(b.label).includes(t)?0:1)||a.order-b.order).slice(0,14);
  res.innerHTML=hits.length?hits.map(n=>`<li><button data-go="${esc(n.id)}"><span class="k">${esc(n.type==="sec"?n.num:n.type==="ch"?n.num:n.type==="eq"?"·":n.num)}</span><span>${esc(n.type==="apx"?n.short:n.label)}</span></button></li>`).join(""):'<li style="padding:8px;font-size:.9rem">Sin coincidencias. Prueba con otra palabra o un número de sección.</li>';
  res.style.display="block";
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{res.style.display="none";q.value="";q.blur();select(b.dataset.go,true);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector("[data-go]");if(f)f.click();}if(e.key==="Escape"){res.style.display="none";}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.style.display="none";});
window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>fit(),200);});
render();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
</script>
</body>
</html>
