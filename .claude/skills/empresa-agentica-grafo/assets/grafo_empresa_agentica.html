<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La empresa agéntica — grafo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-x:auto;white-space:nowrap}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "La empresa agéntica — grafo", "subtitle": "Babak Hodjat y Antoine Blondeau (O'Reilly, ed. en español): introducción, 9 capítulos, conceptos clave y cómo se conectan", "language": "es", "itemLabel": "Concepto clave", "itemLabelPlural": "Conceptos clave", "resourceLabel": "Figura", "resourceLabelPlural": "Figuras", "searchHint": "Buscar: AAOSA, RACI, MCP, pasarela, sly_data…"}, "blocks": {"intro": {"name": "Introducción"}, "porque": {"name": "Parte I · Por qué importa la empresa agéntica"}, "tec": {"name": "Parte II · Tecnología de agentes de IA"}, "conf": {"name": "Parte III · Confianza"}, "futuro": {"name": "Parte IV · El futuro"}}, "chapters": [{"num": "Int", "title": "Introducción", "page": 27, "block": "intro", "summary": "Qué es un agente de IA: de Turing y los sistemas multiagente de los noventa a los agentes basados en LLM. Define agente, indicativo del sistema y arnés agéntico, y presenta la empresa dotada de agentes.", "sections": [{"num": "I.1", "title": "Una breve historia", "page": 28, "items": ["agencia"], "summary": "Del agente general de los setenta al agente restringido a internet y la ingeniería de software orientada a agentes."}, {"num": "I.2", "title": "La era de la IA generativa", "page": 31, "items": ["prompt_sistema", "agente_llm"], "summary": "El lenguaje natural como protocolo universal entre humanos y máquinas, y entre agentes."}, {"num": "I.3", "title": "Sistemas multiagente", "page": 37, "items": ["rag", "agente_proteccion", "modelo_vs_agente"], "summary": "Del LLM que consulta una base de datos a la empresa dotada de agentes, con los humanos como árbitros finales."}]}, {"num": 1, "title": "De la automatización a los agentes: la evolución de la IA empresarial", "page": 52, "block": "porque", "summary": "De los sistemas expertos y la RPA a los agentes. Argumenta por qué conviene un sistema multiagente en lugar de un único agente todopoderoso, y cómo dividir el trabajo entre el LLM y el código.", "sections": [{"num": "1.1", "title": "El efecto ChatGPT", "page": 53, "items": ["confabulacion"], "summary": "Chatbots, RAG y copilotos como primeros usos de bajo riesgo; el ROI inicial no se cumplió."}, {"num": "1.2", "title": "Ingeniería de la IA", "page": 55, "items": ["por_que_multiagente"], "summary": "Con agentes se entra en terreno de ingeniería: roles, herramientas, pruebas y monitoreo."}, {"num": "1.3", "title": "Aplicaciones y software agentificados", "page": 60, "items": ["beneficios_agentificacion", "mitigacion_autonomia", "llm_vs_codigo"], "summary": "Agentes que hablan entre sí; ventajas y riesgos de la autonomía."}, {"num": "1.4", "title": "Organizaciones multiagente", "page": 71, "summary": "Flexibilidad de ingeniería, protección, confiabilidad y variedad de LLM frente al costo de más agentes."}, {"num": "1.5", "title": "Autonomía y el papel de los humanos", "page": 74, "items": ["metacognicion"], "summary": "Por qué no entregar todas las API a un único LLM potente."}]}, {"num": 2, "title": "El caso de negocio de la IA agéntica", "page": 77, "block": "porque", "summary": "Por qué actuar ahora: tecnología madura, presión competitiva y organizaciones preparadas. La IA agéntica pasa de automatizar pasos a automatizar resultados, en tres capas de valor.", "sections": [{"num": "2.1", "title": "Madurez tecnológica e impulsores competitivos", "page": 79, "items": ["tres_fuerzas", "rpa_vs_agentica"], "summary": "Casos Allianz Partners (siniestros de 30 a 3–4 días), Franklin Templeton y Artisan."}, {"num": "2.2", "title": "Valor estratégico frente a la automatización táctica", "page": 83, "items": ["capas_valor"], "summary": "Apalancamiento de decisiones: los humanos intervienen solo por excepción."}, {"num": "2.3", "title": "Revisión de código: la IA agéntica y la economía de la ingeniería", "page": 88, "items": ["adecuacion_casos"], "summary": "Revisión de código multiagente: −50 % de tiempo de revisión y −20 % de reescrituras."}, {"num": "2.4", "title": "Preparación organizacional y técnica", "page": 92, "items": ["seis_dimensiones"], "summary": "Autoevaluación de la empresa antes de agentificar."}, {"num": "2.5", "title": "Sistemas agénticos: ¿cuál es el beneficio?", "page": 95, "summary": "Resumen: madurez y oportunidad estratégica."}]}, {"num": 3, "title": "Aplicaciones empresariales de alto impacto", "page": 97, "block": "porque", "summary": "Catálogo de sistemas multiagente construidos o desplegados (muchos con Neuro SAN): desarrollo de software, migración, sectores y funciones transversales.", "sections": [{"num": "3.1", "title": "Ciclo de vida de desarrollo de software agéntico", "page": 98, "items": ["sdlc_multiagente"], "summary": "Revisión de código y generación de pruebas como puntos de entrada."}, {"num": "3.2", "title": "Migración de código y aplicaciones", "page": 108, "items": ["representacion_intermedia"], "summary": "Ahorros de 40–50 %; caso SAP BO a Power BI."}, {"num": "3.3", "title": "Sectores: comercio minorista", "page": 112, "summary": "Líneas de soporte que cruzan departamentos y operaciones internas de grandes almacenes."}, {"num": "3.4", "title": "Sectores: telecomunicaciones y agricultura", "page": 117, "items": ["nodos_hoja"], "summary": "Informes de incidentes y rebalanceo de red por regiones."}, {"num": "3.5", "title": "Sectores: finanzas", "page": 128, "items": ["apa"], "summary": "Contracargos, banca invisible y el escenario del agente financiero personal de Mark."}, {"num": "3.6", "title": "Sectores: atención médica", "page": 134, "summary": "Supervisión terapéutica con agentes de distintas corrientes; confidencialidad como requisito."}, {"num": "3.7", "title": "Transversales: investigación", "page": 137, "summary": "Agentes que mejoran algoritmos en sistemas cerrados; en el mundo real hace falta un humano en el circuito."}, {"num": "3.8", "title": "Transversales: recursos humanos e intranet", "page": 138, "summary": "Intranet multiagente 1C: los tickets de incidentes bajaron de unos 170 000 a 74 000 al mes."}, {"num": "3.9", "title": "Transversales: marketing", "page": 144, "items": ["agente_consumidor"], "summary": "Higgsfield y campañas automatizadas; ¿cómo hacer marketing para agentes?"}, {"num": "3.10", "title": "Transversales: TI", "page": 149, "items": ["validacion_logs", "capa_agentica_buffer"], "summary": "TI como motor de la agentificación; agentes con ID de empleado."}, {"num": "3.11", "title": "Negociación multipartita", "page": 157, "summary": "Red de 121 agentes para preparar a delegados de la COP sobre cambio climático."}]}, {"num": 4, "title": "Evaluación del ROI y los riesgos", "page": 161, "block": "porque", "summary": "La IA agéntica es un modelo operativo, no un proyecto de TI: el ROI se mide sobre una cartera y una plataforma. Cinco tipos de riesgo, tres viñetas (DBS, JPMorganChase, Siemens), construir frente a comprar y pilotos.", "sections": [{"num": "4.1", "title": "El ROI agéntico y los cinco tipos de riesgo", "page": 161, "items": ["cinco_riesgos"], "summary": "ROI beta frente a alfa; la responsabilidad legal recae en humanos y organizaciones."}, {"num": "4.2", "title": "Viñeta 1: la trayectoria de IA de DBS Group", "page": 168, "items": ["grupo_control"], "summary": "Plataformas ADA/ALAN y marco PURE; despliegue de modelos de 12–15 a 2–3 meses."}, {"num": "4.3", "title": "Viñeta 2: JPMorganChase", "page": 169, "summary": "LLM Suite en 200 000 escritorios, barreras de 12 niveles y tiempo desde la idea hasta producción."}, {"num": "4.4", "title": "Viñeta 3: Siemens y sus agentes de IA", "page": 172, "summary": "ROI en métricas de planta (OEE, tiempo de inactividad, kWh por unidad) e integración OT/IT."}, {"num": "4.5", "title": "Conclusiones clave sobre el valor y el ROI", "page": 176, "items": ["plataforma_cartera", "unidades_valor"], "summary": "Gobernanza integrada en la evaluación del valor."}, {"num": "4.6", "title": "Construir frente a comprar en arquitecturas agénticas", "page": 179, "items": ["construir_comprar"], "summary": "La orquestación y las políticas se vuelven estratégicas; crece el riesgo de lock-in."}, {"num": "4.7", "title": "Pilotos iniciales frente a despliegues empresariales", "page": 182, "items": ["piloto_plataforma"], "summary": "Evitar el purgatorio de pilotos con un modelo federado sobre plataformas comunes."}]}, {"num": 5, "title": "Capacidades principales y fundamentos técnicos", "page": 189, "block": "tec", "summary": "Los conceptos técnicos para agentificar: por dónde empezar, personalización, anclaje, coordinación, modos de activación, herramientas, ajuste fino, contexto, memoria y planificación.", "sections": [{"num": "5.1", "title": "¿Por dónde empezar?", "page": 189, "items": ["agentificacion_flujos"], "summary": "Agentificación orgánica de abajo arriba frente a diseño de arriba abajo; protocolos MCP y A2A."}, {"num": "5.2", "title": "Personalización de agentes", "page": 193, "items": ["llm_abierto_comercial"], "summary": "No hay polvo de hadas: la agentificación exige adaptación y desarrollo."}, {"num": "5.3", "title": "Anclaje (fundamentación)", "page": 195, "items": ["anclaje"]}, {"num": "5.4", "title": "Coordinación", "page": 195, "items": ["aaosa"], "summary": "Del coordinador con reglas a la pizarra (OAA) y a AAOSA."}, {"num": "5.5", "title": "Agentes por turnos, continuos y activados por eventos", "page": 198, "items": ["modos_activacion"], "summary": "Codex, Devin y Claude Code como agentes continuos."}, {"num": "5.6", "title": "Elección de herramientas", "page": 200, "items": ["registro_habilidades"], "summary": "Incidentes de OpenClaw y Moltbook."}, {"num": "5.7", "title": "Refinamientos y ajuste fino", "page": 202, "items": ["ajuste_fino"], "summary": "La agentificación es como pelar una cebolla: un proceso continuo."}, {"num": "5.8", "title": "Contexto", "page": 206, "items": ["ingenieria_contexto"]}, {"num": "5.9", "title": "Memoria y planificación", "page": 207, "items": ["memoria_planificacion"], "summary": "La supervisión humana se volverá el cuello de botella."}]}, {"num": 6, "title": "Diseño de sistemas agénticos", "page": 211, "block": "tec", "summary": "No hay solución llave en mano: cada empresa necesita su ciclo de vida de desarrollo agéntico (ADLC), con registro central, identidad de agentes, reglas de autonomía, UX, pruebas y errores comunes.", "sections": [{"num": "6.1", "title": "Consideraciones de diseño", "page": 213, "items": ["identidad_agente", "proceso_autonomia"], "summary": "Repositorio y centro de control centralizados para todos los sistemas agénticos."}, {"num": "6.2", "title": "Confianza", "page": 215, "items": ["componentes_confianza"], "summary": "Ejemplo: medir sesgos en un sistema de contratación."}, {"num": "6.3", "title": "La experiencia de usuario agéntica", "page": 218, "items": ["ux_agentica"]}, {"num": "6.4", "title": "Pruebas de sistemas multiagente", "page": 221, "items": ["red_team"]}, {"num": "6.5", "title": "Errores comunes", "page": 222, "items": ["descomposicion"], "summary": "Costo y latencia: lanzar primero en un sandbox a pequeña escala."}]}, {"num": 7, "title": "Construcción de sistemas confiables", "page": 226, "block": "conf", "summary": "Cuándo confiar en agentes autónomos: confianza calibrada, mapa de riesgos, rendición de cuentas con RACI de segunda capa, el orquestador como plano de control, tres pilares de mitigación, marcos regulatorios y segmentos de usuarios.", "sections": [{"num": "7.1", "title": "El espectro de la confianza: de la fe ciega a la confianza calibrada", "page": 227, "items": ["lentes_confiabilidad"], "summary": "Caso Cruise y marco PRG de Zoox."}, {"num": "7.2", "title": "Viñeta: GitHub Copilot con confianza calibrada", "page": 231, "summary": "Cada cambio pasa por una pull request con revisión humana."}, {"num": "7.3", "title": "Mapeo del panorama de riesgos", "page": 232, "items": ["panorama_riesgos"], "summary": "Incidente OpenClaw en Meta: la compresión de contexto borró la orden de esperar aprobación."}, {"num": "7.4", "title": "Viñeta: agentes autohospedados de Deviniti", "page": 236, "summary": "Privilegios mínimos, colas de aprobación y cumplimiento por diseño para banca regulada."}, {"num": "7.5", "title": "Rendición de cuentas: ¿quién es el responsable?", "page": 241, "items": ["raci_segunda_capa"], "summary": "«La IA lo hizo» no es admisible."}, {"num": "7.6", "title": "Viñeta: RACI de segunda capa en préstamos hipotecarios", "page": 246, "summary": "DualFair del MIT: menos sesgo con precisión similar."}, {"num": "7.7", "title": "Los orquestadores como planos de control responsables", "page": 249, "items": ["plano_control"]}, {"num": "7.8", "title": "Mitigaciones técnicas en sistemas agénticos", "page": 250, "items": ["tres_pilares"], "summary": "De «disparar y olvidar» a autonomía acotada y observable."}, {"num": "7.9", "title": "Gobernanza, explicabilidad, registro y cumplimiento", "page": 257, "items": ["nist_ue"], "summary": "Roles CAIO, CDO y CRO, y comités de gobernanza."}, {"num": "7.10", "title": "Viñeta: cumplimiento continuo de Autodesk", "page": 262, "summary": "Agentes que revisan diseños frente a códigos de ingeniería en tiempo real."}, {"num": "7.11", "title": "Cultura, adopción, cambios generacionales y agentes que confían en agentes", "page": 266}, {"num": "7.12", "title": "Qué dicen los principales estudios sobre la confianza en la IA", "page": 267, "summary": "La confianza varía con la familiaridad, la edad, el rol y el contexto."}, {"num": "7.13", "title": "Segmentos prácticos y cómo abordarlos", "page": 269, "items": ["segmentos_confianza"], "summary": "Los orquestadores también «confían» en agentes según su historial."}, {"num": "7.14", "title": "Viñeta: agentes industriales orquestados de Siemens", "page": 273, "summary": "Confianza en capas: copiloto para operadores y contratos de confianza entre agentes."}, {"num": "7.15", "title": "Integración de todo", "page": 275, "summary": "Autonomía acotada, rendición de cuentas explícita y confianza calibrada avanzan juntas."}]}, {"num": 8, "title": "Escalamiento sin lock-in", "page": 278, "block": "conf", "summary": "Cinco secciones que forman un solo argumento: encapsular y coordinar, evitar el vendor lock-in, preparar la arquitectura para actualizaciones, equilibrar el control central con el empoderamiento y crecer con estándares abiertos.", "sections": [{"num": "8.1", "title": "Encapsulamiento y coordinación", "page": 280, "items": ["catalogo_acciones"], "summary": "Migración incremental: auditar, poner pasarela y catálogo, migrar agente a agente, retirar integraciones frágiles."}, {"num": "8.2", "title": "Evitar el vendor lock-in (agnosticismo de LLM y nube)", "page": 286, "items": ["pasarela_neutral", "costos_compuestos"], "summary": "Caso Grab; tres categorías de capas de orquestación."}, {"num": "8.3", "title": "Arquitecturas a prueba de futuro para actualizaciones", "page": 294, "items": ["cuatro_lentes_futuro"]}, {"num": "8.4", "title": "Propiedad centralizada frente al empoderamiento", "page": 298, "items": ["camino_pavimentado"], "summary": "Caso ANZ Bank y guía de madurez de Microsoft."}, {"num": "8.5", "title": "Expandibilidad, Model Context Protocol y de agente a agente", "page": 301, "items": ["mcp_a2a"], "summary": "MCP como «USB-C» de los agentes."}]}, {"num": 9, "title": "El camino por delante para las empresas agénticas", "page": 309, "block": "futuro", "summary": "La multiagencia es inevitable; la duda es la granularidad. Agentes creados por vibe coding, la Web Agéntica Mundial, robots con agentes y dos escenarios ante la superinteligencia.", "sections": [{"num": "9.1", "title": "Granularidad, vibe coding y la web agéntica", "page": 309, "items": ["granularidad", "vibe_coding_agentes", "web_agentica"], "summary": "Agentes efímeros: agentificación perpetua."}, {"num": "9.2", "title": "Preparación para la próxima ola", "page": 316, "items": ["evaluador_multiagente"], "summary": "Hackathon de más de 50 000 participantes; 40 % no eran programadores."}, {"num": "9.3", "title": "Futuro", "page": 321, "items": ["limites_llm"], "summary": "Robots controlados por agentes, responsabilidad y personalidad jurídica, AGI/ASI y dos escenarios."}]}], "items": {"agencia": {"title": "Agencia", "formula": "Objetivo propio → plan de acción → ejecución → retroalimentación", "summary": "Lo que hace agente a un humano o a una IA; los objetivos y sensores de un agente de IA los diseñan humanos."}, "prompt_sistema": {"title": "Indicativo del sistema (system prompt)", "formula": "Rol + experiencia + descripción de puesto, repetidos en cada entrada", "summary": "Confina a un LLM general a un rol concreto dentro de un flujo de trabajo."}, "agente_llm": {"title": "Agente basado en LLM", "formula": "Agente = LLM + código (arnés agéntico); meta-arnés = sistema que crea o mejora arneses", "summary": "El código actúa sobre las intenciones del LLM y añade planificación, memoria y herramientas."}, "rag": {"title": "RAG como sistema multiagente", "formula": "Agente que resume y codifica → base vectorial → agente que responde", "summary": "Generación aumentada por recuperación: búsqueda por significado en documentos propios."}, "agente_proteccion": {"title": "Agente de protección y registro de intenciones", "formula": "Agente registra el «qué» y el «por qué» → agente de protección aplica ética y normas", "summary": "Un agente vigila a otro e interviene si una petición no cumple las políticas."}, "modelo_vs_agente": {"title": "Modelo frente a agente", "formula": "Modelo: datos → datos · Agente: LLM + herramientas que actúan e iteran", "summary": "El mismo LLM programa mejor como agente porque ejecuta el código y corrige."}, "confabulacion": {"title": "Confabulación (alucinación)", "formula": "Salida muestreada de una distribución → inconsistencia e invención", "summary": "Junto con la seguridad de datos, frenó la adopción empresarial inicial."}, "por_que_multiagente": {"title": "Por qué multiagente y no un solo agente", "formula": "Menos contexto por LLM · LLM más pequeños y locales · ajuste fino por agente · paralelismo · menor costo", "summary": "Un agente de línea de comandos puede costar hasta 45 veces más que su equivalente multiagente."}, "beneficios_agentificacion": {"title": "Beneficios de agentificar el software", "formula": "Registro de intenciones · comunicación robusta · barreras · modularidad · actualización · interoperabilidad · tolerancia a fallos · fin de silos", "summary": "Ventajas de migrar una pila de aplicaciones a una arquitectura basada en agentes."}, "mitigacion_autonomia": {"title": "Mitigar la autonomía", "formula": "Reglas deterministas · umbral de incertidumbre del LLM · agentes de barreras de protección", "summary": "Tres estrategias para decidir cuándo confiar en el LLM, en reglas o en un humano."}, "llm_vs_codigo": {"title": "División LLM / código y sly_data", "formula": "Razonamiento y texto no estructurado → LLM · reglas y consistencia → código", "summary": "sly_data: datos que viajan entre agentes por el código, sin pasar por el LLM. Sin autonomía, mejor un módulo de software."}, "metacognicion": {"title": "Falta de metacognición", "formula": "El LLM no sabe lo que no sabe", "summary": "Límite que justifica controles y contrapesos en sistemas distribuidos y redundantes."}, "tres_fuerzas": {"title": "Tres fuerzas convergentes", "formula": "Madurez tecnológica · presión económica · preparación organizativa", "summary": "Por qué el momento estratégico es ahora."}, "rpa_vs_agentica": {"title": "RPA frente a IA agéntica", "formula": "RPA automatiza pasos · IA agéntica automatiza resultados", "summary": "Aporta velocidad de decisión: percibir, evaluar y actuar casi en tiempo real."}, "capas_valor": {"title": "Tres capas de valor", "formula": "1 Productividad operativa · 2 Calidad y resiliencia · 3 Sistemas adaptativos empresariales", "summary": "Las herramientas actuales operan sobre todo en las capas 1 y 2."}, "adecuacion_casos": {"title": "Dónde encajan y dónde no", "formula": "Sí: soporte proactivo, cadena de suministro, cumplimiento · No: juicio subjetivo, información tácita, alto riesgo", "summary": "Saber dónde no usar agentes es en sí un juicio estratégico."}, "seis_dimensiones": {"title": "Seis dimensiones de preparación", "formula": "Liderazgo · infraestructura · gobernanza y riesgo · arquitectura · recursos técnicos · gestión del cambio", "summary": "Se evalúan con semáforo rojo/ámbar/verde para priorizar inversiones."}, "sdlc_multiagente": {"title": "SDLC multiagente", "formula": "Agentes por rol (revisión, pruebas, gestión) → subredes → red de SDLC", "summary": "Introducción gradual empezando por procesos menos centrales."}, "representacion_intermedia": {"title": "Representación intermedia", "formula": "Código heredado → representación explicada en lenguaje natural → código destino", "summary": "Mejora la migración y sirve para futuras mejoras."}, "nodos_hoja": {"title": "Agentes de nodo hoja", "formula": "LLM locales en el borde + jerarquía regional que consolida", "summary": "Decisiones rápidas con conocimiento local; la jerarquía mira el contexto amplio."}, "apa": {"title": "Automatización de procesos agénticos (APA)", "formula": "RPA rígida con algunos nodos reemplazados por agentes", "summary": "Agentes orientados a resultados que explican sus pasos."}, "agente_consumidor": {"title": "Agentes alineados con el consumidor", "formula": "Red de agentes del usuario ↔ redes de agentes de las empresas", "summary": "Plantea cómo hacer marketing para agentes; analogía con Consumer Reports."}, "validacion_logs": {"title": "Red de agentes validadores", "formula": "Registros de cada agente → validadores con distintas perspectivas → informe o intervención", "summary": "Supervisión no intrusiva y asíncrona; la mejor herramienta para supervisar IA es la IA."}, "capa_agentica_buffer": {"title": "La capa agéntica como amortiguador", "formula": "UX estable ↔ agentes ↔ fuentes y API que se modernizan", "summary": "Permite cambiar aplicaciones y datos sin que el usuario lo note."}, "cinco_riesgos": {"title": "Cinco tipos de riesgo", "formula": "Estratégico · organizacional · gobernanza y cumplimiento · operacional · responsabilidad legal", "summary": "Los agentes son herramientas, no personas jurídicas."}, "grupo_control": {"title": "Incremento con grupo de control", "formula": "Valor de la IA = resultado con IA − resultado sin IA", "summary": "Método de DBS para atribuir valor económico y retirar modelos sin beneficio."}, "plataforma_cartera": {"title": "Plataforma más cartera", "formula": "Infraestructura compartida (datos, orquestación, gobernanza) + cartera de casos de uso", "summary": "Conclusión común de DBS, JPMC y Siemens."}, "unidades_valor": {"title": "Unidades de valor propias", "formula": "Definir unidades → agentes observables · patrones reutilizables · promover solo lo que rinde dentro del riesgo", "summary": "No existe una plantilla de ROI genérica."}, "construir_comprar": {"title": "Construir frente a comprar", "formula": "Diferenciación · sensibilidad de datos · talento interno · interoperabilidad y salida", "summary": "Pila híbrida: comprar modelos e infraestructura; construir orquestación, barreras y agentes de dominio."}, "piloto_plataforma": {"title": "Pilotos con efecto de plataforma", "formula": "Redes de agentes + fuente única de verdad + gobernanza desde el día 1 + líneas base → valor · riesgo · preparación", "summary": "Criterios de éxito acordados antes de empezar."}, "agentificacion_flujos": {"title": "Empezar por los flujos de trabajo", "formula": "Flujo humano codificado → plano del flujo agéntico", "summary": "Preferible al organigrama; tira y afloja entre divisiones y el área central."}, "llm_abierto_comercial": {"title": "LLM comerciales frente a abiertos", "formula": "Datos sensibles o borde → código abierto con ajuste fino", "summary": "Los agentes suelen diseñarse independientes del LLM."}, "anclaje": {"title": "Anclaje", "formula": "Agente en sandbox simulado → agente anclado a datos y sistemas reales", "summary": "Observar agentes no anclados ayuda a descubrir qué herramientas necesitan."}, "aaosa": {"title": "AAOSA y CRUSE", "formula": "Cada agente coordina a sus subordinados y consolida sus respuestas (y su UI)", "summary": "Arquitectura con encapsulación y extensibilidad, independiente del punto de entrada."}, "modos_activacion": {"title": "Modos de activación", "formula": "Por turnos · continuo (bucle con plan) · activado por eventos", "summary": "Se alterna entre programas deterministas y agentes según la parte del flujo."}, "registro_habilidades": {"title": "Registro de habilidades verificadas", "formula": "Habilidad = archivo .md con pasos y API · solo habilidades registradas y examinadas", "summary": "Dar control total de un equipo a un agente es arriesgado."}, "ajuste_fino": {"title": "Ajuste fino y destilación", "formula": "Registros etiquetados → ajuste fino (RLHF) → destilación a SLM", "summary": "Gana especialización y pierde generalidad; conservar los datos etiquetados para modelos nuevos."}, "ingenieria_contexto": {"title": "Ingeniería de contexto", "formula": "Añadir a tiempo la información de estado relevante a la entrada del agente", "summary": "Puede ser agéntica: unos agentes alimentan el contexto de otros."}, "memoria_planificacion": {"title": "Memoria y planificación", "formula": "Memoria: almacenar, indexar, recuperar · Plan: pasos, ejecución, retroceso", "summary": "Compensan que los LLM no aprenden en ejecución."}, "identidad_agente": {"title": "Identidad del agente", "formula": "Firma hash de prompts y arnés en un registro seguro", "summary": "Requisito urgente para la comunicación agéntica B2B y B2C."}, "proceso_autonomia": {"title": "Proceso para decidir la autonomía", "formula": "Responsabilidades en el prompt · agentes de protección · middleware determinista · incertidumbre (≈5 muestras) · botón de desconexión", "summary": "Si nada de lo anterior aplica, el sistema opera de forma autónoma."}, "componentes_confianza": {"title": "Componentes medibles de la confianza", "formula": "Enumerar → cuantificar → monitorear de forma continua", "summary": "Preferir reglas deterministas como primera línea; no certificar una vez y olvidar."}, "ux_agentica": {"title": "Experiencia de usuario agéntica", "formula": "Latencia percibida · multicanal · humano en el ciclo o sobre el ciclo", "summary": "Múltiples puntos de entrada y acceso directo al agente elegido."}, "red_team": {"title": "Equipo rojo agéntico", "formula": "Dividir y probar subredes + casos de prueba generados por IA", "summary": "Revela debilidades y cuánto inventa el sistema."}, "descomposicion": {"title": "Descomposición", "formula": "Espiral sin salida → tiempo de espera · sobrecarga → dividir agentes · coordinador único → pipeline", "summary": "Errores comunes de diseño y sus mitigaciones."}, "lentes_confiabilidad": {"title": "Lentes de confiabilidad", "formula": "Seguridad y fiabilidad · equidad y ética · privacidad · explicabilidad", "summary": "Copiloto, no piloto automático, hasta demostrar rendimiento."}, "panorama_riesgos": {"title": "Panorama de riesgos agénticos", "formula": "Acciones inseguras · vulnerabilidades · privacidad · fuga de PI", "summary": "Las restricciones críticas no deben vivir solo en el contexto que el agente puede truncar."}, "raci_segunda_capa": {"title": "RACI de segunda capa", "formula": "Alcance del juicio · umbrales de riesgo · límites de datos · conflictos · registro", "summary": "Se gobierna un espacio de comportamientos, no un sistema fijo."}, "plano_control": {"title": "Orquestador como plano de control", "formula": "Toda solicitud pasa por el orquestador → reglas de autonomía + auditoría unificada", "summary": "Ser dueño de un sistema agéntico es ser dueño de su orquestador."}, "tres_pilares": {"title": "Tres pilares de mitigación", "formula": "Barreras técnicas y control · supervisión humana y flujo · gobernanza y transparencia", "summary": "Incluye vigilantes, kill-switch, enrutamient <script>
// ---------- build graph ----------
const M=Object.assign({title:"Grafo del libro",subtitle:"",language:"es",itemLabel:"Concepto clave",itemLabelPlural:"Conceptos",resourceLabel:"Apéndice",resourceLabelPlural:"Apéndices",searchHint:"Buscar…",pageLabel:"Página",chapterLabel:"Capítulo",sectionLabel:"Sección"},GRAPH.meta||{});

const firstBlock=Object.keys(BLOCKS)[0];

function add(n){nodes.push(n);byId[n.id]=n;}
const itemHome={};
(GRAPH.chapters||[]).forEach((c,ci)=>{

Object.entries(GRAPH.items||{}).forEach(([id,it])=>{

(GRAPH.resources||[]).forEach((r,ri)=>{
  add({id:"r:"+r.id,type:"apx",num:r.id,label:M.resourceLabel+" "+r.id+": "+r.title,short:r.title,page:r.page,block:"__res",desc:r.summary,order:900000+ri});

const RQ=GRAPH.requires||{};
const addReq=(map,pre,lvl)=>Object.entries(map||{}).forEach(([a,bs])=>bs.forEach(b=>{if(byId[pre+a]&&byId[pre+b])links.push({source:pre+a,target:pre+b,kind:"req",lvl});}));
addReq(RQ.chapters,"ch","ch");addReq(RQ.sections,"s","sec");addReq(RQ.items,"i:","eq");
const CH_DEP={};Object.entries(RQ.chapters||{}).forEach(([a,bs])=>CH_DEP[a]=bs.map(String));
// adjacency
nodes.forEach(n=>{n.out=[];n.inn=[];});
links.forEach(l=>{byId[l.source].out.push(l);byId[l.target].inn.push(l);});

// ---------- prerequisite trace ----------
function trace(id){
  const start=byId[id], set=new Set([id]), q=[];
  const push=x=>{if(!set.has(x)){set.add(x);q.push(x);}};
  const reqOf=n=>n.out.filter(l=>l.kind==="req").map(l=>l.target);
  reqOf(start).forEach(push);
  if(start.type==="sec") start.out.filter(l=>l.kind==="defines").forEach(l=>reqOf(byId[l.target]).forEach(push));
  while(q.length){const n=byId[q.shift()];reqOf(n).forEach(push);}
  // where to read each equation
  const read=new Set(set);
  [...set].forEach(x=>{const n=byId[x];if(n.type==="eq"&&n.home)read.add(n.home);});
  return {set,read};
}

// ---------- rendering ----------
const svg=d3.select("#graph"), root=svg.append("g");
const defs=svg.append("defs");

const posCache={};
const R=n=>n.type==="ch"?17:n.type==="eq"?7:n.type==="apx"?8:4.5;
const col=n=>BLOCKS[n.block].color;

function viewFilter(n){
  if(hidden.has(n.block)) return false;
  if(view==="ch") return n.type==="ch";
  if(view==="eq") return n.type==="eq";
  return true;
}
function linkFilter(l,ids){
  if(!ids.has(l.source.id||l.source)||!ids.has(l.target.id||l.target)) return false;
  if(view==="all") return l.kind!=="req"||l.lvl!=="ch";
  return l.kind==="req";
}
let curNodes=[], curLinks=[], nodeSel, linkSel;
function render(){
  const w=svg.node().clientWidth, h=svg.node().clientHeight;
  curNodes=nodes.filter(viewFilter).map(n=>{const c=posCache[n.id];return Object.assign(n,c?{x:c.x,y:c.y}:{});});
  const ids=new Set(curNodes.map(n=>n.id));

  // initial layout by chapter order along a spiral so chapters keep reading order
  curNodes.forEach(n=>{
    if(n.x==null){const ci=(byId["ch"+(n.ch??n.num)]||{idx:20}).idx+1, a=ci*0.62, r=60+ci*22;
      n.x=w/2+Math.cos(a)*r+(Math.random()-.5)*30; n.y=h/2+Math.sin(a)*r+(Math.random()-.5)*30;}
  });
  if(view==="ch"){
    const depth={},seen=new Set();
    const dep=c=>{c=String(c);if(depth[c]!=null)return depth[c];if(seen.has(c))return 0;seen.add(c);
      return depth[c]=(CH_DEP[c]||[]).reduce((m,p)=>Math.max(m,dep(p)+1),0);};
    const rows={};curNodes.forEach(n=>{const d=dep(n.num);(rows[d]=rows[d]||[]).push(n);});
    const rowH=w<720?96:92, maxPer=w<720?3:6; let y=50;
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(d=>{const arr=rows[d].sort((a,b)=>a.idx-b.idx);
      for(let k=0;k<arr.length;k+=maxPer){const part=arr.slice(k,k+maxPer);
        const sp=Math.min(w<720?125:250,(w-24)/part.length);
        part.forEach((n,i)=>{n.fx=w/2+(i-(part.length-1)/2)*sp;n.fy=y;n.wrap=Math.max(11,Math.min(22,Math.floor(sp/7.2)));});
        y+=rowH;}});
  } else curNodes.forEach(n=>{n.fx=null;n.fy=null;});
  linkSel=gL.selectAll("path").data(curLinks,d=>d.source+">"+d.target).join("path")
    .attr("class",d=>"link "+d.kind).attr("marker-end",d=>d.kind==="req"?"url(#arr)":null);
  nodeSel=gN.selectAll("g.node").data(curNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button")
      .attr("aria-label",d=>d.label);

    g.append("text").attr("class","num");
    g.append("text").attr("class","lbl");
    return g;
  });
  nodeSel.select(".shape").attr("fill",col).attr("d",d=>{
    const r=R(d);
    if(d.type==="eq") return `M0,${-r*1.25}L${r*1.25},0L0,${r*1.25}L${-r*1.25},0Z`;
    if(d.type==="apx") return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;

  });

    const t=d3.select(this), txt=d.type==="sec"?d.num+" "+d.label:d.type==="apx"?d.short:d.label;

      const words=txt.split(" "),lines=[];let cur="";
      words.forEach(wd=>{if((cur+" "+wd).trim().length>(d.wrap||19)&&cur){lines.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});lines.push(cur);

function ticked(){

  });

}
function labelLOD(k){
  if(!nodeSel) return;

    if(selected&&(d.id===selected||(traceOn&&curTrace&&curTrace.read.has(d.id)))) return null;
    if(d.type==="ch"||view!=="all") return null;

function fit(sub){
  const set=(Array.isArray(sub)?sub:curNodes).filter(n=>n.x!=null);

  let w=svg.node().clientWidth,h=svg.node().clientHeight,ox=0;
  const panelOpen=panel.classList.contains("open"), mobile=w<720;
  if(panelOpen&&!mobile){w-=400;} if(panelOpen&&mobile){h*=.4;}
  let oy=0; if(mobile&&!panelOpen){h-=56;}
  const xs=set.map(n=>n.x),ys=set.map(n=>n.y);
  const padR=view==="ch"?60:150, padB=view==="ch"?50:30;
  const x0=Math.min(...xs)-(view==="ch"?60:30),x1=Math.max(...xs)+padR,y0=Math.min(...ys)-30,y1=Math.max(...ys)+padB;
  const k=Math.min(2.2,.92*Math.min(w/(x1-x0),h/(y1-y0)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k));
}
d3.select("#zin").on("click",()=>svg.transition().call(zoom.scaleBy,1.4));
d3.select("#zout").on("click",()=>svg.transition().call(zoom.scaleBy,1/1.4));
d3.select("#fit").on("click",()=>fit());
svg.on("click",()=>closePanel());

// ---------- highlight ----------
let curTrace=null;
function applyHighlight(){
  if(!nodeSel) return;
  nodeSel.classed("sel",d=>d.id===selected);
  if(!selected){nodeSel.classed("dim",false);linkSel.classed("dim",false).classed("hot",false);labelLOD(d3.zoomTransform(svg.node()).k);return;}
  let keep;
  if(traceOn&&curTrace){keep=curTrace.read;}
  else{keep=new Set([selected]);byId[selected].out.concat(byId[selected].inn).forEach(l=>{keep.add(l.source.id||l.source);keep.add(l.target.id||l.target);});}
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",d=>!(keep.has(d.source.id)&&keep.has(d.target.id)))
    .classed("hot",d=>traceOn&&d.kind==="req"&&keep.has(d.source.id)&&keep.has(d.target.id));
  labelLOD(d3.zoomTransform(svg.node()).k);
}

// ---------- panel ----------
const panel=document.getElementById("panel");
const kindName={ch:M.chapterLabel,sec:M.sectionLabel,eq:M.itemLabel,apx:M.resourceLabel};
function item(id,prefix){
  const n=byId[id];
  const t=n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label;
  return `<li><button data-go="${esc(id)}"><span class="dot" style="background:${col(n)}"></span><span>${esc(t)}</span></button></li>`;
}
function list(title,ids,ordered){
  if(!ids.length) return "";
  ids=[...new Set(ids)].sort((a,b)=>byId[a].order-byId[b].order);
  return `<div class="p-sec"><h3>${title}</h3>${ordered?'<ol class="p-list path">':'<ul class="p-list">'}${ids.map(i=>item(i)).join("")}${ordered?"</ol>":"</ul>"}</div>`;
}
function select(id,center){
  selected=id;traceOn=false;curTrace=null;
  const n=byId[id];
  if(!curNodes.includes(n)){view=n.type==="ch"?"ch":n.type==="eq"?"eq":"all";hidden.delete(n.block);syncViewBtns();syncLegend();render();setTimeout(()=>centerOn(id),view==="all"?1500:1000);}
  else if(center) centerOn(id);
  const outT=k=>n.out.filter(l=>l.kind===k).map(l=>l.target.id||l.target);
  const inT=k=>n.inn.filter(l=>l.kind===k).map(l=>l.source.id||l.source);
  let html=`<button class="close" aria-label="Cerrar">×</button>
   <div class="p-kind"><span class="dot" style="background:${col(n)}"></span>${esc(kindName[n.type])} · ${esc(BLOCKS[n.block].name)}</div>
   <div class="p-title">${esc(n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label)}</div>`;
  const meta=[];
  if(n.page) meta.push(M.pageLabel+" "+n.page);
  if(n.type==="sec") meta.push(M.chapterLabel+" "+n.ch+": "+byId["ch"+n.ch].label);
  if(n.type==="eq"){if(n.ref)meta.push(M.itemLabel+" "+n.ref);if(n.home)meta.push(M.sectionLabel+" "+byId[n.home].num);}
  if(meta.length) html+=`<div class="p-meta">${esc(meta.join(". "))}</div>`;
  if(n.formula) html+=`<div class="formula" style="color:${col(n)}"><span style="color:var(--ink)">${esc(n.formula)}</span></div>`;
  if(n.desc) html+=`<p class="p-desc">${esc(n.desc)}</p>`;
  if(n.type!=="apx") html+=`<button class="trace-btn" id="traceBtn" aria-pressed="false">Trazar prerrequisitos</button><div id="pathBox"></div>`;
  if(n.type==="ch") html+=list("Secciones",outT("contains"),true)+list(M.itemLabelPlural+" clave",outT("contains").flatMap(s=>byId[s].out.filter(l=>l.kind==="defines").map(l=>l.target.id||l.target)))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"));
  if(n.type==="sec") html+=list(M.itemLabelPlural+" que presenta",outT("defines"))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"))+list(M.resourceLabelPlural+" que consulta",outT("data"));
  if(n.type==="eq") html+=list("Se deriva de o usa",outT("req"))+list("Base de",inT("req"))+list("Dónde se presenta",inT("defines"));
  if(n.type==="apx") html+=list("Se consulta en",inT("data"));
  panel.innerHTML=html;panel.classList.add("open");
  panel.querySelector(".close").onclick=closePanel;
  panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  const tb=document.getElementById("traceBtn");
  if(tb) tb.onclick=()=>{traceOn=!traceOn;tb.setAttribute("aria-pressed",traceOn);tb.textContent=traceOn?"Quitar trazado":"Trazar prerrequisitos";
    curTrace=traceOn?trace(id):null;
    const box=document.getElementById("pathBox");
    if(traceOn){const ids=[...curTrace.read].filter(x=>x!==id&&byId[x].type!=="eq");
      box.innerHTML=ids.length?list("Ruta de lectura sugerida, en orden del libro",ids,true):'<p class="empty">No depende de otros temas: es un punto de partida.</p>';
      box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}
    else box.innerHTML="";
    applyHighlight();
    if(traceOn) fit(curNodes.filter(x=>curTrace.read.has(x.id)));};
  document.getElementById("hint").style.opacity=0;
  applyHighlight();
}
function closePanel(){panel.classList.remove("open");selected=null;traceOn=false;curTrace=null;applyHighlight();}
function centerOn(id){
  const n=byId[id];if(n.x==null) return;
  const w=svg.node().clientWidth,h=svg.node().clientHeight,k=Math.max(1.3,d3.zoomTransform(svg.node()).k);
  const mobile=w<720, cx=mobile?w/2:(w-400)/2, cy=mobile?h*.28:h/2;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(cx-k*n.x,cy-k*n.y).scale(k));
}

// ---------- controls ----------
function syncViewBtns(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewBtns();closePanel();render();});
const legend=document.getElementById("legend");
function syncLegend(){
  legend.innerHTML=Object.entries(BLOCKS).map(([k,v])=>`<button data-b="${k}" aria-pressed="${!hidden.has(k)}"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}</button>`).join("")+
  `<div class="shapes"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#172A3A"/></svg>${esc(M.chapterLabel.toLowerCase())} o ${esc(M.sectionLabel.toLowerCase())}</span><span><svg width="12" height="12"><path d="M6 0L12 6L6 12L0 6Z" fill="#172A3A"/></svg>${esc(M.itemLabel.toLowerCase())}</span>${hasRes?`<span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#172A3A"/></svg>${esc(M.resourceLabel.toLowerCase())}</span>`:""}</div>`;
  legend.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);syncLegend();render();});
}
syncLegend();
// search
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(t.length<2){res.style.display="none";return;}
  const hits=nodes.filter(n=>norm((n.num||"")+" "+n.label+" "+(n.formula||"")+" "+(n.desc||"")).includes(t))
    .sort((a,b)=>(norm(a.label).includes(t)?0:1)-(norm(b.label).includes(t)?0:1)||a.order-b.order).slice(0,14);
  res.innerHTML=hits.length?hits.map(n=>`<li><button data-go="${esc(n.id)}"><span class="k">${esc(n.type==="sec"?n.num:n.type==="ch"?n.num:n.type==="eq"?"·":n.num)}</span><span>${esc(n.type==="apx"?n.short:n.label)}</span></button></li>`).join(""):'<li style="padding:8px;font-size:.9rem">Sin coincidencias. Prueba con otra palabra o un número de sección.</li>';
  res.style.display="block";
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{res.style.display="none";q.value="";q.blur();select(b.dataset.go,true);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector("[data-go]");if(f)f.click();}if(e.key==="Escape"){res.style.display="none";}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.style.display="none";});
window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>fit(),200);});
render();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
</script>
</body>
</html>
