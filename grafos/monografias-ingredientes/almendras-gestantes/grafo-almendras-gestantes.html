<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almendras en gestantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-wrap:anywhere;white-space:normal}
.caution{font-size:.88rem;line-height:1.45;background:#FBF1DC;border-left:3px solid #B07A12;color:#4A3A12;padding:8px 10px;margin:0 0 12px;border-radius:0 3px 3px 0}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Almendras en gestantes", "subtitle": "Grafo construido desde literatura científica y fuentes oficiales · con alertas de evidencia", "itemLabel": "Producto, componente o efecto", "itemLabelPlural": "Productos, componentes y efectos", "resourceLabel": "Tabla", "resourceLabelPlural": "Tablas", "searchHint": "Buscar: diabetes gestacional, alergia, folato, bebida, amarga, Salmonella, INMA…"}, "blocks": {"pregunta": {"name": "Pregunta y guías", "color": "#3F6FA0"}, "composicion": {"name": "Composición y formas", "color": "#B08A2E"}, "efectos": {"name": "Efectos en madre e hijo", "color": "#6B8E4E"}, "alergia": {"name": "Alergia", "color": "#6B5B95"}, "seguridad": {"name": "Seguridad alimentaria", "color": "#B5465A"}, "contexto": {"name": "Contexto colombiano y síntesis", "color": "#A0663F"}}, "chapters": [{"num": 1, "title": "Pregunta, contexto y recomendaciones vigentes", "block": "pregunta", "summary": "Ninguna guía consultada nombra la almendra; todas piden dieta saludable y suplementos de hierro, ácido fólico y calcio.", "sections": [{"num": "1.1", "title": "Pregunta clínica", "summary": "¿Comer almendra dulce o sus derivados en la gestación y la lactancia aporta beneficio o riesgo a la madre y al hijo?", "items": ["p_almendra_dulce"]}, {"num": "1.2", "title": "Guías internacionales", "summary": "OMS 2016 recomienda consejería de alimentación saludable y suplementos; no da metas para frutos secos.", "items": ["h_guias_internacionales"]}, {"num": "1.3", "title": "Normas y guías de Colombia", "summary": "La Resolución 3280 de 2018 fija suplementos; la guía del ICBF para gestantes incluye nueces y maní, no almendra.", "items": ["h_guias_colombia"]}]}, {"num": 2, "title": "Composición relevante para la gestación", "block": "composicion", "summary": "Una porción de 28 g aporta 162 kcal, grasa monoinsaturada, vitamina E y magnesio; aporta poco folato y hierro.", "sections": [{"num": "2.1", "title": "Energía, grasa y proteína", "summary": "La almendra es densa en energía; la mayor parte de su grasa es monoinsaturada.", "items": ["c_energia_macros"]}, {"num": "2.2", "title": "Folato, hierro y zinc", "summary": "Los aportes por porción son pequeños frente a las metas de la gestación.", "items": ["c_folato_hierro"]}, {"num": "2.3", "title": "Vitamina E, magnesio y calcio", "summary": "Una porción cubre cerca de la mitad de la vitamina E y un quinto del magnesio de una gestante.", "items": ["c_vite_magnesio_calcio"]}, {"num": "2.4", "title": "Fibra", "summary": "Una porción aporta 3,5 g de fibra, un octavo de la ingesta adecuada en la gestación.", "items": ["c_fibra"]}, {"num": "2.5", "title": "Fitatos y oxalatos", "summary": "Los fitatos ligan hierro y zinc; los frutos secos contienen oxalato en cantidades variables.", "items": ["c_fitatos_oxalatos"]}]}, {"num": 3, "title": "Efectos maternos", "block": "efectos", "summary": "Hay un ensayo pequeño con almendra en gestantes hipertensas; el resto de la evidencia es de frutos secos o de dieta mediterránea.", "sections": [{"num": "3.1", "title": "Diabetes gestacional y glucemia", "summary": "No hay ensayos publicados con almendra en diabetes gestacional; hay cohortes de frutos secos y un ensayo de dieta mediterránea con pistachos.", "items": ["u_diabetes_gestacional", "h_ensayo_st_carlos"]}, {"num": "3.2", "title": "Presión arterial y lípidos", "summary": "Un ensayo en Pakistán con 25 g/día de almendra bajó la presión y el LDL en gestantes con hipertensión y dislipidemia.", "items": ["u_presion_lipidos"]}, {"num": "3.3", "title": "Ganancia de peso", "summary": "En el ensayo St. Carlos la dieta mediterránea con pistachos redujo la ganancia de peso; no hay datos específicos de almendra."}, {"num": "3.4", "title": "Estreñimiento", "summary": "La fibra mejora la frecuencia de deposiciones en la gestación; no hay ensayos con almendra.", "items": ["u_estrenimiento"]}, {"num": "3.5", "title": "Anemia y déficit de folato", "summary": "La almendra no reemplaza el hierro ni el ácido fólico suplementarios que indica la norma.", "items": ["u_anemia_folato"]}]}, {"num": 4, "title": "Efectos fetales y del recién nacido", "block": "efectos", "summary": "La evidencia en el hijo viene de frutos secos en general: un ensayo de dieta mediterránea y una cohorte española de neurodesarrollo.", "sections": [{"num": "4.1", "title": "Peso al nacer y prematuridad", "summary": "La dieta mediterránea con pistachos redujo recién nacidos pequeños y grandes para la edad gestacional; no aumentó el peso al nacer.", "items": ["u_crecimiento_fetal"]}, {"num": "4.2", "title": "Neurodesarrollo", "summary": "En la cohorte INMA, más frutos secos en el primer trimestre se asoció con mejor atención a los 8 años.", "items": ["u_neurodesarrollo"]}, {"num": "4.3", "title": "Salud del niño a 6 años", "summary": "En la cohorte St. Carlos, mayor adherencia materna a la dieta mediterránea con frutos secos se asoció con menos bronquiolitis y eccema."}]}, {"num": 5, "title": "Alergia", "block": "alergia", "summary": "Comer frutos secos en el embarazo no aumenta la alergia del hijo; las guías desaconsejan evitarlos para prevenir alergia.", "sections": [{"num": "5.1", "title": "Consumo materno y alergia del hijo", "summary": "Tres cohortes grandes (NHS II/GUTS, DNBC, Project Viva) asocian el consumo materno de frutos secos o maní con menos alergia o asma en el hijo.", "items": ["u_alergia_hijo"]}, {"num": "5.2", "title": "Guías EAACI y AAP", "summary": "EAACI 2020 y AAP 2019 no recomiendan restringir alérgenos en la gestación ni en la lactancia.", "items": ["h_guias_alergia"]}, {"num": "5.3", "title": "Gestante con alergia a la almendra", "summary": "La gestante con alergia confirmada debe evitar la almendra; los tests con extracto tienen baja especificidad.", "items": ["u_alergia_materna"]}, {"num": "5.4", "title": "Lactancia", "summary": "Las mismas guías aplican a la lactancia: no hay que evitar frutos secos para prevenir alergia en el lactante."}]}, {"num": 6, "title": "Seguridad alimentaria", "block": "seguridad", "summary": "Los riesgos reales son la almendra amarga, las aflatoxinas y la Salmonella en almendra cruda sin tratar.", "sections": [{"num": "6.1", "title": "Almendra amarga y amigdalina", "summary": "La almendra amarga y las semillas de albaricoque liberan cianuro; pocos gramos superan la dosis aguda de referencia de EFSA.", "items": ["p_almendra_amarga", "u_intoxicacion_cianuro"]}, {"num": "6.2", "title": "Aflatoxinas", "summary": "La UE y el Codex fijan límites de aflatoxinas para almendra; la compra a granel sin control aumenta la incertidumbre.", "items": ["c_aflatoxinas"]}, {"num": "6.3", "title": "Salmonella y pasteurización", "summary": "Dos brotes por almendra cruda llevaron a EE. UU. a exigir desde 2007 una reducción de 4 log de Salmonella.", "items": ["h_salmonella_pasteurizacion"]}, {"num": "6.4", "title": "Interacción con hierro y calcio", "summary": "Los fitatos de la almendra pueden reducir la absorción de hierro no hemo; conviene separar el suplemento de hierro de las comidas ricas en fitatos."}]}, {"num": 7, "title": "Formas, cantidad y preparación", "block": "composicion", "summary": "Porción de 28 g, almendra pasteurizada o tostada; el remojo no mejora minerales y la bebida no reemplaza la leche.", "sections": [{"num": "7.1", "title": "Porción y frecuencia", "summary": "La porción de referencia es 28 g; los estudios en gestantes usaron entre 5 y 25 g/día o porciones por semana.", "items": ["h_porcion"]}, {"num": "7.2", "title": "Remojo o «activación»", "summary": "Remojar 4–24 h cambió los fitatos entre −12 % y +10 % y bajó algunos minerales.", "items": ["u_absorcion_remojo"]}, {"num": "7.3", "title": "Mantequilla y harina", "summary": "Tienen la misma composición base que la almendra; la mantequilla sin azúcar ni sal añadidos es la opción más simple.", "items": ["p_mantequilla_harina"]}, {"num": "7.4", "title": "Bebida de almendra", "summary": "La bebida aporta 0,66 g de proteína por 100 g y suele no tener yodo; su calcio depende de la fortificación.", "items": ["p_bebida_almendra", "u_bebida_vs_leche"]}]}, {"num": 8, "title": "Contexto colombiano y tradiciones", "block": "contexto", "summary": "La almendra se importa y es costosa; el maní y las nueces ya están en la guía del ICBF; persisten creencias sin respaldo.", "sections": [{"num": "8.1", "title": "Disponibilidad y alternativas en Colombia", "summary": "Colombia no figura como productor de almendra; el maní es la alternativa local más barata y figura en la guía del ICBF.", "items": ["h_colombia_disponibilidad"]}, {"num": "8.2", "title": "Creencias tradicionales", "summary": "Circulan creencias de «calor», aborto o inducción del parto; no hay estudios que liguen la almendra comida con esos desenlaces.", "items": ["h_creencias_calor", "u_parto_aborto"]}]}, {"num": 9, "title": "Conclusiones", "block": "contexto", "summary": "La almendra es un alimento seguro y opcional en la gestación sin alergia; no es tratamiento ni sustituye suplementos.", "sections": [{"num": "9.1", "title": "Lo que está respaldado", "summary": "Los frutos secos dentro de una dieta mediterránea se asocian con menos diabetes gestacional; no hay que evitarlos por alergia."}, {"num": "9.2", "title": "Lo que no está respaldado", "summary": "La almendra no reemplaza suplementos ni leche, el remojo no mejora minerales y no hay datos propios de almendra en diabetes gestacional."}, {"num": "9.3", "title": "Recomendaciones prácticas medibles", "summary": "Si no hay alergia: hasta 28 g/día de almendra dulce pasteurizada o tostada, sin azúcar ni sal añadidos, dentro del plan de alimentación."}, {"num": "9.4", "title": "Huecos de evidencia", "summary": "Faltan ensayos con almendra en diabetes gestacional, peso al nacer y neurodesarrollo; un ensayo británico está en curso.", "items": ["h_huecos_evidencia"]}]}], "items": {"p_almendra_dulce": {"title": "Almendra dulce (Prunus dulcis)", "summary": "Almendra: semilla comestible de la variedad dulce, cruda, tostada o en derivados. Es el alimento al que se refiere la pregunta clínica.", "formula": "Porción de referencia: 28 g (USDA FDC 170567)"}, "h_guias_internacionales": {"title": "Guías internacionales de alimentación prenatal", "summary": "No específico de almendra: OMS 2016 recomienda consejería de alimentación saludable, hierro y ácido fólico diarios, y calcio donde la ingesta es baja. No fija metas para frutos secos.", "formula": "Hierro 30–60 mg + ácido fólico 400 µg/día · calcio 1,5–2,0 g/día (OMS 2016)"}, "h_guias_colombia": {"title": "Resolución 3280 de 2018 y guía del ICBF", "summary": "No específico de almendra: la ruta materno-perinatal fija suplementos de ácido fólico, calcio y hierro. La guía del ICBF para gestantes nombra nueces y maní, no almendra.", "formula": "Ácido fólico 0,4 mg · calcio 1200 mg/día desde la semana 14"}, "c_energia_macros": {"title": "Energía, grasa y proteína", "summary": "Almendra: densa en energía, con grasa sobre todo monoinsaturada y proteína vegetal moderada.", "formula": "28 g: 162 kcal · grasa 14,0 g (monoinsaturada 8,8 g) · proteína 5,9 g"}, "c_folato_hierro": {"title": "Folato, hierro y zinc", "summary": "Almendra: aportes pequeños por porción frente a las recomendaciones para la gestación.", "formula": "28 g: folato 12 µg (2 % de 600 µg) · hierro 1,0 mg (4 % de 27 mg) · zinc 0,9 mg"}, "c_vite_magnesio_calcio": {"title": "Vitamina E, magnesio y calcio", "summary": "Almendra: buena fuente de vitamina E y de magnesio; aporte moderado de calcio.", "formula": "28 g: vitamina E 7,2 mg (48 % de 15 mg) · magnesio 76 mg · calcio 75 mg"}, "c_fibra": {"title": "Fibra", "summary": "Almendra: aporta fibra en cantidad moderada por porción.", "formula": "28 g: 3,5 g de fibra (12,5 % de 28 g/día)"}, "c_fitatos_oxalatos": {"title": "Fitatos y oxalatos", "summary": "Almendra y frutos secos en general: el fitato liga hierro y zinc; los frutos secos tienen oxalato total entre 42 y 469 mg/100 g. No se confirmó el valor específico de almendra.", "formula": "Fitato de almendra: 14,7 µmol/g (Lee 2018)"}, "u_diabetes_gestacional": {"title": "Diabetes gestacional y glucemia", "summary": "Frutos secos en general: una cohorte china y un ensayo español de dieta mediterránea con pistachos mostraron menos diabetes gestacional. Almendra: no hay ensayos publicados en diabetes gestacional.", "formula": "Cohorte: RR 0,65 (IC 95 % 0,48–0,89) · ECA St. Carlos: RR 0,73 (0,56–0,95)", "caution": "No hay ensayos publicados con almendra en diabetes gestacional. Los datos vienen de frutos secos en general. En un ensayo español, una dieta mediterránea con pistachos y aceite de oliva redujo la diabetes gestacional (RR 0,73). La almendra puede ser parte de esa dieta. No reemplaza el tratamiento ni el control de glucemia. (Assaf-Balut 2017; Pang 2022)"}, "h_ensayo_st_carlos": {"title": "Ensayo St. Carlos (Madrid)", "summary": "Frutos secos en general (pistachos): ECA en 1000 gestantes normoglucémicas con dieta mediterránea más aceite de oliva extra virgen y pistachos frente a dieta baja en grasa.", "formula": "Diabetes gestacional 17,1 % frente a 23,4 % · n = 874 analizadas"}, "u_presion_lipidos": {"title": "Presión arterial y lípidos", "summary": "Almendra: ECA de 12 semanas en Karachi con gestantes hipertensas y dislipidémicas; 25 g/día bajó más la presión y los lípidos que el control sin intervención.", "formula": "n = 46 · PAS −18,3 % frente a −7,4 % · LDL −27,3 % (25 g/día)", "caution": "Si hay hipertensión o dislipidemia en la gestación, 25 g/día de almendra se asoció con menor presión y LDL en un ensayo pequeño. Fueron 46 gestantes, sin placebo, en un solo centro. No reemplaza el tratamiento antihipertensivo ni el control prenatal. (Arslan 2025)"}, "u_estrenimiento": {"title": "Estreñimiento del embarazo", "summary": "No específico de almendra: Cochrane halló más deposiciones con suplementos de fibra en gestantes. No hay ensayos con almendra.", "formula": "Fibra: +2,24 deposiciones/semana (IC 95 % 0,96–3,52) · 1 ECA, n = 40", "caution": "No hay ensayos con almendra en el estreñimiento del embarazo. La fibra en general aumentó la frecuencia de deposiciones (+2,24 por semana) en un ensayo pequeño. La almendra aporta 3,5 g de fibra por porción. Sumar agua y otras fuentes de fibra. (Cochrane, Rungsiprakarn 2015)"}, "u_anemia_folato": {"title": "Anemia y prevención de defectos del tubo neural", "summary": "Almendra: una porción cubre 4 % del hierro y 2 % del folato que necesita una gestante. No sustituye los suplementos indicados.", "formula": "Para 27 mg de hierro harían falta unos 730 g de almendra/día", "caution": "La almendra no reemplaza el hierro ni el ácido fólico suplementarios. Una porción de 28 g aporta 4 % del hierro y 2 % del folato que necesita una gestante. Mantener los suplementos que indica la Resolución 3280 de 2018. (USDA FDC; OMS 2016)"}, "u_crecimiento_fetal": {"title": "Peso al nacer y prematuridad", "summary": "Frutos secos en general: en el ensayo St. Carlos bajaron los recién nacidos pequeños y grandes para la edad gestacional y la prematuridad. Almendra: sin datos propios.", "formula": "Desenlace compuesto materno-fetal: RR 0,48 (IC 95 % 0,37–0,63) · NNT 5", "caution": "No hay estudios que muestren que la almendra aumente el peso al nacer. En el ensayo St. Carlos, la dieta mediterránea con pistachos redujo tanto los recién nacidos pequeños como los grandes para la edad gestacional. El objetivo es un crecimiento adecuado, no un peso mayor. (Assaf-Balut 2017 y 2019)"}, "u_neurodesarrollo": {"title": "Neurodesarrollo del hijo", "summary": "Frutos secos en general: en la cohorte INMA (España), más de 32 g/semana en el primer trimestre se asoció con mejor atención a los 8 años. Almendra: solo un estudio en ratas.", "formula": "n = 2208 · tiempo de reacción −13,82 ms (IC 95 % −23,40 a −4,23)", "caution": "Nota de contexto: el dato viene de una cohorte española (INMA) con frutos secos en general, no de almendra. El efecto fue pequeño, en una prueba de atención a los 8 años. No hay ensayos clínicos. (Gignac 2019)"}, "u_alergia_hijo": {"title": "Consumo materno y alergia del hijo", "summary": "Frutos secos en general y maní: en hijos de madres no alérgicas, más consumo periparto se asoció con menos alergia a frutos secos y menos asma.", "formula": "NHS II/GUTS: OR 0,31 (IC 95 % 0,13–0,75) · DNBC asma: OR 0,75 (0,67–0,84)", "caution": "Si la madre no es alérgica, no hay que evitar frutos secos en la gestación ni en la lactancia. Tres cohortes grandes asociaron más consumo con menos alergia o asma en el hijo. EAACI 2020 y AAP 2019 desaconsejan restringir alérgenos para prevenir alergia. (Frazier 2014; Maslova 2012; Halken 2021)"}, "h_guias_alergia": {"title": "Guías EAACI 2020 y AAP 2019", "summary": "No específico de almendra: ambas guías desaconsejan restringir alérgenos en la gestación o la lactancia para prevenir alergia en el hijo."}, "u_alergia_materna": {"title": "Gestante con alergia a la almendra", "summary": "Almendra: la alergia puede ser primaria (Pru du 6) o cruzada con polen de abedul (Pru du 1). El extracto de almendra tiene baja especificidad diagnóstica.", "formula": "Prevalencia autorreportada en Europa: 2,0 % · especificidad del extracto: 33 %", "caution": "Si la gestante tiene alergia confirmada a la almendra, debe evitarla y sus derivados, incluida la bebida. Si hay alergia a otros frutos secos, consultar antes de introducirla. Un IgE positivo al extracto no confirma alergia. (Kabasser 2021; Brettig 2021)"}, "p_almendra_amarga": {"title": "Almendra amarga y semillas de albaricoque", "summary": "Almendra amarga (no la dulce): rica en amigdalina, que libera cianuro al masticarla. Se vende como «vitamina B17» sin eficacia demostrada.", "formula": "Cochrane: 0 ensayos válidos de laetrile en cáncer", "caution": "La almendra amarga y las semillas de albaricoque no son seguras. Liberan cianuro. Entre 0,1 y 1,4 g de almendra amarga pueden superar la dosis aguda de referencia. La «vitamina B17» no es una vitamina y no tiene eficacia probada en cáncer. En la gestación, evitarlas siempre. (EFSA 2016; Milazzo 2015)"}, "u_intoxicacion_cianuro": {"title": "Intoxicación por cianuro", "summary": "Almendra amarga: hay casos de acidosis metabólica grave y paro tras ingerirla. EFSA fijó una dosis aguda de referencia de cianuro.", "formula": "ARfD 20 µg/kg · 0,1–1,4 g de almendra amarga pueden alcanzarla"}, "c_aflatoxinas": {"title": "Aflatoxinas", "summary": "Almendra: puede contaminarse con aflatoxinas por hongos. La UE y el Codex fijan límites para almendra lista para consumo.", "formula": "UE: B1 8 µg/kg y total 10 µg/kg · Codex: total 10 µg/kg"}, "h_salmonella_pasteurizacion": {"title": "Salmonella y pasteurización", "summary": "Almendra: brotes de salmonelosis por almendra cruda en 2000–2001 y 2003–2004. Desde 2007 EE. UU. exige tratamiento validado.", "formula": "Reducción mínima de 4 log (10 000 veces) de Salmonella", "caution": "La almendra cruda sin tratar puede tener Salmonella. Hubo brotes en 2000–2001 y 2003–2004. En la gestación, preferir almendra pasteurizada o tostada de origen controlado. Evitar la almendra cruda a granel sin rotulado. (Chen 2026; USDA 2007)"}, "h_porcion": {"title": "Porción y frecuencia", "summary": "Almendra: la porción de referencia es 28 g. Los estudios usaron 10–25 g/día (almendra) o cerca de 5 g/día (frutos secos en cohortes).", "formula": "28 g = 162 kcal"}, "u_absorcion_remojo": {"title": "Remojo o «activación»", "summary": "Almendra y frutos secos: remojar 4–24 h casi no cambió el fitato y redujo algunos minerales. No mejora la biodisponibilidad.", "formula": "Fitato: −12 % a +10 % (Kumari 2020) · −4,75 % a 24 h (Lee 2018)", "caution": "El remojo o «activación» no mejora la absorción de minerales de la almendra. En laboratorio, el fitato cambió entre −12 % y +10 %. Algunos minerales bajaron. Remojar es opcional, por gusto o textura. (Kumari 2020; Lee 2018)"}, "p_mantequilla_harina": {"title": "Mantequilla y harina de almendra", "summary": "Almendra: derivados con composición base similar. Algunas versiones comerciales añaden azúcar, sal o aceites."}, "p_bebida_almendra": {"title": "Bebida de almendra", "summary": "Almendra: bebida vegetal con muy poca almendra. Su calcio y vitaminas dependen de la fortificación.", "formula": "Sin azúcar: 19 kcal y 0,66 g de proteína por 100 g"}, "u_bebida_vs_leche": {"title": "Bebida de almendra frente a leche de vaca", "summary": "Almendra: frente a la leche de vaca, la bebida aporta 5 veces menos proteína y suele no tener yodo. Quienes solo la toman tienen menos yodo en orina.", "formula": "Proteína 0,66 g frente a 3,27 g/100 g · yodo urinario 79 frente a 132 µg/L", "caution": "La bebida de almendra no reemplaza la leche en la gestación. Aporta unas 5 veces menos proteína. Suele no tener yodo. Si se usa como sustituto, elegir una fortificada con calcio, yodo y vitamina B12, y cubrir la proteína con otros alimentos. (USDA FDC; Dineva 2020)"}, "h_colombia_disponibilidad": {"title": "Disponibilidad y alternativas en Colombia", "summary": "Almendra: producto importado en Colombia. Maní y nueces figuran en la guía del ICBF; el maní cuenta como intercambio de grasa.", "formula": "Maní: 1 cucharada = 1 intercambio de grasa (ICBF)"}, "h_creencias_calor": {"title": "Creencias de «calor» y otras", "summary": "Almendra: en redes y comercio circulan creencias de que la almendra da «calor» o es un remedio del embarazo. No se halló un estudio académico que las documente para almendra."}, "u_parto_aborto": {"title": "Almendra, aborto e inducción del parto", "summary": "Almendra: no hay estudios que liguen la almendra comida con aborto o parto. Un ensayo iraní usó óvulos vaginales de aceite de almendra a las 40 semanas.", "formula": "Óvulos: inicio espontáneo 66,7 % frente a 40 %", "caution": "No hay evidencia de que comer almendra cause aborto, «calor» o parto. No hay que evitarla por esas creencias. Los estudios de parto usaron aceite de almendra vaginal, no almendra comida. No usar aceites por vía vaginal ni oral para inducir el parto sin indicación médica. (Hosseini 2026; Chen 2026)"}, "h_huecos_evidencia": {"title": "Huecos de evidencia", "summary": "Almendra: no hay ensayos publicados en diabetes gestacional, peso al nacer ni neurodesarrollo. El ensayo NUTCRACKER (King's College London) está en curso.", "formula": "NCT07069855 · NCT01919476 sin resultados publicados"}}, "resources": [{"id": "T1", "title": "Composición de 28 g de almendra frente a las recomendaciones de la gestación (USDA FDC 170567; NIH ODS)", "usedBy": ["2.1", "2.2", "2.3", "2.4"]}], "requires": {"chapters": {"2": [1], "3": [2], "4": [2], "5": [1], "6": [1], "7": [2, 6], "8": [1, 7], "9": [3, 4, 5, 6, 7, 8]}, "sections": {"1.2": ["1.1"], "1.3": ["1.2"], "2.1": ["1.1"], "2.2": ["2.1"], "2.3": ["2.1"], "2.4": ["2.1"], "2.5": ["2.2"], "3.1": ["2.1", "2.4"], "3.2": ["2.3"], "3.3": ["3.1"], "3.4": ["2.4"], "3.5": ["2.2", "1.3"], "4.1": ["3.1"], "4.2": ["2.1"], "4.3": ["4.1"], "5.1": ["1.1"], "5.2": ["5.1"], "5.3": ["5.1"], "5.4": ["5.2"], "6.1": ["1.1"], "6.2": ["1.1"], "6.3": ["1.1"], "6.4": ["2.5"], "7.1": ["2.1"], "7.2": ["2.5"], "7.3": ["7.1"], "7.4": ["7.1"], "8.1": ["1.3"], "8.2": ["1.1"], "9.1": ["3.1", "4.2", "5.2"], "9.2": ["3.5", "7.2", "7.4"], "9.3": ["9.1", "9.2", "6.1", "6.3"], "9.4": ["9.1"]}, "items": {"c_energia_macros": ["p_almendra_dulce"], "c_folato_hierro": ["p_almendra_dulce"], "c_vite_magnesio_calcio": ["p_almendra_dulce"], "c_fibra": ["p_almendra_dulce"], "c_fitatos_oxalatos": ["p_almendra_dulce"], "h_porcion": ["c_energia_macros"], "u_diabetes_gestacional": ["c_fibra", "c_energia_macros", "h_ensayo_st_carlos"], "u_presion_lipidos": ["c_energia_macros", "c_vite_magnesio_calcio"], "u_estrenimiento": ["c_fibra"], "u_anemia_folato": ["c_folato_hierro", "c_fitatos_oxalatos", "h_guias_colombia"], "u_crecimiento_fetal": ["h_ensayo_st_carlos"], "u_neurodesarrollo": ["c_energia_macros"], "u_alergia_hijo": ["p_almendra_dulce"], "h_guias_alergia": ["u_alergia_hijo"], "u_alergia_materna": ["p_almendra_dulce"], "p_almendra_amarga": ["p_almendra_dulce"], "u_intoxicacion_cianuro": ["p_almendra_amarga"], "c_aflatoxinas": ["p_almendra_dulce"], "h_salmonella_pasteurizacion": ["p_almendra_dulce"], "u_absorcion_remojo": ["c_fitatos_oxalatos"], "p_mantequilla_harina": ["p_almendra_dulce"], "p_bebida_almendra": ["p_almendra_dulce"], "u_bebida_vs_leche": ["p_bebida_almendra"], "h_colombia_disponibilidad": ["p_almendra_dulce", "h_guias_colombia"], "h_creencias_calor": ["p_almendra_dulce"], "u_parto_aborto": ["h_creencias_calor"], "h_huecos_evidencia": ["u_diabetes_gestacional", "u_crecimiento_fetal", "u_neurodesarrollo"]}}};

<script>
// ---------- build graph ----------
const M=Object.assign({title:"Grafo del libro",subtitle:"",language:"es",itemLabel:"Concepto clave",itemLabelPlural:"Conceptos",resourceLabel:"Apéndice",resourceLabelPlural:"Apéndices",searchHint:"Buscar…",pageLabel:"Página",chapterLabel:"Capítulo",sectionLabel:"Sección"},GRAPH.meta||{});
document.title=M.title;
document.getElementById("ttl").innerHTML=esc(M.title)+(M.subtitle?"<small>"+esc(M.subtitle)+"</small>":"");
document.getElementById("eqBtn").textContent=M.itemLabelPlural;
document.getElementById("q").placeholder=M.searchHint;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const PALETTE=["#2F4FA8","#B0622A","#16808A","#6F7C24","#7A5BA6","#A83F5A","#5B6770","#2E7D4F","#9A6B12","#3D6E8F"];
const BLOCKS={};
Object.entries(GRAPH.blocks||{}).forEach(([k,v],i)=>BLOCKS[k]={name:v.name||k,color:v.color||PALETTE[i%PALETTE.length]});
if(!Object.keys(BLOCKS).length) BLOCKS.main={name:"Contenido",color:PALETTE[0]};
const firstBlock=Object.keys(BLOCKS)[0];
const hasRes=(GRAPH.resources||[]).length>0;
if(hasRes) BLOCKS.__res={name:M.resourceLabelPlural,color:"#8B969C"};
const nodes=[], links=[], byId={};
function add(n){nodes.push(n);byId[n.id]=n;}
const itemHome={};
(GRAPH.chapters||[]).forEach((c,ci)=>{
  const b=BLOCKS[c.block]?c.block:firstBlock, cid="ch"+c.num;
  add({id:cid,type:"ch",num:c.num,label:c.title,page:c.page,block:b,desc:c.summary,order:(ci+1)*1000,idx:ci});
  (c.sections||[]).forEach((s,si)=>{
    const sid="s"+s.num;
    add({id:sid,type:"sec",num:String(s.num),label:s.title,page:s.page,block:b,ch:c.num,desc:s.summary,order:(ci+1)*1000+si+1});
    links.push({source:cid,target:sid,kind:"contains"});
    (s.items||[]).forEach(e=>{if(!itemHome[e])itemHome[e]=sid;links.push({source:sid,target:"i:"+e,kind:"defines"});});
  });
});
Object.entries(GRAPH.items||{}).forEach(([id,it])=>{
  const home=byId[itemHome[id]];
  add({id:"i:"+id,type:"eq",label:it.title,formula:it.formula,ref:it.ref,desc:it.summary,caution:it.caution,block:home?home.block:firstBlock,ch:home?home.ch:null,home:home?home.id:null,order:home?home.order+.5:99999});
});
(GRAPH.resources||[]).forEach((r,ri)=>{
  add({id:"r:"+r.id,type:"apx",num:r.id,label:M.resourceLabel+" "+r.id+": "+r.title,short:r.title,page:r.page,block:"__res",desc:r.summary,order:900000+ri});
  (r.usedBy||[]).forEach(s=>{if(byId["s"+s])links.push({source:"s"+s,target:"r:"+r.id,kind:"data"});});
});
const RQ=GRAPH.requires||{};
const addReq=(map,pre,lvl)=>Object.entries(map||{}).forEach(([a,bs])=>bs.forEach(b=>{if(byId[pre+a]&&byId[pre+b])links.push({source:pre+a,target:pre+b,kind:"req",lvl});}));
addReq(RQ.chapters,"ch","ch");addReq(RQ.sections,"s","sec");addReq(RQ.items,"i:","eq");
const CH_DEP={};Object.entries(RQ.chapters||{}).forEach(([a,bs])=>CH_DEP[a]=bs.map(String));
// adjacency
nodes.forEach(n=>{n.out=[];n.inn=[];});
links.forEach(l=>{byId[l.source].out.push(l);byId[l.target].inn.push(l);});

// ---------- prerequisite trace ----------
function trace(id){
  const start=byId[id], set=new Set([id]), q=[];
  const push=x=>{if(!set.has(x)){set.add(x);q.push(x);}};
  const reqOf=n=>n.out.filter(l=>l.kind==="req").map(l=>l.target);
  reqOf(start).forEach(push);
  if(start.type==="sec") start.out.filter(l=>l.kind==="defines").forEach(l=>reqOf(byId[l.target]).forEach(push));
  while(q.length){const n=byId[q.shift()];reqOf(n).forEach(push);}
  // where to read each equation
  const read=new Set(set);
  [...set].forEach(x=>{const n=byId[x];if(n.type==="eq"&&n.home)read.add(n.home);});
  return {set,read};
}

// ---------- rendering ----------
const svg=d3.select("#graph"), root=svg.append("g");
const defs=svg.append("defs");
defs.append("marker").attr("id","arr").attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
  .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
  .append("path").attr("d","M0,-4L8,0L0,4").attr("fill","#7F8F99");
const gL=root.append("g"), gN=root.append("g");
let view="ch", sim=null, selected=null, traceOn=false, hidden=new Set();
const zoom=d3.zoom().scaleExtent([.2,5]).on("zoom",e=>{root.attr("transform",e.transform);labelLOD(e.transform.k);});
svg.call(zoom).on("dblclick.zoom",null);
const posCache={};
const R=n=>n.type==="ch"?17:n.type==="eq"?7:n.type==="apx"?8:4.5;
const col=n=>BLOCKS[n.block].color;

function viewFilter(n){
  if(hidden.has(n.block)) return false;
  if(view==="ch") return n.type==="ch";
  if(view==="eq") return n.type==="eq";
  return true;
}
function linkFilter(l,ids){
  if(!ids.has(l.source.id||l.source)||!ids.has(l.target.id||l.target)) return false;
  if(view==="all") return l.kind!=="req"||l.lvl!=="ch";
  return l.kind==="req";
}
let curNodes=[], curLinks=[], nodeSel, linkSel;
function render(){
  const w=svg.node().clientWidth, h=svg.node().clientHeight;
  curNodes=nodes.filter(viewFilter).map(n=>{const c=posCache[n.id];return Object.assign(n,c?{x:c.x,y:c.y}:{});});
  const ids=new Set(curNodes.map(n=>n.id));
  curLinks=links.filter(l=>linkFilter(l,ids)).map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,kind:l.kind,lvl:l.lvl}));
  // initial layout by chapter order along a spiral so chapters keep reading order
  curNodes.forEach(n=>{
    if(n.x==null){const ci=(byId["ch"+(n.ch??n.num)]||{idx:20}).idx+1, a=ci*0.62, r=60+ci*22;
      n.x=w/2+Math.cos(a)*r+(Math.random()-.5)*30; n.y=h/2+Math.sin(a)*r+(Math.random()-.5)*30;}
  });
  if(view==="ch"){
    const depth={},seen=new Set();
    const dep=c=>{c=String(c);if(depth[c]!=null)return depth[c];if(seen.has(c))return 0;seen.add(c);
      return depth[c]=(CH_DEP[c]||[]).reduce((m,p)=>Math.max(m,dep(p)+1),0);};
    const rows={};curNodes.forEach(n=>{const d=dep(n.num);(rows[d]=rows[d]||[]).push(n);});
    const rowH=w<720?96:92, maxPer=w<720?3:6; let y=50;
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(d=>{const arr=rows[d].sort((a,b)=>a.idx-b.idx);
      for(let k=0;k<arr.length;k+=maxPer){const part=arr.slice(k,k+maxPer);
        const sp=Math.min(w<720?125:250,(w-24)/part.length);
        part.forEach((n,i)=>{n.fx=w/2+(i-(part.length-1)/2)*sp;n.fy=y;n.wrap=Math.max(11,Math.min(22,Math.floor(sp/7.2)));});
        y+=rowH;}});
  } else curNodes.forEach(n=>{n.fx=null;n.fy=null;});
  linkSel=gL.selectAll("path").data(curLinks,d=>d.source+">"+d.target).join("path")
    .attr("class",d=>"link "+d.kind).attr("marker-end",d=>d.kind==="req"?"url(#arr)":null);
  nodeSel=gN.selectAll("g.node").data(curNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button")
      .attr("aria-label",d=>d.label);
    g.append("path").attr("class","shape");
    g.append("text").attr("class","num");
    g.append("text").attr("class","lbl");
    return g;
  });
  nodeSel.select(".shape").attr("fill",col).attr("d",d=>{
    const r=R(d);
    if(d.type==="eq") return `M0,${-r*1.25}L${r*1.25},0L0,${r*1.25}L${-r*1.25},0Z`;
    if(d.type==="apx") return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;
    return d3.arc()({innerRadius:0,outerRadius:r,startAngle:0,endAngle:2*Math.PI});
  });
  nodeSel.select(".num").text(d=>d.type==="ch"?d.num:d.type==="apx"?d.num:"").attr("text-anchor","middle").attr("dy","0.36em")
    .style("font-size",d=>d.type==="apx"?"9px":null);
  const lbl=nodeSel.select(".lbl").text(null).selectAll("tspan").remove();
  nodeSel.select(".lbl").each(function(d){
    const t=d3.select(this), txt=d.type==="sec"?d.num+" "+d.label:d.type==="apx"?d.short:d.label;
    if(view==="ch"){
      t.attr("x",0).attr("y",R(d)+15).attr("dy",null).attr("text-anchor","middle");
      const words=txt.split(" "),lines=[];let cur="";
      words.forEach(wd=>{if((cur+" "+wd).trim().length>(d.wrap||19)&&cur){lines.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});lines.push(cur);
      lines.forEach((ln,i)=>t.append("tspan").attr("x",0).attr("dy",i?"1.1em":0).text(ln));
    } else t.attr("x",R(d)+5).attr("y",0).attr("dy","0.35em").attr("text-anchor",null).text(txt);
  });
  nodeSel.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);}})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  if(sim) sim.stop();
  const ld={contains:34,defines:22,data:70,req:view==="all"?110:90};
  const ls={contains:.7,defines:.9,data:.08,req:view==="all"?.04:.35};
  const lsf=l=>view==="all"&&l.kind==="req"&&l.lvl==="eq"?.008:ls[l.kind];
  sim=d3.forceSimulation(curNodes)
    .force("link",d3.forceLink(curLinks).id(d=>d.id).distance(l=>ld[l.kind]).strength(lsf))
    .force("charge",d3.forceManyBody().strength(d=>view==="all"?(d.type==="ch"?-260:-45):-320))
    .force("collide",d3.forceCollide(d=>R(d)+(view==="all"?3:22)))
    .force("x",d3.forceX(w/2).strength(.04)).force("y",d3.forceY(h/2).strength(.05))
    .on("tick",ticked).on("end",()=>{curNodes.forEach(n=>posCache[n.id]={x:n.x,y:n.y});});
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){sim.stop();for(let i=0;i<300;i++)sim.tick();ticked();}
  setTimeout(fit, view==="ch"?150:view==="all"?1400:900);
  labelLOD(d3.zoomTransform(svg.node()).k);
  applyHighlight();
}
function ticked(){
  linkSel.attr("d",d=>{
    const s=d.source,t=d.target;
    if(d.kind!=="req") return `M${s.x},${s.y}L${t.x},${t.y}`;
    const dx=t.x-s.x,dy=t.y-s.y,dist=Math.hypot(dx,dy)||1,r=R(t)+(t.type==="eq"?4:3);
    const tx=t.x-dx/dist*r, ty=t.y-dy/dist*r;
    return `M${s.x},${s.y}Q${(s.x+tx)/2+dy*.12},${(s.y+ty)/2-dx*.12} ${tx},${ty}`;
  });
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function labelLOD(k){
  if(!nodeSel) return;
  nodeSel.select(".lbl").style("display",d=>{
    if(selected&&(d.id===selected||(traceOn&&curTrace&&curTrace.read.has(d.id)))) return null;
    if(d.type==="ch"||view!=="all") return null;
    if(d.type==="eq"||d.type==="apx") return k>1.1?null:"none";
    return k>1.8?null:"none";
  });
}
function fit(sub){
  const set=(Array.isArray(sub)?sub:curNodes).filter(n=>n.x!=null);
  if(!set.length) return;
  let w=svg.node().clientWidth,h=svg.node().clientHeight,ox=0;
  const panelOpen=panel.classList.contains("open"), mobile=w<720;
  if(panelOpen&&!mobile){w-=400;} if(panelOpen&&mobile){h*=.4;}
  let oy=0; if(mobile&&!panelOpen){h-=56;}
  const xs=set.map(n=>n.x),ys=set.map(n=>n.y);
  const padR=view==="ch"?60:150, padB=view==="ch"?50:30;
  const x0=Math.min(...xs)-(view==="ch"?60:30),x1=Math.max(...xs)+padR,y0=Math.min(...ys)-30,y1=Math.max(...ys)+padB;
  const cap=Array.isArray(sub)?(set.length<4?1.3:1.6):2.2;
  const k=Math.min(cap,.92*Math.min(w/Math.max(x1-x0,320),h/Math.max(y1-y0,240)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k));
}
d3.select("#zin").on("click",()=>svg.transition().call(zoom.scaleBy,1.4));
d3.select("#zout").on("click",()=>svg.transition().call(zoom.scaleBy,1/1.4));
d3.select("#fit").on("click",()=>fit());
svg.on("click",()=>closePanel());

// ---------- highlight ----------
let curTrace=null;
function applyHighlight(){
  if(!nodeSel) return;
  nodeSel.classed("sel",d=>d.id===selected);
  if(!selected){nodeSel.classed("dim",false);linkSel.classed("dim",false).classed("hot",false);labelLOD(d3.zoomTransform(svg.node()).k);return;}
  let keep;
  if(traceOn&&curTrace){keep=curTrace.read;}
  else{keep=new Set([selected]);byId[selected].out.concat(byId[selected].inn).forEach(l=>{keep.add(l.source.id||l.source);keep.add(l.target.id||l.target);});}
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",d=>!(keep.has(d.source.id)&&keep.has(d.target.id)))
    .classed("hot",d=>traceOn&&d.kind==="req"&&keep.has(d.source.id)&&keep.has(d.target.id));
  labelLOD(d3.zoomTransform(svg.node()).k);
}

// ---------- panel ----------
const panel=document.getElementById("panel");
const kindName={ch:M.chapterLabel,sec:M.sectionLabel,eq:M.itemLabel,apx:M.resourceLabel};
function item(id,prefix){
  const n=byId[id];
  const t=n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label;
  return `<li><button data-go="${esc(id)}"><span class="dot" style="background:${col(n)}"></span><span>${esc(t)}</span></button></li>`;
}
function list(title,ids,ordered){
  if(!ids.length) return "";
  ids=[...new Set(ids)].sort((a,b)=>byId[a].order-byId[b].order);
  return `<div class="p-sec"><h3>${title}</h3>${ordered?'<ol class="p-list path">':'<ul class="p-list">'}${ids.map(i=>item(i)).join("")}${ordered?"</ol>":"</ul>"}</div>`;
}
function select(id,center){
  selected=id;traceOn=false;curTrace=null;
  const n=byId[id];
  if(!curNodes.includes(n)){view=n.type==="ch"?"ch":n.type==="eq"?"eq":"all";hidden.delete(n.block);syncViewBtns();syncLegend();render();setTimeout(()=>centerOn(id),view==="all"?1500:1000);}
  else if(center) centerOn(id);
  const outT=k=>n.out.filter(l=>l.kind===k).map(l=>l.target.id||l.target);
  const inT=k=>n.inn.filter(l=>l.kind===k).map(l=>l.source.id||l.source);
  let html=`<button class="close" aria-label="Cerrar">×</button>
   <div class="p-kind"><span class="dot" style="background:${col(n)}"></span>${esc(kindName[n.type])} · ${esc(BLOCKS[n.block].name)}</div>
   <div class="p-title">${esc(n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label)}</div>`;
  const meta=[];
  if(n.page) meta.push(M.pageLabel+" "+n.page);
  if(n.type==="sec") meta.push(M.chapterLabel+" "+n.ch+": "+byId["ch"+n.ch].label);
  if(n.type==="eq"){if(n.ref)meta.push(M.itemLabel+" "+n.ref);if(n.home)meta.push(M.sectionLabel+" "+byId[n.home].num);}
  if(meta.length) html+=`<div class="p-meta">${esc(meta.join(". "))}</div>`;
  if(n.formula) html+=`<div class="formula" style="color:${col(n)}"><span style="color:var(--ink)">${esc(n.formula)}</span></div>`;
  if(n.caution) html+=`<p class="caution"><strong>Atención:</strong> ${esc(n.caution)}</p>`;
  if(n.desc) html+=`<p class="p-desc">${esc(n.desc)}</p>`;
  if(n.type!=="apx") html+=`<button class="trace-btn" id="traceBtn" aria-pressed="false">Trazar prerrequisitos</button><div id="pathBox"></div>`;
  if(n.type==="ch") html+=list("Secciones",outT("contains"),true)+list(M.itemLabelPlural+" clave",outT("contains").flatMap(s=>byId[s].out.filter(l=>l.kind==="defines").map(l=>l.target.id||l.target)))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"));
  if(n.type==="sec") html+=list(M.itemLabelPlural+" que presenta",outT("defines"))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"))+list(M.resourceLabelPlural+" que consulta",outT("data"));
  if(n.type==="eq") html+=list("Se deriva de o usa",outT("req"))+list("Base de",inT("req"))+list("Dónde se presenta",inT("defines"));
  if(n.type==="apx") html+=list("Se consulta en",inT("data"));
  panel.innerHTML=html;panel.classList.add("open");
  panel.querySelector(".close").onclick=closePanel;
  panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  const tb=document.getElementById("traceBtn");
  if(tb) tb.onclick=()=>{traceOn=!traceOn;tb.setAttribute("aria-pressed",traceOn);tb.textContent=traceOn?"Quitar trazado":"Trazar prerrequisitos";
    curTrace=traceOn?trace(id):null;
    const box=document.getElementById("pathBox");
    if(traceOn){const ids=[...curTrace.read].filter(x=>x!==id&&byId[x].type!=="eq");
      box.innerHTML=ids.length?list("Ruta de lectura sugerida, en orden del libro",ids,true):'<p class="empty">No depende de otros temas: es un punto de partida.</p>';
      box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}
    else box.innerHTML="";
    applyHighlight();
    if(traceOn) fit(curNodes.filter(x=>curTrace.read.has(x.id)));};
  document.getElementById("hint").style.opacity=0;
  applyHighlight();
}
function closePanel(){panel.classList.remove("open");selected=null;traceOn=false;curTrace=null;applyHighlight();}
function centerOn(id){
  const n=byId[id];if(n.x==null) return;
  const w=svg.node().clientWidth,h=svg.node().clientHeight,k=Math.max(1.3,d3.zoomTransform(svg.node()).k);
  const mobile=w<720, cx=mobile?w/2:(w-400)/2, cy=mobile?h*.28:h/2;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(cx-k*n.x,cy-k*n.y).scale(k));
}

// ---------- controls ----------
function syncViewBtns(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewBtns();closePanel();render();});
const legend=document.getElementById("legend");
function syncLegend(){
  legend.innerHTML=Object.entries(BLOCKS).map(([k,v])=>`<button data-b="${k}" aria-pressed="${!hidden.has(k)}"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}</button>`).join("")+
  `<div class="shapes"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#172A3A"/></svg>${esc(M.chapterLabel.toLowerCase())} o ${esc(M.sectionLabel.toLowerCase())}</span><span><svg width="12" height="12"><path d="M6 0L12 6L6 12L0 6Z" fill="#172A3A"/></svg>${esc(M.itemLabel.toLowerCase())}</span>${hasRes?`<span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#172A3A"/></svg>${esc(M.resourceLabel.toLowerCase())}</span>`:""}</div>`;
  legend.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);syncLegend();render();});
}
syncLegend();
// search
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(t.length<2){res.style.display="none";return;}
  const hits=nodes.filter(n=>norm((n.num||"")+" "+n.label+" "+(n.formula||"")+" "+(n.desc||"")).includes(t))
    .sort((a,b)=>(norm(a.label).includes(t)?0:1)-(norm(b.label).includes(t)?0:1)||a.order-b.order).slice(0,14);
  res.innerHTML=hits.length?hits.map(n=>`<li><button data-go="${esc(n.id)}"><span class="k">${esc(n.type==="sec"?n.num:n.type==="ch"?n.num:n.type==="eq"?"·":n.num)}</span><span>${esc(n.type==="apx"?n.short:n.label)}</span></button></li>`).join(""):'<li style="padding:8px;font-size:.9rem">Sin coincidencias. Prueba con otra palabra o un número de sección.</li>';
  res.style.display="block";
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{res.style.display="none";q.value="";q.blur();select(b.dataset.go,true);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector("[data-go]");if(f)f.click();}if(e.key==="Escape"){res.style.display="none";}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.style.display="none";});
window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>fit(),200);});
render();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
</script>
</body>
</html>
