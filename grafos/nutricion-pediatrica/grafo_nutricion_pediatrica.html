ary": "Estimación de necesidades energéticas y elección del método de soporte en mucositis y neutropenia."}, {"num": "33.5", "title": "Nutrición oral", "page": 499, "items": ["c33_seguridad_alimentaria"], "summary": "Estrategias para mejorar la ingesta según el síntoma y prácticas higiénicas para pacientes inmunocomprometidos."}, {"num": "33.6", "title": "Nutrición enteral", "page": 500, "items": [], "summary": "Alimentación por sonda como opción más barata y segura que la parenteral, incluso en pequeñas cantidades tróficas."}, {"num": "33.7", "title": "Nutrición parenteral", "page": 500, "items": [], "summary": "Indicada con tubo digestivo poco funcional; en trasplante acorta el injerto y la glutamina se estudia en este contexto."}], "block": "critico"}, {"num": 34, "title": "Prematurez", "page": 503, "summary": "Guía la nutrición del recién nacido prematuro desde la evaluación y clasificación al nacer hasta la nutrición parenteral, el avance enteral, la elección de leche o fórmula y la planificación del alta.", "sections": [{"num": "34.1", "title": "Introducción y factores de riesgo", "page": 503, "items": [], "summary": "Demandas aumentadas, reservas pobres e inmadurez orgánica; riesgos médicos como enterocolitis necrotizante, displasia broncopulmonar y osteopenia."}, {"num": "34.2", "title": "Evaluación nutricional", "page": 503, "items": ["c34_clasificacion", "c34_edad_corregida"], "summary": "Edad gestacional, medidas al nacer, curvas intrauterinas y posnatales, velocidad de crecimiento esperada y uso de edad corregida."}, {"num": "34.3", "title": "Terapia nutricional: nutrición parenteral", "page": 506, "items": ["c34_np_prematuro"], "summary": "Inicio precoz de NP, líquidos, glucosa, aminoácidos, lípidos, aditivos y monitoreo bioquímico."}, {"num": "34.4", "title": "Nutrición enteral: inicio, avance y metas", "page": 508, "items": ["c34_metas_enterales"], "summary": "Alimentación trófica, avance según peso al nacer, signos de intolerancia y metas de energía, proteína, minerales, vitaminas y hierro."}, {"num": "34.5", "title": "Métodos de alimentación y elección del sustrato", "page": 512, "items": ["c34_fortificacion"], "summary": "Indicaciones de succión, sonda gástrica, transpilórica o gastrostomía; leche materna, fortificadores y fórmulas para prematuros."}, {"num": "34.6", "title": "Planificación del alta", "page": 518, "items": [], "summary": "Criterios de alta, transición a régimen domiciliario seguro, suplementos y derivación a apoyo comunitario."}], "block": "critico"}, {"num": 35, "title": "Enfermedad renal", "page": 521, "summary": "Resume las consecuencias nutricionales y metabólicas de la insuficiencia renal crónica en niños y cómo evaluarlas y tratarlas con nutrición enteral, parenteral y tras el trasplante renal.", "sections": [{"num": "35.1", "title": "Insuficiencia renal crónica: consecuencias nutricionales y metabólicas", "page": 521, "items": ["c35_osteodistrofia", "c35_vitaminas"], "summary": "Desnutrición, acidosis, pérdida de sal, osteodistrofia, hiperpotasemia, retraso de crecimiento, anemia y alteraciones vitamínicas con su tratamiento."}, {"num": "35.2", "title": "Evaluación nutricional y recomendaciones", "page": 521, "items": ["c35_proteina_energia"], "summary": "Evaluación frecuente centrada en el crecimiento y recomendaciones de proteína y energía."}, {"num": "35.3", "title": "Diálisis, trasplante y nutrición enteral", "page": 524, "items": ["c35_densidad_calorica"], "summary": "Modalidades de reemplazo renal, fórmulas densas, reflujo, sonda nocturna y productos específicos para pacientes renales."}, {"num": "35.4", "title": "Nutrición parenteral en enfermedad renal", "page": 524, "items": ["c35_np_renal"], "summary": "Restricción de volumen, objetivos según edad-talla, electrolitos titulados y riesgo de toxicidad por micronutrientes."}, {"num": "35.5", "title": "Paciente postrasplante renal", "page": 526, "items": [], "summary": "Vigilar función renal, efectos de inmunosupresores, dieta sin sal añadida, hipofosfatemia y educación en alimentación saludable."}], "block": "organo"}, {"num": 36, "title": "Síndrome de intestino corto", "page": 529, "summary": "Explica los determinantes del pronóstico en el síndrome de intestino corto y el manejo nutricional por etapas, de la nutrición parenteral a la alimentación enteral progresiva, incluyendo sus complicaciones metabólicas.", "sections": [{"num": "36.1", "title": "Definición y causas", "page": 529, "items": [], "summary": "Menor superficie mucosa con malabsorción; causas pediátricas frecuentes y factores pronósticos."}, {"num": "36.2", "title": "Longitud de intestino delgado resecado", "page": 530, "items": ["c36_longitud_residual"], "summary": "Longitud intestinal normal según edad y su relación con la posibilidad de suspender la NP."}, {"num": "36.3", "title": "Porción de intestino resecada", "page": 531, "items": [], "summary": "Consecuencias de perder duodeno, yeyuno o íleon terminal (hierro, folato, calcio, sales biliares, vitamina B12, tránsito)."}, {"num": "36.4", "title": "Presencia o ausencia de válvula ileocecal", "page": 531, "items": [], "summary": "Su ausencia acelera el tránsito, aumenta pérdidas y favorece el sobrecrecimiento bacteriano."}, {"num": "36.5", "title": "Capacidad adaptativa del intestino remanente", "page": 532, "items": [], "summary": "Cambios anatómicos e histológicos de adaptación y papel trófico de la nutrición enteral."}, {"num": "36.6", "title": "Salud de otros órganos: colestasis asociada a NP", "page": 533, "items": ["c36_colestasis_np"], "summary": "La hepatopatía asociada a NP es la principal causa de muerte; medidas para reducir su riesgo."}, {"num": "36.7", "title": "Terapia nutricional: qué administrar", "page": 533, "items": ["c36_liquidos_sodio", "c36_formula_enteral"], "summary": "Balance de líquidos y sodio con NP y reposición de pérdidas, leche materna y elección de fórmula, grasas, carbohidratos y fibra."}, {"num": "36.8", "title": "Cómo alimentar: inicio y avance enteral", "page": 535, "items": ["c36_avance_enteral"], "summary": "Alimentación continua por sonda, avance guiado por gasto fecal u ostomía, transición a vía oral y reposición con soluciones de rehidratación."}, {"num": "36.9", "title": "Nutrientes experimentales", "page": 538, "items": [], "summary": "Glutamina y hormona de crecimiento con evidencia aún controvertida."}, {"num": "36.10", "title": "Complicaciones metabólicas", "page": 539, "items": [], "summary": "Litiasis renal por oxalato, cálculos biliares, hipersecreción gástrica, sobrecrecimiento bacteriano con acidosis D-láctica y déficits de vitaminas, zinc, cobre, hierro y calcio."}], "block": "organo"}], "items": {"c01_niveles_evaluacion": {"title": "Niveles de evaluación: rutinario, intermedio y profundo", "formula": "Rutinario (todos) → intermedio (si el tamizaje lo indica o hay riesgo crónico) → profundo (desnutrición aguda o crónica, enfermos crónicos)", "summary": "Cada nivel añade parámetros dietéticos, clínicos, antropométricos y bioquímicos más complejos según el riesgo del niño."}, "c01_metodos_dieteticos": {"title": "Métodos de evaluación de la ingesta", "formula": "Recordatorio de 24 h, registro de alimentos de 3 a 7 días, patrón habitual; idealmente combinados", "summary": "Herramientas clínicas más usadas para cuantificar la ingesta individual y construir la historia dietética."}, "c01_sesgo_reporte": {"title": "Sesgos del reporte de ingesta", "summary": "Los pacientes con bajo peso tienden a sobreestimar y los con sobrepeso a subestimar; periodos largos sobreestiman y cortos subestiman la ingesta."}, "c02_peso_estandar": {"title": "Porcentaje del peso estándar y pérdida de peso", "formula": "% estándar = peso real / peso estándar (p50 para edad y sexo) × 100; >120 % exceso; 80–90 % déficit marginal; 60–80 % moderado; <60 % grave. % cambio = (peso habitual − actual) / habitual × 100; pérdida >5 % en 1 mes es anormal", "summary": "Cálculo rápido para graduar el déficit o exceso de peso y detectar problemas agudos."}, "c02_imc": {"title": "Índice de masa corporal en pediatría", "formula": "IMC = peso (kg) / talla² (m); IMC ≥ p95 para edad y sexo → evaluar y tratar obesidad", "summary": "En niños se interpreta por percentiles, porque el valor absoluto cambia con la edad."}, "c02_puntaje_z": {"title": "Puntaje Z antropométrico", "formula": "Z = (valor medido − mediana de referencia) / desviación estándar", "summary": "Ubica la medición en la curva normal y permite seguir la tendencia incluso por debajo del p5 o por encima del p95."}, "c02_talla_parental": {"title": "Talla diana por punto medio parental", "formula": "Punto medio parental = (talla madre + talla padre) / 2 (cm)", "summary": "Con los estándares de Fels estima la talla esperada del niño a cada edad y ayuda a evaluar la talla baja familiar frente a la patológica."}, "c02_crecimiento_recuperacion": {"title": "Crecimiento de recuperación (catch-up)", "formula": "Durante la recuperación la velocidad de talla puede ser ~2 veces y la de peso ~4 veces el promedio", "summary": "Su éxito depende de la duración y edad del retraso, la adecuación de la repleción y el control de la enfermedad; la edad ósea estima el potencial."}, "c02_marasmo_kwashiorkor": {"title": "Marasmo frente a kwashiorkor", "summary": "El marasmo es déficit predominante de calorías con emaciación y retraso de crecimiento; el kwashiorkor, déficit proteico con edema, hipoalbuminemia e hígado graso, y mayor mortalidad."}, "c02_clasificacion_dpc": {"title": "Clasificación de la desnutrición proteico-calórica y enanismo nutricional", "formula": "Enanismo nutricional: peso para la talla >90 % y talla para la edad <90 % del esperado", "summary": "Se gradúa en leve, moderada y grave con los criterios de Gómez (peso/edad), Waterlow (talla/edad, peso/talla) y otros; peso/talla bajo indica desnutrición aguda y talla/edad bajo, crónica.", "caution": "Clasificación en % del estándar (era NCHS); hoy, puntaje Z de la OMS (Resolución 2465 de 2016). Desnutrición aguda en menores de 5 años: Resolución 2350 de 2020, modificada por la 115 de 2026. Las cifras por grado del libro eran ilegibles y se omitieron."}, "c03_tabla_signos": {"title": "Tabla de signos clínicos por nutriente", "summary": "Herramienta que vincula para cada nutriente funciones, signos de déficit y exceso, fuentes, causas y pruebas confirmatorias."}, "c03_deficit_proteico": {"title": "Signos de déficit proteico", "summary": "Cabello seco, despigmentado y fácil de arrancar, edema bilateral declive, hígado graso, proteínas viscerales bajas y dermatosis pelagroide en casos graves."}, "c03_vitamina_d_raquitismo": {"title": "Déficit de vitamina D: raquitismo", "summary": "Rosario costal, ensanchamiento epifisario, prominencia craneal, piernas arqueadas y fontanela anterior persistente; se confirma con 25-hidroxivitamina D, fosfatasa alcalina, calcio, fósforo y radiografía."}, "c03_fluor": {"title": "Flúor: déficit y fluorosis", "formula": "Exceso en agua > 4 ppm → moteado y manchas pardas del esmalte", "summary": "El déficit se asocia a caries y el exceso prolongado a fluorosis dental y ósea."}, "c03_zinc": {"title": "Déficit de zinc", "summary": "Produce falla de crecimiento, cambios cutáneos, cicatrización lenta, hipogeusia, inmadurez sexual, alopecia y diarrea; causas frecuentes son malabsorción y diarrea crónica."}, "c04_balance_nitrogenado": {"title": "Balance nitrogenado", "formula": "Balance N = (proteína ingerida en 24 h, g / 6,25) − nitrógeno ureico urinario de 24 h (g) − factor; factor ≈ 2–3 g/d en adultos y ≈ 10 mg/kg/d en niños", "summary": "Un balance negativo indica aporte energético o proteico insuficiente o catabolismo; los niños en crecimiento deben estar en balance positivo."}, "c04_fase_aguda": {"title": "Proteínas de fase aguda positivas y negativas", "formula": "Positivas (↑): PCR, fibrinógeno, ferritina, ceruloplasmina, α1-antitripsina, α1-glicoproteína. Negativas (↓): albúmina, prealbúmina, RBP, transferrina", "summary": "La inflamación o el catabolismo bajan las proteínas nutricionales independientemente del estado nutricional, lo que limita su interpretación."}, "c04_albumina": {"title": "Albúmina sérica", "formula": "Normal 3,5–5,0 g/dL; vida media ≈ 20 días", "summary": "Marcador poco sensible de estado o de repleción nutricional; también baja por hepatopatía, pérdidas, fuga capilar, sobrecarga hídrica o reposo."}, "c04_triene_tetraene": {"title": "Índice trieno/tetraeno para déficit de ácidos grasos esenciales", "formula": "Trieno (ácido eicosatrienoico) / tetraeno (ácido araquidónico) > 0,4 → déficit de AGE", "summary": "El déficit aparece con ayuno prolongado, nutrición parenteral sin lípidos o fórmulas con predominio de triglicéridos de cadena media."}, "c04_rtl": {"title": "Recuento total de linfocitos", "formula": "RTL (células/mm³) = leucocitos × % linfocitos; desnutrición leve <1500, moderada 800–1200, grave <800", "summary": "La linfopenia acompaña a la desnutrición proteico-energética, pero es una medida inespecífica e insensible."}, "c05_componentes_dri": {"title": "Componentes de las DRI", "formula": "RDA = EAR + 2 DE (cubre al 97–98 % de los individuos sanos); EAR cubre al 50 %", "summary": "RDA como meta individual, EAR para evaluar poblaciones, AI cuando faltan datos y UL como techo de seguridad."}, "c05_equivalencias": {"title": "Equivalentes de vitaminas A y E", "formula": "1 ER = 1 µg retinol = 6 µg β-caroteno; 1 mg d-α-tocoferol = 1 α-ET", "summary": "Unidades en que se expresan las recomendaciones de vitaminas A y E en las tablas."}, "c05_ul": {"title": "Nivel máximo de ingesta tolerable (UL)", "summary": "Máxima ingesta diaria que probablemente no causa efectos adversos en casi nadie del grupo; sirve para prevenir excesos, sobre todo de oligoelementos."}, "c05_energia_por_kg": {"title": "Energía recomendada por kg de peso", "formula": "0–6 m: 108 kcal/kg; 6–12 m: 98; 1–3 a: 102; 4–6 a: 90; 7–10 a: 70; varones 11–14 a: 55, 15–18 a: 45; mujeres 11–14 a: 47, 15–18 a: 40. Embarazo 2.º–3.er trimestre +300 kcal/d; lactancia +500 kcal/d", "summary": "Base para estimar las necesidades energéticas de niños sanos según edad y sexo (actividad ligera a moderada)."}, "c05_acido_folico": {"title": "Folato y equivalentes dietéticos", "formula": "1 EFD = 1 µg folato alimentario = 0,6 µg ácido fólico con comida = 0,5 µg en ayunas; mujeres en edad fértil: 400 µg/d de ácido fólico sintético además del folato de la dieta. Vitamina D: 1 µg colecalciferol = 40 UI", "summary": "Recomendación para prevenir defectos del tubo neural y equivalencias necesarias para interpretar la tabla DRI."}, "c06_latch": {"title": "Escala LATCH de evaluación de la lactancia", "formula": "5 componentes (agarre, deglución audible, tipo de pezón, comodidad, sostén), cada uno de 0–2; total 9–10 = lactancia exitosa con mínima ayuda; 4–5 = requiere más asistencia", "summary": "Puntuación tipo Apgar que identifica en qué componente necesita ayuda la díada madre-hijo y permite seguir su evolución."}, "c06_almacenamiento": {"title": "Tiempos de conservación de la leche materna", "formula": "Fresca: ambiente 6 h; refrigerador 48 h (máx. 5 días); congelador < −20 °C 4 meses; ultracongelador < −70 °C 6–12 meses. Descongelada: ambiente 1 h, refrigerador 24 h, no recongelar", "summary": "Usar primero la leche fresca, luego la refrigerada y después la congelada; descongelar con agua tibia y nunca en microondas."}, "c06_ingesta_adecuada": {"title": "Signos de que el lactante recibe suficiente leche", "formula": "6–8 pañales empapados/día + deposiciones regulares + ganancia de peso según la meta + deglución audible durante la mayor parte de la toma", "summary": "Criterios clínicos simples para tranquilizar a la madre y evitar el abandono prematuro de la lactancia."}, "c06_ictericia": {"title": "Ictericia por lactancia frente a ictericia por leche materna", "formula": "Temprana (por lactancia): tras 24 h de vida, pico días 3–4, asociada a tomas insuficientes. Tardía (por leche materna): inicia días 5–10, pico ~día 10, en niño sano; puede suspenderse la leche materna 12–48 h para confirmar", "summary": "La temprana se trata aumentando la frecuencia de las tomas; en la tardía se descartan otras causas y se mantiene la extracción para no perder la producción."}, "c06_contraindicaciones": {"title": "Contraindicaciones de la lactancia", "summary": "Galactosemia; fenilcetonuria (alternar con fórmula sin fenilalanina); tuberculosis activa no tratada (extraer y desechar hasta 1–2 semanas de tratamiento); VIH cuando hay sustitutos seguros; hepatitis C materna de diagnóstico reciente (controvertida si la lactancia ya está establecida); drogas de abuso; y fármacos como bromocriptina, ciclofosfamida, ciclosporina, doxorrubicina, ergotamina, litio, metotrexato, fenindiona y compuestos radiactivos.", "caution": "La postura sobre VIH cambió: la AAP (2024) apoya la lactancia con antirretrovirales y carga viral suprimida sostenida. Revisar fármacos con una fuente actual (p. ej. LactMed)."}, "c07_un_alimento_nuevo": {"title": "Introducir un alimento nuevo cada 3–4 días", "formula": "1 alimento nuevo de un solo ingrediente cada 3–4 días", "summary": "Permite identificar con facilidad una posible intolerancia alimentaria."}, "c07_inicio_solidos": {"title": "Momento de inicio de los sólidos", "formula": "Cereal y purés a los 4–6 meses, en posición semisentada y con cuchara (el reflejo de extrusión lingual disminuye hacia los 4 meses)", "summary": "El inicio depende de la madurez oromotora; la AAP considera óptima la lactancia exclusiva hasta cerca de los 6 meses."}, "c07_transicion_12m": {"title": "Transición a la comida familiar alrededor del año", "summary": "Hacia los 12 meses el niño come alimentos de mesa blandos, machacados o picados, toma alimentos con los dedos y bebe en vaso; se introducen la leche entera y el huevo.", "caution": "Las guías actuales no recomiendan retrasar alérgenos como huevo o maní; en lactantes de riesgo se introducen temprano (NIAID 2017)."}, "c07_guia_lactante": {"title": "Guía de alimentación del lactante por edades", "formula": "Cereal de arroz, avena o cebada desde 4–6 meses (2–3 cdtas mezcladas con leche); frutas y verduras desde 6–8 meses; carnes, yema, yogur y legumbres desde 8–10 meses; jugo opcional ≤ 8 oz/día", "summary": "Tabla de volúmenes de leche y de cantidades y texturas por grupo de alimentos entre 0 y 12 meses.", "caution": "La AAP (2017) desaconseja el jugo de fruta antes del año de edad."}, "c08_alimentacion_normal": {"title": "Alimentación normal y autorregulación", "summary": "El adulto ofrece alimentos variados y nutritivos preparados de forma aceptable, y el niño decide cuánto y de cuáles come, guiado por su hambre y su saciedad."}, "c08_grasa_minima": {"title": "Aporte mínimo de grasa en la dieta infantil", "formula": "Grasa ≥ 30 % de las calorías (salvo dietas especiales); la mitad de los cereales y panes, integrales", "summary": "La grasa en cantidad moderada es esencial; una dieta muy alta en carbohidratos puede ser pobre en grasa y poco saciante."}, "c08_refrigerios": {"title": "Estructura de los refrigerios", "formula": "Combinar proteína + cereal, fruta o verdura; ofrecer unas 2 h antes de la comida", "summary": "Refrigerios planificados (no picoteo continuo) que mantienen la energía y el ánimo sin quitar el apetito para las comidas."}, "c08_leche_preescolar": {"title": "Leche en el preescolar", "formula": "≈ 2 tazas/día de lácteos entre 1 y 5 años; después de los 2 años pueden ser bajos en grasa", "summary": "La leche aporta calcio, pero su exceso reduce el apetito por alimentos ricos en hierro.", "caution": "Las Dietary Guidelines 2025–2030 (enero de 2026) favorecen lácteos enteros en la infancia en lugar de bajos en grasa desde los 2 años; contrastar con AAP y GABA."}, "c08_kcal_por_cm": {"title": "Energía y proteína del adolescente según la talla", "formula": "Varones: 11–14 a 15,9 kcal/cm y 0,29 g prot/cm; 15–18 a 17,1 kcal/cm y 0,34 g/cm; 19–24 a 16,4 kcal/cm y 0,33 g/cm. Mujeres: 11–14 a 14,0 kcal/cm y 0,29 g/cm; 15–18 a 13,5 kcal/cm y 0,27 g/cm; 19–24 a 13,4 kcal/cm y 0,28 g/cm", "summary": "Las necesidades se correlacionan mejor con el crecimiento que con la edad; multiplicar el valor por cm por la talla actual."}, "c09_rango_porciones": {"title": "Rango de porciones de la pirámide", "formula": "Número menor de porciones ≈ 1600 kcal/día; número mayor ≈ 2800 kcal/día", "summary": "Se debe elegir sobre todo de la mitad inferior de la pirámide, ajustando las porciones a las necesidades.", "caution": "Basado en la Pirámide USDA de 1992. Hoy rigen las Dietary Guidelines 2025–2030 (enero de 2026), con una nueva pirámide que reemplazó a MyPlate; en Colombia, las GABA."}, "c09_menu_4_6": {"title": "Porciones diarias para niños de 4 a 6 años", "formula": "6 cereales + 3 verduras + 2 frutas + 2 lácteos + 5 oz de carne o equivalente; de 2 a 3 años, misma variedad con ≈ 2/3 de la porción", "summary": "Ejemplo de distribución de un día de comidas y refrigerios según la pirámide para niños pequeños.", "caution": "Basado en la Pirámide USDA de 1992. Hoy rigen las Dietary Guidelines 2025–2030 (enero de 2026), con una nueva pirámide que reemplazó a MyPlate; en Colombia, las GABA."}, "c10_tipos": {"title": "Clasificación de las dietas vegetarianas", "summary": "Semivegetariana (sin carnes rojas), lacto-ovovegetariana, lactovegetariana, ovovegetariana y vegana (solo vegetales); la macrobiótica se parece a la vegana, pero puede incluir pescado."}, "c10_criterios_evaluacion": {"title": "Criterios para evaluar una dieta vegetariana", "summary": "Verificar que cubra las calorías y los nutrientes que el paciente necesita, que sea equilibrada y variada, y que no tenga ningún componente en exceso."}, "c10_b12": {"title": "Fuente obligatoria de vitamina B12 en veganos", "formula": "Requerimiento mínimo de B12 ≈ 2 µg/día en niños mayores", "summary": "No existe fuente vegetal fiable de B12: hacen falta alimentos fortificados (cereales, bebidas vegetales, levadura nutricional) o un suplemento."}, "c10_no_vegano_lactante": {"title": "Evitar la dieta vegana estricta antes de los 2 años", "formula": "Entre 4–6 meses y 2 años: preferir dieta semi-, lacto-ovo- o lactovegetariana; la vegana puede reanudarse a los 2 años", "summary": "El crecimiento rápido de esta etapa exige proporciones adecuadas de macro- y micronutrientes."}, "c11_distribucion_macros": {"title": "Distribución de macronutrientes en el joven deportista", "formula": "Carbohidratos ≥ 55 % de las calorías; grasa 25–30 %; proteína 15–20 %", "summary": "Las mayores necesidades de energía se cubren sobre todo con carbohidratos, en tres comidas y refrigerios bien distribuidos."}, "c11_comida_previa": {"title": "Refrigerio previo al ejercicio", "formula": "Refrigerio rico en carbohidratos unas 2–3 h antes de la actividad, con algo de grasa", "summary": "Optimiza el combustible muscular; la carga de carbohidratos combina una dieta rica en carbohidratos con reposo antes de la competencia."}, "c11_hidratacion": {"title": "Reposición de líquidos en el deporte", "formula": "Antes: 4–8 oz 1–2 h previas; durante: pequeños volúmenes cada 15–20 min; después: 16 oz (≈ 475 mL) por cada libra de peso perdido", "summary": "El agua es la bebida de elección; las bebidas deportivas sirven en pérdidas sudorales intensas y no se recomiendan las tabletas de sal."}, "c11_trastornos_calor": {"title": "Calambres, agotamiento y golpe de calor", "summary": "Gradación de los trastornos por calor: los calambres se tratan con agua fría y sombra; el agotamiento, suspendiendo el ejercicio, enfriando y reponiendo el líquido perdido; el golpe de calor (piel seca y caliente, sin sudor, alteración del estado mental) es una emergencia médica."}, "c11_triada": {"title": "Tríada de la atleta femenina", "summary": "Relación entre ejercicio excesivo, trastorno de la conducta alimentaria y amenorrea, con riesgo de baja densidad ósea; es más frecuente en gimnastas, bailarinas y patinadoras."}, "c12_fluor": {"title": "Esquema de suplementación con flúor", "formula": "Agua < 0,3 ppm F: 6 meses–3 años 0,25 mg; 3–6 años 0,50 mg; 6–16 años 1 mg. Agua 0,3–0,6 ppm: 3–6 años 0,25 mg; 6–16 años 0,50 mg. Agua > 0,6 ppm o < 6 meses: no suplementar", "summary": "Consultar el flúor del agua local antes de suplementar; dosis preferiblemente al acostarse; no usar pasta dental antes de los 2 años y después solo una cantidad del tamaño de un guisante."}, "c12_caries_biberon": {"title": "Síndrome de caries del biberón", "summary": "Dormir con un biberón de fórmula o jugo expone los dientes a carbohidratos fermentables mientras disminuye la saliva, lo que favorece la caries."}, "c12_signos_orales": {"title": "Signos orales de deficiencias vitamínicas", "summary": "Vitamina A: menos saliva e hipoplasia del esmalte; C: encías inflamadas y sangrantes; K: sangrado gingival; complejo B: alteraciones papilares y queilitis angular; folato y B12: úlceras de lengua y mucosas."}, "c13_gotas_lactante": {"title": "Gotas multivitamínicas para lactantes", "formula": "Tri-Vi-Sol / Poly-Vi-Sol 1 mL/día (0–3 años) aportan 400 UI de vitamina D", "summary": "Presentaciones líquidas de dosis única diaria para menores de 3 años; ADEKS es una formulación con vitaminas liposolubles y zinc."}, "c13_excipientes": {"title": "Excipientes relevantes de los multivitamínicos", "summary": "Revisar ingredientes inactivos: algunas tabletas masticables contienen aspartamo (fenilalanina), otras llevan colorantes, lactosa, sacarosa o alcohol, lo que importa en fenilcetonuria, intolerancias o dietas especiales."}, "c13_sales_calcio": {"title": "Calcio elemental según la sal", "formula": "Carbonato 40 %; cloruro 27 %; acetato 25 %; citrato 21 %; lactato 13 %; gluconato 9,3 %; glubionato 6,5 % de calcio elemental", "summary": "La elección de la sal cambia mucho la cantidad de calcio elemental por tableta o mL."}, "c13_electrolitos_meq": {"title": "Contenido de electrolitos por gramo de sal", "formula": "KCl 13,41 mEq K/g; NaCl 17,1 mEq Na/g; óxido de magnesio 60 % de Mg elemental", "summary": "Equivalencias para calcular la suplementación oral o parenteral de potasio, sodio y magnesio."}, "c14_wic": {"title": "Programa WIC", "formula": "Elegibles: embarazadas o en posparto y niños < 5 años que cumplen criterios de ingresos", "summary": "Ofrece alimentos complementarios, educación nutricional y remisiones de salud."}, "c14_programas_escolares": {"title": "Programas de comidas escolares y comunitarias", "summary": "Almuerzo y desayuno escolar gratuitos o de bajo costo, leche escolar, comidas en vacaciones y en guarderías, según criterios de ingresos o de zona."}, "c15_mb_schofield": {"title": "Metabolismo basal por ecuaciones de Schofield", "formula": "GER (kcal/d) = a·Peso(kg) + b·Talla(cm) + c, con coeficientes según sexo y grupo de edad (0–3, 3–10, 10–18, >18 años); p. ej., varón 0–3 años: 0,167·P + 15,174·T − 617,6", "summary": "En niños, las ecuaciones de Schofield son las que mejor predicen el basal medido; también existen tablas de basal por peso y sexo."}, "c15_factor_estres": {"title": "Gasto energético estimado = basal × factor de estrés", "formula": "GET ≈ MB × factor: inanición 0,9; fiebre +12 % por cada °C > 37; insuficiencia cardiaca 1,15–1,25; cirugía mayor 1,20–1,30; sepsis 1,40–1,50; crecimiento de recuperación 1,5–2,0; quemaduras 1,5–2,0", "summary": "En el hospitalizado se usa este enfoque en lugar de las recomendaciones para niños sanos, que sobrestiman las necesidades; el peso seriado es el patrón de oro."}, "c15_calorimetria_indirecta": {"title": "Calorimetría indirecta y cociente respiratorio", "formula": "GER por ecuación de Weir a partir de VO₂, VCO₂ y nitrógeno ureico urinario; CR = VCO₂/VO₂ (glucosa 1,0; grasa ≈ 0,7); CR > 1,0 sugiere sobrealimentación con lipogénesis", "summary": "Mide el gasto en reposo y permite detectar aporte energético excesivo, hiperventilación o medición sin estado estable."}, "c15_sindrome_realimentacion": {"title": "Síndrome de realimentación", "formula": "Riesgo: pérdida de peso grave (anorexia nerviosa, caquexia) o hidratación IV prolongada → electrolitos séricos 1–2 veces/día al inicio de la recuperación", "summary": "La síntesis proteica y la insulina desplazan fósforo, potasio y magnesio al interior celular; la hipofosfatemia causa hemólisis, debilidad diafragmática e insuficiencia cardiaca.", "caution": "Hoy hay definición y criterios de riesgo formales, incluidos niños: consenso ASPEN 2020."}, "c15_proteina_hospitalizado": {"title": "Aporte proteico en el niño hospitalizado", "formula": "Proteína ≈ 100–150 % de la recomendación para la edad; relación kcal no proteicas : g de nitrógeno aceptable 150–250:1", "summary": "El balance nitrogenado es la medida más directa de adecuación; si la energía es insuficiente, los aminoácidos se queman como combustible."}, "c16_indicaciones_sonda": {"title": "Indicaciones de alimentación por sonda", "summary": "Incapacidad para comer por boca (neurológica, anatómica, prematurez < 34 semanas), incapacidad de cubrir necesidades por hipermetabolismo, anorexia o causas psicosociales, y trastornos de absorción o metabolismo que exigen dieta modificada."}, "c16_seleccion_formula": {"title": "Selección de fórmula infantil según indicación", "summary": "Prematuro: leche materna fortificada o fórmula de prematuro; intolerancia a la lactosa: sin lactosa o soya; sensibilidad a proteína intacta: hidrolizado; alergia grave: aminoácidos libres; malabsorción grasa o quilotórax: alto MCT; función renal disminuida: fórmula baja en solutos."}, "c16_concentracion_modulos": {"title": "Concentración de fórmula y módulos calóricos", "formula": "Concentrar la fórmula base hasta 24–26 kcal/oz; por encima, añadir módulos; avanzar 2–4 kcal/oz cada 12–24 h; no avanzar volumen y concentración a la vez; fórmula isotónica ≈ 300 mOsm/L", "summary": "Los módulos de carbohidrato, grasa de cadena larga o MCT se eligen según la condición clínica, vigilando carga renal de solutos y osmolalidad."}, "c16_inicio_avance": {"title": "Inicio y avance de la alimentación continua", "formula": "Continua — pretérmino: inicio 1–2 mL/kg/h, avance 10–20 mL/kg/d, meta 120–175 mL/kg/d; 0–12 meses: inicio 1–2 mL/kg/h, avance 1–2 mL/kg cada 2–8 h, meta 6 mL/kg/h; > 7 años: inicio 25 mL/h, avance 25 mL cada 2–8 h, meta 100–150 mL/h", "summary": "La progresión depende de la tolerancia al paso previo; el intestino delgado solo tolera infusión continua, mientras el estómago admite bolos."}, "c16_complicaciones_residuos": {"title": "Residuo gástrico y complicaciones de la alimentación por sonda", "formula": "Un residuo aislado > 1,5–2 veces la velocidad horaria no obliga a suspender; vaciamiento inadecuado si > 200 mL por sonda nasogástrica o > 100 mL por gastrostomía", "summary": "Diarrea, vómito, aspiración, obstrucción de la sonda y alteraciones metabólicas tienen causas y correcciones específicas (velocidad, osmolalidad, posición, procinéticos, vía transpilórica)."}, "c16_transicion_oral": {"title": "Destete de la sonda hacia la vía oral", "formula": "Reducir la alimentación por sonda en pasos de 25 %; suspenderla cuando > 75 % del aporte sea oral", "summary": "Tras evaluar estado nutricional, deglución y disposición del cuidador, se pasa a bolos con horario de comidas, se ofrece primero la vía oral y se usa estimulación oral sin forzar."}, "c16_transicion_pn_en": {"title": "Transición de parenteral a enteral", "formula": "Disminuir la parenteral mililitro por mililitro conforme avanza la enteral; la enteral requiere ≈ 10 % más calorías que la parenteral", "summary": "En pacientes con restricción hídrica se mantienen los lípidos hasta alcanzar la meta enteral y luego se concentra la fórmula."}, "c17_indicacion_acceso": {"title": "Cuándo iniciar NP y por qué vía", "formula": "Ayuno previsto > 5 días → considerar NP; > 7 días → NP completa por vía central. Vía periférica: osmolaridad máxima 900 mOsm/L (≈ dextrosa 10 % + aminoácidos 2 %). Punta del catéter central en la unión vena cava superior–aurícula derecha, confirmada por radiografía.", "summary": "Umbral de duración del ayuno para iniciar NP y límite de osmolaridad que obliga a usar un acceso central.", "caution": "Contrastar indicaciones, vías y aportes con las guías ESPGHAN/ESPEN/ESPR/CSPEN de nutrición parenteral pediátrica (2018)."}, "c17_holliday_segar": {"title": "Líquidos de mantenimiento (Holliday-Segar)", "formula": "0–10 kg: 100 mL/kg/d; 10–20 kg: 1000 mL + 50 mL/kg por cada kg > 10; > 20 kg: 1500 mL + 20 mL/kg por cada kg > 20", "summary": "Cálculo de los líquidos diarios de mantenimiento según el peso, que se ajusta por pérdidas sensibles e insensibles."}, "c17_tasa_dextrosa": {"title": "Tasa de infusión de glucosa", "formula": "Glucosa (mg/kg/min) = velocidad (mL/h) × % dextrosa × 0,166 / peso (kg). Inicio ≈ 5 mg/kg/min, aumentos de 2–5 mg/kg/min al día; en neonatos rara vez > 12–15 mg/kg/min. Hiperglucemia: reducir aporte o insulina 0,01 U/kg/h", "summary": "Cálculo y progresión del aporte de dextrosa para no exceder la capacidad de oxidación y evitar esteatosis e hiperglucemia."}, "c17_relacion_npc_n": {"title": "Relación calorías no proteicas : nitrógeno", "formula": "(kcal de carbohidrato + kcal de grasa) : (g de proteína / 6,25); óptimo 150:1 a 250:1; quemados ≈ 100:1", "summary": "Indicador del equilibrio entre energía y proteína para que la proteína se use en síntesis y no como combustible."}, "c17_lipidos_iv": {"title": "Lípidos intravenosos", "formula": "Inicio 1 g/kg/d, aumentos de 1 g/kg/d, máximo habitual 3 g/kg/d; triglicéridos medidos tras 4 h sin infusión; relación molar ácidos grasos libres/albúmina < 6 en neonatos con hiperbilirrubinemia", "summary": "Progresión y vigilancia de las emulsiones lipídicas, aportan ácidos grasos esenciales, con precaución en hiperbilirrubinemia e hipertrigliceridemia.", "caution": "Tipos de emulsión y dosis actuales en las guías ESPGHAN/ESPEN/ESPR/CSPEN 2018. En el libro, el tope de energía por lípidos era ilegible y se omitió."}, "c17_calcio_fosforo": {"title": "Calcio y fósforo y riesgo de precipitación", "formula": "Ca:P óptimo 1,7:1 en peso o 1,3:1 molar; si Ca (mmol/L) + P (mmol/L) > 30 → alto riesgo de precipitación; L-cisteína 40 mg por g de proteína; con aminoácidos ≤ 1 % añadir solo Ca o solo P", "summary": "Aportes para la mineralización ósea y medidas para evitar precipitados de calcio-fosfato, que pueden causar flebitis y embolias."}, "c17_hierro_dextrano": {"title": "Déficit de hierro y hierro dextrano", "formula": "Fe (mg) = peso (kg) × 4,5 × (13,5 − Hb del paciente [g/dL]); dosis de prueba inicial y vigilancia de anafilaxia", "summary": "Estimación del hierro total necesario para normalizar la hemoglobina cuando la vía enteral está contraindicada."}, "c18_etiologia_malnutricion": {"title": "Causas de malnutrición en el SIDA pediátrico", "summary": "Clasificación en menor ingesta, malabsorción y aumento de requerimientos, sumando efectos adversos de los fármacos."}, "c18_evaluacion_periodica": {"title": "Evaluación nutricional periódica en VIH", "formula": "Al diagnóstico y al menos cada 6 meses; más seguido si el crecimiento se detiene o aparecen síntomas", "summary": "Seguimiento sistemático con énfasis en la masa magra, que puede perderse sin bajar de peso."}, "c18_micronutrientes_rda": {"title": "Energía y micronutrientes en VIH", "formula": "Suplemento vitamínico-mineral de 1 a 2 veces la RDA", "summary": "Energía según guías generales más el extra por infecciones o malabsorción, ajustada según el peso, y suplementación de micronutrientes."}, "c18_intervenciones_sintomas": {"title": "Intervenciones según el síntoma", "summary": "Medidas como comidas pequeñas y densas, alimentos blandos y fríos, fórmulas hidrolizadas con TCM, enzimas pancreáticas, sonda o NP según el problema."}, "c19_superficie_corporal": {"title": "Superficie corporal en el niño quemado", "summary": "Uso de la superficie corporal (nomograma o ecuación de Mosteller) en lugar del peso para estimar líquidos y energía, por las mayores pérdidas relativas del niño."}, "c19_formulas_reanimacion": {"title": "Fórmulas de reanimación hídrica en quemaduras", "formula": "Brooke modificada: Ringer lactato 3 mL/kg/% SCQ; Parkland: 4 mL/kg/% SCQ; Galveston: 5000 mL/m² de superficie quemada + 2000 mL/m² de SC de mantenimiento. Mitad del total en las primeras 8 h y el resto en 16 h; diuresis meta 1 mL/kg/h", "summary": "Estimación del volumen de reanimación de las primeras 24 h, siempre guiada por la evaluación clínica y de laboratorio."}, "c19_galveston_calorico": {"title": "Fórmula de Galveston para energía en quemados", "formula": "< 1 año: 2100 kcal/m² SC + 1000 kcal/m² quemado; 1–12 años: 1800 kcal/m² SC + 1300 kcal/m² quemado; > 12 años: 1500 kcal/m² SC + 1500 kcal/m² quemado", "summary": "Cálculo diario de energía en niños con quemaduras de más del 30 % de la superficie corporal."}, "c19_meta_balance": {"title": "Meta nutricional en el paciente crítico", "formula": "Balance nitrogenado positivo y peso dentro del 5 % del previo al ingreso", "summary": "Criterio práctico para evitar tanto la subalimentación como la sobrealimentación."}, "c19_glucosa_uci": {"title": "Aporte de glucosa en el paciente crítico", "formula": "40–60 % de la energía como carbohidrato; glucosa 5–7 mg/kg/min (oxidación ≈ 5 mg/kg/min)", "summary": "Límite práctico de glucosa para no producir hiperglucemia, exceso de CO₂ ni diuresis osmótica."}, "c20_clasificacion_cianotica": {"title": "Cardiopatías cianóticas y acianóticas", "summary": "Las cianóticas afectan peso y talla, mientras que las acianóticas afectan sobre todo el peso, lo que orienta la interpretación del crecimiento."}, "c20_epp_fontan": {"title": "Enteropatía perdedora de proteínas tras Fontan", "summary": "Pérdida intestinal de proteínas y otros nutrientes, confirmada con alfa-1-antitripsina fecal y tratada con dieta alta en proteína, baja en grasa de cadena larga y con TCM."}, "c20_energia_cardiopatia": {"title": "Energía en cardiopatía congénita", "formula": "Energía ≈ RDA para la edad + 30 a 60 kcal/kg/d, titulada según el crecimiento", "summary": "Estimación inicial de las calorías extra que necesitan estos niños, que a menudo exige fórmulas hipercalóricas."}, "c20_contraindicaciones_enteral": {"title": "Contraindicaciones de la alimentación enteral en cardiópatas", "summary": "Inestabilidad hemodinámica con vasoactivos en aumento, lesiones dependientes del ductus con mala perfusión mesentérica, paro cardíaco reciente, intubación o extubación reciente, obstrucción intestinal, sangrado digestivo alto y taquicardia ectópica de la unión."}, "c21_categorias_intervencion": {"title": "Categorías de intervención nutricional en FQ", "formula": "Peso/talla ≥ 90 % del ideal: guía anticipatoria; 85–90 % o caída de la velocidad de peso: suplementos orales; < 85 % persistente: alimentación por sonda; < 75 % o deterioro progresivo: alimentación enteral continua o NP", "summary": "Escala de soporte nutricional que se intensifica según el índice peso/talla."}, "c21_energia_grasa": {"title": "Energía y grasa en FQ", "formula": "Energía 120–150 % de la RDA (hasta 200 %); grasa 35–40 % de las calorías; ácidos grasos esenciales 3–5 %; proteína según RDA", "summary": "Dieta hipercalórica sin restricción de grasa, compensando la malabsorción con enzimas."}, "c21_vitaminas_liposolubles": {"title": "Vitaminas liposolubles en FQ", "formula": "Toxicidad por vitamina A: relación molar retinol/RBP normal 0,8–1,0; > 1,0 sugiere exceso de retinol libre", "summary": "Suplementación obligatoria de A, D, E y K en insuficiencia pancreática, vigilancia de niveles y revisión de la adherencia antes de subir dosis."}, "c21_dosis_enzimas": {"title": "Dosificación de enzimas pancreáticas", "formula": "Niños pequeños (hasta ~4 años): 1000 U lipasa/kg por comida; mayores: 500 U lipasa/kg por comida; máximo 2500 U lipasa/kg por comida o 10 000 U/kg/d", "summary": "Inicio y titulación de enzimas según esteatorrea y absorción, sin pasar los máximos por el riesgo de colonopatía fibrosante."}, "c21_coeficiente_absorcion_grasa": {"title": "Coeficiente de absorción de grasa", "formula": "COA (%) = (g grasa ingerida − g grasa excretada) / g grasa ingerida × 100; recolección de heces de 72 h; normal > 3 años ≈ 95 %", "summary": "Prueba de referencia para cuantificar la malabsorción de grasa y ajustar las enzimas."}, "c22_meta_peso_no_ambulatorio": {"title": "Meta de peso en el niño no ambulatorio", "formula": "Peso para la longitud entre los percentiles 10 y 25", "summary": "En niños inmóviles el peso extra se acumula como grasa, por lo que se acepta una meta más baja."}, "c22_kcal_por_cm": {"title": "Calorías por centímetro de talla", "formula": "5–12 años ambulatorio 13,9 kcal/cm; no ambulatorio 11,1 kcal/cm; PC con actividad muy restringida 10 kcal/cm; PC con actividad leve a moderada 15 kcal/cm; Down 5–12 años: niños 16,1, niñas 14,3 kcal/cm; Prader-Willi 10–11 kcal/cm (mantenimiento) y 8–9 kcal/cm (pérdida); mielomeningocele puede requerir solo 7 kcal/cm", "summary": "Estimación de energía basada en la talla, más apropiada que el peso en niños con talla baja o poca movilidad, siempre ajustada según la evolución del peso."}, "c22_crecimiento_recuperacion_talla": {"title": "Crecimiento de recuperación por edad-talla", "formula": "kcal/kg = (peso ideal para la talla × RDA kcal/kg para la edad-talla) / peso actual; g proteína/kg = (peso ideal para la talla × RDA g/kg para la edad-talla) / peso actual", "summary": "Ecuaciones de recuperación que usan la edad correspondiente a la talla en lugar de la edad cronológica.", "caution": "Usa las RDA de energía de 1989; hoy se parte del requerimiento estimado de energía (EER) de las DRI de energía 2023."}, "c22_banderas_rojas_deglucion": {"title": "Señales de alarma de trastorno de la deglución", "summary": "Tos o atoragamiento al comer, voz húmeda, reflujo nasofaríngeo, fatiga o desaturación al comer, alimento aspirado por traqueostomía y neumonías recurrentes indican estudio videofluoroscópico."}, "c22_ingesta_selectiva_autismo": {"title": "Ingesta selectiva en autismo", "summary": "Rechazo de alimentos por color, textura, temperatura u olor, que se maneja con ambiente constante, multivitamínico en una forma aceptada y un equipo con terapia sensorial."}, "c23_dcct": {"title": "Estudio DCCT", "formula": "HbA1c media 7,2 % (intensivo) frente a 9,0 % (convencional); reducción de retinopatía 76 %, neuropatía 60 % y nefropatía 40–50 %", "summary": "Ensayo que demostró que el control glucémico intensivo retrasa o previene las complicaciones crónicas de la diabetes tipo 1."}, "c23_distribucion_macronutrientes": {"title": "Distribución de nutrientes en diabetes", "formula": "Carbohidratos 50–60 %; proteína 10–20 %; grasa ≤ 30 % con saturada < 10 %; fibra 20–35 g/d o edad (años) + 5 g/d", "summary": "Reparto calórico recomendado; la cantidad total de carbohidrato importa más que su tipo, y la sacarosa puede sustituir otros carbohidratos gramo por gramo."}, "c23_conteo_carbohidratos": {"title": "Conteo de carbohidratos e intercambios", "formula": "1 intercambio de almidón o fruta = 15 g de carbohidrato = 1 porción; leche = 12 g", "summary": "Método flexible para planificar las comidas sumando gramos o porciones de carbohidrato.", "caution": "Las guías ISPAD 2024 basan el manejo nutricional en el conteo de carbohidratos; las listas de intercambio están en desuso."}, "c23_ejercicio_enfermedad": {"title": "Reglas para enfermedad y ejercicio", "formula": "Enfermedad: no omitir la insulina; medir cetonas en orina si glucemia > 240 mg/dL. Ejercicio: evitar si glucemia > 250 mg/dL con cetonuria o > 300 mg/dL sin cetonuria; añadir 15 g de carbohidrato por cada 30–60 min de ejercicio", "summary": "Ajustes de insulina, líquidos y carbohidratos durante la enfermedad intercurrente y el ejercicio, que baja la glucosa hasta 24 h después."}, "c23_metas_glucemia": {"title": "Metas de glucemia por edad", "formula": "< 5 años: 100–200 mg/dL; 5–11 años: 80–180 mg/dL; 12–18 años: 70–150 mg/dL", "summary": "Rangos de glucosa más altos en niños pequeños para evitar la hipoglucemia.", "caution": "Metas por edad superadas: ISPAD 2024 propone metas más estrictas y comunes a todas las edades. Verificar en la guía antes de usar."}, "c24_criterios_an_bn": {"title": "Criterios DSM-IV de anorexia y bulimia nerviosa", "formula": "AN: peso < 85 % del esperado + miedo a engordar + alteración de la imagen corporal + amenorrea ≥ 3 ciclos. BN: atracones y conductas compensatorias ≥ 2 veces/semana durante 3 meses", "summary": "Criterios que definen anorexia nerviosa (restrictiva o purgativa) y bulimia nerviosa (purgativa o no purgativa); los cuadros incompletos son TCA no especificado.", "caution": "Criterios DSM-IV. El DSM-5 (2013) retiró la amenorrea como requisito de anorexia y añadió ARFID y el trastorno por atracón."}, "c24_sindrome_realimentacion": {"title": "Síndrome de realimentación", "summary": "Hipofosfatemia grave al pasar del catabolismo al uso de carbohidratos, con caída de ATP y riesgo de falla cardiaca y respiratoria.", "caution": "Hoy hay definición y criterios de riesgo formales, incluidos niños: consenso ASPEN 2020."}, "c24_criterios_hospitalizacion": {"title": "Criterios de hospitalización en TCA", "formula": "Pérdida > 25 % del peso ideal o peso < 75 % del ideal; signos vitales inestables; deshidratación o alteración electrolítica; rechazo alimentario agudo; emergencia psiquiátrica; fracaso ambulatorio", "summary": "Indicaciones de ingreso por inestabilidad médica, desnutrición grave, conductas incontrolables o riesgo psiquiátrico."}, "c24_progresion_calorica": {"title": "Progresión calórica en la realimentación de anorexia nerviosa", "formula": "Inicio 1.500 kcal/d (mujeres) o 1.750 kcal/d (varones), +250 kcal/d hasta la meta; fósforo profiláctico (Neutraphos 500 mg c/12 h, ajustado según niveles)", "summary": "Plan de comidas inicial con aumentos diarios, suplemento líquido si no se completa la comida y sonda nasogástrica si se rechaza."}, "c24_ganancia_peso_esperada": {"title": "Ganancia de peso esperada en el hospital", "formula": "Meta 0,2 kg/día; si no se alcanza: +250 kcal el día 1, +500 kcal el día 2, +750 kcal el día 3, etc.", "summary": "Peso diario estandarizado en ayunas tras orinar, con aumento escalonado del suplemento si no se cumple la meta."}, "c25_tipos_hipersensibilidad": {"title": "Cuatro tipos de reacciones de hipersensibilidad a alimentos", "formula": "I: IgE inmediata (anafiláctica); II: citotóxica por anticuerpos; III: por inmunocomplejos IgG; IV: celular (linfocitos T)", "summary": "Mecanismos inmunológicos que, solos o combinados, explican las reacciones alérgicas alimentarias."}, "c25_prueba_cutanea": {"title": "Interpretación de la prueba cutánea (prick)", "formula": "Positiva si la pápula > 3 mm", "summary": "Confirma sensibilización pero no diagnóstico; puede seguir positiva tras la resolución clínica; el RAST la sustituye si se teme anafilaxia."}, "c25_formula_hidrolizada": {"title": "Fórmula extensamente hidrolizada en colitis alérgica", "summary": "En lactantes alimentados con biberón se usa hidrolizado extenso (o fórmula de aminoácidos si no responden) por la frecuente alergia cruzada a soya; si lacta, la madre elimina leche y soya."}, "c25_provocacion_doble_ciego": {"title": "Provocación oral doble ciego controlada con placebo", "formula": "Dosis crecientes cada 20–30 min hasta 8–10 g de alimento seco o 60–100 g de alimento húmedo; si es negativa, confirmar con provocación abierta", "summary": "Estándar de oro diagnóstico, realizado en entorno controlado con acceso venoso si hay riesgo de reacción grave."}, "c25_dieta_sin_leche": {"title": "Dieta sin leche y adecuación nutricional", "summary": "Excluir todas las fuentes de proteína láctea (incluidas ocultas); sin sustituto fortificado se requiere suplementar calcio, fósforo y vitamina D."}, "c26_dieta_sin_gluten": {"title": "Dieta sin gluten", "summary": "Tratamiento de la enfermedad celíaca: eliminar trigo, centeno y cebada (la avena es controvertida) y vigilar gluten oculto en aditivos, medicamentos y etiquetas cambiantes."}, "c26_reto_gluten": {"title": "Reto con gluten para confirmar celiaquía", "formula": "Proteína de trigo habitual por edad: 1–3 a 5–10 g/d; 3–6 a 7–12 g/d; 6–9 a 10–15 g/d; ≥ 9 a 15–30 g/d, durante 2–3 meses o hasta recaída", "summary": "Tras un periodo sin gluten se añade harina de trigo de forma encubierta; si reaparecen síntomas se confirma con serología, si no puede requerirse nueva biopsia."}, "c26_fibra_edad_mas_5": {"title": "Recomendación de fibra 'edad + 5'", "formula": "Fibra (g/d) = edad (años) + 5, en niños mayores de 2 años", "summary": "Base del manejo dietético del estreñimiento, aumentando la fibra gradualmente y con líquidos suficientes."}, "c26_rehidratacion_oral": {"title": "Terapia de rehidratación oral según grado de deshidratación", "formula": "Leve–moderada: SRO 60–80 mL/kg en 4 h; grave: bolos de 20 mL/kg de Ringer lactato IV hasta mejorar perfusión y luego SRO; pérdidas: 4–8 oz de SRO por deposición líquida", "summary": "Rehidratar con SRO comercial, reponer pérdidas y reanudar la dieta habitual en cuanto se rehidrata, evitando dietas restrictivas."}, "c26_eliminacion_lactosa": {"title": "Manejo de la intolerancia a la lactosa", "formula": "Secundaria: eliminar toda la lactosa 2–6 semanas y reintroducir según tolerancia; primaria: restricción permanente", "summary": "Muchos niños toleran pequeñas cantidades (yogur, quesos duros); en dieta estricta hay que asegurar calcio y vitamina D."}, "c26_suplementacion_eii": {"title": "Recomendaciones nutricionales en EII pediátrica", "formula": "Energía y proteína 100–150 % de la RDA para la edad-talla; calcio 500–1.300 mg/d; hierro 2–4 mg/kg/d elemental; B12 100 µg IM cada 3 meses si hay pérdida de íleon terminal", "summary": "Multivitamínico diario más suplementos dirigidos de calcio (sobre todo con esteroides), hierro, zinc, folato (interacción con sulfasalazina) y B12."}, "c26_nutricion_enteral_crohn": {"title": "Nutrición enteral como tratamiento de Crohn", "summary": "Las dietas elementales inducen remisión con eficacia similar a los corticoides y las poliméricas también son eficaces y mejor aceptadas."}, "c27_criterios_diagnosticos": {"title": "Criterios diagnósticos de falla de crecimiento", "formula": "Peso/edad < p5 o peso/talla < p5 (NCHS), o caída de > 2 percentiles mayores (o 2 DE) en 3–6 meses", "summary": "Define retraso del crecimiento por valor absoluto bajo o por desaceleración de la velocidad de crecimiento.", "caution": "Percentiles NCHS de 1977. Hoy: patrones OMS 2006 (0–5 años) y OMS 2007 o CDC 2000 después; en Colombia, Resolución 2465 de 2016."}, "c27_incrementos_peso_talla": {"title": "Incrementos normales de peso y longitud", "formula": "El lactante duplica el peso de nacimiento hacia los 4 meses y lo triplica a los 12 meses", "summary": "Tabla de ganancias diarias de peso (g/d) y longitud (mm/d) por sexo y edad hasta 24 meses para evaluar la velocidad de crecimiento."}, "c27_clasificacion_chatoor": {"title": "Clasificación evolutiva de trastornos alimentarios (Chatoor)", "formula": "Homeostasis 0–2 meses; apego 2–6 meses; individuación/separación 6 meses–3 años", "summary": "Relaciona la etapa del desarrollo con rasgos del niño y del cuidador y orienta el tratamiento conductual."}, "c27_crecimiento_recuperacion": {"title": "Cálculo de necesidades para el crecimiento de recuperación", "formula": "kcal/kg = RDA energía para la edad × peso ideal para la talla (kg) ÷ peso actual (kg) [rango hasta peso ideal para la edad]; proteína = RDA proteína × peso ideal para la talla ÷ peso actual; alternativa: 120 kcal/kg × peso ideal para la talla ÷ peso actual", "summary": "Estima la energía y proteína necesarias para alcanzar el peso ideal (p50 NCHS) en un periodo de crecimiento acelerado.", "caution": "Usa las RDA de energía de 1989; hoy se parte del requerimiento estimado de energía (EER) de las DRI de energía 2023."}, "c27_estrategias_alimentacion": {"title": "Estrategias de alimentación en falla de crecimiento", "formula": "Comidas y meriendas cada 2½–3 h, de 20–30 min; jugo máximo 4 oz/d en preescolares; multivitamínico con hierro y zinc", "summary": "Aumentar la densidad calórica de líquidos y sólidos, estructurar horarios, limitar distracciones y jugos, y movilizar apoyos sociales."}, "c28_deficit_liposolubles": {"title": "Déficit de vitaminas liposolubles en colestasis", "summary": "La malabsorción de grasa por déficit de sales biliares causa déficit de A (ceguera nocturna), D (raquitismo), E (neuropatía, ataxia) y K (coagulopatía)."}, "c28_suplementacion_micronutrientes": {"title": "Suplementación en hepatopatía crónica", "formula": "Vit A 5.000–25.000 UI/d; vit D (Calderol) 3–5 µg/kg/d; vit E (TPGS) 15–25 UI/kg/d; vit K1 2,5–5 mg/d; zinc 1 mg/kg/d; calcio 25–100 mg/kg/d; fósforo 25–50 mg/kg/d", "summary": "Dosis de referencia de vitaminas liposolubles hidromiscibles y minerales, ajustadas según niveles séricos."}, "c28_energia_proteina": {"title": "Energía y proteína en hepatopatía", "formula": "Energía 100–150 % de la RDA; restringir proteína solo si hay encefalopatía hepática", "summary": "Los requerimientos están aumentados; se prefiere la vía enteral y la sonda si la ingesta oral es insuficiente."}, "c28_aminoacidos_ramificados": {"title": "Aminoácidos de cadena ramificada", "summary": "En hepatopatía suben los aromáticos y bajan los ramificados; los productos enriquecidos en ramificados son controvertidos y se reservan para encefalopatía no controlada."}, "c29_tamizaje_selectivo": {"title": "Tamizaje selectivo de colesterol (NCEP)", "formula": "A partir de los 2 años si hay ECV prematura (antes de los 55 años) en padres o abuelos, o colesterol parental ≥ 240 mg/dL; colesterol total aceptable < 170, limítrofe 170–199, alto ≥ 200 mg/dL", "summary": "Estrategia de tamizaje dirigido por antecedentes familiares y factores de riesgo en lugar de tamizaje universal.", "caution": "Guía NCEP de 1991; el panel NHLBI 2011 añadió tamizaje universal a los 9–11 y 17–21 años. Los cortes de colesterol total se reconstruyeron de una figura con OCR dañado: verificar en la pág. 434."}, "c29_ldl_friedewald": {"title": "Estimación del LDL (Friedewald)", "formula": "LDL = colesterol total − HDL − (triglicéridos ÷ 5), tras 12 h de ayuno", "summary": "Cálculo del colesterol LDL a partir del perfil lipídico en ayunas."}, "c29_clasificacion_ldl": {"title": "Clasificación del LDL en niños", "formula": "Aceptable < 110 mg/dL; limítrofe 110–129 mg/dL; alto ≥ 130 mg/dL; HDL < 35 mg/dL se considera bajo", "summary": "Puntos de corte NCEP que orientan educación, seguimiento e inicio de dieta."}, "c29_dietas_paso_uno_dos": {"title": "Dietas Paso Uno y Paso Dos", "formula": "Paso Uno: grasa total ≤ 30 % kcal, saturada < 10 %, poliinsaturada ≤ 10 %, colesterol < 300 mg/d; Paso Dos: mayor restricción de grasa saturada y colesterol < 200 mg/d", "summary": "Se pasa a Paso Dos si no se alcanzan metas tras 3 meses de Paso Uno; preferir grasa monoinsaturada y evitar grasas trans.", "caution": "Dietas Paso Uno y Paso Dos del NCEP; el panel NHLBI 2011 las sustituyó por las dietas CHILD-1 y CHILD-2."}, "c29_criterios_farmacos": {"title": "Criterios para tratamiento farmacológico", "formula": "Tras 1 año de dieta: LDL > 190 mg/dL en mayores de 10 años, o LDL > 160 mg/dL con dos o más factores de riesgo", "summary": "La medicación es coadyuvante de la dieta Paso Dos, no su sustituto.", "caution": "Criterios NCEP de 1991; contrastar con el panel NHLBI 2011."}, "c30_razon_cetogenica": {"title": "Razón cetogénica", "formula": "Razón = g de grasa : g de (proteína + carbohidrato); habitual 4:1 o 3:1", "summary": "Relación que define la intensidad de la dieta; la mayoría inicia en 4:1 y se usa menor razón en lactantes muy pequeños, niños con sobrepeso o mayores de 12 años.", "caution": "El libro inicia la dieta con ayuno; el consenso internacional de 2018 recomienda inicio sin ayuno y admite variantes como la dieta Atkins modificada."}, "c30_energia_cetogenica": {"title": "Metas de energía en la dieta cetogénica", "formula": "<1 año: 80 kcal/kg; 1–1½ años: 75 kcal/kg; 1½–3 años: 70 kcal/kg; 4–6 años: 65 kcal/kg; 7–8 años: 60 kcal/kg (con peso ideal para la talla si hay sobrepeso)", "summary": "Las calorías se fijan por debajo de las recomendaciones habituales y por kg de peso ideal en el niño con sobrepeso."}, "c30_calculo_unidades": {"title": "Cálculo por unidades dietéticas", "formula": "kcal/unidad = (g grasa de la razón × 9) + (1 g × 4) → 3:1 = 31 kcal, 4:1 = 40 kcal; unidades/día = kcal totales ÷ kcal/unidad; grasa = unidades × parte de grasa; proteína+CHO = unidades × 1; proteína: <2 años según RDA, 2–12 años 1 g/kg, >12 años 0.75–1 g/kg; CHO = (proteína+CHO) − proteína − CHO de medicamentos", "summary": "Secuencia para convertir la meta calórica y la razón en gramos diarios de grasa, proteína y carbohidrato, restando el carbohidrato contenido en los fármacos."}, "c30_complicaciones": {"title": "Complicaciones de la dieta cetogénica", "summary": "Deshidratación, hipoglucemia, vómito, diarrea y rechazo a corto plazo; litiasis renal, acidosis, hiperuricemia, desnutrición y déficit de carnitina a largo plazo, manejados con líquidos, ajuste de razón y monitoreo de peso y albúmina."}, "c30_liquidos_suplementos": {"title": "Líquidos y suplementos", "formula": "Líquidos ≈ 1 mL por kcal de la dieta (incluye la crema); calcio 600–650 mg/día y multivitamínico, ambos sin azúcar", "summary": "La dieta restringe líquidos e implica suplementar calcio y multivitamínico libres de azúcar."}, "c31_principio_tratamiento": {"title": "Principios del tratamiento de los errores innatos", "summary": "Reducir el sustrato acumulado con restricción dietaria, suplementar el producto deficiente, dar cofactores en defectos sensibles a vitaminas y usar fármacos que favorezcan la excreción de metabolitos tóxicos, asegurando crecimiento normal."}, "c31_formulas_medicas": {"title": "Fórmulas médicas de aminoácidos", "summary": "Fórmulas específicas por edad y diagnóstico, a base de L-aminoácidos, que aportan la mayor parte de la proteína; por su rápida oxidación las metas de proteína y energía suelen superar las RDA y la proteína natural se limita al mínimo tolerado."}, "c31_pku": {"title": "Fenilcetonuria: clasificación y dieta", "formula": "Fenilalanina sanguínea: clásica >1200 µmol/L; moderada 360–1200 µmol/L; leve (hiperfenilalaninemia) 120–360 µmol/L", "summary": "Restricción de fenilalanina con suplemento de tirosina mantenida de por vida; en mujeres con PKU la dieta estricta debe iniciarse antes de la concepción para evitar daño fetal."}, "c31_manejo_crisis": {"title": "Manejo de la descompensación metabólica aguda", "formula": "Suspender proteína y dar glucosa y líquidos; no mantener dieta sin proteína más de 2 días; en NP estándar, 0.5 g proteína/kg", "summary": "En acidemias orgánicas y trastornos del ciclo de la urea se suspende la proteína, se aportan calorías como glucosa y líquidos, y se reintroduce la proteína gradualmente para evitar catabolismo y rebote."}, "c31_galactosemia": {"title": "Dieta en galactosemia", "summary": "Eliminar lactosa y galactosa de por vida (fórmula de soya en lactantes, revisar etiquetas y medicamentos), suplementar calcio; es contraindicación verdadera de la lactancia materna."}, "c31_gsd_i": {"title": "Glucogenosis tipo I: aporte continuo de glucosa", "formula": "Energía 60–70 % carbohidratos complejos, 10–15 % proteína, resto grasa; almidón crudo 1.75–2.5 g/kg por dosis cada 4–6 h", "summary": "Comidas diurnas frecuentes y alimentación nocturna continua o almidón de maíz crudo para evitar hipoglucemia, limitando lácteos, frutas y azúcares simples."}, "c31_oxidacion_ag": {"title": "Defectos de oxidación de ácidos grasos: evitar el ayuno", "formula": "Ayuno nocturno máximo: 6 h en lactantes, 8–12 h en niños", "summary": "Corregir la hipoglucemia con glucosa en la fase aguda; a largo plazo comidas frecuentes ricas en carbohidratos, restricción de grasa de cadena larga con MCT y aporte de ácidos grasos esenciales."}, "c32_imc_percentiles": {"title": "IMC y puntos de corte de obesidad", "formula": "IMC = peso (kg) / talla (m)²; ≥ percentil 95 para edad y sexo = obesidad; > percentil 85 = riesgo", "summary": "El IMC es la medida preferida en clínica aunque no distingue masa magra ni estadio puberal."}, "c32_peso_relativo": {"title": "Peso relativo respecto al peso ideal", "formula": "Leve 120–149 %; moderada 150–199 %; grave >200 % del peso ideal (p50 de peso para talla, edad y sexo)", "summary": "Clasificación de la obesidad según el porcentaje del peso corporal ideal, complementaria al IMC, los pliegues y el cruce de percentiles."}, "c32_meta_perdida": {"title": "Metas de peso y déficit calórico", "formula": "Pérdida de 1–2 lb/semana; déficit de 500–1000 kcal/día en niños mayores y adolescentes", "summary": "En prepúberes suele bastar estabilizar el peso mientras crecen; si se busca perder peso, el déficit es menor en niños pequeños que en adolescentes."}, "c32_peso_ajustado": {"title": "Peso corporal ajustado", "formula": "Peso ajustado = [(peso actual − peso ideal) × 0.25] + peso ideal", "summary": "Se usa para estimar gasto energético basal y proteína en quienes superan mucho el peso ideal; validado en adultos, no en niños."}, "c32_tratamiento": {"title": "Tratamiento multidisciplinario de la obesidad", "formula": "Grasa ≤30 % de la energía; ejercicio mínimo 30 min 3 veces/semana", "summary": "Combina consejería nutricional, actividad física placentera con menos sedentarismo y modificación de conducta con participación familiar; dietas muy bajas en calorías, fármacos y cirugía no son de rutina en pediatría.", "caution": "La guía de práctica clínica de la AAP (2023) plantea tratamiento intensivo y temprano, con farmacoterapia y cirugía en adolescentes seleccionados."}, "c33_riesgo_por_tumor": {"title": "Riesgo nutricional según tipo de cáncer", "summary": "Alto riesgo en tumores sólidos avanzados (Wilms y neuroblastoma estadios III–IV), rabdomiosarcoma, Ewing, leucemia no linfoblástica, recaídas múltiples y meduloblastoma; bajo en tumores no metastásicos, LLA de bajo riesgo y remisión."}, "c33_toxicidad_tratamiento": {"title": "Efectos nutricionales de quimioterapia y radiación", "summary": "Mucositis, náuseas y vómito, diarrea, alteración del gusto y daño hepático o renal según el agente, sumados a efectos por zona irradiada, esteroides e inmunosupresores."}, "c33_lisis_tumoral": {"title": "Síndrome de lisis tumoral: plan nutricional", "formula": "Mantener pH urinario 7.0–7.5", "summary": "Desde antes del tratamiento hasta unos 5 días después: limitar potasio, alopurinol, hidratación agresiva con bicarbonato, quelantes de fosfato, reponer calcio y diálisis si falla lo conservador."}, "c33_energia": {"title": "Necesidades energéticas en cáncer y trasplante", "formula": "RDA, o metabolismo basal + 20–100 % por estrés; en trasplante de médula, niños 45–65 kcal/kg/día para balance nitrogenado", "summary": "Las necesidades están poco estudiadas; la calorimetría indirecta y la ganancia de peso con estado hídrico normal guían la adecuación."}, "c33_seguridad_alimentaria": {"title": "Prácticas higiénicas en inmunocomprometidos", "formula": "Alimentos a <40 °F o >140 °F; sobras refrigeradas máximo 3 días", "summary": "Lavado de manos, cocción completa de carnes, evitar huevo crudo y comida callejera; la dieta baja en bacterias en neutropenia tiene poca evidencia."}, "c34_clasificacion": {"title": "Clasificación por peso al nacer y peso para la edad gestacional", "formula": "Bajo peso <2500 g; muy bajo peso <1500 g; extremo bajo peso <1000 g; PEG < p10; AEG p10–p90; GEG > p90", "summary": "Clasifica al recién nacido por peso y por adecuación para la edad gestacional, distinguiendo PEG simétrico y asimétrico."}, "c34_edad_corregida": {"title": "Edad corregida", "formula": "Edad corregida = edad cronológica − semanas de prematurez (término − edad gestacional al nacer)", "summary": "Desde las 40 semanas posconcepcionales las medidas se grafican en las curvas NCHS usando la edad corregida."}, "c34_np_prematuro": {"title": "Nutrición parenteral en el prematuro", "formula": "Glucosa inicial 4–6 mg/kg/min, avanzar 1–2 mg/kg/min, límite <14 mg/kg/min; proteína y lípidos: <1000 g iniciar 0.5 g/kg/d y avanzar 0.5; >1000 g iniciar 1.0 g/kg/d y avanzar 1.0; lípidos mínimo 0.5 g/kg/d para evitar déficit de ácidos grasos esenciales; triglicéridos <150 mg/dL", "summary": "Iniciar NP en las primeras 24–48 h si se prevé ayuno de más de 3–5 días, con solución pediátrica de aminoácidos y lípidos al 20 %.", "caution": "Contrastar con las guías ESPGHAN/ESPEN/ESPR/CSPEN 2018, que incluyen al recién nacido prematuro."}, "c34_metas_enterales": {"title": "Alimentación trófica y metas enterales", "formula": "Trófica 10–20 mL/kg/d; energía 110–130 kcal/kg/d (hasta 150–160 en DBP o PEG); proteína 3.0–4.0 g/kg/d", "summary": "La alimentación enteral se inicia hacia las 48–72 h y se avanza según peso al nacer vigilando signos de intolerancia.", "caution": "Metas de energía, proteína y micronutrientes actualizadas en el documento de posición ESPGHAN 2022 sobre nutrición enteral del prematuro."}, "c34_fortificacion": {"title": "Fortificación de la leche materna", "formula": "Indicada en nacidos <34 semanas o <2000 g, o con restricción de líquidos", "summary": "La leche materna es de elección pero requiere fortificador (o fórmula para prematuros si no hay leche) para cubrir proteína, energía y minerales; soya, fórmula de término e hidrolizados no son de rutina.", "caution": "Criterios de fortificación de la leche humana actualizados en ESPGHAN 2022."}, "c35_osteodistrofia": {"title": "Osteodistrofia renal", "summary": "Por retención de fosfato, hipocalcemia e hiperparatiroidismo secundario y menor activación de vitamina D; se trata reduciendo fosfato, con quelantes de calcio y vitamina D activa."}, "c35_vitaminas": {"title": "Vitaminas en insuficiencia renal y diálisis", "formula": "Vitaminas hidrosolubles (o multivitamínico) + folato 0.5–1.0 mg; evitar suplementos de vitamina A y de vitamina C", "summary": "La diálisis arrastra vitaminas hidrosolubles, mientras la vitamina A se acumula y la vitamina C favorece cálculos de oxalato."}, "c35_proteina_energia": {"title": "Proteína y energía según edad-talla", "summary": "Las recomendaciones de proteína y energía se basan en la RDA para la edad-talla; no hay datos de que restringir proteína por debajo de la RDA retrase la progresión en niños."}, "c35_densidad_calorica": {"title": "Aumentar densidad calórica sin elevar carga renal", "summary": "Concentrar energía con módulos de carbohidrato y grasa en vez de concentrar la fórmula; la sonda nocturna continua suele tolerarse bien ante el reflujo frecuente."}, "c35_np_renal": {"title": "Nutrición parenteral en enfermedad renal terminal", "summary": "Iniciar sin potasio, magnesio ni fosfato añadidos y titular según niveles, vigilar síndrome de realimentación y preferir folato, vitamina C y complejo B frente a multivitamínicos estándar prolongados."}, "c36_longitud_residual": {"title": "Longitud residual y válvula ileocecal", "summary": "La probabilidad de suspender la NP depende de la longitud de intestino delgado remanente, y con válvula ileocecal intacta se necesita menos longitud que sin ella."}, "c36_colestasis_np": {"title": "Prevención de la colestasis asociada a NP", "formula": "Evitar sobrealimentación (energía parenteral habitual 90–100 kcal/kg); ciclar la NP apagándola 2–6 h al día", "summary": "Además, prevenir y tratar infecciones y sobrecrecimiento bacteriano y avanzar la nutrición enteral, que es la meta final."}, "c36_liquidos_sodio": {"title": "Líquidos y sodio en la fase inicial", "formula": "NP con sodio ≥80–100 mEq/L; reposición oral de pérdidas con soluciones de 75–90 mEq/L de sodio", "summary": "Las pérdidas son abundantes y ricas en sodio; se usa NP estándar más una solución aparte que repone las pérdidas medidas."}, "c36_formula_enteral": {"title": "Elección de la fórmula enteral", "summary": "Leche materna si está disponible; si no, hidrolizado proteico sin lactosa con parte de la grasa como MCT, grasa al menos moderada y carbohidratos como polímeros de glucosa para limitar la carga osmótica."}, "c36_avance_enteral": {"title": "Inicio y avance enteral en el lactante", "formula": "Inicio 10–20 mL/kg/d continuo por 24 h; heces <10 g/kg/d → avanzar 10–20 mL/kg/d; 10–20 g/kg/d → sin cambio; >20 g/kg/d → reducir o suspender; ostomía <2 g/kg/h avanzar, 2–3 sin cambio, >3 reducir; metas 130–200 mL/kg/d y 100–140 kcal/kg/d; tras suspender 8 h, reiniciar a 3/4 de la velocidad previa", "summary": "Un solo avance por 24 h guiado por gasto fecal u ostomía, sustancias reductoras, hidratación y residuos gástricos, reduciendo la NP de forma isocalórica."}}, "resources": [{"id": "A", "title": "Tablas de conversión", "page": 542, "usedBy": ["1.4"]}, {"id": "B", "title": "Interacciones fármaco-nutriente", "page": 544, "usedBy": ["22.5", "28.4", "3.1", "33.2"]}, {"id": "C", "title": "Centros de referencia genético-metabólicos", "page": 568, "usedBy": ["31.1"]}, {"id": "D", "title": "Fabricantes de productos enterales", "page": 573, "usedBy": ["16.4"]}, {"id": "E", "title": "Curvas de crecimiento para síndromes específicos", "page": 574, "usedBy": ["22.3", "22.7"]}], "requires": {"chapters": {"1": [], "2": [1], "3": [1], "4": [2, 3], "5": [], "6": [2], "7": [6], "8": [5, 7], "9": [5], "10": [5, 8], "11": [5, 8], "12": [3, 5], "13": [5], "14": [8], "15": [1, 4, 5], "16": [6, 15], "17": [15, 16], "18": [5, 15], "19": [15, 16, 17], "20": [2, 16], "21": [2, 16], "22": [2, 16], "23": [5, 8], "24": [2, 15], "25": [5, 6], "26": [5, 16], "27": [1, 2, 5], "28": [16, 17], "29": [4], "30": [5, 13], "31": [5, 16, 17], "32": [2, 5, 9], "33": [15, 16, 17], "34": [2, 6, 17], "35": [5, 16, 17], "36": [16, 17, 26
