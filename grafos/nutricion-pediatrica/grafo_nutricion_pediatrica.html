<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo del libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-wrap:anywhere;white-space:normal}
.caution{font-size:.88rem;line-height:1.45;background:#FBF1DC;border-left:3px solid #B07A12;color:#4A3A12;padding:8px 10px;margin:0 0 12px;border-radius:0 3px 3px 0}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Nutrición pediátrica como grafo", "subtitle": "Manual of Pediatric Nutrition, 3.ª ed. (Hendricks, Duggan y Walker): capítulos, secciones, conceptos clave y apéndices. Alertas actualizadas a octubre de 2026.", "language": "es", "itemLabel": "Concepto clave", "itemLabelPlural": "Conceptos", "resourceLabel": "Apéndice", "resourceLabelPlural": "Apéndices", "searchHint": "Buscar: realimentación, Holliday-Segar, cetogénica, 16.6…"}, "blocks": {"eval": {"name": "Evaluación y requerimientos"}, "sano": {"name": "Alimentación del niño sano"}, "soporte": {"name": "Hospitalización y soporte nutricional"}, "critico": {"name": "Crítico, inmunocomprometido y prematuro"}, "organo": {"name": "Enfermedades de órganos y sistemas"}, "metab": {"name": "Endocrino-metabólicas"}, "conducta": {"name": "Crecimiento, conducta y alergia"}}, "chapters": [{"num": 1, "title": "Evaluación nutricional: evaluación dietética", "page": 1, "summary": "Presenta la evaluación nutricional pediátrica como combinación de datos dietéticos, clínicos, antropométricos y bioquímicos, con un enfoque escalonado de tamizaje a evaluación profunda, y describe los métodos para medir la ingesta y sus limitaciones.", "sections": [{"num": "1.1", "title": "Propósito y componentes de la evaluación nutricional", "page": 1, "items": [], "summary": "Por qué evaluar al niño: detectar desnutrición y exceso nutricional combinando historia, examen y antropometría."}, {"num": "1.2", "title": "Enfoque escalonado para identificar problemas nutricionales", "page": 2, "items": ["c01_niveles_evaluacion"], "summary": "Parámetros dietéticos, clínicos, antropométricos y bioquímicos por nivel: rutinario, intermedio y profundo (Tabla 1-1)."}, {"num": "1.3", "title": "Hoja de recolección de datos de evaluación pediátrica", "page": 4, "items": [], "summary": "Formato modelo para registrar historia, antropometría, laboratorio, clínica, dieta y recomendaciones (Tabla 1-2)."}, {"num": "1.4", "title": "Evaluación dietética y métodos de recolección de la ingesta", "page": 5, "items": ["c01_metodos_dieteticos"], "summary": "La ingesta inadecuada o excesiva precede a los signos clínicos; métodos clínicos habituales para cuantificarla."}, {"num": "1.5", "title": "Limitaciones y combinación de métodos", "page": 6, "items": ["c01_sesgo_reporte"], "summary": "Sesgos de reporte, variabilidad diaria y de bases de composición; conviene combinar métodos."}], "block": "eval"}, {"num": 2, "title": "Evaluación nutricional: antropometría y crecimiento", "page": 8, "summary": "Describe cómo medir, graficar e interpretar peso, talla, perímetro cefálico, IMC, puntaje Z, velocidad de crecimiento, pliegues, edad ósea y maduración sexual, y cómo clasificar la malnutrición proteico-calórica.", "sections": [{"num": "2.1", "title": "Peso", "page": 8, "items": ["c02_peso_estandar"], "summary": "Peso para la edad con curvas NCHS, porcentaje del peso estándar, cambio reciente de peso y técnica de medición."}, {"num": "2.2", "title": "Longitud y talla", "page": 13, "items": [], "summary": "Talla para la edad como indicador de desnutrición crónica; menores de 2 años se miden acostados."}, {"num": "2.3", "title": "Perímetro cefálico", "page": 15, "items": [], "summary": "Sensible a la nutrición hasta los 36 meses; valores bajos sugieren desnutrición fetal o temprana."}, {"num": "2.4", "title": "Peso para la talla e índice de masa corporal", "page": 17, "items": ["c02_imc"], "summary": "El peso para la talla distingue emaciación (aguda) de retraso de talla (crónica); IMC por percentiles para tamizar obesidad."}, {"num": "2.5", "title": "Puntaje Z", "page": 20, "items": ["c02_puntaje_z"], "summary": "Expresión en desviaciones estándar respecto a la mediana, útil fuera de los percentiles extremos y para seguir la evolución."}, {"num": "2.6", "title": "Velocidad de crecimiento", "page": 21, "items": [], "summary": "Cambio de talla o peso por unidad de tiempo; detecta antes la falla de crecimiento que las curvas de distancia."}, {"num": "2.7", "title": "Estimación de la talla adulta", "page": 24, "items": ["c02_talla_parental"], "summary": "Estándares de Fels según punto medio parental y fórmulas de Tanner a partir de la talla a los 3 años."}, {"num": "2.8", "title": "Pliegues cutáneos y circunferencia del brazo", "page": 27, "items": [], "summary": "Pliegue tricipital y circunferencia media del brazo para estimar reservas de grasa y músculo; tablas y nomogramas."}, {"num": "2.9", "title": "Edad ósea y maduración sexual", "page": 44, "items": ["c02_crecimiento_recuperacion"], "summary": "Maduración esquelética (Greulich y Pyle) y estadios de Tanner para valorar potencial de recuperación y progreso puberal."}, {"num": "2.10", "title": "Clasificación de la malnutrición", "page": 47, "items": ["c02_marasmo_kwashiorkor", "c02_clasificacion_dpc"], "summary": "Marasmo frente a kwashiorkor, enanismo nutricional, clasificaciones de Gómez, Waterlow, Jelliffe y McLaren, y mortalidad asociada."}], "block": "eval"}, {"num": 3, "title": "Evaluación nutricional: evaluación clínica", "page": 52, "summary": "Tabla de referencia que, para cada macronutriente, vitamina, mineral y oligoelemento, reúne funciones, signos de déficit y exceso, fuentes alimentarias, causas y pruebas de laboratorio, para orientar el examen físico nutricional.", "sections": [{"num": "3.1", "title": "Examen clínico de deficiencias y excesos", "page": 52, "items": ["c03_tabla_signos"], "summary": "Los signos físicos sutiles son inespecíficos y deben confirmarse con datos bioquímicos, antropométricos o dietéticos."}, {"num": "3.2", "title": "Macronutrientes: carbohidratos, grasas y proteínas", "page": 53, "items": ["c03_deficit_proteico"], "summary": "Aporte energético, signos de déficit de ácidos grasos esenciales y de proteína, y su laboratorio."}, {"num": "3.3", "title": "Vitaminas liposolubles (A, D, E, K)", "page": 54, "items": ["c03_vitamina_d_raquitismo"], "summary": "Signos oculares del déficit de vitamina A, raquitismo, hemólisis por déficit de E y sangrado por déficit de K."}, {"num": "3.4", "title": "Vitaminas hidrosolubles", "page": 57, "items": [], "summary": "Vitamina C, biotina, B12, folato, niacina, ácido pantoténico, B6, riboflavina y tiamina: signos y pruebas."}, {"num": "3.5", "title": "Minerales: calcio, magnesio y fósforo", "page": 60, "items": [], "summary": "Signos de hipocalcemia, hipomagnesemia e hipofosfatemia, incluida su relación con el síndrome de realimentación."}, {"num": "3.6", "title": "Oligoelementos", "page": 62, "items": ["c03_fluor", "c03_zinc"], "summary": "Cromo, cobre, flúor, yodo, hierro, manganeso, molibdeno, selenio y zinc."}], "block": "eval"}, {"num": 4, "title": "Evaluación de laboratorio del estado nutricional", "page": 66, "summary": "Explica las pruebas bioquímicas que confirman deficiencias subclínicas y monitorizan la respuesta al soporte nutricional: balance nitrogenado, proteínas séricas, ácidos grasos esenciales, inmunocompetencia y rangos de referencia pediátricos.", "sections": [{"num": "4.1", "title": "Papel del laboratorio en la evaluación nutricional", "page": 66, "items": [], "summary": "El laboratorio sirve para diagnosticar déficits subclínicos, confirmar la malnutrición y tener una línea de base."}, {"num": "4.2", "title": "Balance nitrogenado", "page": 66, "items": ["c04_balance_nitrogenado"], "summary": "Cálculo y significado del balance positivo o negativo; los niños deben estar en balance positivo."}, {"num": "4.3", "title": "Proteínas séricas y respuesta de fase aguda", "page": 67, "items": ["c04_fase_aguda"], "summary": "Proteínas hepáticas como marcadores del estado proteico y su alteración con infección o catabolismo."}, {"num": "4.4", "title": "Albúmina", "page": 67, "items": ["c04_albumina"], "summary": "Marcador más usado pero poco sensible; buen predictor de morbimortalidad en hospitalizados."}, {"num": "4.5", "title": "Prealbúmina, proteína transportadora de retinol y transferrina", "page": 68, "items": [], "summary": "Proteínas de vida media corta (prealbúmina 2 días, RBP 12 horas, transferrina 8 días), más sensibles a la repleción y con factores que las alteran."}, {"num": "4.6", "title": "Otras proteínas: IGF-1 y fibronectina", "page": 69, "items": [], "summary": "IGF-1 se correlaciona con el balance nitrogenado; la fibronectina se ha usado como marcador de repleción."}, {"num": "4.7", "title": "Ácidos grasos esenciales", "page": 70, "items": ["c04_triene_tetraene"], "summary": "Causas clínicas del déficit de ácido linoleico y linolénico y su diagnóstico bioquímico."}, {"num": "4.8", "title": "Recuento de linfocitos e hipersensibilidad cutánea", "page": 70, "items": ["c04_rtl"], "summary": "Hemograma, recuento total de linfocitos y anergia cutánea como medidas inespecíficas de inmunocompetencia."}, {"num": "4.9", "title": "Rangos normales de laboratorio nutricional", "page": 71, "items": [], "summary": "Valores pediátricos de referencia por edad y sexo (Tabla 4-2): proteínas, minerales, vitaminas, hemoglobina, VCM, entre otros."}], "block": "eval"}, {"num": 5, "title": "Requerimientos nutricionales: ingestas dietéticas de referencia (DRI)", "page": 77, "summary": "Define los cuatro valores de las DRI (RDA, EAR, AI, UL) y reúne las tablas de recomendaciones de nutrientes y energía por edad, sexo, embarazo y lactancia, que sirven de patrón para evaluar y planificar la dieta.", "sections": [{"num": "5.1", "title": "Concepto de DRI: RDA y EAR", "page": 77, "items": ["c05_componentes_dri"], "summary": "Las DRI reemplazan a las RDA clásicas; definición de RDA y requerimiento promedio estimado."}, {"num": "5.2", "title": "RDA de 1989", "page": 78, "items": ["c05_equivalencias"], "summary": "Tabla de aportes recomendados de 1989 con pesos y tallas de referencia (Tabla 5-1)."}, {"num": "5.3", "title": "Ingesta adecuada, nivel máximo tolerable y grupos del proyecto DRI", "page": 80, "items": ["c05_ul"], "summary": "Definiciones de AI y UL y los siete grupos de nutrientes en que se dividió el proyecto."}, {"num": "5.4", "title": "Ingestas seguras y adecuadas de vitaminas y oligoelementos", "page": 81, "items": [], "summary": "Rangos de biotina, ácido pantoténico, cobre, manganeso, flúor, cromo y molibdeno (Tabla 5-2)."}, {"num": "5.5", "title": "Requerimientos mínimos de sodio, cloro y potasio", "page": 82, "items": [], "summary": "Necesidades mínimas de electrolitos por edad en personas sanas (Tabla 5-3)."}, {"num": "5.6", "title": "Pesos y tallas medianos y aporte energético recomendado", "page": 82, "items": ["c05_energia_por_kg"], "summary": "Gasto energético en reposo y energía recomendada por kg y por día según edad y sexo (Tabla 5-4)."}, {"num": "5.7", "title": "DRI actuales para calcio, vitamina D, vitaminas B y colina", "page": 84, "items": ["c05_acido_folico"], "summary": "Tabla DRI con RDA y AI por grupo de edad, embarazo y lactancia, y sus notas sobre equivalentes (Tabla 5-5)."}], "block": "eval"}, {"num": 6, "title": "Lactancia materna", "page": 86, "summary": "Guía práctica para iniciar, evaluar y sostener la lactancia materna: beneficios para el lactante y la madre, pasos de apoyo, valoración de la díada con LATCH, extracción y conservación de la leche, problemas frecuentes y contraindicaciones.", "sections": [{"num": "6.1", "title": "Beneficios de la lactancia materna", "page": 86, "items": [], "summary": "Ventajas nutricionales, inmunológicas, fisiológicas, psicológicas, maternas y socioeconómicas; recomendación de lactancia exclusiva los primeros 6 meses y continuarla con alimentación complementaria al menos el primer año."}, {"num": "6.2", "title": "Pasos para una lactancia exitosa", "page": 90, "items": [], "summary": "Preparación prenatal, inicio en la primera hora, tomas a demanda (8–12 al día), posición y agarre, causas de baja producción, seguimiento tras el alta y regreso al trabajo."}, {"num": "6.3", "title": "Promoción: Iniciativa Hospital Amigo del Niño", "page": 93, "items": [], "summary": "Declaració
