<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Powders como grafo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-x:auto;white-space:nowrap}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Super Powders como grafo", "subtitle": "Katrine van Wyk (2018) · 25 adaptógenos y hongos, 10 superpolvos y 47 recetas, con alertas de evidencia", "itemLabel": "Polvo o concepto", "itemLabelPlural": "Polvos y conceptos", "resourceLabel": "Glosario", "resourceLabelPlural": "Glosario", "searchHint": "Buscar: ashwagandha, cortisol, Golden Latte…"}, "blocks": {"fund": {"name": "Fundamentos (Parte I)", "color": "#A05A3C"}, "hong": {"name": "Hongos medicinales", "color": "#6B5B95"}, "raiz": {"name": "Raíces, hierbas y hojas", "color": "#4E8A5B"}, "baya": {"name": "Bayas, polen y perla", "color": "#B8475E"}, "otros": {"name": "Otros superpolvos", "color": "#3F6FA0"}, "rec": {"name": "Recetas (Parte III)", "color": "#B08A2E"}}, "chapters": [{"num": 0, "title": "Prólogo e introducción", "block": "fund", "summary": "Frank Lipman, médico de medicina funcional, presenta los adaptógenos como apoyo para el sistema suprarrenal y la autora explica por qué escribió el libro.", "sections": [{"num": "0.1", "title": "Prólogo de Frank Lipman", "items": ["c_absorcion_grasa"], "summary": "Compara los adaptógenos con un termostato y defiende tomarlos en comidas con grasa en lugar de cápsulas."}, {"num": "0.2", "title": "Introducción", "summary": "La autora presenta 25 raíces, hongos y hierbas como ayudas suaves para el estrés y anima a experimentar con ellas."}]}, {"num": 1, "title": "Por qué necesitamos adaptógenos", "block": "fund", "summary": "Explica la respuesta de estrés y cómo el estrés crónico de la vida moderna afecta la salud; la autora cuenta su propia experiencia de agotamiento.", "sections": [{"num": "1.1", "title": "La respuesta de estrés, antes y ahora", "items": ["c_respuesta_estres"], "summary": "Adrenalina y cortisol ante un tigre o ante un jefe: la reacción es la misma y, si no se apaga, enferma."}, {"num": "1.2", "title": "La experiencia de la autora", "items": ["c_fatiga_suprarrenal"], "summary": "Su recuperación de lo que llama fatiga suprarrenal y su trabajo con Frank Lipman."}, {"num": "1.3", "title": "Prevención y diagnóstico médico", "summary": "Pide buscar un diagnóstico profesional y no esperar una sola solución para todos."}]}, {"num": 2, "title": "Qué son los adaptógenos", "block": "fund", "summary": "Define los adaptógenos, repasa su uso en el ayurveda y la medicina china, el origen soviético del término y los beneficios que el libro les atribuye.", "sections": [{"num": "2.1", "title": "Definición", "items": ["c_adaptogeno"], "summary": "Plantas que ayudan al cuerpo a adaptarse al estrés modulando las hormonas suprarrenales, sin ser estimulantes."}, {"num": "2.2", "title": "Sabiduría tradicional", "summary": "Uso como hierbas tónicas en el ayurveda y en las medicinas china, tibetana y nativa americana."}, {"num": "2.3", "title": "Ciencia moderna", "summary": "Investigación soviética a mediados del siglo XX con schisandra y otras plantas para pilotos y tripulaciones; uso en China junto a la quimioterapia."}, {"num": "2.4", "title": "Cómo actúan", "items": ["c_modulacion_hpa"], "summary": "Efecto inmediato y a largo plazo sobre el eje del estrés y la inmunidad, con una lista de 17 beneficios posibles."}, {"num": "2.5", "title": "Alimentos reales y enteros", "summary": "Los polvos como alimentos enteros deshidratados que suman variedad de plantas a la dieta."}]}, {"num": 3, "title": "Cómo encontrar tu adaptógeno", "block": "fund", "summary": "Método para elegir: definir el objetivo, probar un polvo a la vez y orientarse con una guía rápida y perfiles de persona.", "sections": [{"num": "3.1", "title": "Prueba y observación", "items": ["c_una_a_la_vez"], "summary": "Empezar con dosis bajas, esperar semanas y escuchar las señales del cuerpo."}, {"num": "3.2", "title": "Guía rápida para elegir", "items": ["c_estim_calm"], "summary": "Clasificación en estimulantes, calmantes, para jóvenes sanos y para personas agotadas."}, {"num": "3.3", "title": "Encuentra tu perfil", "summary": "Sugerencias por situación: estudiante, madre reciente, viajero, insomne, deportista, ánimo bajo, belleza, alergias y otros."}]}, {"num": 4, "title": "Qué saber antes de empezar", "block": "fund", "summary": "Reglas de seguridad y de uso en el tiempo: consulta médica, embarazo, lactancia, niños, rotación y pausas.", "sections": [{"num": "4.1", "title": "Tomar adaptógenos con seguridad", "items": ["c_seguridad"], "summary": "Consideradas seguras y no adictivas por el libro, con excepciones en embarazo, inmunosupresión y medicamentos."}, {"num": "4.2", "title": "Bueno saber", "items": ["c_rotacion"], "summary": "Rotar, descansar, combinar y recordar que no sustituyen el descanso ni la buena comida."}]}, {"num": 5, "title": "Suprarrenales, respuesta de estrés y estrés crónico", "block": "fund", "summary": "Fisiología básica del eje del estrés y cómo el estrés sostenido afecta el ánimo y el sueño.", "sections": [{"num": "5.1", "title": "Las glándulas suprarrenales y el eje HPA", "items": ["c_eje_hpa"], "summary": "Dónde están las suprarrenales, qué secretan y cómo trabajan con el hipotálamo y la hipófisis."}, {"num": "5.2", "title": "Del estrés útil al estrés crónico", "items": ["c_estres_cronico"], "summary": "El cortisol es necesario, pero alto de forma sostenida se asocia con muchos problemas de salud."}, {"num": "5.3", "title": "Ánimo", "summary": "Cómo la alimentación y los adaptógenos influirían en el estado de ánimo y la reacción al estrés."}, {"num": "5.4", "title": "Sueño", "items": ["c_ritmo_cortisol"], "summary": "Ritmo circadiano, luz y pantallas; los adaptógenos no hacen dormir como un fármaco, pero ayudarían a relajarse."}]}, {"num": 6, "title": "Hongos medicinales", "block": "hong", "summary": "Los cinco hongos del libro: chaga, cordyceps, melena de león, reishi y cola de pavo, con sus usos, precauciones y recetas.", "sections": [{"num": "6.1", "title": "Chaga", "items": ["chaga"], "summary": "Según el libro: estimula la inmunidad cuando está baja y la frena en alergias, aporta antioxidantes y combate la fatiga. Solo da la precaución general sobre medicamentos. Recetas que lo usan: 2."}, {"num": "6.2", "title": "Cordyceps", "items": ["cordyceps"], "summary": "Según el libro: apoya el sistema endocrino, mejora el rendimiento deportivo y el aclaramiento de lactato, y ayuda a concentrarse. Advierte que en exceso podría debilitar la inmunidad. Recetas que lo usan: 5."}, {"num": "6.3", "title": "Melena de león", "items": ["melena_leon"], "summary": "Según el libro: contiene factores de crecimiento nervioso con interés para Alzheimer y Parkinson, y betaglucanos para el corazón y la inmunidad. Solo da la precaución general. Recetas que lo usan: 3."}, {"num": "6.4", "title": "Reishi", "items": ["reishi"], "summary": "Según el libro: relaja el sistema nervioso, protege el ADN y las mitocondrias, apoya el hígado y tiene actividad antitumoral en estudios. Advierte alergia a hongos y anticoagulantes. Recetas que lo usan: 12."}, {"num": "6.5", "title": "Cola de pavo", "items": ["cola_pavo"], "summary": "Según el libro: refuerza la resistencia a infecciones, alimenta la microbiota y contiene betaglucanos. Solo da la precaución general. No aparece en ninguna receta."}]}, {"num": 7, "title": "Raíces, hierbas y hojas", "block": "raiz", "summary": "Trece adaptógenos de raíz, semilla u hoja, de la ashwagandha a la ashitaba, con lo que el libro afirma de cada uno y sus precauciones.", "sections": [{"num": "7.1", "title": "Ashwagandha", "items": ["ashwagandha"], "summary": "Según el libro: regula el cortisol, estimula la tiroides, aporta hierro para la anemia y apoya la lactancia. Advierte evitarla en embarazo, con inmunosupresores, sedantes, úlcera y enfermedades autoinmunes. Recetas que lo usan: 13."}, {"num": "7.2", "title": "Astrágalo", "items": ["astragalo"], "summary": "Según el libro: estimula la telomerasa y así repara ADN y frena el envejecimiento. Advierte no usarlo con fiebre, inmunosupresores, anticoagulantes, diabetes, hipertensión, embarazo ni lactancia. Recetas que lo usan: 10."}, {"num": "7.3", "title": "Eleutero (ginseng siberiano)", "items": ["eleutero"], "summary": "Según el libro: aumenta la resistencia y la recuperación, mejora el sueño y la alerta. Recomienda ciclos (un mes sí, dos no) y evitarlo con presión alta. Recetas que lo usan: 1."}, {"num": "7.4", "title": "He Shou Wu", "items": ["he_shou_wu"], "summary": "Según el libro: devuelve el color al pelo, favorece hígado y vesícula y alarga la vida en animales. Solo advierte diarrea a dosis altas y consultar si se toman estatinas. Recetas que lo usan: 4."}, {"num": "7.5", "title": "Albahaca sagrada (tulsi)", "items": ["tulsi"], "summary": "Según el libro: efecto calmante inmediato, antiinflamatorio y antimicrobiano. Advierte que es diurética leve y que reduce la fertilidad masculina. Recetas que lo usan: 1."}, {"num": "7.6", "title": "Regaliz", "items": ["regaliz"], "summary": "Según el libro: calma la hinchazón y la inflamación intestinal. Advierte evitarlo en embarazo, hipertensión, cardiopatía, edema, potasio bajo o enfermedad hepática, y no superar la dosis del envase. No aparece en recetas."}, {"num": "7.7", "title": "Maca", "items": ["maca"], "summary": "Según el libro: mejora la libido y el recuento de espermatozoides, aporta yodo y minerales; roja para mujeres, negra para hombres. Advierte bociógenos si hay enfermedad tiroidea y aflatoxinas en maca mal secada; prefiere la gelatinizada. Recetas que lo usan: 6."}, {"num": "7.8", "title": "Moringa", "items": ["moringa"], "summary": "Según el libro: aporta proteína, hierro, vitaminas A, B6 y C, triptófano y ácidos que controlan la glucemia. Advierte comprar solo hoja: la raíz puede ser tóxica. Recetas que lo usan: 3."}, {"num": "7.9", "title": "Mucuna", "items": ["mucuna"], "summary": "Según el libro: psicoactiva pero no adictiva, aumenta la dopamina, estimula la hormona de crecimiento y baja la prolactina. Recomienda tomarla en ciclos y lejos de las comidas. Recetas que lo usan: 9."}, {"num": "7.10", "title": "Ginseng asiático", "items": ["ginseng"], "summary": "Según el libro: previene el deterioro cognitivo, normaliza la inmunidad y estabiliza el azúcar. Advierte que puede empeorar insomnio, hipertensión y ansiedad. No aparece en recetas."}, {"num": "7.11", "title": "Rhodiola", "items": ["rhodiola"], "summary": "Según el libro: baja el cortisol, sube la serotonina, mejora la oxigenación cerebral y tiene efecto antidepresivo. Advierte que puede causar insomnio. Recetas que lo usan: 6."}, {"num": "7.12", "title": "Shatavari", "items": ["shatavari"], "summary": "Según el libro: contiene precursores de progesterona, equilibra el cortisol y aumenta la producción de leche. Advierte no usarla con antecedente de cáncer con receptores de estrógeno. No aparece en recetas."}, {"num": "7.13", "title": "Ashitaba", "items": ["ashitaba"], "summary": "Según el libro: es fuente vegetal de vitaminas B6 y B12 y estimula el factor de crecimiento nervioso. Solo da la precaución general. Recetas que lo usan: 1."}]}, {"num": 8, "title": "Bayas, polen y perla", "block": "baya", "summary": "Siete polvos de frutos, polen y perla que el libro usa sobre todo para la piel, la belleza y el corazón.", "sections": [{"num": "8.1", "title": "Amla (grosella india)", "items": ["amla"], "summary": "Según el libro: antioxidante y antiinflamatoria, equilibra el moco intestinal y es laxante suave (forma parte del triphala). Advierte que sus taninos reducen la absorción de hierro y fármacos: separarla 4 horas. Recetas que lo usan: 2."}, {"num": "8.2", "title": "Goji", "items": ["goji"], "summary": "Según el libro: aporta vitamina C y los nueve aminoácidos esenciales. Advierte evitarla con warfarina y algunos fármacos para diabetes y presión, y si hay sensibilidad a solanáceas. Recetas que lo usan: 5."}, {"num": "8.3", "title": "Espino blanco (hawthorn)", "items": ["espino"], "summary": "Según el libro: es muy segura incluso en niños, pero no en embarazo ni lactancia, y como suplemento solo a corto plazo. Recetas que lo usan: 3."}, {"num": "8.4", "title": "Schisandra", "items": ["schisandra"], "summary": "Según el libro: equilibra el sistema endocrino, estabiliza la presión en ambos sentidos y calma. Advierte evitarla con úlcera, gastritis o acidez, y en embarazo y lactancia. Recetas que lo usan: 4."}, {"num": "8.5", "title": "Espino amarillo (sea buckthorn)", "items": ["espino_amarillo"], "summary": "Según el libro: antienvejecimiento, puede ayudar a bajar de peso y se usó para resfriados. Advierte que puede bajar la presión y retrasar la coagulación. Recetas que lo usan: 3."}, {"num": "8.6", "title": "Polen de pino", "items": ["polen_pino"], "summary": "Según el libro: es la única planta con DHEA y debe absorberse bajo la lengua para dar el efecto androgénico. Advierte alergia al polen y no pasar de la dosis recomendada. Recetas que lo usan: 4."}, {"num": "8.7", "title": "Perla en polvo", "items": ["perla"], "summary": "Según el libro: estimula el colágeno y aporta calcio. Advierte usar solo perla de uso interno y no exceder la dosis porque en cantidad enferma. Recetas que lo usan: 8."}]}, {"num": 9, "title": "Otros superpolvos y cómo comprarlos", "block": "otros", "summary": "Diez polvos que no son adaptógenos pero acompañan las recetas, y los criterios del libro para comprar polvos de calidad.", "sections": [{"num": "9.1", "title": "Baobab", "items": ["baobab"], "summary": "No es adaptógeno. Según el libro: la mitad del polvo es fibra prebiótica que frena la respuesta de insulina. Recetas que lo usan: 2."}, {"num": "9.2", "title": "Remolacha", "items": ["remolacha"], "summary": "No es adaptógeno. Según el libro: antioxidante y antiinflamatoria, con vitaminas B, calcio y hierro. Recetas que lo usan: 3."}, {"num": "9.3", "title": "Blue Majik (espirulina azul)", "items": ["blue_majik"], "summary": "No es adaptógeno. Según el libro: proteína completa y fuente de vitaminas B para la energía. Recetas que lo usan: 5."}, {"num": "9.4", "title": "Cacao en polvo", "items": ["cacao"], "summary": "No es adaptógeno. Recetas que lo usan: 11."}, {"num": "9.5", "title": "Carbón activado", "items": ["carbon"], "summary": "No es adaptógeno. El libro advierte separarlo dos horas de medicamentos, vitaminas y comidas porque los adsorbe. Recetas que lo usan: 2."}, {"num": "9.6", "title": "Clorela", "items": ["clorela"], "summary": "No es adaptógeno. Recomienda la de pared celular rota para mejor absorción. Recetas que lo usan: 2."}, {"num": "9.7", "title": "Canela", "items": ["canela"], "summary": "No es adaptógeno. El libro solo advierte evitar cantidades grandes con anticoagulantes. Recetas que lo usan: 17."}, {"num": "9.8", "title": "Colágeno hidrolizado", "items": ["colageno"], "summary": "No es adaptógeno ni vegetal: es de origen bovino o marino. Recetas que lo usan: 9."}, {"num": "9.9", "title": "Matcha", "items": ["matcha"], "summary": "No es adaptógeno. Según el libro: menos ácido que el café, baja glucemia y colesterol y desintoxica por la clorofila. Recetas que lo usan: 5."}, {"num": "9.10", "title": "Cúrcuma", "items": ["curcuma"], "summary": "No es adaptógeno. Según el libro: apoya el hígado, el cerebro y las articulaciones gracias a la curcumina. Recetas que lo usan: 8."}, {"num": "9.11", "title": "Cómo comprar polvos de calidad", "items": ["c_calidad"], "summary": "Formas de venta, etiquetas, certificaciones, compra a granel y marcas que menciona la autora."}]}, {"num": 10, "title": "Lattes y bebidas", "block": "rec", "summary": "Leches vegetales de base y 13 lattes y chocolates calientes con polvos.", "sections": [{"num": "10.1", "title": "Despensa y utensilios", "summary": "Ingredientes básicos (frutos secos, coco, cacao, especias, endulzantes) y utensilios como licuadora y espumador."}, {"num": "10.2", "title": "La base: leches vegetales", "summary": "Leche de coco, de cáñamo y de almendra, nuez, avellana o anacardo, y cómo convertir cualquiera en latte adaptógeno."}, {"num": "10.3", "title": "Beauty Chai", s. Polvos: Reishi, Espino blanco (hawthorn), Schisandra, Perla en polvo, Blue Majik (espirulina azul).", "page": 158}, {"num": "13.2", "title": "Overnight Chia Oats", "summary": "Para: digestión, piel, energía estable. Polvos: Goji, Espino amarillo (sea buckthorn), Canela.", "page": 161}, {"num": "13.3", "title": "Adaptogenic Nut-Granola", "summary": "Para: resistencia, energía estable, brillo de la piel. Polvos: Ashwagandha, Canela, Colágeno hidrolizado.", "page": 163}, {"num": "13.4", "title": "Matcha Milkshake", "summary": "Para: piel, energía. Polvos: Cordyceps, Reishi, Colágeno hidrolizado, Matcha.", "page": 164}, {"num": "13.5", "title": "Golden Sunrise Shake", "summary": "Para: antiinflamatorio, digestión, comida reconfortante. Polvos: Astrágalo, Canela, Cúrcuma.", "page": 165}, {"num": "13.6", "title": "Blue Against Blues", "summary": "Para: energía, belleza, libido. Polvos: Astrágalo, Polen de pino, Perla en polvo, Blue Majik (espirulina azul), Colágeno hidrolizado.", "page": 168}, {"num": "13.7", "title": "Love the Skin You’re In", "summary": "Para: piel, hidratación, brillo. Polvos: Schisandra, Espino amarillo (sea buckthorn), Colágeno hidrolizado.", "page": 169}, {"num": "13.8", "title": "Raspberry Chia Jam", "summary": "Para: antioxidantes, belleza, piel. Polvos: Espino amarillo (sea buckthorn), Perla en polvo, Baobab.", "page": 170}], "page": 158}, {"num": 14, "title": "Caldos, salsas y mezclas", "block": "rec", "summary": "Aderezos, caldos de hongos y de huesos, miel adaptógena y mezcla de leche dorada.", "sections": [{"num": "14.1", "title": "Green Goddess Dressing or Dip", "summary": "Para: desintoxicación, energía, inmunidad. Polvos: Moringa, Ashitaba, Clorela.", "page": 173}, {"num": "14.2", "title": "Carrot Ginger Dressing with Magic Mushrooms", "summary": "Para: digestión, antioxidantes, inmunidad. Polvos: Cordyceps, Melena de león, Reishi.", "page": 175}, {"num": "14.3", "title": "Mushroom Broth", "summary": "Para: enraizamiento, antiinflamatorio, concentración. Polvos: Chaga, Cordyceps, Melena de león, Reishi, Cúrcuma.", "page": 177}, {"num": "14.4", "title": "Pumped-Up Bone Broth with Turmeric, Ginger, and Ghee", "summary": "Para: piel, recuperación, inmunidad. Polvos: Reishi, Astrágalo, Cúrcuma.", "page": 179}, {"num": "14.5", "title": "Adaptogenic Honey", "summary": "Para: ánimo, estrés, protección. Polvos: Ashwagandha, Astrágalo, Mucuna, Rhodiola.", "page": 180}, {"num": "14.6", "title": "Golden Milk Powder Blend", "summary": "Para: antiinflamatorio, digestión, calma. Polvos: Ashwagandha, Canela, Cúrcuma.", "page": 181}], "page": 173}], "items": {"c_respuesta_estres": {"title": "Respuesta aguda de estrés", "formula": "Amenaza → adrenalina + cortisol → lucha o huida → se apaga", "summary": "Reacción de las suprarrenales que prepara el cuerpo para huir o pelear y que, en condiciones normales, se apaga al pasar el peligro."}, "c_fatiga_suprarrenal": {"title": "\"Fatiga suprarrenal\"", "summary": "Agotamiento atribuido a suprarrenales exhaustas por estrés crónico; la autora cuenta que lo vivió y lo usa como marco del libro.", "caution": "Superada. La revisión sistemática de Cadegiani y Kater (2016, 58 estudios) concluyó que no hay base para considerarla una condición médica real, y la Endocrine Society (2022) afirma que no existe prueba científica ni prueba diagnóstica válida."}, "c_absorcion_grasa": {"title": "Tomar los polvos con grasa", "formula": "Polvo + grasa saludable (frutos secos, semillas, coco, ghee)", "summary": "Idea del prólogo, que retoma el libro: muchos adaptógenos se absorben mejor con grasa, por eso las recetas la incluyen."}, "c_adaptogeno": {"title": "Adaptógeno", "summary": "Planta u hongo que ayuda al cuerpo a adaptarse al estrés sin el subidón y la caída de la cafeína o el azúcar; el libro afirma que es seguro casi por definición.", "caution": "Imprecisa. El libro presenta el enfoque como ya aceptado, pero la EMA (documento de reflexión del HMPC, 2008) no acepta el término \"adaptógeno\" en la terminología clínica de la UE y señala deficiencias en los datos clínicos; Panossian y Wikman (2010) lo defienden con base en mecanismos y ensayos pequeños. Ser \"adaptógeno\" no garantiza seguridad."}, "c_modulacion_hpa": {"title": "Efecto \"termostato\" sobre el estrés", "formula": "Si hay agotamiento → energía · si hay ansiedad → calma", "summary": "Idea central del libro: el mismo adaptógeno regula en ambas direcciones el eje del estrés y la inmunidad según lo que el cuerpo necesite."}, "c_estim_calm": {"title": "Estimulantes y calmantes", "formula": "Estimulantes: ginseng asiático, rhodiola · Calmantes: ashwagandha, cordyceps, reishi, schisandra", "summary": "Guía rápida del libro para elegir: unos adaptógenos activan y otros calman; también separa los indicados para jóvenes sanos y para personas agotadas."}, "c_una_a_la_vez": {"title": "Empezar con uno y en dosis baja", "formula": "1 polvo · dosis baja · al menos 2 semanas antes de cambiar", "summary": "Método del libro para encontrar el adaptógeno propio: probar de a uno, observar la respuesta y suspender si da insomnio, ansiedad o diarrea."}, "c_seguridad": {"title": "Precauciones generales", "formula": "Consultar al médico si hay medicación · evitar en embarazo · no con inmunosupresores", "summary": "Reglas de seguridad del libro; añade que en la lactancia se consideran en general seguros y que algunos sirven para niños.", "caution": "Sin evidencia en humanos para la lactancia. LactMed (NIH) no tiene datos sobre la ashwagandha en la leche y recomienda evitarla, y dice que la seguridad del shatavari no se ha estudiado con rigor; para el ginseng no hay estudios en lactancia (Seely 2008). Varios polvos del libro tienen riesgos hepáticos o interacciones no mencionados: ver cada ficha."}, "c_rotacion": {"title": "Uso regular, rotación y pausas", "formula": "6–8 semanas de uso regular · rotar cada par de meses · descanso 1 día/semana o 1 semana/mes", "summary": "Pauta del libro para tomar adaptógenos en el tiempo; combinar varios se presenta como seguro y a menudo recomendable."}, "c_eje_hpa": {"title": "Eje hipotálamo-hipófisis-suprarrenal", "formula": "Hipotálamo → hipófisis → suprarrenales → cortisol", "summary": "Sistema que regula la respuesta al estrés; el libro explica su ritmo diario y su relación con el cortisol."}, "c_estres_cronico": {"title": "Estrés crónico", "formula": "Cortisol alto sostenido → glucemia, grasa abdominal, mal sueño, ánimo bajo", "summary": "Cuando la respuesta de estrés no se apaga; el libro la vincula con resistencia a la insulina, colesterol, aumento de peso, depresión y problemas de tiroides."}, "c_ritmo_cortisol": {"title": "Ritmo diario del cortisol", "formula": "Alto al despertar → desciende a lo largo del día", "summary": "El cortisol sigue la luz y la oscuridad; según el libro, el estrés lo eleva de noche y dificulta dormir."}, "c_calidad": {"title": "Calidad y origen de los polvos", "formula": "Orgánico o silvestre · sin pesticidas · un solo ingrediente en la etiqueta", "summary": "Criterios del libro para comprar adaptógenos: origen certificado, comercio justo y etiquetas sin rellenos."}, "chaga": {"title": "Chaga", "formula": "Inonotus obliquus · hongo del abedul", "summary": "Hongo de los abedules que el libro presenta como inmunomodulador rico en betaglucanos y como sustituto del café en viajes.", "caution": "Riesgo omitido. Hay casos de nefropatía por oxalato con consumo prolongado de polvo de chaga, uno con insuficiencia renal terminal (Kikuchi 2014; Lee 2020; Kwon 2022). Sus efectos sobre glucemia y plaquetas solo están descritos en células y ratones (Memorial Sloan Kettering, 2023)."}, "cordyceps": {"title": "Cordyceps", "formula": "Ophiocordyceps sinensis / Cordyceps militaris · hongo", "summary": "Hongo del Himalaya que el libro recomienda para resistencia física y mental, inmunidad, glucemia y energía sexual.", "caution": "Debatida. Los ensayos en humanos son pocos, pequeños e inconsistentes: mejora del umbral de lactato en adultos mayores (Chen 2010) o con una mezcla de hongos (Hirsch 2016), y ningún efecto en ciclistas (Colson 2005)."}, "melena_leon": {"title": "Melena de león", "formula": "Hericium erinaceus · hongo", "summary": "Hongo comestible que el libro asocia con regeneración de tejido nervioso, memoria, concentración y menos ansiedad y depresión.", "caution": "Sin evidencia en humanos para el cerebro. La regeneración nerviosa y el uso en Alzheimer o Parkinson vienen de estudios en células y animales; en personas solo hay ensayos pequeños, como Mori 2009 (n = 30, la mejora desapareció al suspenderlo) y Nagano 2010 (n = 30, ansiedad y depresión, preliminar)."}, "reishi": {"title": "Reishi", "formula": "Ganoderma lucidum · hongo", "summary": "El \"hongo de la inmortalidad\": el libro lo recomienda para calmar, dormir, alergias estacionales, inmunidad y como posible antitumoral.", "caution": "Imprecisa. La revisión Cochrane de Jin et al. (2016) no halló evidencia suficiente para usarlo contra el cáncer ni para afirmar que prolongue la supervivencia; a lo sumo como complemento. Hay casos de hepatitis con reishi en polvo, uno mortal (Wanmuang 2007)."}, "cola_pavo": {"title": "Cola de pavo", "formula": "Trametes versicolor · hongo", "summary": "Hongo de troncos muertos que el libro propone para la inmunidad, el intestino (prebiótico) y como apoyo durante la quimioterapia.", "caution": "Imprecisa. La evidencia es del extracto farmacéutico PSK, no del polvo: un metaanálisis halló mejor supervivencia con PSK añadido a la quimioterapia en cáncer colorrectal operado (Sakamoto 2005), y Cochrane (Pilkington 2022) califica la certeza de baja."}, "ashwagandha": {"title": "Ashwagandha", "formula": "Withania somnifera · raíz", "summary": "Raíz ayurvédica calmante que el libro recomienda para el estrés, el sueño, la libido, la tiroides y las madres recientes.", "caution": "Riesgo omitido. Metaanálisis en humanos muestran menos estrés y ansiedad (Akhgarjand 2022, certeza baja; Arumugam 2024), pero el libro no menciona el daño hepático con ictericia (serie de Björnsson 2020) ni casos de tirotoxicosis; Dinamarca la retiró de los complementos en 2023. Nada respalda su uso para la anemia."}, "astragalo": {"title": "Astrágalo", "formula": "Astragalus membranaceus · raíz", "summary": "Raíz de la medicina china que el libro usa como tónico general para inmunidad, corazón, digestión y longevidad.", "caution": "Imprecisa. Los estudios en humanos con derivados del astrágalo (TA-65, cicloastragenol) solo miden la longitud de los telómeros en sangre, son pocos y el principal tiene autores ligados al fabricante (Salvador 2016). No hay pruebas de que repare el ADN ni retrase el envejecimiento."}, "eleutero": {"title": "Eleutero (ginseng siberiano)", "formula": "Eleutherococcus senticosus · raíz", "summary": "El primer vegetal clasificado como adaptógeno; el libro lo recomienda para resistencia, rendimiento deportivo, alerta y defensas.", "caution": "Debatida. La EMA (monografía HMPC 2014) lo acepta solo por uso tradicional para el cansancio y considera no concluyentes los ensayos clínicos; los estudios sobre resistencia física se contradicen."}, "he_shou_wu": {"title": "He Shou Wu", "formula": "Reynoutria multiflora (Polygonum multiflorum) · raíz", "summary": "Raíz china de la longevidad que el libro recomienda contra las canas, para el hígado, la inmunidad y como tónico del espíritu.", "caution": "Riesgo omitido. LiverTox (NIH, 2020) lo clasifica como causa bien establecida de hepatitis aguda (categoría A), a veces grave, con muerte o trasplante en hasta un 10 % de los casos publicados. El libro solo advierte diarrea."}, "tulsi": {"title": "Albahaca sagrada (tulsi)", "formula": "Ocimum tenuiflorum · hoja", "summary": "Hierba sagrada de la India que el libro propone para calmarse por la noche, bajar el cortisol y la glucemia, y para asma y alergias.", "caution": "Imprecisa. La revisión de Jamshidi y Cohen (2017) halló resultados favorables sobre metabolismo y estrés, pero en estudios pequeños y heterogéneos. Lo de que reduce la fertilidad masculina proviene de estudios en ratas (Ahmed 2002), no en humanos."}, "regaliz": {"title": "Regaliz", "formula": "Glycyrrhiza glabra / G. uralensis · raíz", "summary": "Raíz armonizadora de fórmulas que el libro usa para el estómago, el colon irritable, la \"fatiga suprarrenal\" y el cansancio.", "caution": "Respaldada. Sus advertencias coinciden con la evidencia: la glicirricina produce seudohiperaldosteronismo, con hipertensión e hipopotasemia (Ceccuzzi 2023), y la FDA alertó en 2017 sobre arritmias en mayores de 40 años. No tiene base su uso para la \"fatiga suprarrenal\"."}, "maca": {"title": "Maca", "formula": "Lepidium meyenii · raíz (hipocótilo)", "summary": "Tubérculo andino que el libro recomienda para libido, fertilidad, menopausia, ánimo y energía.", "caution": "Debatida. Las revisiones sistemáticas sobre función sexual (Shin 2010), menopausia (Lee 2011) y semen (Lee 2016; Lee 2022) encuentran evidencia limitada o nula, con ensayos pocos, pequeños y con riesgo de sesgo."}, "moringa": {"title": "Moringa", "formula": "Moringa oleifera · hoja", "summary": "Hoja muy nutritiva que el libro propone para la ansiedad, la digestión, la glucemia, la lactancia y la piel.", "caution": "Respaldada. La precaución con la raíz es razonable por sus alcaloides tóxicos, aunque los datos son casi todos de animales (Canett-Romero 2014); el efecto de la hoja sobre la glucemia es alentador pero con pocos estudios en humanos (Nova 2020)."}, "mucuna": {"title": "Mucuna", "formula": "Mucuna pruriens · semilla (frijol terciopelo)", "summary": "Semilla rica en L-dopa que el libro presenta como potenciador natural del ánimo, afrodisíaco y fortalecedor muscular.", "caution": "Riesgo omitido. Es una fuente real de levodopa, el fármaco del Parkinson (Katzenschlager 2004; Cilia 2017); un análisis de 16 suplementos halló de 2 a 241 mg por porción con etiquetas poco fiables (Cohen 2022, JAMA Neurology). Su uso sin supervisión médica puede causar discinesias y efectos psiquiátricos, y no conviene presentarla como potenciador cotidiano del ánimo."}, "ginseng": {"title": "Ginseng asiático", "formula": "Panax ginseng · raíz", "summary": "Uno de los adaptógenos estimulantes; el libro lo recomienda para memoria, aprendizaje, alerta, inmunidad y glucemia.", "caution": "Imprecisa. La revisión Cochrane de Geng 2010 no halló evidencia convincente de mejora cognitiva en personas sanas ni de calidad en demencia. Con warfarina conviene vigilar el INR: el ginseng americano redujo su efecto (Yuan 2004)."}, "rhodiola": {"title": "Rhodiola", "formula": "Rhodiola rosea · raíz", "summary": "Raíz ártica que el libro llama \"la mejor amiga del atleta\": rendimiento, recuperación, memoria, ánimo y fatiga.", "caution": "Debatida. La EMA (HMPC, 2023) la acepta solo por uso tradicional para el estrés pasajero, no más de 2 semanas sin consejo médico; las revisiones califican la evidencia de contradictoria (Ishaque 2012; Hung 2011) y los metaanálisis recientes discrepan sobre el rendimiento."}, "shatavari": {"title": "Shatavari", "formula": "Asparagus racemosus · raíz", "summary": "\"El adaptógeno de la mujer\" del ayurveda: libido, fertilidad, menopausia, leche materna y fatiga.", "caution": "Debatida. LactMed (NIH, 2025) describe resultados mixtos como galactogogo y seguridad poco estudiada; hay un ECA positivo de 2025 (n = 113). Lo de los \"precursores de progesterona\" solo se apoya en modelos por computadora."}, "ashitaba": {"title": "Ashitaba", "formula": "Angelica keiskei · hoja", "summary": "Hoja japonesa de la belleza y la longevidad que el libro propone para concentración, digestión y cicatrización.", "caution": "Imprecisa. Según la Oficina de Suplementos Dietéticos de los NIH (2024), los alimentos vegetales no contienen vitamina B12 salvo fortificación: la ashitaba no es fuente de B12 para veganos."}, "amla": {"title": "Amla (grosella india)", "formula": "Phyllanthus emblica · fruto", "summary": "Baya ayurvédica ácida, rica en vitamina C, que el libro usa para la digestión, la piel, el pelo y las defensas."}, "goji": {"title": "Goji", "formula": "Lycium barbarum · baya", "summary": "Baya china rica en carotenoides que el libro recomienda para la vista, la energía y la belleza.", "caution": "Respaldada. La advertencia con warfarina es correcta: hay al menos cuatro casos publicados de INR elevado, algunos con sangrado, tras consumir té, jugo o vino de goji (Lam 2001; Leung 2008; Rivera 2012; Zhang 2015)."}, "espino": {"title": "Espino blanco (hawthorn)", "formula": "Crataegus spp. · baya, hoja y flor", "summary": "Planta del corazón en la tradición; el libro la recomienda para prevenir la angina, bajar la presión, la inflamación y la menopausia.", "caution": "Imprecisa. Cochrane (Pittler, Guo y Ernst 2008) halló mejoría de síntomas como complemento en la insuficiencia cardíaca, pero el ensayo SPICE (Holubarsch 2008, n = 2681) no redujo los eventos cardíacos. No se confirmó que prevenga la angina ni que sea seguro en niños."}, "schisandra": {"title": "Schisandra", "formula": "Schisandra chinensis · baya", "summary": "La \"fruta de los cinco sabores\": el libro la usa para la piel, el hígado, las suprarrenales, la ansiedad y el rendimiento.", "caution": "Riesgo omitido. Un extracto de Schisandra sphenanthera aumentó un 164 % la exposición al inmunosupresor tacrolimus en voluntarios sanos (Xin 2007), por inhibición de CYP3A y glucoproteína P; para S. chinensis, la especie habitual, es una inferencia razonable."}, "espino_amarillo": {"title": "Espino amarillo (sea buckthorn)", "formula": "Hippophae rhamnoides · baya", "summary": "Baya naranja con omega-7 que el libro propone para la piel (incluida la psoriasis), el intestino y la inmunidad."}, "polen_pino": {"title": "Polen de pino", "formula": "Pinus spp. · polen", "summary": "Polen de pino que el libro presenta como afrodisíaco, equilibrador hormonal y \"reemplazo natural de testosterona\".", "caution": "Sin evidencia en humanos. El único análisis localizado halló solo nanogramos de andrógenos por gramo de polen (Saden-Krehula 1971) y no hay estudios en personas; la idea de un \"reemplazo natural de testosterona\" no tiene base."}, "perla": {"title": "Perla en polvo", "formula": "Perlas de agua dulce molidas", "summary": "Polvo de perla de la cosmética tradicional que el libro usa para piel, pelo, uñas y densidad ósea.", "caution": "Sin evidencia en humanos. No hay ensayos que muestren que la perla oral estimule el colágeno o fortalezca los huesos; solo un ECA sobre marcadores antioxidantes (Chiu 2017) y un piloto de calcio de concha que no superó al carbonato (Vujasinović-Stupar 2009)."}, "baobab": {"title": "Baobab", "formula": "Adansonia digitata · pulpa del fruto", "summary": "Fruto africano rico en fibra y vitamina C que el libro usa para moderar el azúcar, la digestión y como electrolito natural."}, "remolacha": {"title": "Remolacha", "formula": "Beta vulgaris · raíz", "summary": "Polvo de remolacha que el libro recomienda para el corazón, la bilis, la \"limpieza de la sangre\" y la recuperación deportiva."}, "blue_majik": {"title": "Blue Majik (espirulina azul)", "formula": "Extracto azul de espirulina", "summary": "Extracto azul de espirulina que el libro usa como colorante, antioxidante y antihistamínico.", "caution": "Imprecisa. Cerca del 83 % de los compuestos tipo B12 de la espirulina son pseudovitamina B12 inactiva (Watanabe 1999): no es fuente fiable de B12. Se han hallado microcistinas en suplementos de algas, sobre todo de Aphanizomenon."}, "cacao": {"title": "Cacao en polvo", "formula": "Theobroma cacao · semilla", "summary": "Cacao crudo rico en antioxidantes y magnesio, con algo de cafeína, que el libro usa para el ánimo."}, "carbon": {"title": "Carbón activado", "formula": "Carbón vegetal activado", "summary": "Polvo negro que el libro propone para prevenir la resaca, aliviar gases e hinchazón y \"desintoxicar\".", "caution": "Imprecisa. No previene la resaca: 60 g de carbón no redujeron la alcoholemia (Katona 1989). Para los gases, la UE solo autoriza la declaración con 1 g antes y 1 g después de comer (EFSA 2011) y los ensayos se contradicen."}, "clorela": {"title": "Clorela", "formula": "Chlorella vulgaris · alga unicelular", "summary": "Alga verde rica en clorofila y proteína que el libro recomienda para desintoxicar, la energía y las hormonas.", "caution": "Matiz. A diferencia de la espirulina, los comprimidos de clorela analizados sí tenían B12 verdadera (Watanabe 2002). Se han hallado cianotoxinas en suplementos de algas, sobre todo de Aphanizomenon; elegir productos con control de calidad."}, "canela": {"title": "Canela", "formula": "Cinnamomum spp. · corteza", "summary": "Especia antioxidante y antiinflamatoria que el libro usa en 17 recetas y a la que atribuye bajar la presión.", "caution": "Riesgo omitido. La canela cassia, la más común, puede tener mucha cumarina, tóxica para el hígado; la ingesta tolerable es 0,1 mg/kg al día (EFSA 2004, confirmada por el BfR), y quien consume mucha cassia puede superarla, sobre todo los niños. La canela de Ceilán contiene muy poca."}, "colageno": {"title": "Colágeno hidrolizado", "formula": "Péptidos de colágeno bovino o marino", "summary": "Proteína en polvo que el libro recomienda para piel, pelo, uñas, articulaciones, celulitis y \"sellar el intestino\".", "caution": "Debatida. Algunos metaanálisis muestran mejor hidratación y elasticidad de la piel (de Miranda 2021), pero el efecto desaparece en los estudios de alta calidad o sin financiación de la industria (Myung y Park 2025). Para \"sellar el intestino\" solo hay un estudio abierto sin grupo control."}, "matcha": {"title": "Matcha", "formula": "Camellia sinensis · té verde en polvo", "summary": "Té verde en polvo con cafeína y catequinas que el libro usa para la energía, el metabolismo y bajar de peso.", "caution": "Imprecisa. Cochrane (Jurgens 2012) halló una pérdida de peso pequeña y sin relevancia clínica con preparados de té verde. La EFSA (2018) vio daño hepático con 800 mg o más de EGCG al día en suplementos; la bebida tradicional se considera segura."}, "curcuma": {"title": "Cúrcuma", "formula": "Curcuma longa · rizoma", "summary": "Especia antiinflamatoria que el libro usa en 8 recetas, siempre con pimienta negra para mejorar la absorción.", "caution": "Riesgo omitido. La pimienta negra aumenta la absorción de la curcumina, y esa mayor exposición se asocia a casos de daño hepático por suplementos (Lombardi 2020 en Italia; red DILIN, Halegoua-DeMarzio 2022: 10 casos, 1 muerte; advertencia de la TGA australiana en 2023). La cúrcuma como especia en la comida no se asocia a ese riesgo."}}, "resources": [{"id": "G", "title": "Glosario", "usedBy": ["2.1", "2.2", "5.1"]}], "requires": {"chapters": {"2": [1], "3": [2], "4": [2], "5": [1], "6": [3, 4], "7": [3, 4], "8": [3, 4], "9": [2], "10": [6, 7, 8, 9], "11": [6, 7, 8, 9], "12": [6, 7, 8, 9], "13": [6, 7, 8, 9], "14": [6, 7, 9]}, "sections": {"10.3": ["7.7", "7.11", "8.7", "9.7", "9.8", "10.2"], "10.4": ["6.2", "7.8", "7.9", "9.9", "10.2"], "10.5": ["9.5", "10.2"], "10.6": ["6.4", "7.9", "9.7", "9.8", "9.9", "10.2"], "10.7": ["7.7", "8.7", "9.7", "10.2"], "10.8": ["8.3", "9.2", "9.7", "10.2"], "10.9": ["8.1", "8.6", "9.3", "10.2"], "10.10": ["7.1", "7.4", "7.9", "10.2"], "10.11": ["6.4", "7.2", "9.7", "9.8", "9.10", "10.2"], "10.12": ["6.4", "9.4", "10.2"], "10.13": ["7.1", "7.7", "7.9", "9.4", "9.7", "10.2"], "10.14": ["7.1", "7.9", "8.7", "10.2"], "11.1": ["7.1", "9.1"], "11.2": ["8.1", "8.7"], "11.3": ["6.4", "9.10"], "11.4": ["7.11", "8.2", "8.4"], "11.5": ["7.9", "9.3"], "11.6": ["7.1"], "11.7": ["8.3", "9.2", "9.7"], "11.8": ["7.2", "7.11", "9.5"], "11.9": ["7.1", "7.3", "7.5", "7.11"], "12.1": ["7.1", "7.7", "9.4", "9.7"], "12.2": ["7.11", "8.2", "8.6", "9.4"], "12.3": ["7.2", "7.4", "8.7", "9.4", "9.7", "9.8"], "12.4": ["9.4"], "12.5": ["6.4", "7.2", "9.7", "9.9"], "12.6": ["7.7", "8.2", "9.8"], "12.7": ["7.1", "7.4", "8.4", "9.4"], "12.8": ["7.1", "7.9", "9.4", "9.7"], "12.9": ["7.2", "7.7", "7.8", "8.2", "8.6", "9.2", "9.4", "9.7", "9.9", "9.10"], "12.10": ["7.1", "7.2", "7.4", "7.9", "9.4", "9.7", "9.10"], "12.11": ["6.1", "6.2", "6.3", "6.4", "9.4"], "12.12": ["6.4", "9.3", "9.6"], "13.1": ["6.4", "8.3", "8.4", "8.7", "9.3"], "13.2": ["8.2", "8.5", "9.7"], "13.3": ["7.1", "9.7", "9.8"], "13.4": ["6.2", "6.4", "9.8", "9.9"], "13.5": ["7.2", "9.7", "9.10"], "13.6": ["7.2", "8.6", "8.7", "9.3", "9.8"], "13.7": ["8.4", "8.5", "9.8"], "13.8": ["8.5", "8.7", "9.1"], "14.1": ["7.8", "7.13", "9.6"], "14.2": ["6.2", "6.3", "6.4"], "14.3": ["6.1", "6.2", "6.3", "6.4", "9.10"], "14.4": ["6.4", "7.2", "9.10"], "14.5": ["7.1", "7.2", "7.9", "7.11"], "14.6": ["7.1", "9.7", "9.10"], "1.2": ["1.1"], "2.4": ["2.1"], "2.5": ["2.1"], "3.1": ["2.4"], "3.2": ["2.4"], "3.3": ["3.2"], "4.2": ["4.1"], "5.2": ["5.1"], "5.3": ["5.2"], "5.4": ["5.2"], "9.11": ["2.5"], "10.2": ["10.1"]}, "items": {"c_fatiga_suprarrenal": ["c_respuesta_estres"], "c_adaptogeno": ["c_respuesta_estres"], "c_modulacion_hpa": ["c_adaptogeno"], "c_estim_calm": ["c_adaptogeno"], "c_una_a_la_vez": ["c_estim_calm"], "c_seguridad": ["c_adaptogeno"], "c_rotacion": ["c_seguridad"], "c_eje_hpa": ["c_respuesta_estres"], "c_estres_cronico": ["c_eje_hpa"], "c_ritmo_cortisol": ["c_eje_hpa"], "chaga": ["c_adaptogeno"], "cordyceps": ["c_estim_calm"], "melena_leon": ["c_adaptogeno"], "reishi": ["c_estim_calm"], "cola_pavo": ["c_adaptogeno"], "ashwagandha": ["c_estim_calm"], "astragalo": ["c_adaptogeno"], "eleutero": ["c_adaptogeno"], "he_shou_wu": ["c_adaptogeno"], "tulsi": ["c_adaptogeno"], "regaliz": ["c_adaptogeno", "c_fatiga_suprarrenal"], "maca": ["c_adaptogeno"], "moringa": ["c_adaptogeno"], "mucuna": ["c_adaptogeno"], "ginseng": ["c_estim_calm"], "rhodiola": ["c_estim_calm"], "shatavari": ["c_adaptogeno"], "ashitaba": ["c_adaptogeno"], "amla": ["c_adaptogeno"], "goji": ["c_adaptogeno"], "espino": ["c_adaptogeno"], "schisandra": ["c_estim_calm"], "espino_amarillo": ["c_adaptogeno"], "polen_pino": ["c_adaptogeno"], "perla": ["c_adaptogeno"]}}};
</script>
<script>
// ---------- build graph ----------
const M=Object.assign({title:"Grafo del libro",subtitle:"",language:"es",itemLabel:"Concepto clave",itemLabelPlural:"Conceptos",resourceLabel:"Apéndice",resourceLabelPlural:"Apéndices",searchHint:"Buscar…",pageLabel:"Página",chapterLabel:"Capítulo",sectionLabel:"Sección"},GRAPH.meta||{});
document.title=M.title;
document.getElementById("ttl").innerHTML=esc(M.title)+(M.subtitle?"<small>"+esc(M.subtitle)+"</small>":"");
document.getElementById("eqBtn").textContent=M.itemLabelPlural;
document.getElementById("q").placeholder=M.searchHint;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const PALETTE=["#2F4FA8","#B0622A","#16808A","#6F7C24","#7A5BA6","#A83F5A","#5B6770","#2E7D4F","#9A6B12","#3D6E8F"];
const BLOCKS={};
Object.entries(GRAPH.blocks||{}).forEach(([k,v],i)=>BLOCKS[k]={name:v.name||k,color:v.color||PALETTE[i%PALETTE.length]});
if(!Object.keys(BLOCKS).length) BLOCKS.main={name:"Contenido",color:PALETTE[0]};
const firstBlock=Object.keys(BLOCKS)[0];
const hasRes=(GRAPH.resources||[]).length>0;
if(hasRes) BLOCKS.__res={name:M.resourceLabelPlural,color:"#8B969C"};
const nodes=[], links=[], byId={};
function add(n){nodes.push(n);byId[n.id]=n;}
const itemHome={};
(GRAPH.chapters||[]).forEach((c,ci)=>{
  const b=BLOCKS[c.block]?c.block:firstBlock, cid="ch"+c.num;
  add({id:cid,type:"ch",num:c.num,label:c.title,page:c.page,block:b,desc:c.summary,order:(ci+1)*1000,idx:ci});
  (c.sections||[]).forEach((s,si)=>{
    const sid="s"+s.num;
    add({id:sid,type:"sec",num:String(s.num),label:s.title,page:s.page,block:b,ch:c.num,desc:s.summary,order:(ci+1)*1000+si+1});
    links.push({source:cid,target:sid,kind:"contains"});
    (s.items||[]).forEach(e=>{if(!itemHome[e])itemHome[e]=sid;links.push({source:sid,target:"i:"+e,kind:"defines"});});
  });
});
Object.entries(GRAPH.items||{}).forEach(([id,it])=>{
  const home=byId[itemHome[id]];
  add({id:"i:"+id,type:"eq",label:it.title,formula:it.formula,ref:it.ref,desc:it.summary,block:home?home.block:firstBlock,ch:home?home.ch:null,home:home?home.id:null,order:home?home.order+.5:99999});
});
(GRAPH.resources||[]).forEach((r,ri)=>{
  add({id:"r:"+r.id,type:"apx",num:r.id,label:M.resourceLabel+" "+r.id+": "+r.title,short:r.title,page:r.page,block:"__res",desc:r.summary,order:900000+ri});
  (r.usedBy||[]).forEach(s=>{if(byId["s"+s])links.push({source:"s"+s,target:"r:"+r.id,kind:"data"});});
});
const RQ=GRAPH.requires||{};
const addReq=(map,pre,lvl)=>Object.entries(map||{}).forEach(([a,bs])=>bs.forEach(b=>{if(byId[pre+a]&&byId[pre+b])links.push({source:pre+a,target:pre+b,kind:"req",lvl});}));
addReq(RQ.chapters,"ch","ch");addReq(RQ.sections,"s","sec");addReq(RQ.items,"i:","eq");
const CH_DEP={};Object.entries(RQ.chapters||{}).forEach(([a,bs])=>CH_DEP[a]=bs.map(String));
// adjacency
nodes.forEach(n=>{n.out=[];n.inn=[];});
links.forEach(l=>{byId[l.source].out.push(l);byId[l.target].inn.push(l);});

// ---------- prerequisite trace ----------
function trace(id){
  const start=byId[id], set=new Set([id]), q=[];
  const push=x=>{if(!set.has(x)){set.add(x);q.push(x);}};
  const reqOf=n=>n.out.filter(l=>l.kind==="req").map(l=>l.target);
  reqOf(start).forEach(push);
  if(start.type==="sec") start.out.filter(l=>l.kind==="defines").forEach(l=>reqOf(byId[l.target]).forEach(push));
  while(q.length){const n=byId[q.shift()];reqOf(n).forEach(push);}
  // where to read each equation
  const read=new Set(set);
  [...set].forEach(x=>{const n=byId[x];if(n.type==="eq"&&n.home)read.add(n.home);});
  return {set,read};
}

// ---------- rendering ----------
const svg=d3.select("#graph"), root=svg.append("g");
const defs=svg.append("defs");
defs.append("marker").attr("id","arr").attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
  .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
  .append("path").attr("d","M0,-4L8,0L0,4").attr("fill","#7F8F99");
const gL=root.append("g"), gN=root.append("g");
let view="ch", sim=null, selected=null, traceOn=false, hidden=new Set();
const zoom=d3.zoom().scaleExtent([.2,5]).on("zoom",e=>{root.attr("transform",e.transform);labelLOD(e.transform.k);});
svg.call(zoom).on("dblclick.zoom",null);
const posCache={};
const R=n=>n.type==="ch"?17:n.type==="eq"?7:n.type==="apx"?8:4.5;
const col=n=>BLOCKS[n.block].color;

function viewFilter(n){
  if(hidden.has(n.block)) return false;
  if(view==="ch") return n.type==="ch";
  if(view==="eq") return n.type==="eq";
  return true;
}
function linkFilter(l,ids){
  if(!ids.has(l.source.id||l.source)||!ids.has(l.target.id||l.target)) return false;
  if(view==="all") return l.kind!=="req"||l.lvl!=="ch";
  return l.kind==="req";
}
let curNodes=[], curLinks=[], nodeSel, linkSel;
function render(){
  const w=svg.node().clientWidth, h=svg.node().clientHeight;
  curNodes=nodes.filter(viewFilter).map(n=>{const c=posCache[n.id];return Object.assign(n,c?{x:c.x,y:c.y}:{});});
  const ids=new Set(curNodes.map(n=>n.id));
  curLinks=links.filter(l=>linkFilter(l,ids)).map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,kind:l.kind,lvl:l.lvl}));
  // initial layout by chapter order along a spiral so chapters keep reading order
  curNodes.forEach(n=>{
    if(n.x==null){const ci=(byId["ch"+(n.ch??n.num)]||{idx:20}).idx+1, a=ci*0.62, r=60+ci*22;
      n.x=w/2+Math.cos(a)*r+(Math.random()-.5)*30; n.y=h/2+Math.sin(a)*r+(Math.random()-.5)*30;}
  });
  if(view==="ch"){
    const depth={},seen=new Set();
    const dep=c=>{c=String(c);if(depth[c]!=null)return depth[c];if(seen.has(c))return 0;seen.add(c);
      return depth[c]=(CH_DEP[c]||[]).reduce((m,p)=>Math.max(m,dep(p)+1),0);};
    const rows={};curNodes.forEach(n=>{const d=dep(n.num);(rows[d]=rows[d]||[]).push(n);});
    const rowH=w<720?96:92, maxPer=w<720?3:6; let y=50;
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(d=>{const arr=rows[d].sort((a,b)=>a.idx-b.idx);
      for(let k=0;k<arr.length;k+=maxPer){const part=arr.slice(k,k+maxPer);
        const sp=Math.min(w<720?125:250,(w-24)/part.length);
        part.forEach((n,i)=>{n.fx=w/2+(i-(part.length-1)/2)*sp;n.fy=y;n.wrap=Math.max(11,Math.min(22,Math.floor(sp/7.2)));});
        y+=rowH;}});
  } else curNodes.forEach(n=>{n.fx=null;n.fy=null;});
  linkSel=gL.selectAll("path").data(curLinks,d=>d.source+">"+d.target).join("path")
    .attr("class",d=>"link "+d.kind).attr("marker-end",d=>d.kind==="req"?"url(#arr)":null);
  nodeSel=gN.selectAll("g.node").data(curNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button")
      .attr("aria-label",d=>d.label);
    g.append("path").attr("class","shape");
    g.append("text").attr("class","num");
    g.append("text").attr("class","lbl");
    return g;
  });
  nodeSel.select(".shape").attr("fill",col).attr("d",d=>{
    const r=R(d);
    if(d.type==="eq") return `M0,${-r*1.25}L${r*1.25},0L0,${r*1.25}L${-r*1.25},0Z`;
    if(d.type==="apx") return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;
    return d3.arc()({innerRadius:0,outerRadius:r,startAngle:0,endAngle:2*Math.PI});
  });
  nodeSel.select(".num").text(d=>d.type==="ch"?d.num:d.type==="apx"?d.num:"").attr("text-anchor","middle").attr("dy","0.36em")
    .style("font-size",d=>d.type==="apx"?"9px":null);
  const lbl=nodeSel.select(".lbl").text(null).selectAll("tspan").remove();
  nodeSel.select(".lbl").each(function(d){
    const t=d3.select(this), txt=d.type==="sec"?d.num+" "+d.label:d.type==="apx"?d.short:d.label;
    if(view==="ch"){
      t.attr("x",0).attr("y",R(d)+15).attr("dy",null).attr("text-anchor","middle");
      const words=txt.split(" "),lines=[];let cur="";
      words.forEach(wd=>{if((cur+" "+wd).trim().length>(d.wrap||19)&&cur){lines.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});lines.push(cur);
      lines.forEach((ln,i)=>t.append("tspan").attr("x",0).attr("dy",i?"1.1em":0).text(ln));
    } else t.attr("x",R(d)+5).attr("y",0).attr("dy","0.35em").attr("text-anchor",null).text(txt);
  });
  nodeSel.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);}})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  if(sim) sim.stop();
  const ld={contains:34,defines:22,data:70,req:view==="all"?110:90};
  const ls={contains:.7,defines:.9,data:.08,req:view==="all"?.04:.35};
  const lsf=l=>view==="all"&&l.kind==="req"&&l.lvl==="eq"?.008:ls[l.kind];
  sim=d3.forceSimulation(curNodes)
    .force("link",d3.forceLink(curLinks).id(d=>d.id).distance(l=>ld[l.kind]).strength(lsf))
    .force("charge",d3.forceManyBody().strength(d=>view==="all"?(d.type==="ch"?-260:-45):-320))
    .force("collide",d3.forceCollide(d=>R(d)+(view==="all"?3:22)))
    .force("x",d3.forceX(w/2).strength(.04)).force("y",d3.forceY(h/2).strength(.05))
    .on("tick",ticked).on("end",()=>{curNodes.forEach(n=>posCache[n.id]={x:n.x,y:n.y});});
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){sim.stop();for(let i=0;i<300;i++)sim.tick();ticked();}
  setTimeout(fit, view==="ch"?150:view==="all"?1400:900);
  labelLOD(d3.zoomTransform(svg.node()).k);
  applyHighlight();
}
function ticked(){
  linkSel.attr("d",d=>{
    const s=d.source,t=d.target;
    if(d.kind!=="req") return `M${s.x},${s.y}L${t.x},${t.y}`;
    const dx=t.x-s.x,dy=t.y-s.y,dist=Math.hypot(dx,dy)||1,r=R(t)+(t.type==="eq"?4:3);
    const tx=t.x-dx/dist*r, ty=t.y-dy/dist*r;
    return `M${s.x},${s.y}Q${(s.x+tx)/2+dy*.12},${(s.y+ty)/2-dx*.12} ${tx},${ty}`;
  });
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function labelLOD(k){
  if(!nodeSel) return;
  nodeSel.select(".lbl").style("display",d=>{
    if(selected&&(d.id===selected||(traceOn&&curTrace&&curTrace.read.has(d.id)))) return null;
    if(d.type==="ch"||view!=="all") return null;
    if(d.type==="eq"||d.type==="apx") return k>1.1?null:"none";
    return k>1.8?null:"none";
  });
}
function fit(sub){
  const set=(Array.isArray(sub)?sub:curNodes).filter(n=>n.x!=null);
  if(!set.length) return;
  let w=svg.node().clientWidth,h=svg.node().clientHeight,ox=0;
  const panelOpen=panel.classList.contains("open"), mobile=w<720;
  if(panelOpen&&!mobile){w-=400;} if(panelOpen&&mobile){h*=.4;}
  let oy=0; if(mobile&&!panelOpen){h-=56;}
  const xs=set.map(n=>n.x),ys=set.map(n=>n.y);
  const padR=view==="ch"?60:150, padB=view==="ch"?50:30;
  const x0=Math.min(...xs)-(view==="ch"?60:30),x1=Math.max(...xs)+padR,y0=Math.min(...ys)-30,y1=Math.max(...ys)+padB;
  const k=Math.min(2.2,.92*Math.min(w/(x1-x0),h/(y1-y0)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k));
}
d3.select("#zin").on("click",()=>svg.transition().call(zoom.scaleBy,1.4));
d3.select("#zout").on("click",()=>svg.transition().call(zoom.scaleBy,1/1.4));
d3.select("#fit").on("click",()=>fit());
svg.on("click",()=>closePanel());

// ---------- highlight ----------
let curTrace=null;
function applyHighlight(){
  if(!nodeSel) return;
  nodeSel.classed("sel",d=>d.id===selected);
  if(!selected){nodeSel.classed("dim",false);linkSel.classed("dim",false).classed("hot",false);labelLOD(d3.zoomTransform(svg.node()).k);return;}
  let keep;
  if(traceOn&&curTrace){keep=curTrace.read;}
  else{keep=new Set([selected]);byId[selected].out.concat(byId[selected].inn).forEach(l=>{keep.add(l.source.id||l.source);keep.add(l.target.id||l.target);});}
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",d=>!(keep.has(d.source.id)&&keep.has(d.target.id)))
    .classed("hot",d=>traceOn&&d.kind==="req"&&keep.has(d.source.id)&&keep.has(d.target.id));
  labelLOD(d3.zoomTransform(svg.node()).k);
}

// ---------- panel ----------
const panel=document.getElementById("panel");
const kindName={ch:M.chapterLabel,sec:M.sectionLabel,eq:M.itemLabel,apx:M.resourceLabel};
function item(id,prefix){
  const n=byId[id];
  const t=n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label;
  return `<li><button data-go="${esc(id)}"><span class="dot" style="background:${col(n)}"></span><span>${esc(t)}</span></button></li>`;
}
function list(title,ids,ordered){
  if(!ids.length) return "";
  ids=[...new Set(ids)].sort((a,b)=>byId[a].order-byId[b].order);
  return `<div class="p-sec"><h3>${title}</h3>${ordered?'<ol class="p-list path">':'<ul class="p-list">'}${ids.map(i=>item(i)).join("")}${ordered?"</ol>":"</ul>"}</div>`;
}
function select(id,center){
  selected=id;traceOn=false;curTrace=null;
  const n=byId[id];
  if(!curNodes.includes(n)){view=n.type==="ch"?"ch":n.type==="eq"?"eq":"all";hidden.delete(n.block);syncViewBtns();syncLegend();render();setTimeout(()=>centerOn(id),view==="all"?1500:1000);}
  else if(center) centerOn(id);
  const outT=k=>n.out.filter(l=>l.kind===k).map(l=>l.target.id||l.target);
  const inT=k=>n.inn.filter(l=>l.kind===k).map(l=>l.source.id||l.source);
  let html=`<button class="close" aria-label="Cerrar">×</button>
   <div class="p-kind"><span class="dot" style="background:${col(n)}"></span>${esc(kindName[n.type])} · ${esc(BLOCKS[n.block].name)}</div>
   <div class="p-title">${esc(n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label)}</div>`;
  const meta=[];
  if(n.page) meta.push(M.pageLabel+" "+n.page);
  if(n.type==="sec") meta.push(M.chapterLabel+" "+n.ch+": "+byId["ch"+n.ch].label);
  if(n.type==="eq"){if(n.ref)meta.push(M.itemLabel+" "+n.ref);if(n.home)meta.push(M.sectionLabel+" "+byId[n.home].num);}
  if(meta.length) html+=`<div class="p-meta">${esc(meta.join(". "))}</div>`;
  if(n.formula) html+=`<div class="formula" style="color:${col(n)}"><span style="color:var(--ink)">${esc(n.formula)}</span></div>`;
  if(n.desc) html+=`<p class="p-desc">${esc(n.desc)}</p>`;
  if(n.type!=="apx") html+=`<button class="trace-btn" id="traceBtn" aria-pressed="false">Trazar prerrequisitos</button><div id="pathBox"></div>`;
  if(n.type==="ch") html+=list("Secciones",outT("contains"),true)+list(M.itemLabelPlural+" clave",outT("contains").flatMap(s=>byId[s].out.filter(l=>l.kind==="defines").map(l=>l.target.id||l.target)))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"));
  if(n.type==="sec") html+=list(M.itemLabelPlural+" que presenta",outT("defines"))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"))+list(M.resourceLabelPlural+" que consulta",outT("data"));
  if(n.type==="eq") html+=list("Se deriva de o usa",outT("req"))+list("Base de",inT("req"))+list("Dónde se presenta",inT("defines"));
  if(n.type==="apx") html+=list("Se consulta en",inT("data"));
  panel.innerHTML=html;panel.classList.add("open");
  panel.querySelector(".close").onclick=closePanel;
  panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  const tb=document.getElementById("traceBtn");
  if(tb) tb.onclick=()=>{traceOn=!traceOn;tb.setAttribute("aria-pressed",traceOn);tb.textContent=traceOn?"Quitar trazado":"Trazar prerrequisitos";
    curTrace=traceOn?trace(id):null;
    const box=document.getElementById("pathBox");
    if(traceOn){const ids=[...curTrace.read].filter(x=>x!==id&&byId[x].type!=="eq");
      box.innerHTML=ids.length?list("Ruta de lectura sugerida, en orden del libro",ids,true):'<p class="empty">No depende de otros temas: es un punto de partida.</p>';
      box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}
    else box.innerHTML="";
    applyHighlight();
    if(traceOn) fit(curNodes.filter(x=>curTrace.read.has(x.id)));};
  document.getElementById("hint").style.opacity=0;
  applyHighlight();
}
function closePanel(){panel.classList.remove("open");selected=null;traceOn=false;curTrace=null;applyHighlight();}
function centerOn(id){
  const n=byId[id];if(n.x==null) return;
  const w=svg.node().clientWidth,h=svg.node().clientHeight,k=Math.max(1.3,d3.zoomTransform(svg.node()).k);
  const mobile=w<720, cx=mobile?w/2:(w-400)/2, cy=mobile?h*.28:h/2;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(cx-k*n.x,cy-k*n.y).scale(k));
}

// ---------- controls ----------
function syncViewBtns(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewBtns();closePanel();render();});
const legend=document.getElementById("legend");
function syncLegend(){
  legend.innerHTML=Object.entries(BLOCKS).map(([k,v])=>`<button data-b="${k}" aria-pressed="${!hidden.has(k)}"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}</button>`).join("")+
  `<div class="shapes"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#172A3A"/></svg>${esc(M.chapterLabel.toLowerCase())} o ${esc(M.sectionLabel.toLowerCase())}</span><span><svg width="12" height="12"><path d="M6 0L12 6L6 12L0 6Z" fill="#172A3A"/></svg>${esc(M.itemLabel.toLowerCase())}</span>${hasRes?`<span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#172A3A"/></svg>${esc(M.resourceLabel.toLowerCase())}</span>`:""}</div>`;
  legend.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);syncLegend();render();});
}
syncLegend();
// search
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(t.length<2){res.style.display="none";return;}
  const hits=nodes.filter(n=>norm((n.num||"")+" "+n.label+" "+(n.formula||"")+" "+(n.desc||"")).includes(t))
    .sort((a,b)=>(norm(a.label).includes(t)?0:1)-(norm(b.label).includes(t)?0:1)||a.order-b.order).slice(0,14);
  res.innerHTML=hits.length?hits.map(n=>`<li><button data-go="${esc(n.id)}"><span class="k">${esc(n.type==="sec"?n.num:n.type==="ch"?n.num:n.type==="eq"?"·":n.num)}</span><span>${esc(n.type==="apx"?n.short:n.label)}</span></button></li>`).join(""):'<li style="padding:8px;font-size:.9rem">Sin coincidencias. Prueba con otra palabra o un número de sección.</li>';
  res.style.display="block";
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{res.style.display="none";q.value="";q.blur();select(b.dataset.go,true);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector("[data-go]");if(f)f.click();}if(e.key==="Escape"){res.style.display="none";}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.style.display="none";});
window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>fit(),200);});
render();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
</script>
</body>
</html>
