<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo del libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-x:auto;white-space:nowrap}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Desarrollo de aplicaciones con agentes de IA como grafo", "subtitle": "Michael Albada (O’Reilly, 1.ª ed. 2025, trad. al español): 13 capítulos, secciones, conceptos y patrones clave de diseño de agentes", "language": "es", "itemLabel": "Concepto clave", "itemLabelPlural": "Conceptos y patrones", "resourceLabel": "Recurso complementario", "resourceLabelPlural": "Recursos complementarios", "sectionLabel": "Sección", "searchHint": "Buscar: ReAct, MCP, GraphRAG, bandidos…"}, "blocks": {"fund": {"name": "Fundamentos y diseño"}, "const": {"name": "Construcción del agente"}, "esc": {"name": "Aprendizaje y escalado"}, "oper": {"name": "Evaluación y operación"}, "conf": {"name": "Seguridad y colaboración humana"}}, "chapters": [{"num": 1, "title": "Introducción a los agentes", "block": "fund", "summary": "Qué es un agente de IA, por qué los modelos preentrenados cambiaron el panorama y cuándo conviene un agente en lugar de código, un flujo fijo o RAG.", "sections": [{"num": "1.1", "title": "Definición de los agentes de IA", "summary": "La agencia se entiende como un grado: más autonomía real implica razonar con el contexto y decidir sin guion.", "items": ["agencia_espectro"]}, {"num": "1.2", "title": "La revolución del preentrenamiento", "summary": "Los modelos fundacionales reducen la dependencia de grandes conjuntos de datos propios que tenía el ML clásico."}, {"num": "1.3", "title": "Tipos de agentes", "summary": "Catálogo práctico: tareas de negocio, conversacionales, investigación, analítica, desarrollo, dominio específico y navegación web; más voz y video."}, {"num": "1.4", "title": "Selección de modelos", "summary": "Panorama de modelos comerciales y de pesos abiertos, y criterios iniciales para elegir."}, {"num": "1.5", "title": "De operaciones sincrónicas a asincrónicas", "summary": "Por qué la ejecución asíncrona evita esperas y permite trabajo en paralelo."}, {"num": "1.6", "title": "Aplicaciones prácticas y casos de uso", "summary": "Siete agentes de ejemplo (soporte, finanzas, triaje de pacientes, TI, legal, SOC, cadena de suministro) que el libro reutiliza."}, {"num": "1.7", "title": "Flujos de trabajo y agentes", "summary": "Criterios para elegir entre código simple, flujo determinista, chatbot/RAG o agente autónomo.", "items": ["decision_agente"]}, {"num": "1.8", "title": "Principios para construir sistemas agénticos efectivos", "summary": "Escalabilidad, modularidad, aprendizaje continuo, resiliencia y preparación para el futuro.", "items": ["principios_agenticos"]}, {"num": "1.9", "title": "Organización para el éxito", "summary": "Evitar la fragmentación de pruebas de concepto con plataformas y aprendizajes compartidos."}, {"num": "1.10", "title": "Frameworks agénticos", "summary": "Fortalezas y límites de LangGraph, AutoGen, CrewAI y el SDK de agentes de OpenAI."}]}, {"num": 2, "title": "Diseñando sistemas de agentes", "block": "fund", "summary": "Guía de inicio rápido: un primer agente de soporte con evaluación mínima, los componentes centrales, los compromisos de diseño, los patrones de arquitectura y las buenas prácticas.", "sections": [{"num": "2.1", "title": "Nuestro primer sistema de agentes", "summary": "Agente de soporte de comercio electrónico acotado a cancelar pedidos, con una prueba mínima automática.", "items": ["agente_minimo"]}, {"num": "2.2", "title": "Componentes principales de los sistemas de agentes", "summary": "Modelo, herramientas, memoria y orquestación como piezas que deben encajar.", "items": ["componentes_nucleo"]}, {"num": "2.3", "title": "Selección de modelos", "summary": "Cómo la complejidad de la tarea, la latencia y el costo guían la elección del modelo."}, {"num": "2.4", "title": "Herramientas", "summary": "Herramientas como capacidades del agente; diseño por tarea y modularidad."}, {"num": "2.5", "title": "Memoria", "summary": "Memoria a corto y largo plazo, y cómo gestionarla y recuperarla."}, {"num": "2.6", "title": "Orquestación", "summary": "La lógica que encadena habilidades hacia un objetivo; anticipo del capítulo 5."}, {"num": "2.7", "title": "Compromisos de diseño", "summary": "Velocidad frente a precisión, escalabilidad con GPU, confiabilidad (tolerancia a fallos) y costo frente a valor.", "items": ["compromisos"]}, {"num": "2.8", "title": "Patrones de diseño de arquitectura", "summary": "Agente único frente a multiagente: ventajas, retos y casos de uso."}, {"num": "2.9", "title": "Mejores prácticas", "summary": "Diseño iterativo, estrategia de evaluación y pruebas en el mundo real.", "items": ["diseno_iterativo"]}]}, {"num": 3, "title": "Diseño de experiencia de usuario para sistemas de agentes", "block": "fund", "summary": "Cómo interactúan las personas con los agentes: modalidades, grado de autonomía, ritmo síncrono o asíncrono, continuidad del contexto y comunicación honesta de capacidades y límites.", "sections": [{"num": "3.1", "title": "Interfaces basadas en texto", "summary": "Versátiles pero con poca descubribilidad de lo que el agente sabe hacer."}, {"num": "3.2", "title": "Interfaces gráficas", "summary": "Orquestadores visuales e IDE con IA; claridad para flujos estructurados."}, {"num": "3.3", "title": "Interfaces de voz y habla", "summary": "Interacción manos libres; exige gestionar turnos, latencia y errores de reconocimiento."}, {"num": "3.4", "title": "Interfaces basadas en video", "summary": "Avatares y video como modalidad emergente."}, {"num": "3.5", "title": "Combinación de modalidades", "summary": "Diseñar un recorrido único que pase de una modalidad a otra sin perder el hilo."}, {"num": "3.6", "title": "El control deslizante de autonomía", "summary": "Dejar que el usuario regule cuánto decide el agente: manual, preguntar o agente.", "items": ["autonomia_slider"]}, {"num": "3.7", "title": "Experiencias sincrónicas frente a asincrónicas", "summary": "Principios para respuestas inmediatas y para tareas largas en segundo plano."}, {"num": "3.8", "title": "Equilibrio entre comportamiento proactivo e intrusivo", "summary": "Cuándo debe el agente tomar la iniciativa y cuándo callar.", "items": ["proactivo_intrusivo"]}, {"num": "3.9", "title": "Retención de contexto y continuidad", "summary": "Mantener estado entre interacciones y personalizar según el historial."}, {"num": "3.10", "title": "Comunicación de las capacidades de los agentes", "summary": "Mostrar qué puede hacer, señalar la incertidumbre y pedir aclaraciones.", "items": ["comunicar_incertidumbre"]}, {"num": "3.11", "title": "Fallar con elegancia", "summary": "Responder al fallo con transparencia y una salida útil.", "items": ["fallo_elegante"]}, {"num": "3.12", "title": "Confianza en el diseño de interacción", "summary": "Transparencia y previsibilidad como base de la confianza del usuario."}]}, {"num": 4, "title": "Uso de herramientas", "block": "const", "summary": "Las herramientas como forma de actuar sobre el entorno: tipos (locales, API, plug-in, MCP), riesgos de las que cambian estado, herramientas generadas por el propio modelo y control del uso de herramientas.", "sections": [{"num": "4.1", "title": "Fundamentos de LangChain", "summary": "Modelos de chat, mensajes y definición de herramientas con esquema y descripción.", "items": ["tool_def"]}, {"num": "4.2", "title": "Herramientas locales", "summary": "Lógica determinista junto al agente que compensa debilidades del modelo (p. ej., cálculo)."}, {"num": "4.3", "title": "Herramientas basadas en API", "summary": "Acceso a servicios externos para obtener datos o ejecutar acciones."}, {"num": "4.4", "title": "Herramientas plug-in", "summary": "Integraciones de terceros listas para usar con poca personalización."}, {"num": "4.5", "title": "Model Context Protocol", "summary": "Estándar abierto cliente-servidor sobre JSON-RPC para conectar modelos con sistemas externos.", "items": ["mcp"]}, {"num": "4.6", "title": "Herramientas con estado", "summary": "Riesgo de acciones destructivas cuando el modelo modifica estado persistente; cómo acotarlo.", "items": ["herr_estado"]}, {"num": "4.7", "title": "Desarrollo automatizado de herramientas", "summary": "Modelos que crean herramientas y generación de código en tiempo real dentro de un entorno aislado.", "items": ["codegen_herr"]}, {"num": "4.8", "title": "Configuración del uso de herramientas", "summary": "Parámetro de elección de herramienta (auto, obligatoria, ninguna) y flujos de validación y reintento.", "items": ["tool_choice"]}]}, {"num": 5, "title": "Orquestación", "block": "const", "summary": "Cómo el agente decide y encadena acciones: tipos de agentes según su razonamiento, selección y ejecución de herramientas, topologías de ejecución e ingeniería de contexto.", "sections": [{"num": "5.1", "title": "Agentes reflexivos", "summary": "Mapeo directo de entrada a acción, sin razonamiento intermedio; rápidos pero rígidos."}, {"num": "5.2", "title": "Agentes ReAct", "summary": "Bucle de pensamiento, acción y observación.", "items": ["react"]}, {"num": "5.3", "title": "Agentes planificador-ejecutor", "summary": "Separar la planificación de largo alcance de la ejecución paso a paso.", "items": ["plan_ejec"]}, {"num": "5.4", "title": "Agentes de descomposición de consultas", "summary": "Dividir una pregunta compleja en subpreguntas y sintetizar."}, {"num": "5.5", "title": "Agentes de reflexión", "summary": "Revisar pasos previos para detectar y corregir errores antes de seguir."}, {"num": "5.6", "title": "Agentes de investigación profunda", "summary": "Investigación abierta de varias etapas; potente pero costosa y lenta."}, {"num": "5.7", "title": "Selección de herramientas", "summary": "Selección estándar, semántica (por embeddings) y jerárquica (por grupos).", "items": ["sel_semantica"]}, {"num": "5.8", "title": "Ejecución de herramientas", "summary": "Parametrización: rellenar los argumentos de la herramienta a partir del contexto."}, {"num": "5.9", "title": "Topologías de herramientas", "summary": "Una herramienta, varias en paralelo, cadenas y grafos con ramas y consolidación.", "items": ["topologias"]}, {"num": "5.10", "title": "Ingeniería de contexto", "summary": "Ensamblar en cada paso la información justa dentro del límite de tokens.", "items": ["ing_contexto"]}]}, {"num": 6, "title": "Conocimiento y memoria", "block": "const", "summary": "Cómo dar memoria y conocimiento externo al agente: ventana de contexto, búsqueda por palabras clave, memoria semántica con vectores, RAG, GraphRAG y toma de notas.", "sections": [{"num": "6.1", "title": "Gestión de ventanas de contexto", "summary": "La forma más simple de memoria: lo que cabe en la entrada del modelo.", "items": ["ventana_contexto"]}, {"num": "6.2", "title": "Búsqueda tradicional de texto completo", "summary": "Índice invertido y BM25 para recuperar coincidencias exactas.", "items": ["bm25"]}, {"num": "6.3", "title": "Búsqueda semántica y almacenes vectoriales", "summary": "Recuperar por significado con embeddings guardados en una base vectorial.", "items": ["embeddings"]}, {"num": "6.4", "title": "Generación aumentada por recuperación", "summary": "Indexar fragmentos y recuperarlos para fundamentar la respuesta.", "items": ["rag"]}, {"num": "6.5", "title": "Memoria de experiencia semántica", "summary": "Guardar y recuperar experiencias pasadas para no empezar cada sesión desde cero."}, {"num": "6.6", "title": "GraphRAG y uso de grafos de conocimiento", "summary": "Recuperación sobre entidades y relaciones para preguntas globales o de varios saltos.", "items": ["graphrag"]}, {"num": "6.7", "title": "Construcción de grafos de conocimiento", "summary": "Extraer entidades y relaciones con un modelo y mantener el grafo."}, {"num": "6.8", "title": "Grafos de conocimiento dinámicos", "summary": "Promesa y peligros de un grafo que se actualiza continuamente."}, {"num": "6.9", "title": "Toma de notas", "summary": "El modelo anota el contexto antes de responder, como notas al margen."}]}, {"num": 7, "title": "Aprendizaje en sistemas agénticos", "block": "esc", "summary": "Cómo un agente mejora con la experiencia: métodos no paramétricos (ejemplos, reflexión, aprendizaje experiencial) y paramétricos (ajuste fino supervisado, por preferencias y por refuerzo).", "sections": [{"num": "7.1", "title": "Aprendizaje no paramétrico por ejemplares", "summary": "Usar ejemplos exitosos como few-shot, elegidos dinámicamente por similitud.", "items": ["ejemplares"]}, {"num": "7.2", "title": "Reflexión", "summary": "Tras un fallo, el agente escribe una autocrítica que guía el siguiente intento.", "items": ["reflexion"]}, {"num": "7.3", "title": "Aprendizaje experiencial", "summary": "Destilar reglas o perspectivas a partir de muchas experiencias y mantenerlas.", "items": ["aprend_experiencial"]}, {"num": "7.4", "title": "Ajuste fino de grandes modelos fundacionales", "summary": "Cuándo compensa ajustar un modelo grande y qué cuesta mantenerlo."}, {"num": "7.5", "title": "La promesa de los modelos pequeños", "summary": "Modelos pequeños ajustados como opción barata y rápida para tareas acotadas."}, {"num": "7.6", "title": "Ajuste fino supervisado", "summary": "Pares entrada/salida curados, p. ej., para llamadas a funciones robustas.", "items": ["sft"]}, {"num": "7.7", "title": "Optimización directa de preferencias", "summary": "Entrenar con pares preferido/rechazado para moldear la calidad.", "items": ["dpo"]}, {"num": "7.8", "title": "Aprendizaje por refuerzo con recompensas verificables", "summary": "Optimizar la política frente a una recompensa medible (RLVR); el código completo está en el repositorio."}]}, {"num": 8, "title": "De un agente a muchos", "block": "esc", "summary": "Cuándo pasar a varios agentes, cómo coordinarlos (democrática, por gestor, jerárquica, actor-crítico), el diseño automatizado de agentes y la infraestructura de comunicación y estado.", "sections": [{"num": "8.1", "title": "Escenarios de un solo agente", "summary": "Suficiente para tareas moderadas, pocas herramientas o latencia crítica."}, {"num": "8.2", "title": "Escenarios multiagente", "summary": "Especialistas coordinados por un supervisor que enruta cada caso.", "items": ["supervisor"]}, {"num": "8.3", "title": "Enjambres", "summary": "Muchos agentes simples con comportamiento colectivo emergente."}, {"num": "8.4", "title": "Principios para agregar agentes", "summary": "Añadir agentes solo cuando aporten; roles claros y medición."}, {"num": "8.5", "title": "Coordinación democrática", "summary": "Decisión por consenso entre pares, sin líder."}, {"num": "8.6", "title": "Coordinación por gestor", "summary": "Un agente gestor reparte tareas y resuelve conflictos."}, {"num": "8.7", "title": "Coordinación jerárquica", "summary": "Varios niveles de supervisión que combinan control central y local."}, {"num": "8.8", "title": "Enfoques actor-crítico", "summary": "Un actor genera candidatos y un crítico los acepta o pide regenerar.", "items": ["actor_critico"]}, {"num": "8.9", "title": "Diseño automatizado de sistemas de agentes", "summary": "Un metaagente busca, evalúa y refina arquitecturas de agentes definidas en código.", "items": ["adas"]}, {"num": "8.10", "title": "Comunicación local frente a distribuida", "summary": "De llamadas en memoria a mensajería entre procesos y máquinas."}, {"num": "8.11", "title": "Protocolo de agente a agente", "summary": "Descubrimiento por tarjetas de agente y solicitudes JSON-RPC entre agentes heterogéneos.", "items": ["a2a"]}, {"num": "8.12", "title": "Brokers de mensajes y buses de eventos", "summary": "Desacoplar emisores y receptores con comunicación asíncrona."}, {"num": "8.13", "title": "Frameworks de actores", "summary": "Ray, Orleans y Akka: mensajería y cómputo en un mismo modelo."}, {"num": "8.14", "title": "Orquestación y motores de flujo de trabajo", "summary": "Secuenciar, reintentar y rastrear dependencias en procesos largos."}, {"num": "8.15", "title": "Gestión de estado y persistencia", "summary": "Estado compartido duradero entre ejecuciones y reinicios."}]}, {"num": 9, "title": "Validación y medición", "block": "oper", "summary": "Cómo medir un sistema agéntico antes de lanzarlo: métricas, conjuntos de evaluación, pruebas por componente, pruebas de sistema completo y criterios de despliegue.", "sections": [{"num": "9.1", "title": "La medición es la piedra angular", "summary": "Métricas claras y accionables alineadas con los objetivos."}, {"num": "9.2", "title": "La evaluación en el ciclo de vida", "summary": "Evaluar de forma sistemática en cada cambio, no a ojo."}, {"num": "9.3", "title": "Creación y escalado de conjuntos de evaluación", "summary": "Casos con estado de entrada y resultado esperado; generación dirigida y minería de datos reales.", "items": ["conjunto_eval"]}, {"num": "9.4", "title": "Evaluación de herramientas", "summary": "Pruebas unitarias de cada herramienta, incluidos casos límite.", "items": ["eval_componentes"]}, {"num": "9.5", "title": "Evaluación de la planificación", "summary": "Verificar que los planes sean válidos, completos y eficientes."}, {"num": "9.6", "title": "Evaluación de la memoria", "summary": "Comprobar que se guarda y se recupera lo relevante."}, {"num": "9.7", "title": "Evaluación del aprendizaje", "summary": "Confirmar que el agente mejora sin sobreajustarse."}, {"num": "9.8", "title": "Rendimiento de extremo a extremo", "summary": "Pruebas de integración sobre recorridos completos de usuario.", "items": ["eval_holistica"]}, {"num": "9.9", "title": "Consistencia", "summary": "Medir la variación de resultados ante entradas equivalentes."}, {"num": "9.10", "title": "Coherencia", "summary": "Que las salidas sigan una lógica a lo largo de toda la interacción."}, {"num": "9.11", "title": "Alucinación", "summary": "Detectar información fabricada, sobre todo en tareas de conocimiento."}, {"num": "9.12", "title": "Manejo de entradas inesperadas", "summary": "Robustez ante entradas mal formadas o maliciosas."}, {"num": "9.13", "title": "Preparación para el despliegue", "summary": "Umbrales, puertas de calidad y planes de reversión.", "items": ["puertas_calidad"]}]}, {"num": 10, "title": "Monitoreo en producción", "block": "oper", "summary": "Qué observar cuando el agente ya está en producción: causas de fallo, stacks de observabilidad, instrumentación con OpenTelemetry, alertas, patrones de lanzamiento seguro y detección de deriva.", "sections": [{"num": "10.1", "title": "El monitoreo es cómo aprendes", "summary": "Señales de infraestructura y semánticas; cada fallo se vuelve caso de prueba.", "items": ["senales_semanticas"]}, {"num": "10.2", "title": "Stacks de monitoreo", "summary": "Grafana con OTel, Loki y Tempo; ELK; Arize Phoenix; SigNoz; Langfuse."}, {"num": "10.3", "title": "Elegir el stack adecuado", "summary": "Partir de lo que ya existe y extenderlo con señales de agentes."}, {"num": "10.4", "title": "Instrumentación OTel", "summary": "Trazas, métricas y logs estructurados dentro del runtime del agente.", "items": ["otel"]}, {"num": "10.5", "title": "Visualización y alertas", "summary": "Paneles y alertas para priorizar depuración y optimización."}, {"num": "10.6", "title": "Modo sombra", "summary": "La versión nueva procesa tráfico real sin servir respuestas.", "items": ["sombra_canary"]}, {"num": "10.7", "title": "Despliegues canary", "summary": "Exponer la versión nueva a un porcentaje pequeño de usuarios."}, {"num": "10.8", "title": "Recopilación de trazas de regresión", "summary": "Convertir trazas de fallos en nuevos casos del conjunto de evaluación."}, {"num": "10.9", "title": "Agentes autorreparables", "summary": "Agentes que leen su propia telemetría y activan respaldos."}, {"num": "10.10", "title": "La retroalimentación del usuario como señal", "summary": "Señales explícitas e implícitas de satisfacción."}, {"num": "10.11", "title": "Desplazamiento de distribución", "summary": "Detectar cambios en entradas y salidas con pruebas estadísticas.", "items": ["deriva"]}, {"num": "10.12", "title": "Propiedad de las métricas y gobernanza", "summary": "Quién responde por cada métrica cuando la respuesta del modelo es el producto."}]}, {"num": 11, "title": "Ciclos de mejora", "block": "oper", "summary": "Cómo convertir lo observado en mejoras: pipelines de retroalimentación con revisión humana, experimentación controlada (sombra, A/B, bandidos) y aprendizaje continuo.", "sections": [{"num": "11.1", "title": "Pipelines de retroalimentación", "summary": "Analizar interacciones de forma automática para detectar patrones de fallo.", "items": ["pipeline_retro"]}, {"num": "11.2", "title": "Detección automatizada y análisis de causa raíz", "summary": "Agrupar incidentes y diagnosticar su origen a escala."}, {"num": "11.3", "title": "Revisión con intervención humana", "summary": "Escalar a personas los casos ambiguos o de alto impacto.", "items": ["hitl"]}, {"num": "11.4", "title": "Refinamiento de prompts y herramientas", "summary": "Las palancas más directas para corregir lo detectado."}, {"num": "11.5", "title": "Agregar y priorizar mejoras", "summary": "Ordenar el trabajo según impacto, frecuencia y esfuerzo."}, {"num": "11.6", "title": "Despliegues en sombra", "summary": "Ensayar la variante nueva en paralelo a producción."}, {"num": "11.7", "title": "Pruebas A/B", "summary": "Dividir tráfico entre control y tratamiento para comparar.", "items": ["ab"]}, {"num": "11.8", "title": "Bandidos bayesianos", "summary": "Experimentación adaptativa que desplaza tráfico hacia la mejor variante.", "items": ["bandidos"]}, {"num": "11.9", "title": "Aprendizaje en contexto", "summary": "Adaptar el comportamiento en tiempo de ejecución sin reentrenar."}, {"num": "11.10", "title": "Reentrenamiento offline", "summary": "Incorporar mejoras duraderas de forma periódica con datos acumulados.", "items": ["reentrenamiento"]}]}, {"num": 12, "title": "Protección de sistemas agénticos", "block": "conf", "summary": "Riesgos de seguridad propios de los agentes y defensas en tres frentes: el modelo fundacional, los datos y el agente mismo (salvaguardas, amenazas externas y fallos internos).", "sections": [{"num": "12.1", "title": "Los riesgos únicos de los sistemas agénticos", "summary": "Autonomía, razonamiento probabilístico y objetivos desalineados amplían la superficie de ataque."}, {"num": "12.2", "title": "Vectores de amenazas emergentes", "summary": "Inyección directa e indirecta de prompts, fuga de información y jailbreaking.", "items": ["inyeccion_prompts"]}, {"num": "12.3", "title": "Protección de modelos fundacionales", "summary": "La elección del modelo como decisión de seguridad."}, {"num": "12.4", "title": "Técnicas defensivas", "summary": "Defensa en capas: filtros, ajuste de seguridad y monitoreo."}, {"num": "12.5", "title": "Red teaming", "summary": "Simular ataques para encontrar vulnerabilidades, a menudo con ayuda de modelos.", "items": ["red_teaming"]}, {"num": "12.6", "title": "Modelado de amenazas con MAESTRO", "summary": "Marco de siete capas de la CSA para IA agéntica.", "items": ["maestro"]}, {"num": "12.7", "title": "Privacidad y cifrado de datos", "summary": "Primera línea de defensa contra accesos y exposiciones."}, {"num": "12.8", "title": "Procedencia e integridad de los datos", "summary": "Verificar el origen y la integridad de lo que usa el agente."}, {"num": "12.9", "title": "Manejo de datos sensibles", "summary": "Datos personales, financieros y confidenciales en flujos agénticos."}, {"num": "12.10", "title": "Salvaguardas", "summary": "Roles y permisos, restricciones, aislamiento, validación de entrada/salida y límites de tasa.", "items": ["salvaguardas"]}, {"num": "12.11", "title": "Protecciones contra amenazas externas", "summary": "Seguridad de red, API y componentes de terceros."}, {"num": "12.12", "title": "Protecciones contra fallos internos", "summary": "Evitar que errores internos se propaguen en silencio entre agentes."}]}, {"num": 13, "title": "Colaboración humano-agente", "block": "conf", "summary": "Cómo trabajan juntos personas y agentes: roles que cambian con la autonomía, escalado de individuo a organización, confianza progresiva, rendición de cuentas, supervisión y cumplimiento normativo.", "sections": [{"num": "13.1", "title": "El papel cambiante de los humanos", "summary": "De ejecutores a supervisores y luego colaboradores.", "items": ["roles_humanos"]}, {"num": "13.2", "title": "Alinear a las partes interesadas e impulsar la adopción", "summary": "Sin adopción, el agente fracasa aunque funcione."}, {"num": "13.3", "title": "Escalar la colaboración", "summary": "De asistente individual a colaborador de equipo y empresa."}, {"num": "13.4", "title": "Alcance del agente y roles organizacionales", "summary": "Agentes personales, de equipo, de proyecto, funcionales y organizacionales.", "items": ["alcance_agente"]}, {"num": "13.5", "title": "Memoria compartida y límites de contexto", "summary": "Qué recuerda un agente compartido y quién puede verlo."}, {"num": "13.6", "title": "El ciclo de vida de la confianza", "summary": "La confianza se gana con desempeño y transparencia, y se pierde rápido.", "items": ["delegacion_progresiva"]}, {"num": "13.7", "title": "Marcos de rendición de cuentas", "summary": "Líneas claras de responsabilidad, registros y auditorías."}, {"num": "13.8", "title": "Diseño de escalamiento y supervisión", "summary": "Cuándo y cómo el agente cede la decisión a una persona.", "items": ["escalamiento"]}, {"num": "13.9", "title": "Privacidad y cumplimiento normativo", "summary": "Regulación específica de IA y obligaciones de privacidad."}]}], "items": {"agencia_espectro": {"title": "La agencia como espectro", "summary": "Un sistema es más o menos agente según cuánto razona con el contexto y decide sin guion fijo."}, "decision_agente": {"title": "¿Código, flujo, RAG o agente?", "summary": "Elegir el nivel mínimo suficiente según variabilidad de entradas, razonamiento, latencia/cumplimiento y mantenimiento."}, "principios_agenticos": {"title": "Cinco principios de diseño", "summary": "Escalabilidad, modularidad, aprendizaje continuo, resiliencia y preparación para el futuro."}, "agente_minimo": {"title": "Agente mínimo con evaluación", "summary": "Empezar con una tarea acotada y una prueba automática que verifique la herramienta y la respuesta."}, "componentes_nucleo": {"title": "Componentes centrales", "summary": "Modelo, herramientas, memoria y orquestación forman el esqueleto de todo agente."}, "compromisos": {"title": "Compromisos de diseño", "summary": "Equilibrar rendimiento, escalabilidad, confiabilidad y costo según el valor de la tarea."}, "diseno_iterativo": {"title": "Diseño iterativo", "summary": "Prototipos pequeños evaluados y mejorados en ciclos, en lugar de un diseño perfecto inicial."}, "autonomia_slider": {"title": "Control deslizante de autonomía", "summary": "El usuario regula el grado de independencia del agente: manual, preguntar o autónomo."}, "proactivo_intrusivo": {"title": "Proactivo sin ser intrusivo", "summary": "La iniciativa del agente debe ser oportuna y relevante, no interrumpir sin necesidad."}, "comunicar_incertidumbre": {"title": "Comunicar confianza e incertidumbre", "summary": "Indicar cuán seguro está el agente y pedir aclaración ante ambigüedad."}, "fallo_elegante": {"title": "Fallo elegante", "summary": "Ante un fallo, explicarlo y ofrecer una alternativa o una vía de escalamiento."}, "tool_def": {"title": "Definición de herramienta", "summary": "Función con nombre, descripción y esquema de parámetros que el modelo puede invocar."}, "mcp": {"title": "Model Context Protocol (MCP)", "summary": "Protocolo estándar cliente-servidor para exponer herramientas y datos a cualquier modelo."}, "herr_estado": {"title": "Herramientas con estado y su riesgo", "summary": "Las herramientas que modifican datos persistentes requieren permisos mínimos y confirmaciones."}, "codegen_herr": {"title": "Herramientas generadas por el modelo", "summary": "El agente escribe y prueba código en un entorno aislado para crear herramientas nuevas."}, "tool_choice": {"title": "Control de elección de herramienta", "summary": "Forzar, permitir o bloquear llamadas a herramientas y validar la salida con esquemas y reintentos."}, "react": {"title": "Patrón ReAct", "summary": "Alternar razonamiento y acción, observando el resultado de cada herramienta antes del siguiente paso."}, "plan_ejec": {"title": "Planificador-ejecutor", "summary": "Un plan de varios pasos se genera primero y luego se ejecuta paso a paso."}, "sel_semantica": {"title": "Selección semántica de herramientas", "summary": "Recuperar por similitud solo las herramientas relevantes antes de que el modelo elija."}, "topologias": {"title": "Topologías de ejecución", "summary": "Una herramienta, paralelo, cadena o grafo: más expresividad implica más costo y riesgo."}, "ing_contexto": {"title": "Ingeniería de contexto", "summary": "Seleccionar, estructurar y comprimir lo que entra en la ventana del modelo en cada paso."}, "ventana_contexto": {"title": "Gestión de la ventana de contexto", "summary": "Mantener en la entrada lo reciente y relevante dentro del límite de tokens."}, "bm25": {"title": "Búsqueda por palabras clave (BM25)", "summary": "Recuperación por coincidencia exacta con índice invertido; precisa pero sin captar sinónimos."}, "embeddings": {"title": "Memoria semántica vectorial", "summary": "Representar textos como vectores para recuperar por significado."}, "rag": {"title": "Generación aumentada por recuperación (RAG)", "summary": "Recuperar fragmentos relevantes e incluirlos en el prompt para fundamentar la respuesta."}, "graphrag": {"title": "GraphRAG", "summary": "RAG sobre un grafo de entidades y relaciones para preguntas globales o de varios saltos."}, "ejemplares": {"title": "Ejemplos few-shot dinámicos", "summary": "Elegir por similitud los ejemplos exitosos más útiles para cada entrada."}, "reflexion": {"title": "Reflexion", "summary": "Autocrítica verbal tras cada fallo, guardada en memoria para el siguiente intento."}, "aprend_experiencial": {"title": "Aprendizaje experiencial", "summary": "Extraer reglas generales de muchas experiencias y crearlas, ajustarlas o retirarlas."}, "sft": {"title": "Ajuste fino supervisado (SFT)", "summary": "Entrenar con pares entrada/salida curados para fijar formatos y comportamientos."}, "dpo": {"title": "Optimización directa de preferencias (DPO)", "summary": "Entrenar con respuestas preferidas y rechazadas para mejorar la calidad percibida."}, "supervisor": {"title": "Patrón supervisor-especialistas", "summary": "Un agente enruta cada caso al especialista adecuado."}, "actor_critico": {"title": "Actor-crítico", "summary": "Generar candidatos y filtrarlos con un evaluador; útil cuando evaluar es más fácil que generar."}, "adas": {"title": "Diseño automatizado de agentes (ADAS)", "summary": "Un metaagente busca y evalúa arquitecturas de agentes escritas como código."}, "a2a": {"title": "Protocolo agente a agente (A2A)", "summary": "Descubrimiento por tarjetas de agente y delegación estándar entre agentes de distintos proveedores."}, "conjunto_eval": {"title": "Conjunto de evaluación", "summary": "Casos con estado inicial, conversación y resultado esperado que permiten puntuar de forma automática."}, "eval_componentes": {"title": "Evaluación por componentes", "summary": "Pruebas unitarias de herramientas, planificación, memoria y aprendizaje por separado."}, "eval_holistica": {"title": "Evaluación holística", "summary": "Pruebas de extremo a extremo de consistencia, coherencia, alucinación y robustez."}, "puertas_calidad": {"title": "Puertas de calidad para el despliegue", "summary": "Umbrales medibles que bloquean el paso a producción si no se cumplen."}, "senales_semanticas": {"title": "Señales semánticas de monitoreo", "summary": "Además de latencia y errores, vigilar intención, uso de herramientas, alucinación y abandono."}, "otel": {"title": "Instrumentación con OpenTelemetry", "summary": "Trazas, métricas y logs estándar emitidos desde el runtime del agente."}, "sombra_canary": {"title": "Modo sombra y canary", "summary": "Probar una versión nueva con tráfico real sin exponerla, y luego con una fracción pequeña de usuarios."}, "deriva": {"title": "Desplazamiento de distribución", "summary": "Cambios graduales en entradas o salidas detectados con pruebas como KS, KL o PSI."}, "pipeline_retro": {"title": "Pipeline de retroalimentación", "summary": "Flujo automático que convierte observaciones de producción en mejoras priorizadas."}, "hitl": {"title": "Revisión con intervención humana", "summary": "Escalamiento estructurado de casos ambiguos o de alto impacto a revisores."}, "ab": {"title": "Pruebas A/B", "summary": "Comparar control y variante con tráfico dividido y métricas definidas."}, "bandidos": {"title": "Bandidos bayesianos", "summary": "Asignar más tráfico a la variante que mejor rinde mientras se sigue explorando."}, "reentrenamiento": {"title": "Reentrenamiento offline", "summary": "Ajustar el modelo periódicamente con datos acumulados de producción."}, "inyeccion_prompts": {"title": "Inyección de prompts", "summary": "Instrucciones maliciosas, directas o escondidas en datos externos, que desvían al agente."}, "red_teaming": {"title": "Red teaming", "summary": "Ataques simulados y sistemáticos para descubrir modos de fallo antes que un atacante."}, "maestro": {"title": "Modelado de amenazas MAESTRO", "summary": "Marco por capas para mapear amenazas, riesgos y dependencias en IA agéntica."}, "salvaguardas": {"title": "Salvaguardas del agente", "summary": "Mínimo privilegio, restricciones, aislamiento, validación de entrada/salida y límites de tasa."}, "roles_humanos": {"title": "Evolución del rol humano", "summary": "Las personas pasan de ejecutar a supervisar y a colaborar a medida que crece la autonomía."}, "alcance_agente": {"title": "Alcance del agente", "summary": "A quién sirve el agente (persona, equipo, proyecto, función, organización) define acceso y autonomía."}, "delegacion_progresiva": {"title": "D <script>
// ---------- build graph ----------
const M=Object.assign({title:"Grafo del libro",subtitle:"",language:"es",itemLabel:"Concepto clave",itemLabelPlural:"Conceptos",resourceLabel:"Apéndice",resourceLabelPlural:"Apéndices",searchHint:"Buscar…",pageLabel:"Página",chapterLabel:"Capítulo",sectionLabel:"Sección"},GRAPH.meta||{});

const PALETTE=["#2F4FA8","#B0622A","#16808A","#6F7C24","#7A5BA6","#A83F5A","#5B6770","#2E7D4F","#9A6B12","#3D6E8F"];
const BLOCKS={};
Object.entries(GRAPH.blocks||{}).forEach(([k,v],i)=>BLOCKS[k]={name:v.name||k,color:v.color||PALETTE[i%PALETTE.length]});

const firstBlock=Object.keys(BLOCKS)[0];
const hasRes=(GRAPH.resources||[]).length>0;
if(hasRes) BLOCKS.__res={name:M.resourceLabelPlural,color:"#8B969C"};
const nodes=[], links=[], byId={};
function add(n){nodes.push(n);byId[n.id]=n;}
const itemHome={};
(GRAPH.chapters||[]).forEach((c,ci)=>{
  const b=BLOCKS[c.block]?c.block:firstBlock, cid="ch"+c.num;
  add({id:cid,type:"ch",num:c.num,label:c.title,page:c.page,block:b,desc:c.summary,order:(ci+1)*1000,idx:ci});
  (c.sections||[]).forEach((s,si)=>{
    const sid="s"+s.num;
    add({id:sid,type:"sec",num:String(s.num),label:s.title,page:s.page,block:b,ch:c.num,desc:s.summary,order:(ci+1)*1000+si+1});
    links.push({source:cid,target:sid,kind:"contains"});
    (s.items||[]).forEach(e=>{if(!itemHome[e])itemHome[e]=sid;links.push({source:sid,target:"i:"+e,kind:"defines"});});
  });
});
Object.entries(GRAPH.items||{}).forEach(([id,it])=>{
  const home=byId[itemHome[id]];
  add({id:"i:"+id,type:"eq",label:it.title,formula:it.formula,ref:it.ref,desc:it.summary,block:home?home.block:firstBlock,ch:home?home.ch:null,home:home?home.id:null,order:home?home.order+.5:99999});
});
(GRAPH.resources||[]).forEach((r,ri)=>{
  add({id:"r:"+r.id,type:"apx",num:r.id,label:M.resourceLabel+" "+r.id+": "+r.title,short:r.title,page:r.page,block:"__res",desc:r.summary,order:900000+ri});
  (r.usedBy||[]).forEach(s=>{if(byId["s"+s])links.push({source:"s"+s,target:"r:"+r.id,kind:"data"});});
});
const RQ=GRAPH.requires||{};
const addReq=(map,pre,lvl)=>Object.entries(map||{}).forEach(([a,bs])=>bs.forEach(b=>{if(byId[pre+a]&&byId[pre+b])links.push({source:pre+a,target:pre+b,kind:"req",lvl});}));
addReq(RQ.chapters,"ch","ch");addReq(RQ.sections,"s","sec");addReq(RQ.items,"i:","eq");
const CH_DEP={};Object.entries(RQ.chapters||{}).forEach(([a,bs])=>CH_DEP[a]=bs.map(String));
// adjacency
nodes.forEach(n=>{n.out=[];n.inn=[];});
links.forEach(l=>{byId[l.source].out.push(l);byId[l.target].inn.push(l);});

// ---------- prerequisite trace ----------
function trace(id){
  const start=byId[id], set=new Set([id]), q=[];
  const push=x=>{if(!set.has(x)){set.add(x);q.push(x);}};
  const reqOf=n=>n.out.filter(l=>l.kind==="req").map(l=>l.target);
  reqOf(start).forEach(push);
  if(start.type==="sec") start.out.filter(l=>l.kind==="defines").forEach(l=>reqOf(byId[l.target]).forEach(push));
  while(q.length){const n=byId[q.shift()];reqOf(n).forEach(push);}
  // where to read each equation
  const read=new Set(set);
  [...set].forEach(x=>{const n=byId[x];if(n.type==="eq"&&n.home)read.add(n.home);});
  return {set,read};
}

// ---------- rendering ----------
const svg=d3.select("#graph"), root=svg.append("g");
const defs=svg.append("defs");
defs.append("marker").attr("id","arr").attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
  .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
  .append("path").attr("d","M0,-4L8,0L0,4").attr("fill","#7F8F99");
const gL=root.append("g"), gN=root.append("g");
let view="ch", sim=null, selected=null, traceOn=false, hidden=new Set();
const zoom=d3.zoom().scaleExtent([.2,5]).on("zoom",e=>{root.attr("transform",e.transform);labelLOD(e.transform.k);});
svg.call(zoom).on("dblclick.zoom",null);
const posCache={};
const R=n=>n.type==="ch"?17:n.type==="eq"?7:n.type==="apx"?8:4.5;
const col=n=>BLOCKS[n.block].color;

function viewFilter(n){
  if(hidden.has(n.block)) return false;
  if(view==="ch") return n.type==="ch";
  if(view==="eq") return n.type==="eq";
  return true;
}
function linkFilter(l,ids){
  if(!ids.has(l.source.id||l.source)||!ids.has(l.target.id||l.target)) return false;
  if(view==="all") return l.kind!=="req"||l.lvl!=="ch";
  return l.kind==="req";
}
let curNodes=[], curLinks=[], nodeSel, linkSel;
function render(){
  const w=svg.node().clientWidth, h=svg.node().clientHeight;
  curNodes=nodes.filter(viewFilter).map(n=>{const c=posCache[n.id];return Object.assign(n,c?{x:c.x,y:c.y}:{});});
  const ids=new Set(curNodes.map(n=>n.id));
  curLinks=links.filter(l=>linkFilter(l,ids)).map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,kind:l.kind,lvl:l.lvl}));
  // initial layout by chapter order along a spiral so chapters keep reading order
  curNodes.forEach(n=>{
    if(n.x==null){const ci=(byId["ch"+(n.ch??n.num)]||{idx:20}).idx+1, a=ci*0.62, r=60+ci*22;
      n.x=w/2+Math.cos(a)*r+(Math.random()-.5)*30; n.y=h/2+Math.sin(a)*r+(Math.random()-.5)*30;}
  });
  if(view==="ch"){
    const depth={},seen=new Set();
    const dep=c=>{c=String(c);if(depth[c]!=null)return depth[c];if(seen.has(c))return 0;seen.add(c);
      return depth[c]=(CH_DEP[c]||[]).reduce((m,p)=>Math.max(m,dep(p)+1),0);};
    const rows={};curNodes.forEach(n=>{const d=dep(n.num);(rows[d]=rows[d]||[]).push(n);});
    const rowH=w<720?96:92, maxPer=w<720?3:6; let y=50;
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(d=>{const arr=rows[d].sort((a,b)=>a.idx-b.idx);
      for(let k=0;k<arr.length;k+=maxPer){const part=arr.slice(k,k+maxPer);
        const sp=Math.min(w<720?125:250,(w-24)/part.length);
        part.forEach((n,i)=>{n.fx=w/2+(i-(part.length-1)/2)*sp;n.fy=y;n.wrap=Math.max(11,Math.min(22,Math.floor(sp/7.2)));});
        y+=rowH;}});
  } else curNodes.forEach(n=>{n.fx=null;n.fy=null;});
  linkSel=gL.selectAll("path").data(curLinks,d=>d.source+">"+d.target).join("path")
    .attr("class",d=>"link "+d.kind).attr("marker-end",d=>d.kind==="req"?"url(#arr)":null);
  nodeSel=gN.selectAll("g.node").data(curNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button")
      .attr("aria-label",d=>d.label);
    g.append("path").attr("class","shape");
    g.append("text").attr("class","num");
    g.append("text").attr("class","lbl");
    return g;
  });
  nodeSel.select(".shape").attr("fill",col).attr("d",d=>{
    const r=R(d);
    if(d.type==="eq") return `M0,${-r*1.25}L${r*1.25},0L0,${r*1.25}L${-r*1.25},0Z`;
    if(d.type==="apx") return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;
    return d3.arc()({innerRadius:0,outerRadius:r,startAngle:0,endAngle:2*Math.PI});
  });
  nodeSel.select(".num").text(d=>d.type==="ch"?d.num:d.type==="apx"?d.num:"").attr("text-anchor","middle").attr("dy","0.36em")
    .style("font-size",d=>d.type==="apx"?"9px":null);
  const lbl=nodeSel.select(".lbl").text(null).selectAll("tspan").remove();
  nodeSel.select(".lbl").each(function(d){
    const t=d3.select(this), txt=d.type==="sec"?d.num+" "+d.label:d.type==="apx"?d.short:d.label;
    if(view==="ch"){
      t.attr("x",0).attr("y",R(d)+15).attr("dy",null).attr("text-anchor","middle");
      const words=txt.split(" "),lines=[];let cur="";
      words.forEach(wd=>{if((cur+" "+wd).trim().length>(d.wrap||19)&&cur){lines.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});lines.push(cur);
      lines.forEach((ln,i)=>t.append("tspan").attr("x",0).attr("dy",i?"1.1em":0).text(ln));
    } else t.attr("x",R(d)+5).attr("y",0).attr("dy","0.35em").attr("text-anchor",null).text(txt);
  });
  nodeSel.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);}})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  if(sim) sim.stop();
  const ld={contains:34,defines:22,data:70,req:view==="all"?110:90};
  const ls={contains:.7,defines:.9,data:.08,req:view==="all"?.04:.35};
  const lsf=l=>view==="all"&&l.kind==="req"&&l.lvl==="eq"?.008:ls[l.kind];
  sim=d3.forceSimulation(curNodes)
    .force("link",d3.forceLink(curLinks).id(d=>d.id).distance(l=>ld[l.kind]).strength(lsf))
    .force("charge",d3.forceManyBody().strength(d=>view==="all"?(d.type==="ch"?-260:-45):-320))

}
function ticked(){
  linkSel.attr("d",d=>{
    const s=d.source,t=d.target;
    if(d.kind!=="req") return `M${s.x},${s.y}L${t.x},${t.y}`;
    const dx=t.x-s.x,dy=t.y-s.y,dist=Math.hypot(dx,dy)||1,r=R(t)+(t.type==="eq"?4:3);
    const tx=t.x-dx/dist*r, ty=t.y-dy/dist*r;
    return `M${s.x},${s.y}Q${(s.x+tx)/2+dy*.12},${(s.y+ty)/2-dx*.12} ${tx},${ty}`;
  });
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function labelLOD(k){
  if(!nodeSel) return;
  nodeSel.select(".lbl").style("display",d=>{
    if(selected&&(d.id===selected||(traceOn&&curTrace&&curTrace.read.has(d.id)))) return null;
    if(d.type==="ch"||view!=="all") return null;
    if(d.type==="eq"||d.type==="apx") return k>1.1?null:"none";
    return k>1.8?null:"none";
  });
}
function fit(sub){
  const set=(Array.isArray(sub)?sub:curNodes).filter(n=>n.x!=null);
  if(!set.length) return;
  let w=svg.node().clientWidth,h=svg.node().clientHeight,ox=0;
  const panelOpen=panel.classList.contains("open"), mobile=w<720;
  if(panelOpen&&!mobile){w-=400;} if(panelOpen&&mobile){h*=.4;}
  let oy=0; if(mobile&&!panelOpen){h-=56;}
  const xs=set.map(n=>n.x),ys=set.map(n=>n.y);

  const x0=Math.min(...xs)-(view==="ch"?60:30),x1=Math.max(...xs)+padR,y0=Math.min(...ys)-30,y1=Math.max(...ys)+padB;
  const k=Math.min(2.2,.92*Math.min(w/(x1-x0),h/(y1-y0)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k));
}
d3.select("#zin").on("click",()=>svg.transition().call(zoom.scaleBy,1.4));
d3.select("#zout").on("click",()=>svg.transition().call(zoom.scaleBy,1/1.4));
d3.select("#fit").on("click",()=>fit());
svg.on("click",()=>closePanel());

// ---------- highlight ----------
let curTrace=null;
function applyHighlight(){
  if(!nodeSel) return;
  nodeSel.classed("sel",d=>d.id===selected);
  if(!selected){nodeSel.classed("dim",false);linkSel.classed("dim",false).classed("hot",false);labelLOD(d3.zoomTransform(svg.node()).k);return;}
  let keep;
  if(traceOn&&curTrace){keep=curTrace.read;}
  else{keep=new Set([selected]);byId[selected].out.concat(byId[selected].inn).forEach(l=>{keep.add(l.source.id||l.source);keep.add(l.target.id||l.target);});}
  nodeSel.classed("dim",d=>!keep.has(d.id));
  linkSel.classed("dim",d=>!(keep.has(d.source.id)&&keep.has(d.target.id)))
    .classed("hot",d=>traceOn&&d.kind==="req"&&keep.has(d.source.id)&&keep.has(d.target.id));
  labelLOD(d3.zoomTransform(svg.node()).k);
}

// ---------- panel ----------
const panel=document.getElementById("panel");
const kindName={ch:M.chapterLabel,sec:M.sectionLabel,eq:M.itemLabel,apx:M.resourceLabel};
function item(id,prefix){
  const n=byId[id];
  const t=n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label;
  return `<li><button data-go="${esc(id)}"><span class="dot" style="background:${col(n)}"></span><span>${esc(t)}</span></button></li>`;
}
function list(title,ids,ordered){
  if(!ids.length) return "";
  ids=[...new Set(ids)].sort((a,b)=>byId[a].order-byId[b].order);
  return `<div class="p-sec"><h3>${title}</h3>${ordered?'<ol class="p-list path">':'<ul class="p-list">'}${ids.map(i=>item(i)).join("")}${ordered?"</ol>":"</ul>"}</div>`;
}
function select(id,center){
  selected=id;traceOn=false;curTrace=null;
  const n=byId[id];
  if(!curNodes.includes(n)){view=n.type==="ch"?"ch":n.type==="eq"?"eq":"all";hidden.delete(n.block);syncViewBtns();syncLegend();render();setTimeout(()=>centerOn(id),view==="all"?1500:1000);}
  else if(center) centerOn(id);
  const outT=k=>n.out.filter(l=>l.kind===k).map(l=>l.target.id||l.target);
  const inT=k=>n.inn.filter(l=>l.kind===k).map(l=>l.source.id||l.source);
  let html=`<button class="close" aria-label="Cerrar">×</button>
   <div class="p-kind"><span class="dot" style="background:${col(n)}"></span>${esc(kindName[n.type])} · ${esc(BLOCKS[n.block].name)}</div>
   <div class="p-title">${esc(n.type==="sec"?n.num+" "+n.label:n.type==="ch"?n.num+". "+n.label:n.label)}</div>`;
  const meta=[];
  if(n.page) meta.push(M.pageLabel+" "+n.page);
  if(n.type==="sec") meta.push(M.chapterLabel+" "+n.ch+": "+byId["ch"+n.ch].label);
  if(n.type==="eq"){if(n.ref)meta.push(M.itemLabel+" "+n.ref);if(n.home)meta.push(M.sectionLabel+" "+byId[n.home].num);}
  if(meta.length) html+=`<div class="p-meta">${esc(meta.join(". "))}</div>`;
  if(n.formula) html+=`<div class="formula" style="color:${col(n)}"><span style="color:var(--ink)">${esc(n.formula)}</span></div>`;
  if(n.desc) html+=`<p class="p-desc">${esc(n.desc)}</p>`;
  if(n.type!=="apx") html+=`<button class="trace-btn" id="traceBtn" aria-pressed="false">Trazar prerrequisitos</button><div id="pathBox"></div>`;
  if(n.type==="ch") html+=list("Secciones",outT("contains"),true)+list(M.itemLabelPlural+" clave",outT("contains").flatMap(s=>byId[s].out.filter(l=>l.kind==="defines").map(l=>l.target.id||l.target)))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"));
  if(n.type==="sec") html+=list(M.itemLabelPlural+" que presenta",outT("defines"))+list("Se apoya en",outT("req"))+list("Lo usan después",inT("req"))+list(M.resourceLabelPlural+" que consulta",outT("data"));
  if(n.type==="eq") html+=list("Se deriva de o usa",outT("req"))+list("Base de",inT("req"))+list("Dónde se presenta",inT("defines"));
  if(n.type==="apx") html+=list("Se consulta en",inT("data"));
  panel.innerHTML=html;panel.classList.add("open");
  panel.querySelector(".close").onclick=closePanel;
  panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  const tb=document.getElementById("traceBtn");
  if(tb) tb.onclick=()=>{traceOn=!traceOn;tb.setAttribute("aria-pressed",traceOn);tb.textContent=traceOn?"Quitar trazado":"Trazar prerrequisitos";
    curTrace=traceOn?trace(id):null;
    const box=document.getElementById("pathBox");
    if(traceOn){const ids=[...curTrace.read].filter(x=>x!==id&&byId[x].type!=="eq");
      box.innerHTML=ids.length?list("Ruta de lectura sugerida, en orden del libro",ids,true):'<p class="empty">No depende de otros temas: es un punto de partida.</p>';
      box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}
    else box.innerHTML="";
    applyHighlight();
    if(traceOn) fit(curNodes.filter(x=>curTrace.read.has(x.id)));};
  document.getElementById("hint").style.opacity=0;
  applyHighlight();
}
function closePanel(){panel.classList.remove("open");selected=null;traceOn=false;curTrace=null;applyHighlight();}
function centerOn(id){
  const n=byId[id];if(n.x==null) return;
  const w=svg.node().clientWidth,h=svg.node().clientHeight,k=Math.max(1.3,d3.zoomTransform(svg.node()).k);
  const mobile=w<720, cx=mobile?w/2:(w-400)/2, cy=mobile?h*.28:h/2;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(cx-k*n.x,cy-k*n.y).scale(k));
}

// ---------- controls ----------
function syncViewBtns(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.view;syncViewBtns();closePanel();render();});
const legend=document.getElementById("legend");
function syncLegend(){
  legend.innerHTML=Object.entries(BLOCKS).map(([k,v])=>`<button data-b="${k}" aria-pressed="${!hidden.has(k)}"><span class="sw" style="background:${v.color}"></span>${esc(v.name)}</button>`).join("")+
  `<div class="shapes"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#172A3A"/></svg>${esc(M.chapterLabel.toLowerCase())} o ${esc(M.sectionLabel.toLowerCase())}</span><span><svg width="12" height="12"><path d="M6 0L12 6L6 12L0 6Z" fill="#172A3A"/></svg>${esc(M.itemLabel.toLowerCase())}</span>${hasRes?`<span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#172A3A"/></svg>${esc(M.resourceLabel.toLowerCase())}</span>`:""}</div>`;
  legend.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);syncLegend();render();});
}
syncLegend();
// search
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(t.length<2){res.style.display="none";return;}
  const hits=nodes.filter(n=>norm((n.num||"")+" "+n.label+" "+(n.formula||"")+" "+(n.desc||"")).includes(t))
    .sort((a,b)=>(norm(a.label).includes(t)?0:1)-(norm(b.label).includes(t)?0:1)||a.order-b.order).slice(0,14);
  res.innerHTML=hits.length?hits.map(n=>`<li><button data-go="${esc(n.id)}"><span class="k">${esc(n.type==="sec"?n.num:n.type==="ch"?n.num:n.type==="eq"?"·":n.num)}</span><span>${esc(n.type==="apx"?n.short:n.label)}</span></button></li>`).join(""):'<li style="padding:8px;font-size:.9rem">Sin coincidencias. Prueba con otra palabra o un número de sección.</li>';
  res.style.display="block";
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{res.style.display="none";q.value="";q.blur();select(b.dataset.go,true);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector("[data-go]");if(f)f.click();}if(e.key==="Escape"){res.style.display="none";}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.style.display="none";});
window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>fit(),200);});
render();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
</script>
</body>
</html>
