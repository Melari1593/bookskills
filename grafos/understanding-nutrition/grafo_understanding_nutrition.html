<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo del libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#E9EFED; --grid:#D7E0DD; --ink:#172A3A; --ink2:#4A5A66; --line:#B9C6C3;
  --panel:#F7FAF9; --focus:#2F4FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper);z-index:5}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-top:2px}
.views{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.views button{font:600 .85rem "Barlow Semi Condensed",sans-serif;background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.views button+button{border-left:1.5px solid var(--ink)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:380px;margin-left:auto}
.search input{width:100%;font:500 .95rem "Barlow",sans-serif;padding:8px 10px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.results{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--ink);border-radius:4px;max-height:50vh;overflow:auto;z-index:20;display:none}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:3px;cursor:pointer;font-size:.9rem;box-sizing:border-box}
.results li button:hover,.results li button:focus-visible{background:var(--paper)}
.results .k{font:600 .75rem "Barlow Semi Condensed";color:var(--ink2);min-width:44px}
main{position:relative;flex:1;min-height:0}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;background:rgba(247,250,249,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:calc(100% - 24px)}
.legend button{all:unset;display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;padding:3px 2px;border-radius:3px}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend button:focus-visible{outline:2px solid var(--focus)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.shapes{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.shapes span{display:flex;align-items:center;gap:4px}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow";cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:70%;font-size:.82rem;color:var(--ink2);background:rgba(247,250,249,.9);padding:5px 10px;border-radius:3px;pointer-events:none;transition:opacity .4s}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1.5px solid var(--ink);overflow:auto;padding:18px 20px 28px;transform:translateX(102%);transition:transform .25s ease;z-index:10}
#panel.open{transform:none}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.p-kind{font:600 .8rem "Barlow Semi Condensed";display:flex;align-items:center;gap:7px;color:var(--ink2)}
.p-title{font:700 1.45rem/1.15 "Barlow Semi Condensed";margin:6px 40px 4px 0}
.p-meta{font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.formula{font:italic 500 1.15rem/1.5 "Source Serif 4",Georgia,serif;background:#fff;border-left:3px solid currentColor;padding:10px 12px;margin:10px 0 12px;overflow-wrap:anywhere;white-space:normal}
.caution{font-size:.88rem;line-height:1.45;background:#FBF1DC;border-left:3px solid #B07A12;color:#4A3A12;padding:8px 10px;margin:0 0 12px;border-radius:0 3px 3px 0}
.p-desc{line-height:1.55;font-size:.95rem;margin:0 0 14px;max-width:62ch}
.trace-btn{width:100%;font:600 .95rem "Barlow Semi Condensed";padding:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;margin:4px 0 16px;min-height:42px}
.trace-btn[aria-pressed="true"]{background:transparent;color:var(--ink)}
.p-sec h3{font:600 .9rem "Barlow Semi Condensed";margin:14px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.p-list{list-style:none;margin:0;padding:0}
.p-list li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 4px;cursor:pointer;border-radius:3px;font-size:.9rem;line-height:1.3;box-sizing:border-box}
.p-list li button:hover,.p-list li button:focus-visible{background:#E4ECEA}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
ol.path{margin:0;padding-left:1.4em}
ol.path li{margin:0}
ol.path li button{padding-left:0}
.empty{font-size:.85rem;color:var(--ink2);margin:0}
/* graph */
.link{stroke:var(--line);stroke-width:1;fill:none}
.link.req{stroke:#7F8F99;stroke-width:1.1}
.link.data{stroke-dasharray:2 3}
.node text{font:500 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.ch text.lbl{font-size:13px;font-weight:700}
.node text.num{font:700 12px "Barlow Semi Condensed";fill:#fff;stroke:none}
.node{cursor:pointer}
.node .shape{stroke:var(--paper);stroke-width:1.5}
.node.sel .shape{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
.link.hot{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.link.hot{animation:none}#panel{transition:none}}
@media (max-width:720px){
  header{padding:10px 12px 8px}
  h1{font-size:1.1rem}
  .search{max-width:none;flex-basis:100%;order:3}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1.5px solid var(--ink);transform:translateY(102%);border-radius:10px 10px 0 0}
  .legend{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;bottom:8px;left:8px;right:8px;padding:6px 8px;gap:10px}
  .legend button{white-space:nowrap}
  .shapes{display:none}
  .hint{left:12px;right:12px;transform:none;top:auto;bottom:56px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grafo del libro</h1>
  <div class="views" role="group" aria-label="Vista">
    <button data-view="ch" aria-pressed="true">Capítulos</button>
    <button data-view="eq" aria-pressed="false" id="eqBtn"></button>
    <button data-view="all" aria-pressed="false">Completo</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en el grafo">
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>
<main>
  <svg id="graph" aria-label="Grafo de conceptos"></svg>
  <div class="hint" id="hint">Toca un nodo para ver qué contiene y qué necesitas saber antes</div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="fit" aria-label="Ajustar a pantalla">⤢</button>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GRAPH = {"meta": {"title": "Understanding Nutrition como grafo", "subtitle": "Whitney y Rolfes, 12.ª ed. (Cengage, 2011): capítulos, Highlights, conceptos clave y apéndices. Alertas de evidencia y guías actualizadas a octubre de 2026.", "language": "es", "itemLabel": "Concepto clave", "itemLabelPlural": "Conceptos", "resourceLabel": "Apéndice", "resourceLabelPlural": "Apéndices", "searchHint": "Buscar: índice glucémico, EER, hierro, 4.3…"}, "blocks": {"fund": {"name": "Fundamentos y planificación"}, "macro": {"name": "Digestión y macronutrientes"}, "energia": {"name": "Metabolismo, energía, peso y actividad"}, "micro": {"name": "Vitaminas, agua y minerales"}, "ciclo": {"name": "Ciclo vital"}, "salud": {"name": "Salud, inocuidad y ambiente"}}, "chapters": [{"num": 1, "title": "Panorama de la nutrición", "page": 2, "summary": "Presenta qué determina la elección de alimentos, las seis clases de nutrientes y su aporte energético, cómo se genera y valida la evidencia en nutrición, las Ingestas Dietéticas de Referencia y los métodos de evaluación nutricional. Sirve de base conceptual y de vocabulario para todo el libro.", "sections": [{"num": "1.1", "title": "Elección de alimentos", "page": 3, "items": [], "summary": "Motivos personales, culturales, sociales, emocionales y de salud que guían qué come la gente, incluidos los alimentos funcionales."}, {"num": "1.2", "title": "Los nutrientes", "page": 5, "items": ["c01_valor_energetico"], "summary": "Composición de alimentos y cuerpo, nutrientes esenciales, nutrientes energéticos medidos en kcal, vitaminas, minerales y agua."}, {"num": "1.3", "title": "La ciencia de la nutrición", "page": 11, "items": [], "summary": "Método científico, diseños de estudio (epidemiológicos, de laboratorio, ensayos clínicos), controles, aleatorización, placebo, doble ciego, correlación frente a causalidad y revisión por pares."}, {"num": "1.4", "title": "Ingestas Dietéticas de Referencia (DRI)", "page": 17, "items": ["c01_ear_rda", "c01_ai_ul", "c01_eer", "c01_amdr"], "summary": "Cómo se fijan EAR, RDA, AI, UL, EER y AMDR, para qué sirve cada una y cómo se comparan con estándares internacionales FAO/OMS."}, {"num": "1.5", "title": "Evaluación nutricional", "page": 21, "items": ["c01_etapas_deficiencia"], "summary": "Historia, antropometría, examen físico y laboratorio en individuos; encuestas nacionales (NHANES) y metas Healthy People en poblaciones."}, {"num": "1.6", "title": "Dieta y salud", "page": 25, "items": [], "summary": "Enfermedades crónicas ligadas a la dieta y factores de riesgo modificables, que persisten en el tiempo y tienden a agruparse."}, {"num": "1.7", "title": "Highlight 1: Información y desinformación nutricional en internet y en las noticias", "page": 28, "items": [], "summary": "Cómo juzgar la fiabilidad de sitios web y noticias, quién es un experto en nutrición (dietista registrado) y señales de alarma de charlatanería."}], "block": "fund"}, {"num": 2, "title": "Planificación de una dieta saludable", "page": 34, "summary": "Expone los principios de planificación dietética y las herramientas para aplicarlos: Guías Alimentarias, Guía Alimentaria del USDA/MyPyramid, listas de intercambio y etiquetado nutricional. Sirve para pasar de las recomendaciones a menús y compras concretas.", "sections": [{"num": "2.1", "title": "Principios de planificación dietética", "page": 35, "items": ["c02_principios_densidad"], "summary": "Adecuación, equilibrio, control de kcal, densidad de nutrientes, moderación y variedad."}, {"num": "2.2", "title": "Guías Alimentarias para Estadounidenses", "page": 38, "items": ["c02_guias_alimentarias"], "summary": "Recomendaciones clave sobre energía, peso, actividad física, grupos de alimentos, grasas, carbohidratos, sodio, alcohol e inocuidad."}, {"num": "2.3", "title": "Guía Alimentaria del USDA y MyPyramid", "page": 39, "items": ["c02_usda_food_guide"], "summary": "Plan por grupos de alimentos con cantidades diarias según nivel calórico, subgrupos de verduras, kcal discrecionales, equivalencias de porción y críticas a MyPyramid."}, {"num": "2.4", "title": "Listas de intercambio y puesta en práctica del plan", "page": 47, "items": ["c02_listas_intercambio"], "summary": "Sistema que agrupa alimentos por su contenido de macronutrientes y ejemplo de cómo convertir un patrón de 2000 kcal en un menú."}, {"num": "2.5", "title": "De las guías a la compra", "page": 48, "items": [], "summary": "Elegir granos integrales frente a refinados o enriquecidos, verduras, frutas, carnes magras y lácteos bajos en grasa al comprar."}, {"num": "2.6", "title": "Etiquetas: ingredientes, porciones y Nutrition Facts", "page": 53, "items": ["c02_valores_diarios"], "summary": "Lista de ingredientes, tamaños de porción estandarizados, panel Nutrition Facts y uso de los Valores Diarios y del %VD."}, {"num": "2.7", "title": "Declaraciones de nutrientes, de salud y de estructura-función", "page": 57, "items": [], "summary": "Definiciones de la FDA para términos como libre, bajo o alto; grados de evidencia de las declaraciones de salud y diferencia con las de estructura-función."}, {"num": "2.8", "title": "Highlight 2: Dietas vegetarianas", "page": 62, "items": ["c02_vegetarianos"], "summary": "Tipos de vegetarianismo, beneficios en peso, presión arterial, cardiopatía y cáncer, y planificación para cubrir nutrientes críticos."}], "block": "fund"}, {"num": 3, "title": "Digestión, absorción y transporte", "page": 68, "summary": "Sigue el recorrido de los alimentos por el tracto gastrointestinal, desde la masticación hasta la excreción, y explica cómo los nutrientes se absorben y llegan a las células por la sangre o la linfa. Sirve de base fisiológica para entender la digestión de cada macronutriente y los trastornos digestivos frecuentes.", "sections": [{"num": "3.1", "title": "Digestión: retos y anatomía del tracto gastrointestinal", "page": 69, "items": [], "summary": "Presenta los retos que resuelve el aparato digestivo y recorre sus órganos y esfínteres desde la boca hasta el ano."}, {"num": "3.2", "title": "Acción muscular de la digestión", "page": 72, "items": [], "summary": "Describe la peristalsis, la mezcla gástrica, la segmentación intestinal y la apertura controlada de los esfínteres."}, {"num": "3.3", "title": "Secreciones digestivas y etapa final", "page": 74, "items": ["c03_secreciones_digestivas"], "summary": "Explica las enzimas e hidrólisis, la saliva, el jugo gástrico, el jugo pancreático con bicarbonato y la bilis, y qué ocurre con los residuos en el colon."}, {"num": "3.4", "title": "Absorción: vellosidades y células intestinales", "page": 78, "items": ["c03_absorcion_vellosidades"], "summary": "Muestra cómo pliegues, vellosidades y microvellosidades amplían la superficie absortiva y cómo los nutrientes entran por difusión simple, difusión facilitada o transporte activo."}, {"num": "3.5", "title": "Sistemas circulatorios: vascular y linfático", "page": 80, "items": ["c03_circulacion_portal_linfatica"], "summary": "Contrasta la ruta de los nutrientes hidrosolubles por la vena porta hacia el hígado con la de las grasas y vitaminas liposolubles por la linfa."}, {"num": "3.6", "title": "Salud y regulación del tracto GI: bacterias, hormonas y nervios", "page": 83, "items": ["c03_hormonas_gi"], "summary": "Aborda la microbiota intestinal, los probióticos y prebióticos, y la regulación por retroalimentación negativa mediante gastrina, secretina, colecistocinina y vías nerviosas."}, {"num": "3.7", "title": "El sistema digestivo en su mejor estado", "page": 86, "items": [], "summary": "Resume cómo flujo sanguíneo, sueño, actividad física, estado mental y una dieta equilibrada, moderada, variada y adecuada sostienen la salud digestiva."}, {"num": "3.8", "title": "Highlight 3: Problemas digestivos comunes", "page": 88, "items": ["c03_erge_ulcera", "c03_estrenimiento_diarrea"], "summary": "Repasa atragantamiento y maniobra de Heimlich, vómito, diarrea, estreñimiento, gases, pirosis/reflujo gastroesofágico y úlcera péptica, con estrategias de prevención."}], "block": "macro"}, {"num": 4, "title": "Carbohidratos: azúcares, almidones y fibras", "page": 96, "summary": "Describe la química, digestión, absorción y metabolismo de los carbohidratos, la regulación de la glucemia y los efectos en la salud de azúcares, edulcorantes, almidones y fibras. Sirve para fijar ingestas recomendadas (AMDR, RDA, fibra) y orientar la elección de alimentos ricos en carbohidratos.", "sections": [{"num": "4.1", "title": "Visión química de los carbohidratos", "page": 97, "items": ["c04_fibra_soluble_insoluble"], "summary": "Clasifica monosacáridos, disacáridos y polisacáridos (glucógeno, almidones y fibras), con las reacciones de condensación e hidrólisis."}, {"num": "4.2", "title": "Digestión y absorción de carbohidratos", "page": 103, "items": [], "summary": "Sigue la acción de las amilasas y de maltasa, sacarasa y lactasa, la fermentación bacteriana de la fibra y la absorción de monosacáridos con su conversión hepática a glucosa."}, {"num": "4.3", "title": "Intolerancia a la lactosa", "page": 105, "items": ["c04_intolerancia_lactosa"], "summary": "Explica síntomas, causas, prevalencia por grupos étnicos y manejo dietético de la intolerancia a la lactosa."}, {"num": "4.4", "title": "La glucosa en el cuerpo: panorama del metabolismo de los carbohidratos", "page": 107, "items": ["c04_gluconeogenesis_cetosis"], "summary": "Describe el almacenamiento como glucógeno, el uso energético de la glucosa, la gluconeogénesis a partir de proteína, la cetosis y la conversión de glucosa en grasa."}, {"num": "4.5", "title": "Constancia de la glucemia y respuesta glucémica", "page": 108, "items": ["c04_homeostasis_glucemia", "c04_indice_glucemico"], "summary": "Expone la regulación por insulina, glucagón y epinefrina, la diabetes tipos 1 y 2, la hipoglucemia y el índice glucémico con sus limitaciones."}, {"num": "4.6", "title": "Efectos en la salud e ingestas recomendadas de azúcares", "page": 112, "items": ["c04_azucares_anadidos"], "summary": "Analiza cómo el exceso de azúcares añadidos desplaza nutrientes y favorece la caries dental, y presenta los límites recomendados."}, {"num": "4.7", "title": "Edulcorantes alternativos", "page": 115, "items": ["c04_edulcorantes_alternativos"], "summary": "Compara edulcorantes artificiales, estevia y alcoholes de azúcar (polioles) según energía, ingesta diaria admisible, efectos y etiquetado."}, {"num": "4.8", "title": "Efectos en la salud e ingestas recomendadas de almidón y fibras", "page": 118, "items": ["c04_ingesta_cho_fibra"], "summary": "Revisa los beneficios de almidones y fibras en enfermedad cardiovascular, diabetes, salud intestinal, cáncer de colon y peso, los riesgos del exceso de fibra, las ingestas recomendadas y su traducción a grupos de alimentos y etiquetas."}, {"num": "4.9", "title": "Highlight 4: Carbohidratos, kilocalorías y controversias", "page": 126, "items": [], "summary": "Examina la evidencia sobre carbohidratos y obesidad: dietas bajas en carbohidratos, jarabe de maíz alto en fructosa, bebidas azucaradas, insulina e índice glucémico en el control del peso."}], "block": "macro"}, {"num": 5, "title": "Lípidos: triglicéridos, fosfolípidos y esteroles", "page": 132, "summary": "Describe la química de los lípidos, cómo se digieren, absorben y transportan en lipoproteínas, sus funciones en el cuerpo y su relación con la enfermedad cardiovascular, el cáncer y la obesidad; termina con las recomendaciones de ingesta y su aplicación al elegir alimentos.", "sections": [{"num": "5.1", "title": "Química de los ácidos grasos y los triglicéridos", "page": 133, "items": ["c05_grasas_trans"], "summary": "Longitud de cadena, grado de insaturación, familias omega-3 y omega-6, formación de triglicéridos, y cómo la saturación y la hidrogenación determinan firmeza, estabilidad y grasas trans."}, {"num": "5.2", "title": "Fosfolípidos y esteroles", "page": 139, "items": [], "summary": "La lecitina como emulsionante y componente de membranas, y el colesterol y los esteroles vegetales, con los compuestos que el cuerpo sintetiza a partir del colesterol."}, {"num": "5.3", "title": "Digestión y absorción de los lípidos", "page": 142, "items": [], "summary": "Acción de las lipasas lingual, gástrica y pancreática, emulsificación por la bilis, circulación enterohepática, micelas y formación de quilomicrones."}, {"num": "5.4", "title": "Transporte de lípidos: lipoproteínas", "page": 145, "items": ["c05_lipoproteinas"], "summary": "Quilomicrones, VLDL, LDL y HDL: composición, origen, destino y su significado para la salud cardiovascular."}, {"num": "5.5", "title": "Lípidos en el cuerpo: funciones y ácidos grasos esenciales", "page": 148, "items": ["c05_acidos_grasos_esenciales"], "summary": "Funciones de los triglicéridos y del tejido adiposo (adipocinas), ácidos linoleico y linolénico, sus derivados de cadena larga, eicosanoides y deficiencia."}, {"num": "5.6", "title": "Avance del metabolismo de los lípidos", "page": 150, "items": [], "summary": "Almacenamiento de grasa mediante la lipoproteína lipasa y movilización por la lipasa sensible a hormonas durante el ayuno, con los límites de la grasa como fuente de glucosa."}, {"num": "5.7", "title": "Efectos de los lípidos sobre la salud", "page": 151, "items": ["c05_perfil_lipidico", "c05_omega3_pescado"], "summary": "Perfil lipídico, riesgos de las grasas saturadas, trans y del colesterol dietario, beneficios de las grasas mono y poliinsaturadas y omega-3, y relación con cáncer y obesidad."}, {"num": "5.8", "title": "Ingestas recomendadas de grasa y elección de alimentos", "page": 154, "items": ["c05_recomendaciones_grasa"], "summary": "Rango de distribución de energía para grasa, IA de ácidos grasos esenciales, Valores Diarios, estrategias por grupo de alimentos, sustitutos de grasa como el olestra y lectura de etiquetas."}, {"num": "5.9", "title": "Highlight 5: Alimentos ricos en grasa, ¿amigos o enemigos?", "page": 164, "items": ["c05_sustitucion_grasa_saturada"], "summary": "Aceite de oliva, frutos secos y pescado frente a carnes grasas, lácteos enteros, aceites tropicales e hidrogenados, y la dieta mediterránea como patrón cardiosaludable."}], "block": "macro"}, {"num": 6, "title": "Proteínas: aminoácidos", "page": 172, "summary": "Explica la estructura de los aminoácidos y las proteínas, su digestión, síntesis y funciones, el recambio proteico y el balance nitrogenado, la calidad proteica de los alimentos, la malnutrición proteico-energética y las recomendaciones de ingesta; cierra con la genómica nutricional.", "sections": [{"num": "6.1", "title": "Química de las proteínas", "page": 173, "items": ["c06_aminoacidos_esenciales"], "summary": "Estructura de los aminoácidos, aminoácidos esenciales, no esenciales y condicionalmente esenciales, enlace peptídico, niveles de estructura proteica y desnaturalización."}, {"num": "6.2", "title": "Digestión y absorción de las proteínas", "page": 176, "items": [], "summary": "Desnaturalización por el ácido clorhídrico, acción de la pepsina y de las proteasas pancreáticas e intestinales, y absorción de aminoácidos y péptidos pequeños."}, {"num": "6.3", "title": "Síntesis de proteínas y expresión génica", "page": 178, "items": [], "summary": "Transcripción y traducción, errores de secuencia como en la anemia de células falciformes, y regulación de la expresión génica por nutrientes."}, {"num": "6.4", "title": "Funciones de las proteínas", "page": 181, "items": [], "summary": "Proteínas como material estructural, enzimas, hormonas, reguladoras del equilibrio hídrico (edema) y ácido-base, transportadoras, anticuerpos y fuente de energía y glucosa."}, {"num": "6.5", "title": "Avance del metabolismo proteico", "page": 184, "items": ["c06_balance_nitrogenado"], "summary": "Recambio proteico, reserva de aminoácidos, balance nitrogenado, uso de aminoácidos para otros compuestos, energía o grasa, desaminación, transaminación y síntesis y excreción de urea."}, {"num": "6.6", "title": "Proteína en los alimentos: calidad proteica", "page": 187, "items": ["c06_calidad_proteica"], "summary": "Digestibilidad, composición de aminoácidos, aminoácido limitante, proteína de referencia, proteínas complementarias y normas de etiquetado de proteína."}, {"num": "6.7", "title": "Malnutrición proteico-energética", "page": 188, "items": ["c06_pem_marasmo_kwashiorkor"], "summary": "Formas aguda y crónica, marasmo, kwashiorkor y su forma mixta, el papel de las infecciones y la rehabilitación nutricional."}, {"num": "6.8", "title": "Efectos del exceso de proteína e ingestas recomendadas", "page": 191, "items": ["c06_rda_proteina"], "summary": "Relación de la ingesta alta de proteína con enfermedad cardiaca (homocisteína), cáncer, pérdida ósea, control de peso y enfermedad renal; RDA, AMDR y la condición de energía adecuada."}, {"num": "6.9", "title": "Suplementos de proteína y aminoácidos", "page": 194, "items": [], "summary": "Por qué las proteínas en polvo, el suero y los aminoácidos aislados (ramificados, lisina, triptófano) no aportan beneficios y pueden causar daño, como el síndrome eosinofilia-mialgia."}, {"num": "6.10", "title": "Highlight 6: Genómica nutricional", "page": 198, "items": ["c06_genomica_nutricional", "c06_fenilcetonuria"], "summary": "Nutrigenómica, nutrigenética y epigenética, trastornos monogénicos como la fenilcetonuria y multigénicos como la enfermedad cardiaca, polimorfismos de un solo nucleótido y sus implicaciones clínicas."}], "block": "macro"}, {"num": 7, "title": "Metabolismo: transformaciones e interacciones", "page": 204, "summary": "Sigue a la glucosa, el glicerol, los ácidos grasos y los aminoácidos por las vías que liberan energía (glucólisis, β-oxidación, ciclo TCA, cadena de transporte de electrones) y explica qué combustibles pueden o no formar glucosa. Con esa base interpreta el exceso de energía, el ayuno, las dietas bajas en carbohidratos y el metabolismo del alcohol.", "sections": [{"num": "7.1", "title": "Reacciones químicas del cuerpo: anabolismo, catabolismo y ATP", "page": 206, "items": [], "summary": "Presenta la célula como sitio del metabolismo, el papel del hígado, las reacciones de síntesis y degradación, el ATP como moneda energética con acoplamiento de reacciones y la función de enzimas y coenzimas derivadas de vitaminas B."}, {"num": "7.2", "title": "Degradación de la glucosa: glucólisis, lactato y acetil-CoA", "page": 209, "items": ["c07_glucolisis_cori", "c07_piruvato_acetilcoa"], "summary": "Describe la glucólisis hasta piruvato, la vía anaeróbica a lactato con el ciclo de Cori y el paso aeróbico e irreversible de piruvato a acetil-CoA."}, {"num": "7.3", "title": "Glicerol, ácidos grasos y aminoácidos como combustible", "page": 215, "items": ["c07_beta_oxidacion"], "summary": "Explica que el glicerol puede formar glucosa, que los ácidos grasos se degradan a acetil-CoA sin poder formar glucosa y que los aminoácidos desaminados son glucogénicos o cetogénicos."}, {"num": "7.4", "title": "Pasos finales del catabolismo: ciclo TCA y cadena de transporte de electrones", "page": 218, "items": ["c07_ciclo_tca_cadena_electrones"], "summary": "Muestra cómo el acetil-CoA se oxida en el ciclo TCA (que necesita oxalacetato derivado de carbohidratos), cómo la cadena respiratoria genera ATP y por qué la grasa rinde más kcal por gramo."}, {"num": "7.5", "title": "Balance energético en el exceso: de la dieta a la grasa corporal", "page": 222, "items": [], "summary": "Compara cómo el exceso de proteína, carbohidrato y grasa termina en tejido adiposo: almacenar grasa dietaria cuesta cerca del 5 % de su energía y convertir carbohidrato en grasa cerca del 25 %, y la grasa no aumenta su propia oxidación."}, {"num": "7.6", "title": "Del ayuno a la inanición: gluconeogénesis y cetosis", "page": 225, "items": ["c07_ayuno_cetosis"], "summary": "Detalla las adaptaciones al ayuno: uso de glucógeno y grasa, degradación de proteína para gluconeogénesis, producción de cuerpos cetónicos para el cerebro, supresión del apetito y descenso del metabolismo."}, {"num": "7.7", "title": "Dietas bajas en carbohidratos", "page": 227, "items": [], "summary": "Aplica la fisiología del ayuno a las dietas cetogénicas: la pérdida rápida es sobre todo agua, glucógeno y proteína, la pérdida de grasa no supera a la de otras dietas isocalóricas y hay efectos adversos."}, {"num": "7.8", "title": "Highlight 7: Alcohol y nutrición", "page": 230, "items": ["c07_bebida_estandar_moderacion", "c07_metabolismo_alcohol", "c07_alcohol_consecuencias"], "summary": "Define la bebida estándar y la moderación, describe la absorción y el metabolismo hepático del etanol (alcohol deshidrogenasa, MEOS, NAD/NADH) y sus efectos en hígado, cerebro, estado nutricional y salud a corto y largo plazo."}], "block": "energia"}, {"num": 8, "title": "Balance energético y composición corporal", "page": 240, "summary": "Plantea la ecuación de energía que entra frente a energía que sale, los factores que regulan el apetito y los componentes del gasto energético, con las ecuaciones para estimarlo. Después define el peso saludable con IMC, grasa corporal y perímetro de cintura y revisa los riesgos de salud del bajo peso y la obesidad, cerrando con los trastornos de la conducta alimentaria.", "sections": [{"num": "8.1", "title": "Balance energético", "page": 241, "items": ["c08_balance_energetico_3500"], "summary": "Define el balance como ingreso frente a gasto de energía y explica la composición del peso ganado o perdido (agua, grasa y tejido magro)."}, {"num": "8.2", "title": "Energía que entra: composición de los alimentos e ingesta", "page": 242, "items": ["c08_hambre_saciacion_saciedad"], "summary": "Explica cómo se mide la energía de los alimentos (calorimetría y factores por macronutriente) y cómo hambre, saciación, saciedad, señales cognitivas y el hipotálamo regulan la ingesta."}, {"num": "8.3", "title": "Energía que sale: componentes del gasto energético", "page": 245, "items": ["c08_componentes_gasto_tmb"], "summary": "Describe el metabolismo basal, la actividad física, el efecto térmico de los alimentos y la termogénesis adaptativa, junto con los factores que suben o bajan la tasa metabólica basal."}, {"num": "8.4", "title": "Estimación de los requerimientos de energía (EER)", "page": 248, "items": ["c08_eer"], "summary": "Presenta las ecuaciones DRI de requerimiento energético estimado según sexo, edad, peso, talla y nivel de actividad física, con su margen de error individual."}, {"num": "8.5", "title": "Peso saludable e índice de masa corporal", "page": 249, "items": ["c08_imc"], "summary": "Distingue peso y composición corporal, critica el ideal estético y adopta el criterio de salud mediante el IMC con sus puntos de corte y limitaciones."}, {"num": "8.6", "title": "Grasa corporal y su distribución", "page": 254, "items": ["c08_grasa_corporal_cintura"], "summary": "Da rangos de porcentaje de grasa por sexo, distingue grasa visceral de subcutánea, fija puntos de corte de perímetro de cintura y resume los métodos para medir composición corporal."}, {"num": "8.7", "title": "Riesgos para la salud según peso y grasa corporal", "page": 256, "items": [], "summary": "Relaciona el IMC con la mortalidad en curva en J, revisa los riesgos del bajo peso y de la obesidad (enfermedad cardiovascular, diabetes tipo 2, inflamación y síndrome metabólico, cáncer) y el papel protector de la condición física."}, {"num": "8.8", "title": "Highlight 8: Trastornos de la conducta alimentaria", "page": 261, "items": ["c08_triada_atleta", "c08_criterios_tca"], "summary": "Revisa la tríada de la atleta, las prácticas peligrosas en deportistas y los criterios, consecuencias y tratamiento de la anorexia nerviosa, la bulimia nerviosa y el trastorno por atracón, con el papel de la sociedad."}], "block": "energia"}, {"num": 9, "title": "Control del peso: sobrepeso, obesidad y bajo peso", "page": 270, "summary": "Explica cómo se desarrolla y regula el tejido adiposo, qué factores genéticos y ambientales favorecen la obesidad y cómo evaluar el riesgo y tratar el exceso o el déficit de peso con dieta, actividad física, conducta, fármacos o cirugía. Sirve para decidir quién necesita perder o ganar peso y con qué estrategia segura.", "sections": [{"num": "9.1", "title": "Sobrepeso y obesidad: el adipocito y el punto de ajuste", "page": 271, "items": [], "summary": "Prevalencia de la obesidad, crecimiento de los adipocitos en número y tamaño, papel de la lipoproteína lipasa y teoría del punto de ajuste del peso."}, {"num": "9.2", "title": "Causas del sobrepeso y la obesidad", "page": 273, "items": ["c09_hormonas_apetito"], "summary": "Influencias genéticas y epigenéticas (leptina, adiponectina, grelina, PYY, proteínas desacoplantes y grasa parda) y ambientales (porciones grandes, densidad energética, sedentarismo y NEAT)."}, {"num": "9.3", "title": "Problemas del sobrepeso y la obesidad", "page": 278, "items": ["c09_criterios_riesgo_obesidad"], "summary": "Indicadores para valorar el riesgo (IMC, cintura, perfil de riesgo), cuándo está indicado bajar de peso, estigma social y peligros de dietas de moda, suplementos y otros artificios."}, {"num": "9.4", "title": "Tratamientos agresivos: fármacos y cirugía", "page": 282, "items": ["c09_farmacos_cirugia_obesidad"], "summary": "Criterios, mecanismos, eficacia y efectos adversos de los fármacos antiobesidad y de la cirugía bariátrica (bypass gástrico y banda), y límites de la liposucción."}, {"num": "9.5", "title": "Estrategias para perder peso: el plan de alimentación", "page": 284, "items": ["c09_deficit_energetico", "c09_densidad_energetica"], "summary": "Metas realistas, ritmo seguro de pérdida, déficit energético, adecuación nutricional, porciones, densidad energética, agua, fibra, grasas, carbohidratos y calorías vacías."}, {"num": "9.6", "title": "Actividad física en el control del peso", "page": 289, "items": ["c09_actividad_fisica_peso"], "summary": "Cómo el ejercicio aumenta el gasto, amplía la asignación discrecional de kcal, mejora composición corporal, apetito y bienestar, y por qué no existe la reducción localizada."}, {"num": "9.7", "title": "Influencias ambientales, conducta y actitud", "page": 293, "items": [], "summary": "Señales del entorno que aumentan la ingesta (accesibilidad, distracciones, variedad, tamaño de envases y platos) y técnicas de modificación de conducta, reestructuración cognitiva y grupos de apoyo."}, {"num": "9.8", "title": "Mantenimiento, prevención y programas de salud pública", "page": 296, "items": [], "summary": "Rasgos de quienes mantienen la pérdida de peso, estrategias para prevenir la ganancia gradual y medidas de política pública contra la obesidad."}, {"num": "9.9", "title": "Bajo peso", "page": 298, "items": ["c09_ganancia_peso"], "summary": "Causas y problemas del bajo peso y estrategias para ganar peso con alimentos de alta densidad energética, comidas regulares, refrigerios y entrenamiento de fuerza."}, {"num": "9.10", "title": "Highlight 9: La dieta milagro más reciente, otra vez", "page": 305, "items": ["c09_dietas_moda"], "summary": "Por qué atraen las dietas de moda, qué afirman y qué es cierto, comparación de dietas populares y pautas para distinguirlas de un programa razonable."}], "block": "energia"}, {"num": 10, "title": "Vitaminas hidrosolubles: vitaminas B y vitamina C", "page": 310, "summary": "Presenta las características generales de las vitaminas y describe cada vitamina B y la vitamina C: funciones como coenzimas o cofactores, recomendaciones, deficiencias, toxicidad y fuentes alimentarias. Sirve como referencia para reconocer carencias (beriberi, pelagra, anemias macrocíticas, escorbuto) y valorar el uso de suplementos.", "sections": [{"num": "10.1", "title": "Panorama de las vitaminas", "page": 311, "items": [], "summary": "Qué distingue a las vitaminas, biodisponibilidad, precursores, labilidad, diferencias entre hidrosolubles y liposolubles, y relación dosis-efecto con los UL."}, {"num": "10.2", "title": "Vitaminas B como individuos: tiamina y riboflavina", "page": 314, "items": ["c10_tiamina_beriberi"], "summary": "Coenzimas TPP, FMN y FAD en el metabolismo energético, beriberi y síndrome de Wernicke-Korsakoff, arriboflavinosis y fuentes alimentarias."}, {"num": "10.3", "title": "Niacina, biotina y ácido pantoténico", "page": 320, "items": ["c10_niacina_equivalentes"], "summary": "NAD/NADP y equivalentes de niacina a partir del triptófano, pelagra y rubor por ácido nicotínico; biotina y avidina; ácido pantoténico como parte de la coenzima A."}, {"num": "10.4", "title": "Vitamina B6", "page": 323, "items": ["c10_vitamina_b6"], "summary": "PLP en el metabolismo de aminoácidos, neurotransmisores y hemo; antagonismo por alcohol e isoniazida y neuropatía por megadosis."}, {"num": "10.5", "title": "Folato", "page": 325, "items": ["c10_folato_dfe"], "summary": "Absorción y activación del folato, equivalentes dietéticos de folato, prevención de defectos del tubo neural, fortificación, homocisteína, cáncer, deficiencia e interacciones con fármacos."}, {"num": "10.6", "title": "Vitamina B12", "page": 330, "items": ["c10_b12_anemia_perniciosa"], "summary": "Absorción dependiente de ácido gástrico y factor intrínseco, anemia perniciosa por gastritis atrófica, riesgo en veganos y enmascaramiento de la deficiencia por el folato."}, {"num": "10.7", "title": "Compuestos similares a vitaminas y falsas vitaminas", "page": 333, "items": [], "summary": "Colina como nutriente condicionalmente esencial con AI y UL, inositol y carnitina sin recomendación, y sustancias promocionadas falsamente como vitaminas."}, {"num": "10.8", "title": "Las vitaminas B en conjunto", "page": 334, "items": ["c10_coenzimas_b"], "summary": "Interdependencia de las vitaminas B en las vías metabólicas, signos comunes de deficiencia (glositis, queilosis, anemia), toxicidad por suplementos y fuentes por grupo de alimentos."}, {"num": "10.9", "title": "Vitamina C", "page": 337, "items": ["c10_vitamina_c"], "summary": "Funciones antioxidante y de cofactor (colágeno, carnitina, neurotransmisores), estrés y resfriado común, recomendaciones, escorbuto, toxicidad y fuentes."}, {"num": "10.10", "title": "Highlight 10: Suplementos de vitaminas y minerales", "page": 346, "items": ["c10_criterios_suplementos"], "summary": "Argumentos a favor y en contra de los suplementos, quiénes los necesitan, cómo elegirlos y cómo los regula la DSHEA de 1994."}], "block": "micro"}, {"num": 11, "title": "Vitaminas liposolubles: A, D, E y K", "page": 354, "summary": "Describe las cuatro vitaminas liposolubles: sus formas activas, funciones, deficiencias, toxicidades, recomendaciones y fuentes. Sirve para reconocer cuadros clínicos como xeroftalmia, raquitismo, hemólisis o enfermedad hemorrágica, y para valorar con criterio el uso de suplementos.", "sections": [{"num": "11.1", "title": "Vitamina A y betacaroteno: formas y funciones", "page": 355, "items": [], "summary": "Retinol, retinal y ácido retinoico, la conversión del betacaroteno y el papel de la vitamina A en la visión, la diferenciación epitelial, la reproducción y el crecimiento."}, {"num": "11.2", "title": "Deficiencia, toxicidad, recomendaciones y fuentes de vitamina A", "page": 358, "items": ["c11_deficiencia_vitamina_a", "c11_rae_vitamina_a"], "summary": "Ceguera nocturna, xeroftalmia, queratinización e infecciones por deficiencia; daño óseo y efecto teratógeno por exceso; RAE, conversión de UI y alimentos fuente."}, {"num": "11.3", "title": "Vitamina D: síntesis, activación y funciones", "page": 363, "items": ["c11_activacion_vitamina_d"], "summary": "Síntesis cutánea con luz UV, doble hidroxilación hepática y renal, y acción hormonal sobre intestino, riñón y hueso para mantener calcio y fósforo."}, {"num": "11.4", "title": "Deficiencia, toxicidad, recomendaciones y fuentes de vitamina D", "page": 364, "items": ["c11_raquitismo_osteomalacia", "c11_ai_vitamina_d"], "summary": "Raquitismo, osteomalacia y riesgo en ancianos; hipercalcemia por exceso; ingestas recomendadas, leche fortificada y factores que limitan la síntesis solar."}, {"num": "11.5", "title": "Vitamina E", "page": 368, "items": ["c11_vitamina_e_antioxidante"], "summary": "El alfa-tocoferol como antioxidante de membranas, la hemólisis por deficiencia en prematuros y malabsorción, su baja toxicidad y sus fuentes en aceites vegetales."}, {"num": "11.6", "title": "Vitamina K", "page": 370, "items": ["c11_vitamina_k_coagulacion"], "summary": "Activación de factores de coagulación y de osteocalcina, deficiencia secundaria por antibióticos o malabsorción, profilaxis neonatal e interacción con anticoagulantes."}, {"num": "11.7", "title": "Las vitaminas liposolubles en conjunto: interacciones", "page": 372, "items": [], "summary": "Interacciones entre vitaminas A, D, E y K y con minerales como calcio, zinc y hierro, con tabla resumen de funciones, deficiencias, toxicidades y fuentes."}, {"num": "11.8", "title": "Highlight 11: Nutrientes antioxidantes en la prevención de enfermedades", "page": 376, "items": ["c11_antioxidantes_suplementos"], "summary": "Radicales libres y estrés oxidativo, defensas antioxidantes y evidencia sobre cáncer y enfermedad cardiovascular, comparando alimentos frente a suplementos."}], "block": "micro"}, {"num": 12, "title": "Agua y minerales mayores", "page": 382, "summary": "Explica el agua corporal, el balance hídrico y su regulación hormonal, el equilibrio hidroelectrolítico y ácido-base, y los minerales mayores (sodio, cloruro, potasio, calcio, fósforo, magnesio y sulfato). Es la base para entender deshidratación, hipertensión sensible a la sal y salud ósea.", "sections": [{"num": "12.1", "title": "Agua: funciones, balance hídrico y recomendaciones", "page": 383, "items": ["c12_balance_hidrico", "c12_deshidratacion"], "summary": "Funciones del agua, compartimentos líquidos, ingresos y pérdidas diarias, sed, deshidratación, intoxicación hídrica, recomendaciones y tipos de agua."}, {"num": "12.2", "title": "Volumen sanguíneo y presión arterial", "page": 387, "items": ["c12_sistema_raa"], "summary": "Cómo el riñón, la ADH y el sistema renina-angiotensina-aldosterona ajustan la retención de agua y sodio para sostener volumen y presión."}, {"num": "12.3", "title": "Equilibrio y desequilibrio hidroelectrolítico", "page": 389, "items": [], "summary": "Electrolitos, neutralidad eléctrica, ósmosis, bomba sodio-potasio, regulación intestinal y renal, y pérdidas por vómito, diarrea o sudor con su reposición oral."}, {"num": "12.4", "title": "Equilibrio ácido-base", "page": 392, "items": ["c12_tampon_bicarbonato"], "summary": "Control del pH sanguíneo por los tampones, la respiración y la excreción renal."}, {"num": "12.5", "title": "Los minerales: panorama general", "page": 393, "items": [], "summary": "Minerales mayores frente a oligoelementos, su naturaleza inorgánica, manejo corporal, biodisponibilidad (fitatos, oxalatos) e interacciones."}, {"num": "12.6", "title": "Sodio, cloruro y potasio", "page": 394, "items": ["c12_sodio_potasio"], "summary": "Funciones en el balance de líquidos, recomendaciones, sensibilidad a la sal, dieta DASH, sodio de alimentos procesados y consecuencias de deficiencia y exceso."}, {"num": "12.7", "title": "Calcio", "page": 400, "items": ["c12_regulacion_calcemia", "c12_calcio_recomendaciones"], "summary": "Calcio óseo y en líquidos, regulación hormonal de la calcemia, absorción, recomendaciones, fuentes y biodisponibilidad, y deficiencia como pérdida ósea."}, {"num": "12.8", "title": "Fósforo, magnesio y sulfato", "page": 406, "items": [], "summary": "Funciones del fósforo en hueso, ATP y fosfolípidos; del magnesio como cofactor enzimático y en la presión arterial; y del sulfato en las proteínas."}, {"num": "12.9", "title": "Highlight 12: Osteoporosis y calcio", "page": 413, "items": ["c12_osteoporosis_tipos"], "summary": "Hueso cortical y trabecular, tipos de osteoporosis, factores de riesgo (edad, sexo, hormonas, genética, actividad, tabaco, alcohol, nutrientes) y elección de suplementos de calcio."}], "block": "micro"}, {"num": 13, "title": "Oligoelementos", "page": 422, "summary": "Describe los minerales traza (hierro, zinc, yodo, selenio, cobre, manganeso, flúor, cromo, molibdeno y otros): funciones, absorción, deficiencias, toxicidades, recomendaciones y fuentes, y cierra con los minerales contaminantes. Sirve para evaluar y prevenir carencias y excesos de micronutrientes minerales, con el hierro como eje clínico.", "sections": [{"num": "13.1", "title": "Panorama de los oligoelementos", "page": 423, "items": [], "summary": "Los minerales traza se requieren en cantidades mínimas, su contenido en los alimentos depende del suelo y el procesamiento, y varios son tóxicos a ingestas solo 2,5–7 veces mayores que el requerimiento, con interacciones frecuentes entre ellos."}, {"num": "13.2", "title": "Hierro: funciones, absorción y metabolismo", "page": 425, "items": ["c13_homeostasis_hierro", "c13_absorcion_hierro"], "summary": "El hierro alterna entre forma ferrosa y férrica, forma parte de hemoglobina, mioglobina y la cadena respiratoria, y su balance se regula sobre todo en la absorción mediante ferritina, transferrina, hemosiderina y la hormona hepcidina."}, {"num": "13.3", "title": "Deficiencia y toxicidad del hierro", "page": 427, "items": ["c13_estadios_deficiencia_hierro", "c13_sobrecarga_hierro"], "summary": "Explica los grupos de riesgo, los estadios y pruebas de la deficiencia, la anemia microcítica hipocrómica, sus efectos conductuales y la pica, así como la hemocromatosis y la intoxicación aguda por suplementos de hierro."}, {"num": "13.4", "title": "Recomendaciones, fuentes y suplementación de hierro", "page": 431, "items": ["c13_rda_hierro"], "summary": "Presenta la RDA de hierro y su cálculo, el ajuste para vegetarianos, las fuentes y alimentos enriquecidos, cómo maximizar la absorción, el hierro de contaminación (utensilios) y el uso correcto de suplementos."}, {"num": "13.5", "title": "Zinc", "page": 434, "items": ["c13_zinc"], "summary": "El zinc es cofactor de más de cien enzimas, circula entre páncreas e intestino (circulación enteropancreática), compite con hierro y cobre, y su deficiencia produce retraso del crecimiento y de la maduración sexual."}, {"num": "13.6", "title": "Yodo y selenio", "page": 438, "items": ["c13_yodo"], "summary": "El yoduro integra las hormonas tiroideas y su déficit causa bocio y cretinismo, prevenibles con sal yodada; el selenio actúa como antioxidante en la glutatión peroxidasa y su deficiencia predispone a la enfermedad de Keshan."}, {"num": "13.7", "title": "Cobre, manganeso, flúor, cromo, molibdeno y otros oligoelementos", "page": 441, "items": ["c13_fluoruro"], "summary": "Repasa el cobre (metabolismo del hierro; enfermedades de Menkes y Wilson), el manganeso, el flúor (fluorapatita, fluoración del agua y fluorosis), el cromo (acción de la insulina), el molibdeno y minerales de función incierta como níquel, silicio, vanadio, cobalto y boro."}, {"num": "13.8", "title": "Minerales contaminantes y reflexiones finales sobre los nutrientes", "page": 445, "items": [], "summary": "Los metales pesados como plomo, mercurio y cadmio desplazan a minerales nutrientes de sus sitios funcionales, y el capítulo cierra subrayando que los nutrientes actúan en interacción dentro de alimentos completos."}, {"num": "13.9", "title": "Highlight 13: Fitoquímicos y alimentos funcionales", "page": 449, "items": ["c13_fitoesteroles"], "summary": "Revisa fitoquímicos con posible efecto protector frente a cáncer y enfermedad cardiovascular (fitoestrógenos, licopeno, flavonoides, fitoesteroles) y discute los alimentos funcionales que se sitúan entre alimento y fármaco."}], "block": "micro"}, {"num": 14, "title": "Condición física: actividad física, nutrientes y adaptaciones del cuerpo", "page": 456, "summary": "Explica los beneficios y las recomendaciones de actividad física, cómo los músculos usan ATP, fosfocreatina, glucosa, grasa y proteína según la intensidad, la duración y el entrenamiento, y qué necesidades de líquidos, electrolitos y dieta tienen las personas activas. Sirve para prescribir actividad y orientar la nutrición deportiva.", "sections": [{"num": "14.1", "title": "Condición física y sus beneficios", "page": 457, "items": ["c14_recomendaciones_actividad_fisica"], "summary": "Distingue actividad física de ejercicio, enumera los beneficios de la condición física y presenta las recomendaciones de minutos semanales de actividad aeróbica y de fortalecimiento muscular según intensidad."}, {"num": "14.2", "title": "Desarrollo de la condición física: sobrecarga, resistencia cardiorrespiratoria y entrenamiento de fuerza", "page": 460, "items": [], "summary": "Expone el principio de sobrecarga progresiva (frecuencia, intensidad, duración), la hipertrofia y la atrofia, el acondicionamiento cardiorrespiratorio y el VO2max, y cómo el entrenamiento de resistencia desarrolla fuerza, potencia y resistencia muscular."}, {"num": "14.3", "title": "Sistemas energéticos: ATP y fosfocreatina", "page": 464, "items": ["c14_sistema_atp_cp"], "summary": "Los músculos usan primero ATP y fosfocreatina y luego una mezcla de combustibles cuya proporción depende de la dieta, la intensidad y duración de la actividad y el grado de entrenamiento."}, {"num": "14.4", "title": "Uso de glucosa durante la actividad física", "page": 466, "items": ["c14_glucogeno_carbohidrato", "c14_carga_carbohidratos"], "summary": "El glucógeno limita el rendimiento de resistencia; su uso depende de la dieta, la intensidad (lactato y ciclo de Cori), la duración y el entrenamiento, y puede optimizarse con carbohidrato antes, durante y después del ejercicio."}, {"num": "14.5", "title": "Uso de grasa y proteína durante la actividad y entre sesiones", "page": 469, "items": [], "summary": "La grasa corporal alimenta la actividad aeróbica moderada y prolongada y el entrenamiento aumenta su uso; la proteína aporta poco combustible pero su síntesis se acelera en la recuperación y las necesidades de atletas superan a las de sedentarios."}, {"num": "14.6", "title": "Vitaminas y minerales para la actividad física", "page": 472, "items": ["c14_anemia_deportiva"], "summary": "Los suplementos no mejoran el rendimiento de personas bien nutridas; se discuten la vitamina E frente al estrés oxidativo del ejercicio y el riesgo de deficiencia de hierro en mujeres activas, distinguiéndola de la anemia deportiva."}, {"num": "14.7", "title": "Líquidos y electrolitos: termorregulación, hidratación y bebidas", "page": 474, "items": ["c14_hidratacion_hiponatremia"], "summary": "Trata la pérdida de agua por sudor, la hipertermia, el golpe de calor y la hipotermia, los esquemas de hidratación, la reposición de electrolitos y la hiponatremia, y compara agua, bebidas deportivas, aguas enriquecidas, cafeína y alcohol."}, {"num": "14.8", "title": "Dietas para personas físicamente activas", "page": 479, "items": ["c14_dieta_rendimiento"], "summary": "Una dieta de rendimiento aporta agua, energía suficiente y alimentos densos en nutrientes con alto carbohidrato; se describen un menú de ejemplo y las comidas previas y posteriores a la competencia."}, {"num": "14.9", "title": "Highlight 14: Suplementos como ayudas ergogénicas", "page": 485, "items": ["c14_ayudas_ergogenicas"], "summary": "Evalúa ayudas ergogénicas (carnitina, picolinato de cromo, creatina, ácido linoleico conjugado, cafeína) y advierte sobre los riesgos de esteroides anabólicos, DHEA, androstenediona y hormona de crecimiento, además de la contaminación de suplementos."}], "block": "energia"}, {"num": 15, "title": "Nutrición en el ciclo vital: embarazo y lactancia", "page": 492, "summary": "Explica cómo la nutrición antes, durante y después del embarazo condiciona la salud materna y el desarrollo fetal, con metas de ganancia de peso, necesidades de energía y nutrientes, embarazos de alto riesgo y requerimientos de la madre lactante.", "sections": [{"num": "15.1", "title": "Nutrición antes del embarazo", "page": 493, "items": [], "summary": "Hábitos preconcepcionales (peso sano, dieta adecuada, actividad física, control de enfermedades crónicas y evitar tóxicos) que favorecen la fertilidad y un embarazo sano."}, {"num": "15.2", "title": "Crecimiento y desarrollo durante el embarazo", "page": 494, "items": ["c15_periodos_criticos", "c15_folato_dtn"], "summary": "Placenta, etapas de cigoto, embrión y feto, periodos críticos, defectos del tubo neural y su prevención con folato, y programación fetal de enfermedades crónicas."}, {"num": "15.3", "title": "Peso materno y ejercicio en el embarazo", "page": 499, "items": ["c15_ganancia_peso_gestacional"], "summary": "Influencia del peso pregestacional y de la ganancia de peso en el peso al nacer, componentes de la ganancia, pérdida posparto y pautas de ejercicio durante el embarazo."}, {"num": "15.4", "title": "Necesidades nutricionales durante el embarazo", "page": 503, "items": ["c15_necesidades_embarazo"], "summary": "Aumentos de energía, proteína, ácidos grasos esenciales y micronutrientes para la sangre, la división celular y el hueso; suplementos prenatales, dietas vegetarianas y molestias digestivas comunes."}, {"num": "15.5", "title": "Embarazos de alto riesgo", "page": 509, "items": ["c15_diabetes_gestacional", "c15_preeclampsia"], "summary": "Factores de riesgo, bajo peso al nacer, desnutrición materna, programa WIC, diabetes previa y gestacional, trastornos hipertensivos y efecto de la edad materna."}, {"num": "15.6", "title": "Prácticas incompatibles con el embarazo", "page": 513, "items": [], "summary": "Alcohol, fármacos, hierbas, drogas ilícitas, tabaco, contaminantes como plomo y mercurio, listeriosis, megadosis de vitamina A, cafeína, dietas para adelgazar y edulcorantes."}, {"num": "15.7", "title": "Lactancia: proceso fisiológico y conducta aprendida", "page": 516, "items": [], "summary": "Beneficios de amamantar, regulación hormonal por prolactina y oxitocina, reflejo de eyección y apoyo profesional y familiar para una lactancia exitosa."}, {"num": "15.8", "title": "Necesidades y salud de la madre lactante", "page": 517, "items": ["c15_lactancia_materna"], "summary": "Energía, nutrientes, agua y suplementos durante la lactancia, condiciones maternas (VIH, diabetes, amenorrea posparto) y prácticas incompatibles con amamantar."}, {"num": "15.9", "title": "Highlight 15: Síndrome alcohólico fetal", "page": 525, "items": ["c15_sindrome_alcoholico_fetal"], "summary": "Espectro de trastornos por exposición prenatal al alcohol, mecanismos de daño, momento de mayor vulnerabilidad y la abstinencia como única prevención."}], "block": "ciclo"}, {"num": 16, "title": "Nutrición en el ciclo vital: lactante, niñez y adolescencia", "page": 528, "summary": "Describe las necesidades nutricionales y la alimentación desde el nacimiento hasta la adolescencia: leche materna y fórmula, alimentación complementaria, problemas nutricionales de la niñez como hierro, plomo, alergias y obesidad, y hábitos del adolescente.", "sections": [{"num": "16.1", "title": "Crecimiento y necesidades de energía y nutrientes del lactante", "page": 529, "items": ["c16_energia_lactante"], "summary": "Ritmo de crecimiento en el primer año, uso de curvas de percentiles y necesidades de energía, macronutrientes, vitaminas, minerales y agua por kilo de peso."}, {"num": "16.2", "title": "Leche materna", "page": 532, "items": ["c16_leche_materna"], "summary": "Recomendación de lactancia exclusiva, frecuencia de tomas, composición nutricional, suplementos necesarios, factores inmunológicos y bancos de leche."}, {"num": "16.3", "title": "Fórmula infantil y necesidades del prematuro", "page": 535, "items": [], "summary": "Composición y estándares de las fórmulas, riesgos de su preparación, fórmulas especiales e inadecuadas, caries por biberón y alimentación del recién nacido prematuro."}, {"num": "16.4", "title": "Introducción de leche de vaca y alimentos sólidos", "page": 536, "items": ["c16_alimentacion_complementaria"], "summary": "Momento y orden de la alimentación complementaria, fuentes de hierro y vitamina C, alimentos a evitar, dietas vegetarianas en el lactante, alimentación al año y comidas con niños pequeños."}, {"num": "16.5", "title": "Necesidades de energía y nutrientes en la niñez", "page": 540, "items": ["c16_necesidades_ninez"], "summary": "Crecimiento y apetito del niño, recomendaciones de energía, carbohidratos, fibra, grasa, proteína, hierro y vitamina D, suplementos y planificación de comidas."}, {"num": "16.6", "title": "Hambre, plomo, hiperactividad y alergias alimentarias", "page": 544, "items": ["c16_plomo_hierro"], "summary": "Efectos del hambre y la deficiencia de hierro en la conducta, relación entre desnutrición e intoxicación por plomo, mitos sobre azúcar e hiperactividad, alergias e intolerancias alimentarias."}, {"num": "16.7", "title": "Obesidad infantil", "page": 549, "items": ["c16_obesidad_infantil"], "summary": "Definición por percentiles de IMC, factores genéticos y ambientales, consecuencias físicas y psicológicas, y prevención y tratamiento con dieta, actividad, apoyo, fármacos y cirugía."}, {"num": "16.8", "title": "Comidas en casa y en la escuela", "page": 554, "items": [], "summary": "Estrategias familiares para la alimentación infantil (preferencias, participación, evitar luchas de poder, meriendas, caries, modelos de rol) y programas de alimentación escolar."}, {"num": "16.9", "title": "Nutrición en la adolescencia", "page": 559, "items": ["c16_hierro_calcio_adolescencia"], "summary": "Estirón puberal, necesidades de energía, vitamina D, hierro y calcio, y hábitos del adolescente: desayuno, meriendas, bebidas, comidas fuera, alcohol, drogas y tabaco."}, {"num": "16.10", "title": "Highlight 16: Obesidad infantil y desarrollo temprano de enfermedades crónicas", "page": 569, "items": ["c16_lipidos_pediatricos"], "summary": "Inicio en la niñez de la diabetes tipo 2 y la aterosclerosis, valores de colesterol pediátrico, presión arterial, actividad física, recomendaciones dietéticas y tabaquismo."}], "block": "ciclo"}, {"num": 17, "title": "Nutrición en el ciclo vital: adultez y vejez", "page": 574, "summary": "Explica cómo la dieta y la actividad física influyen en el envejecimiento y la longevidad, qué cambios fisiológicos, psicológicos y sociales alteran el estado nutricional del adulto mayor y cómo ajustar sus necesidades de energía, agua y micronutrientes. Sirve para valorar el riesgo de malnutrición en la vejez y anticipar interacciones entre fármacos y nutrientes.", "sections": [{"num": "17.1", "title": "Nutrición y longevidad", "page": 576, "items": ["c17_restriccion_energetica"], "summary": "Esperanza de vida frente a duración máxima de la vida, hábitos que retrasan el envejecimiento fisiológico, pautas de ejercicio para mayores y efectos de la restricción energética en animales y humanos."}, {"num": "17.2", "title": "El proceso de envejecimiento: cambios fisiológicos y de otro tipo", "page": 580, "items": ["c17_peso_imc_mayores", "c17_sarcopenia"], "summary": "Estrés y respuesta al estrés, cambios de peso y composición corporal, inmunidad e «inflammaging», tracto gastrointestinal (gastritis atrófica, disfagia), pérdida dental y sensorial, y factores psicológicos, económicos y sociales que comprometen la ingesta."}, {"num": "17.3", "title": "Necesidades de agua, energía y macronutrientes del adulto mayor", "page": 583, "items": ["c17_hidratacion_mayores", "c17_eer_mayores"], "summary": "Riesgo de deshidratación, descenso del gasto energético con la edad, cálculo aproximado de la EER y prioridades de proteína, carbohidrato, fibra y grasa en una dieta de alta densidad nutricional."}, {"num": "17.4", "title": "Vitaminas, minerales y suplementos en la vejez", "page": 586, "items": ["c17_gastritis_atrofica_b12", "c17_vitamina_d_calcio_mayores"], "summary": "Nutrientes de mayor preocupación en mayores (vitamina B12, vitamina D, folato, calcio, hierro, zinc) y criterios para usar suplementos."}, {"num": "17.5", "title": "Problemas relacionados con la nutrición: visión y artritis", "page": 588, "items": [], "summary": "Cataratas y degeneración macular asociadas al estrés oxidativo y posibles factores dietéticos protectores; osteoartritis, artritis reumatoide y gota, con su relación con el peso, los ácidos grasos omega-3, los antioxidantes y las purinas."}, {"num": "17.6", "title": "El cerebro que envejece y la enfermedad de Alzheimer", "page": 589, "items": [], "summary": "Cambios normales del cerebro, relación de los nutrientes con la función cognitiva, demencia senil y enfermedad de Alzheimer, y manejo nutricional del paciente con demencia."}, {"num": "17.7", "title": "Elección de alimentos, programas de asistencia y comidas para personas solas", "page": 591, "items": [], "summary": "Hábitos alimentarios de los mayores, tamizaje de riesgo de malnutrición, programas de asistencia alimentaria (comidas congregadas, entrega a domicilio) y estrategias de compra, inocuidad y preparación para quien vive solo."}, {"num": "17.8", "title": "Highlight 17: interacciones entre nutrientes y fármacos", "page": 599, "items": ["c17_interacciones_farmaco_nutriente"], "summary": "Cómo los fármacos alteran la ingesta, la absorción, el metabolismo y la excreción de nutrientes, cómo la dieta modifica la acción de los fármacos y qué ingredientes inactivos de los medicamentos importan en dietas especiales."}], "block": "ciclo"}, {"num": 18, "title": "Dieta y salud", "page": 604, "summary": "Describe el sistema inmunitario y la inflamación como base de las enfermedades crónicas, y explica cómo se desarrollan la enfermedad cardiovascular, la hipertensión, la diabetes y el cáncer, con sus factores de riesgo y recomendaciones dietéticas. Sirve para relacionar criterios clínicos (lípidos, presión arterial, glucemia) con estrategias de prevención; cierra con un análisis de la medicina complementaria y alternativa.", "sections": [{"num": "18.1", "title": "Nutrición y enfermedades infecciosas", "page": 605, "items": [], "summary": "Componentes del sistema inmunitario (fagocitos, linfocitos B y T), espiral entre malnutrición, inmunidad deprimida e infección, VIH/sida e inflamación aguda frente a crónica."}, {"num": "18.2", "title": "Nutrición y enfermedades crónicas", "page": 608, "items": [], "summary": "Principales causas de muerte vinculadas con la dieta, interrelación entre enfermedades crónicas y su vínculo con la obesidad, e interacción entre genética y estilo de vida."}, {"num": "18.3", "title": "Enfermedad cardiovascular: aterosclerosis y factores de riesgo", "page": 610, "items": ["c18_aterosclerosis_inflamacion", "c18_estandares_riesgo_cc", "c18_sindrome_metabolico"], "summary": "Formación de placas como respuesta inflamatoria, trombosis y embolia, papel de los eicosanoides, y factores de riesgo coronario modificables y no modificables, incluidos los emergentes y el síndrome metabólico."}, {"num": "18.4", "title": "Recomendaciones para reducir el riesgo de cardiopatía coronaria", "page": 615, "items": ["c18_estrategias_dieta_cc"], "summary": "Tamizaje de colesterol, estimación del riesgo coronario a 10 años con puntaje tipo Framingham, cambios de estilo de vida y pautas prácticas de una dieta cardiosaludable."}, {"num": "18.5", "title": "Hipertensión", "page": 618, "items": ["c18_dash_modificaciones_pa"], "summary": "Determinantes de la presión arterial (gasto cardíaco y resistencia periférica), factores de riesgo de hipertensión y su tratamiento con control de peso, actividad física, dieta DASH, restricción de sodio, moderación del alcohol y fármacos."}, {"num": "18.6", "title": "Diabetes mellitus", "page": 620, "items": ["c18_diabetes_tipos_glucemia", "c18_dieta_diabetes"], "summary": "Diferencias entre diabetes tipo 1 y tipo 2, consecuencias metabólicas agudas y complicaciones crónicas macro y microvasculares y neuropáticas, y recomendaciones de nutrición y actividad física."}, {"num": "18.7", "title": "Cáncer", "page": 625, "items": ["c18_carcinogenesis_dieta"], "summary": "Etapas de la carcinogénesis, factores ambientales y obesidad, factores dietéticos iniciadores, promotores y antipromotores, y recomendaciones para reducir el riesgo de cáncer."}, {"num": "18.8", "title": "Recomendaciones para las enfermedades crónicas", "page": 629, "items": [], "summary": "Coincidencias entre las recomendaciones para cardiopatía, hipertensión, diabetes y cáncer, pirámide alternativa de Harvard, y enfoques poblacional frente a individual de la prevención."}, {"num": "18.9", "title": "Highlight 18: medicina complementaria y alternativa", "page": 636, "items": [], "summary": "Definición de medicina complementaria, alternativa e integrativa, efecto placebo, balance riesgo-beneficio, terapias relacionadas con la nutrición, precauciones con hierbas medicinales (regulación, pureza, dosis, interacciones con fármacos) y perspectiva del consumidor."}], "block": "salud"}, {"num": 19, "title": "Preocupaciones del consumidor sobre alimentos y agua", "page": 646, "summary": "Revisa los riesgos de inocuidad de la cadena alimentaria —enfermedades transmitidas por alimentos, contaminantes ambientales, tóxicos naturales, plaguicidas, aditivos y agua de consumo— y las medidas regulatorias y caseras para reducirlos; distingue toxicidad de riesgo real.", "sections": [{"num": "19.1", "title": "Enfermedades transmitidas por alimentos", "page": 648, "items": ["c19_infeccion_vs_intoxicacion", "c19_temperaturas_seguras"], "summary": "Infecciones e intoxicaciones alimentarias, controles industriales (HACCP), manejo seguro en mercado, cocina y viajes, y riesgos específicos de carnes, aves y mariscos."}, {"num": "19.2", "title": "Avances en inocuidad: irradiación y otras tecnologías", "page": 656, "items": ["c19_irradiacion"], "summary": "Usos, beneficios, regulación, etiquetado (radura) y percepción pública de la irradiación de alimentos y de otros sistemas de pasteurización en frío."}, {"num": "19.3", "title": "Adecuación nutricional de alimentos y dietas", "page": 657, "items": [], "summary": "Herramientas para obtener información nutricional y prácticas de almacenamiento y cocción que minimizan la pérdida de vitaminas hidrosolubles y minerales."}, {"num": "19.4", "title": "Contaminantes ambientales", "page": 658, "items": ["c19_mercurio_pescado"], "summary": "Persistencia y bioacumulación de contaminantes (metilmercurio de Minamata, PBB y PCB) y pautas de consumo de pescado que equilibran riesgo de mercurio y beneficio de omega-3."}, {"num": "19.5", "title": "Tóxicos naturales en los alimentos", "page": 661, "items": ["c19_toxicos_naturales"], "summary": "Bociógenos de crucíferas, cianógenos de habas lima y semillas, y solanina de la papa como ejemplo de que la dosis y la estructura, no el origen, determinan el peligro."}, {"num": "19.6", "title": "Plaguicidas", "page": 662, "items": [], "summary": "Riesgos, niveles de tolerancia de la EPA, vigilancia de la FDA (incluido el Estudio de Dieta Total), plaguicidas importados, formas de minimizar residuos, alternativas y alimentos orgánicos."}, {"num": "19.7", "title": "Aditivos alimentarios", "page": 666, "items": ["c19_margen_seguridad_aditivos", "c19_ida_aspartamo"], "summary": "Regulación de aditivos (lista GRAS, cláusula Delaney, regla de minimis, margen de seguridad), aditivos intencionales por clase y aditivos indirectos como acrilamida, dioxinas, hormonas y antibióticos."}, {"num": "19.8", "title": "Preocupaciones sobre el agua", "page": 673, "items": [], "summary": "Fuentes de agua potable (superficial y subterránea), cloración y regulación de la EPA, sistemas de tratamiento domésticos y agua embotellada."}, {"num": "19.9", "title": "Highlight 19: Biotecnología alimentaria", "page": 677, "items": ["c19_biotecnologia_regulacion"], "summary": "Promesas de la ingeniería genética (vida útil, biofortificación, procesamiento, fármacos, cultivos resistentes), sus riesgos y controversias, y la postura regulatoria de la FDA."}], "block": "salud"}, {"num": 20, "title": "Hambre y medio ambiente global", "page": 684, "summary": "Analiza la inseguridad alimentaria en Estados Unidos y el hambre mundial, sus vínculos con la pobreza, la sobrepoblación y la degradación ambiental, y las soluciones sostenibles desde los programas públicos hasta las elecciones alimentarias individuales.", "sections": [{"num": "20.1", "title": "Hambre en Estados Unidos: definición e inseguridad alimentaria", "page": 686, "items": ["c20_seguridad_alimentaria", "c20_paradoja_hambre_obesidad"], "summary": "Conceptos de seguridad e inseguridad alimentaria, su medición por encuesta de hogares, la pobreza como causa principal y la coexistencia de hambre y obesidad."}, {"num": "20.2", "title": "Alivio del hambre en Estados Unidos", "page": 687, "items": [], "summary": "Programas federales de asistencia (SNAP, WIC, comedores escolares, programas para adultos mayores), recuperación de alimentos, bancos de alimentos y esfuerzos comunitarios, con consejos para comer sano con poco presupuesto."}, {"num": "20.3", "title": "Hambre mundial y escasez de alimentos", "page": 689, "items": [], "summary": "La pobreza extrema como causa primaria del hambre mundial y las hambrunas por inestabilidad política, conflictos armados y desastres naturales."}, {"num": "20.4", "title": "Malnutrición en el mundo", "page": 691, "items": ["c20_deficiencias_micronutrientes", "c20_sinergia_desnutricion_infeccion", "c20_terapia_rehidratacion_oral"], "summary": "Deficiencias de hierro, yodo y vitamina A, bajo peso infantil, sinergia entre desnutrición e infección, mortalidad por diarrea y su prevención con rehidratación oral, y la disminución de la oferta de alimentos."}, {"num": "20.5", "title": "Pobreza y sobrepoblación", "page": 691, "items": [], "summary": "Relación bidireccional entre crecimiento poblacional, hambre y pobreza, y cómo la mejora del nivel de vida, la educación y la planificación familiar rompen el ciclo."}, {"num": "20.6", "title": "Medio ambiente global: conexiones entre hambre y ambiente", "page": 693, "items": [], "summary": "Costos ambientales de cultivos, ganadería, pesca, energía y agua en la producción de alimentos, y pérdida de biodiversidad que amenaza la oferta futura."}, {"num": "20.7", "title": "Soluciones sostenibles", "page": 695, "items": [], "summary": "Límites del riego, los fertilizantes y las variedades de alto rendimiento; agricultura y desarrollo sostenibles; y acciones de gobiernos, profesionales de la nutrición e individuos."}, {"num": "20.8", "title": "Highlight 20: Elecciones alimentarias ambientalmente responsables", "page": 700, "items": ["c20_comer_bajo_cadena_alimentaria"], "summary": "Huella ecológica, ventajas de dietas basadas en plantas y de alimentos locales, y acciones cotidianas de compra, cocina y manejo de residuos que ahorran recursos."}], "block": "salud"}], "items": {"c01_valor_energetico": {"title": "Valor energético de los macronutrientes y cálculo del % de energía", "formula": "Carbohidrato 4 kcal/g (17 kJ); proteína 4 kcal/g (17 kJ); grasa 9 kcal/g (37 kJ); alcohol 7 kcal/g (29 kJ, no es nutriente). kcal × 4,2 = kJ. % kcal de un macronutriente = (g × kcal/g) ÷ kcal totales × 100. Densidad energética = kcal ÷ g de alimento.", "summary": "Permite estimar la energía de un alimento a partir de sus gramos de carbohidrato, proteína y grasa, y la proporción de energía que aporta cada uno."}, "c01_ear_rda": {"title": "Requerimiento Promedio Estimado (EAR) y Aporte Dietético Recomendado (RDA)", "formula": "EAR = ingesta que cubre al 50 % de las personas sanas de un grupo de edad y sexo; RDA = valor fijado por encima del EAR que cubre a ~98 %. Evaluación de un individuo: ingesta habitual > RDA → probablemente adecuada; entre EAR y RDA → posiblemente inadecuada; < EAR → probablemente inadecuada.", "summary": "El EAR sirve para planear y evaluar programas en grupos y el RDA es la meta de ingesta individual para personas sanas."}, "c01_ai_ul": {"title": "Ingesta Adecuada (AI) y Nivel Máximo Tolerable (UL)", "summary": "La AI reemplaza al RDA cuando no hay evidencia para fijar un EAR, y el UL marca la ingesta diaria máxima sin riesgo de efectos adversos, útil sobre todo ante suplementos y alimentos fortificados."}, "c01_eer": {"title": "Requerimiento Estimado de Energía (EER)", "formula": "Ingesta energética promedio (kcal/día) que mantiene el balance energético según edad, sexo, peso, talla y actividad; no tiene UL. Adultos de referencia de 19–30 años: hombre 5 ft 10 in y 154 lb; mujer 5 ft 4 in y 126 lb.", "caution": "El libro se basa en las ecuaciones EER de las DRI de 2002/2005; NASEM publicó nuevas ecuaciones EER en 2023.", "summary": "A diferencia de los nutrientes, la recomendación de energía no es generosa: se fija en el promedio porque el exceso se almacena como grasa."}, "c01_amdr": {"title": "Rangos Aceptables de Distribución de Macronutrientes (AMDR)", "formula": "Adultos: carbohidrato 45–65 % de las kcal; grasa 20–35 %; proteína 10–35 %.", "summary": "Proporciones de energía de cada macronutriente que aseguran nutrientes suficientes y reducen el riesgo de enfermedad crónica."}, "c01_etapas_deficiencia": {"title": "Etapas de una deficiencia nutricional y métodos para detectarlas", "summary": "Una deficiencia primaria (dieta) o secundaria (absorción, excreción o uso alterados) pasa por depleción de reservas subclínica, detectable por laboratorio, antes de dar signos manifiestos visibles en el examen físico y la antropometría, como ilustra el hierro."}, "c02_principios_densidad": {"title": "Principios de planificación y densidad de nutrientes", "formula": "Densidad de nutrientes = cantidad de nutriente ÷ kcal del alimento. Ejemplo del libro: leche descremada 300 mg de calcio ÷ 85 kcal ≈ 3,5 mg/kcal; hojas de nabo cocidas 100 mg ÷ 15 kcal ≈ 6,7 mg/kcal.", "summary": "Los seis principios (adecuación, equilibrio, control de kcal, densidad de nutrientes, moderación y variedad) se cumplen mejor eligiendo alimentos que aportan más nutrientes por kcal."}, "c02_guias_alimentarias": {"title": "Recomendaciones clave de las Guías Alimentarias para Estadounidenses", "formula": "Adultos y niños sanos ≥2 años: grasa total 20–35 % de las kcal; grasa saturada < 10 % de las kcal; colesterol < 300 mg/día; grasas trans lo más bajas posible; sodio < 2300 mg/día (≈1 cucharadita de sal); ≥ 3 onzas-equivalentes de granos integrales al día (al menos la mitad de los granos); 3 tazas/día de lácteos descremados o bajos en grasa; alcohol hasta 1 trago/día en mujeres y 2 en hombres.", "caution": "El libro usa las Guías Alimentarias 2005 y las Guías de Actividad Física 2008; las vigentes son las Guías Alimentarias 2025–2030 (el límite de 300 mg/día de colesterol se retiró desde las de 2015–2020) y las Guías de Actividad Física, 2.ª ed. (2018).", "summary": "Consejos basados en evidencia para cubrir nutrientes dentro de las necesidades de energía, mantener el peso y reducir el riesgo de enfermedad crónica."}, "c02_usda_food_guide": {"title": "Guía Alimentaria del USDA, MyPyramid y kcal discrecionales", "formula": "Patrón de 2000 kcal: frutas 2 tazas; verduras 2½ tazas; granos 6 oz; carnes y leguminosas 5½ oz; lácteos 3 tazas; aceites 6 cucharaditas; kcal discrecionales 267. Necesidad estimada (sedentario/activo): mujeres 19–30 años 2000/2400 kcal, 31–50 años 1800/2200, ≥51 años 1600/2100; hombres 19–30 años 2400/3000, 31–50 años 2200/2900, ≥51 años 2000/2600.", "caution": "MyPyramid y la Guía Alimentaria del USDA de 2005 fueron reemplazadas por MyPlate (2011) y los patrones de las Guías Alimentarias 2025–2030.", "summary": "Plan por cinco grupos de alimentos más aceites, con cantidades según nivel calórico; las kcal discrecionales son las que quedan tras cubrir los nutrientes con alimentos densos en nutrientes."}, "c02_listas_intercambio": {"title": "Listas de intercambio", "caution": "Las listas de intercambio para diabetes (Apéndice G) fueron desplazadas por los Estándares de Atención de la ADA (actualizados cada año), que priorizan un plan individualizado y el conteo de carbohidratos.", "summary": "Herramienta creada para la diabetes que agrupa los alimentos por su proporción de carbohidrato, grasa y proteína, de modo que los de una misma lista son intercambiables; ayuda al control de kcal y a la moderación."}, "c02_valores_diarios": {"title": "Valores Diarios (VD) de la etiqueta y %VD", "formula": "Base de 2000 kcal (adultos y niños > 4 años): grasa 65 g (30 % de kcal); grasa saturada 20 g (10 %); colesterol 300 mg; carbohidrato 300 g (60 %); fibra 25 g (11,5 g/1000 kcal); proteína 50 g (10 %); sodio 2400 mg; potasio 3500 mg; vitamina C 60 mg; vitamina A 1500 µg; calcio 1000 mg; hierro 18 mg. %VD ≥ 20 % = fuente alta; 10–19 % = buena fuente; 5 % = fuente baja. VD personal = VD × (kcal propias ÷ 2000).", "caution": "Corresponden a la etiqueta anterior, basada en parte en los RDA de 1968; la regla de la FDA de 2016 (vigente desde 2020–2021) actualizó los Valores Diarios y hace obligatorios los azúcares añadidos, la vitamina D y el potasio.", "summary": "Estándares de la FDA para expresar en la etiqueta cuánto aporta una porción respecto a una dieta de 2000 kcal y comparar productos."}, "c02_vegetarianos": {"title": "Nutrientes críticos en dietas vegetarianas", "summary": "Una dieta vegetariana bien planificada debe asegurar proteína, hierro (cuyo RDA es mayor en vegetarianos por su menor absorción), zinc, calcio, vitamina B12 (en veganos solo con alimentos fortificados o suplementos), vitamina D y ácidos grasos omega-3."}, "c19_infeccion_vs_intoxicacion": {"title": "Infección alimentaria frente a intoxicación alimentaria (incluido el botulismo)", "formula": "Infección = ingestión de microbios patógenos (p. ej., Salmonella, principal causa de enfermedad; Listeria, principal causa de muerte). Intoxicación = ingestión de toxinas naturales o producidas por microbios (p. ej., Staphylococcus aureus, la más común; Clostridium botulinum en medios anaerobios de baja
