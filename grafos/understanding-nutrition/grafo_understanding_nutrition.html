acidez). No dar miel a menores de 1 año.", "caution": "El libro cita la estimación de los CDC de 76 millones de casos anuales en EE. UU.; la estimación vigente de los CDC (2011) es de unos 48 millones de casos al año.", "summary": "La enfermedad transmitida por alimentos se produce por infección con microorganismos o por intoxicación con sus toxinas; el botulismo exige atención inmediata por la parálisis que produce."}, "c19_temperaturas_seguras": {"title": "Zona de peligro y temperaturas seguras de cocción y conservación", "formula": "Zona de peligro: 40–140 °F (≈4–60 °C); no más de 2 h en ella (1 h si el aire supera 90 °F ≈ 32 °C). Refrigerador ≤40 °F (≈4 °C); congelador ≤0 °F (≈−18 °C). Cocción interna: res poco hecha, ternera y cordero 145 °F (≈63 °C); carnes término medio, huevos, cerdo y carne molida 160 °F (≈71 °C); aves, relleno y recalentado de sobras 165 °F (≈74 °C); mantener caliente ≥140 °F.", "caution": "El USDA (2011) redujo la temperatura segura para cortes enteros de cerdo a 145 °F (≈63 °C) con 3 minutos de reposo; la carne molida sigue en 160 °F.", "summary": "Las cuatro reglas básicas (limpiar, separar, cocinar y enfriar) se apoyan en temperaturas internas medidas con termómetro y en evitar la zona de peligro donde las bacterias se multiplican."}, "c19_irradiacion": {"title": "Irradiación de alimentos", "summary": "La irradiación en dosis bajas controla mohos, insectos y bacterias y prolonga la vida útil sin volver radiactivo el alimento ni causar más pérdida vitamínica que otros procesos; debe declararse en la etiqueta con el símbolo radura."}, "c19_mercurio_pescado": {"title": "Bioacumulación de mercurio y consumo de pescado en embarazo, lactancia e infancia", "formula": "Embarazadas, lactantes y niños pequeños: evitar blanquillo (tilefish), pez espada, caballa rey y tiburón; consumir hasta 12 oz/semana (≈340 g) de pescado y mariscos comerciales cocidos o enlatados, de los cuales como máximo 6 oz/semana (≈170 g) de atún blanco albacora.", "caution": "La recomendación conjunta FDA/EPA de 2017 (actualizada en 2021) aconseja en embarazo y lactancia consumir al menos 8 y hasta 12 oz/semana de pescados bajos en mercurio, con una tabla de opciones «mejores», «buenas» y «a evitar».", "summary": "Los contaminantes persistentes se concentran en cada nivel de la cadena trófica, por lo que los grandes peces depredadores acumulan más metilmercurio, tóxico para el cerebro en desarrollo."}, "c19_toxicos_naturales": {"title": "Tóxicos naturales: bociógenos, cianógenos y solanina", "formula": "Solanina: contenido medio ≈8 mg/100 g de papa; dosis tóxica 20–25 mg/100 g de papa; se concentra en brotes y capa verde bajo la piel, no se destruye con la cocción y se elimina al pelar.", "summary": "Las crucíferas aportan bociógenos que pueden agravar una enfermedad tiroidea previa, las habas lima y semillas de frutas contienen cianógenos, y la papa contiene solanina, lo que ilustra que la toxicidad depende de la dosis y no del origen natural o sintético."}, "c19_margen_seguridad_aditivos": {"title": "Aprobación de aditivos: GRAS, cláusula Delaney, regla de minimis y margen de seguridad", "formula": "Uso permitido ≤1/100 del nivel más bajo que causa daño en animales (margen de seguridad 1/100). Regla de minimis: riesgo aceptable <1 cáncer por millón de personas expuestas durante 70 años. Sal de mesa: margen ≈1/5 (3–5 veces lo habitual sería peligroso).", "summary": "La FDA exige que un aditivo sea eficaz, detectable y seguro; los de la lista GRAS están exentos, la cláusula Delaney prohíbe carcinógenos a cualquier dosis y en la práctica se aplica un estándar de riesgo insignificante."}, "c19_ida_aspartamo": {"title": "Ingesta diaria admisible (IDA) de edulcorantes: aspartamo", "formula": "IDA = cantidad consumible a diario de por vida con amplio margen, en general 1/100 del nivel sin efecto observado en animales. Aspartamo: 50 mg/kg de peso/día (la mayoría consume <5 mg/kg/día). Advertencia obligatoria para fenilcetonuria.", "caution": "En 2023 la IARC clasificó el aspartamo como posiblemente carcinógeno (grupo 2B), mientras el JECFA (FAO/OMS) mantuvo su IDA de 40 mg/kg/día; la FDA conserva 50 mg/kg/día.", "summary": "La seguridad de los sustitutos del azúcar se expresa como IDA; el aspartamo aporta fenilalanina, peligrosa en fenilcetonuria, y metanol en cantidades por debajo del umbral de daño."}, "c19_biotecnologia_regulacion": {"title": "Alimentos genéticamente modificados: usos y regulación", "caution": "El libro describe el etiquetado de alimentos modificados como voluntario; el Estándar Nacional de Divulgación de Alimentos Bioingenierizados del USDA (ley de 2016, regla de 2018) lo hizo obligatorio desde el 1 de enero de 2022.", "summary": "La ingeniería genética transfiere genes específicos para lograr rasgos como mayor vida útil, biofortificación (p. ej., arroz dorado) o resistencia a plagas; la FDA los considera sustancialmente equivalentes (GRAS) salvo que cambien la composición o introduzcan alérgenos."}, "c20_seguridad_alimentaria": {"title": "Seguridad e inseguridad alimentaria: categorías y medición en hogares", "formula": "Hogares con niños (18 preguntas): ≤2 respuestas positivas = seguridad alimentaria; 3–7 = seguridad alimentaria baja; ≥8 = muy baja. Hogares sin niños (10 preguntas): ≤2 = seguridad; 3–5 = baja; ≥6 = muy baja.", "summary": "La inseguridad alimentaria es el acceso limitado o incierto a alimentos suficientes y seguros; se clasifica en seguridad alta, marginal, baja y muy baja según respuestas a una encuesta de 12 meses."}, "c20_paradoja_hambre_obesidad": {"title": "Paradoja pobreza–obesidad", "summary": "La pobreza y la inseguridad alimentaria llevan tanto a ingesta insuficiente de nutrientes como a exceso de energía, grasa y azúcar, porque los alimentos densos en energía son los más baratos y saciantes."}, "c20_deficiencias_micronutrientes": {"title": "Deficiencias de hierro, yodo y vitamina A en el mundo", "formula": "Anemia ferropénica: >30 % de la población mundial. Deficiencia de yodo: 1 de cada 7 personas. Vitamina A: casi 80 millones de niños menores de 5 años con síntomas de deficiencia.", "summary": "Hierro, yodo y vitamina A son los nutrientes que más faltan en el mundo, con consecuencias como mortalidad materna, cretinismo, ceguera y mayor susceptibilidad a infecciones."}, "c20_sinergia_desnutricion_infeccion": {"title": "Sinergia desnutrición–infección y riesgo de muerte infantil", "formula": "Riesgo de muerte frente a niños bien nutridos: 2,5 veces en desnutrición leve, 4,6 veces en moderada y 8,4 veces en grave.", "summary": "La desnutrición y las infecciones (diarrea, infecciones respiratorias, sarampión, malaria) se potencian entre sí; la mayoría de los niños que mueren por hambre fallecen por diarrea y deshidratación."}, "c20_terapia_rehidratacion_oral": {"title": "Terapia de rehidratación oral (TRO)", "formula": "Receta casera del libro: ½ L de agua hervida + 4 cucharaditas de azúcar + ½ cucharadita de sal, por vía oral.", "caution": "La OMS y UNICEF (2004) recomiendan las sales de rehidratación oral de osmolaridad reducida (245 mOsm/L) junto con suplemento de zinc durante 10–14 días en la diarrea infantil.", "summary": "Una solución de azúcar, sal y agua por boca revierte la deshidratación de la diarrea de forma simple y barata, y junto con agua segura y saneamiento salva millones de vidas."}, "c20_comer_bajo_cadena_alimentaria": {"title": "Comer bajo en la cadena alimentaria y costo energético de los alimentos", "formula": "Granos: ≈1/3 kcal de combustible por kcal de alimento; la mayoría de los alimentos de origen animal: 10–90 kcal de combustible por kcal comestible.", "summary": "Las dietas basadas en plantas, y sobre todo las veganas, requieren menos combustible, tierra y agua que las basadas en carne de animales alimentados con grano; comprar local reduce además el transporte."}, "c03_secreciones_digestivas": {"title": "Secreciones digestivas y sus acciones", "formula": "Jugo gástrico: pH < 2 (HCl, enzimas, moco). Jugo pancreático: bicarbonato que neutraliza el quimo + enzimas para carbohidrato, grasa y proteína. Bilis: emulsionante (no enzima), liberada por la vesícula ante grasa en el duodeno.", "summary": "Cinco órganos (glándulas salivales, estómago, páncreas, hígado vía vesícula e intestino delgado) aportan agua, enzimas hidrolíticas, ácido, bicarbonato y bilis que descomponen los alimentos en nutrientes absorbibles."}, "c03_absorcion_vellosidades": {"title": "Superficie absortiva y mecanismos de absorción", "summary": "Pliegues, vellosidades y microvellosidades del intestino delgado multiplican la superficie absortiva, y los nutrientes entran a los enterocitos por difusión simple (agua, lípidos pequeños), difusión facilitada (vitaminas hidrosolubles), transporte activo (glucosa, aminoácidos) u ocasionalmente endocitosis."}, "c03_circulacion_portal_linfatica": {"title": "Transporte de nutrientes: vena porta hepática frente a linfa", "formula": "Hidrosolubles y fragmentos grasos pequeños: intestino → vena porta hepática → hígado → vena hepática → corazón. Grasas grandes y vitaminas liposolubles: quilomicrones → linfa (conducto torácico) → vena subclavia, sin pasar primero por el hígado.", "summary": "La circulación portal hace del hígado el primer órgano en recibir los nutrientes hidrosolubles, mientras que los lípidos empaquetados en quilomicrones llegan a la sangre por la linfa y evitan inicialmente el hígado."}, "c03_hormonas_gi": {"title": "Hormonas gastrointestinales y retroalimentación negativa", "formula": "Gastrina (pared gástrica; estímulo: alimento en el estómago) → secreción de HCl; el estómago mantiene pH 1,5–1,7. Secretina (pared duodenal; estímulo: quimo ácido) → jugo pancreático rico en bicarbonato. Colecistocinina (pared intestinal; estímulo: grasa o proteína) → contracción vesicular, enzimas pancreáticas y menor motilidad.", "summary": "La digestión se regula por circuitos de retroalimentación negativa hormonales y nerviosos que ajustan la acidez, la neutralización del quimo, la liberación de bilis y la velocidad del tránsito."}, "c03_erge_ulcera": {"title": "Reflujo gastroesofágico y úlcera péptica", "formula": "ERGE: síntomas de reflujo dos o más veces por semana. Causas de úlcera péptica: infección por Helicobacter pylori (la más frecuente), antiinflamatorios como aspirina, ibuprofeno y naproxeno, y trastornos con hipersecreción ácida.", "caution": "Entre los bloqueadores H2 de venta libre que cita el libro figura la ranitidina (Zantac), que la FDA retiró del mercado estadounidense en 2020 por contaminación con NDMA.", "summary": "La pirosis ocurre cuando el esfínter esofágico inferior permite el reflujo ácido y, si se repite, puede llevar a esófago de Barrett; la úlcera péptica se trata según su causa (antibióticos si hay H. pylori, suspender AINE) y no debe automedicarse con antiácidos."}, "c03_estrenimiento_diarrea": {"title": "Estreñimiento y diarrea: manejo dietético", "formula": "Estreñimiento: menos de 3 deposiciones por semana, esfuerzo y heces duras. Manejo: aumentar la fibra dietética a 20–25 g/día de forma gradual en 1–2 semanas, con abundantes líquidos y unos 30 min/día de actividad física. Diarrea: el tratamiento siempre empieza por la rehidratación.", "summary": "Estreñimiento y diarrea son síntomas, no enfermedades: el primero suele responder a fibra, líquidos, ejercicio y atender el reflejo defecatorio antes de recurrir a laxantes, y la diarrea grave o persistente en lactantes, ancianos o inmunodeprimidos exige atención médica."}, "c04_fibra_soluble_insoluble": {"title": "Fibras solubles e insolubles, almidón resistente y fibra funcional", "formula": "Fibra total = fibra dietética (intrínseca de los vegetales) + fibra funcional (extraída o fabricada, con efecto benéfico demostrado).", "summary": "Las fibras son polisacáridos no amiláceos que las enzimas humanas no digieren: las solubles (viscosas, fermentables; avena, cebada, leguminosas, cítricos) bajan colesterol y glucemia, y las insolubles (salvado, verduras) aumentan el bolo fecal y previenen estreñimiento y diverticulosis."}, "c04_intolerancia_lactosa": {"title": "Intolerancia a la lactosa", "formula": "Muchas personas intolerantes toleran hasta 6 g de lactosa (½ taza de leche) sin síntomas; 1 taza de leche aporta unos 12 g de lactosa. Solo alrededor del 30 % de la población mundial conserva lactasa suficiente en la edad adulta.", "summary": "La lactosa no digerida por déficit de lactasa atrae agua y es fermentada por bacterias, causando distensión, dolor y diarrea; el manejo consiste en dosificar y distribuir los lácteos, preferir yogur, quesos maduros o productos con lactasa, y asegurar calcio, vitamina D y riboflavina."}, "c04_gluconeogenesis_cetosis": {"title": "Gluconeogénesis, efecto ahorrador de proteína y cetosis", "formula": "Se necesitan al menos 50–100 g/día de carbohidrato para ahorrar proteína corporal y prevenir la cetosis.", "summary": "Sin carbohidrato suficiente, el cuerpo degrada proteína de músculo e hígado para fabricar glucosa (gluconeogénesis) y forma cuerpos cetónicos a partir de fragmentos de grasa, cuya acumulación altera el equilibrio ácido-base."}, "c04_homeostasis_glucemia": {"title": "Homeostasis de la glucemia y puntos de corte", "formula": "Glucemia en ayunas: normal 70–100 mg/dL; prediabetes 100–125 mg/dL; diabetes ≥126 mg/dL (repetir la prueba en ayunas para confirmar).", "summary": "La insulina (células beta) introduce la glucosa en las células y promueve su almacenamiento como glucógeno y grasa, mientras que el glucagón (células alfa) y la epinefrina liberan glucosa del glucógeno hepático; su falla da lugar a diabetes tipo 1 (falta de insulina) o tipo 2 (resistencia a la insulina) o a hipoglucemia."}, "c04_indice_glucemico": {"title": "Respuesta glucémica e índice glucémico", "formula": "Generalizaciones del libro: IG bajo, leguminosas y lácteos; moderado, cereales integrales y frutas; alto, productos de harina refinada (snacks, panes, cereales listos para comer). La carga glucémica combina el IG con la cantidad de carbohidrato.", "summary": "El índice glucémico clasifica los alimentos según su potencial para elevar la glucemia y puede ayudar al control glucémico en diabetes, pero su utilidad práctica es discutida porque varía con la variedad, el procesamiento, la cocción, la combinación de alimentos y el individuo."}, "c04_azucares_anadidos": {"title": "Azúcares añadidos: efectos y límites de ingesta", "formula": "DRI: azúcares añadidos ≤25 % de la energía total (en 2000 kcal = 500 kcal ≈ 125 g ≈ 31 cucharaditas). OMS/FAO: <10 % de la energía. 1 cucharadita de azúcar concentrado ≈ 5 g de carbohidrato ≈ 20 kcal.", "caution": "El libro se apoya en MyPyramid, las kilocalorías discrecionales y las DGA 2010. Las Dietary Guidelines 2025–2030 no recomiendan ninguna cantidad de azúcares añadidos: proponen no más de 10 g por comida y evitarlos en la infancia temprana (y ninguna cantidad entre 5 y 10 años). La OMS (2015) recomienda <10 % de la energía y sugiere <5 %, y la etiqueta de la FDA (regla de 2016) les da un Valor Diario de 50 g.", "summary": "Los azúcares añadidos aportan energía sin nutrientes, desplazan alimentos nutritivos y favorecen la caries según la frecuencia de exposición y la adherencia del alimento; miel y azúcar de mesa son nutricionalmente equivalentes."}, "c04_edulcorantes_alternativos": {"title": "Edulcorantes alternativos e ingesta diaria admisible", "formula": "IDA (tabla 4-2): aspartamo 50 mg/kg/día en EE. UU. (40 mg/kg/día según OMS, Europa y Canadá; advertencia para fenilcetonuria); sucralosa 5 mg/kg/día; acesulfame K 15 mg/kg/día. Polioles: la etiqueta debe advertir efecto laxante si el consumo razonable puede llegar a 50 g/día.", "caution": "La guía de la OMS de 2023 recomienda no usar edulcorantes no calóricos para controlar el peso ni reducir el riesgo de enfermedades no transmisibles; en 2023 la IARC clasificó el aspartamo como posible carcinógeno (grupo 2B) y el JECFA mantuvo su IDA de 40 mg/kg/día.", "summary": "Edulcorantes artificiales, estevia y alcoholes de azúcar permiten reducir azúcar y energía; los polioles aportan algo de energía, tienen baja respuesta glucémica y no causan caries, pero en exceso producen gases y diarrea."}, "c04_ingesta_cho_fibra": {"title": "Ingestas recomendadas de carbohidrato y fibra", "formula": "AMDR de carbohidrato: 45–65 % de la energía (en 2000 kcal ≈ 225–325 g). RDA de carbohidrato: 130 g/día (glucosa mínima promedio que usa el cerebro). Fibra (DRI): 14 g/1000 kcal ≈ 25–35 g/día; sin UL. Valores Diarios de etiqueta: carbohidrato 300 g (60 % de 2000 kcal), fibra 25 g (11,5 g/1000 kcal).", "caution": "La regla de etiquetado de la FDA de 2016 (vigente desde 2020–2021) cambió los Valores Diarios a 275 g de carbohidrato total y 28 g de fibra dietética, y añadió 50 g de azúcares añadidos.", "summary": "Una dieta con 45–65 % de la energía en carbohidratos, procedente sobre todo de cereales integrales, verduras, leguminosas y frutas, y con fibra suficiente, protege frente a enfermedad cardiovascular, diabetes tipo 2, trastornos intestinales y posiblemente cáncer de colon, y ayuda al control del peso."}, "c05_grasas_trans": {"title": "Hidrogenación y ácidos grasos trans", "formula": "Ingesta media de grasa trans en EE. UU. ≈ 6 g/día; en la etiqueta puede declararse «sin grasa trans» si la porción tiene ≤0,5 g de grasa trans y ≤0,5 g de grasa saturada", "caution": "La FDA retiró a los aceites parcialmente hidrogenados la condición GRAS en 2015, con efecto desde 2018, por lo que la principal fuente industrial de grasa trans que describe el libro ya no se permite en EE. UU.", "summary": "La hidrogenación parcial satura dobles enlaces y convierte configuraciones cis en trans; estas grasas trans elevan el LDL y, a ingestas altas, reducen el HDL, igual que las saturadas."}, "c05_lipoproteinas": {"title": "Lipoproteínas: quilomicrones, VLDL, LDL y HDL", "formula": "Quilomicrones: los más grandes y menos densos, sobre todo triglicéridos de la dieta; VLDL ≈ mitad triglicéridos; LDL ≈ mitad colesterol; HDL ≈ mitad proteína", "summary": "Los quilomicrones llevan los lípidos de la dieta desde el intestino por la linfa; el hígado produce VLDL, que se convierten en LDL al ceder triglicéridos, y HDL, que devuelven el colesterol al hígado."}, "c05_acidos_grasos_esenciales": {"title": "Ácidos grasos esenciales y eicosanoides", "formula": "Esenciales: ácido linoleico (18:2, omega-6) y ácido linolénico (18:3, omega-3); derivados: araquidónico (20:4, omega-6), EPA (20:5) y DHA (22:6, omega-3)", "summary": "El cuerpo no puede sintetizar los ácidos linoleico y linolénico ni convertir una familia omega en otra; a partir de ellos alarga y desatura cadenas para formar araquidónico, EPA y DHA, precursores de eicosanoides, y su deficiencia es rara."}, "c05_perfil_lipidico": {"title": "Perfil lipídico deseable", "formula": "Colesterol total <200 mg/dL; colesterol LDL <100 mg/dL; colesterol HDL ≥60 mg/dL; triglicéridos <150 mg/dL (adultos)", "caution": "Los puntos de corte provienen del ATP III (NCEP, 2002); la guía de colesterol AHA/ACC 2018 decide el tratamiento según el riesgo cardiovascular global y no por metas fijas de LDL.", "summary": "El LDL elevado aumenta el riesgo de infarto y el HDL alto parece protector; las grasas saturadas y trans son los principales determinantes dietarios del LDL."}, "c05_omega3_pescado": {"title": "Omega-3, pescado y suplementos", "formula": "AHA: 2 porciones de pescado por semana, preferiblemente pescado graso (salmón, arenque, caballa); no superar 3 g/día de omega-3 sin supervisión médica", "summary": "Los omega-3 previenen trombos y arritmias y bajan la presión arterial; se recomienda obtenerlos del pescado no frito y no se aconseja la suplementación rutinaria porque las dosis altas prolongan el sangrado y suprimen la inmunidad."}, "c05_recomendaciones_grasa": {"title": "Ingesta recomendada de grasa y Valores Diarios", "formula": "AMDR: 20–35% de la energía como grasa (adultos). IA de ácido linoleico: hombres 19–50 años 17 g/día, ≥51 años 14 g/día; mujeres 19–50 años 12 g/día, ≥51 años 11 g/día (5–10% de la energía). IA de ácido linolénico: hombres 1,6 g/día, mujeres 1,1 g/día (0,6–1,2% de la energía). Valores Diarios: grasa 65 g (30% de 2000 kcal), saturada 20 g (10%), colesterol 300 mg. Gramos de grasa = kcal totales × % de grasa ÷ 9 kcal/g", "caution": "Desde la regla de la FDA de 2016 (vigente desde 2020–2021) el Valor Diario de grasa total es 78 g; el límite de 300 mg/día de colesterol se retiró de las Dietary Guidelines desde la edición 2015–2020, y MyPyramid fue reemplazado por MyPlate (2011) y las Dietary Guidelines for Americans 2025–2030.", "summary": "Las DRI y las Dietary Guidelines de 2010 piden 20–35% de la energía como grasa, menos del 10% como saturada y la grasa trans lo más baja posible; el % de Valor Diario de la etiqueta no equivale al % de kcal provenientes de grasa."}, "c05_sustitucion_grasa_saturada": {"title": "Sustituir grasa saturada por insaturada y dieta mediterránea", "formula": "Cada 1% de la energía de ácidos grasos saturados que aumenta o disminuye ≈ 2% de cambio en el LDL ≈ 2% de cambio en el riesgo de enfermedad coronaria", "caution": "La relación 1 % → 2 % proviene del ATP III (NCEP, 2002); la referencia vigente para manejo de lípidos es la guía de colesterol AHA/ACC 2018.", "summary": "La grasa saturada es el principal determinante dietario del LDL; reemplazarla por aceite de oliva, frutos secos y pescado, como en la dieta mediterránea tradicional, mejora el perfil lipídico y reduce el riesgo cardiovascular sin cambiar la grasa total."}, "c06_aminoacidos_esenciales": {"title": "Aminoácidos esenciales y condicionalmente esenciales", "formula": "9 esenciales: histidina, isoleucina, leucina, lisina, metionina, fenilalanina, treonina, triptófano y valina; ramificados: leucina, isoleucina y valina", "summary": "De unos 20 aminoácidos comunes, nueve deben venir de la dieta; un no esencial como la tirosina se vuelve condicionalmente esencial si falta su precursor o la conversión falla, como en la fenilcetonuria."}, "c06_balance_nitrogenado": {"title": "Recambio proteico, balance nitrogenado y urea", "formula": "Balance nitrogenado = N ingerido − N excretado (orina, heces, sudor); positivo si N ingerido > N excretado, negativo si es menor. Proteína (g) ≈ nitrógeno (g) × 6,25 (la proteína tiene ≈16% de N)", "summary": "El balance es cero en el adulto sano, positivo durante el crecimiento, el embarazo y la recuperación, y negativo en el ayuno, quemaduras, infecciones y fiebre; el nitrógeno sobrante se desamina y el hígado lo convierte en urea, que excretan los riñones."}, "c06_calidad_proteica": {"title": "Calidad proteica, aminoácido limitante y proteínas complementarias", "formula": "Digestibilidad: proteínas animales 90–99%; vegetales 70–90% (soya y leguminosas >90%). Aminoácidos limitantes más frecuentes: lisina, metionina, treonina y triptófano. Valor Diario de proteína: 50 g (10% de 2000 kcal)", "caution": "La calidad que se compara con una proteína de referencia (Apéndice D) corresponde al enfoque PDCAAS; la FAO propuso en 2013 el DIAAS como medida preferida.", "summary": "La calidad depende de la digestibilidad y de la composición de aminoácidos esenciales frente a las necesidades de preescolares; combinar leguminosas y cereales a lo largo del día compensa sus aminoácidos limitantes."}, "c06_pem_marasmo_kwashiorkor": {"title": "Malnutrición proteico-energética: marasmo y kwashiorkor", "formula": "Marasmo: <2 años, crónico, <60% del peso para la edad, sin edema ni hígado graso. Kwashiorkor: 1–3 años, agudo, 60–80% del peso para la edad, con edema e hígado graso. Rehabilitación: reponer líquidos y minerales en las primeras 24–48 h; luego dieta inicial con ≈10% de la energía como proteína", "caution": "La clasificación por porcentaje del peso para la edad está superada por los puntajes Z de la OMS (patrones 2006) y la guía OMS 2013 de desnutrición aguda grave (peso para la talla < −3 DE, perímetro braquial <115 mm o edema bilateral).", "summary": "La MPE aguda produce emaciación y la crónica retraso de talla; el marasmo es inanición prolongada con pérdida grave de músculo y grasa, y el kwashiorkor, desencadenado a menudo por infecciones, cursa con edema, hígado graso y cambios en piel y cabello."}, "c06_rda_proteina": {"title": "RDA de proteína y AMDR", "formula": "Adultos: 0,8 g/kg de peso saludable/día; adolescentes de 14–18 años: 0,85 g/kg/día; AMDR 10–35% de la energía (50–175 g en una dieta de 2000 kcal); deportistas: 1,2–1,7 g/kg/día. Peso en kg = libras ÷ 2,2", "caution": "La RDA de 0,8 g/kg/día sigue vigente como DRI, pero las Dietary Guidelines 2025–2030 fijan como meta 1,2–1,6 g/kg/día para adultos; para deportistas, la posición AND/Dietitians of Canada/ACSM (2016) recomienda 1,2–2,0 g/kg/día.", "summary": "La RDA cubre la reposición y el crecimiento de tejido si la energía es suficiente; un porcentaje de energía solo sirve como referencia si la ingesta energética es razonable, por eso hay que verificar también los gramos."}, "c06_genomica_nutricional": {"title": "Nutrigenómica, nutrigenética y epigenética", "summary": "La genómica nutricional estudia cómo los nutrientes activan o silencian genes (nutrigenómica, incluida la metilación del ADN) y cómo las variantes genéticas, como los polimorfismos de un solo nucleótido, modifican la respuesta a la dieta (nutrigenética)."}, "c06_fenilcetonuria": {"title": "Fenilcetonuria (PKU)", "formula": "≈1 de cada 15 000 recién nacidos en EE. UU.; tratamiento: dieta restringida en fenilalanina con aporte de tirosina, fórmula especial y controles sanguíneos periódicos", "caution": "El libro presenta la dieta como único tratamiento; la guía del ACMG (2014, actualizada en 2023) incorpora la sapropterina (aprobada por la FDA en 2007), y la FDA aprobó la pegvaliasa en 2018 para adultos.", "summary": "Trastorno monogénico por falta de la enzima que convierte fenilalanina en tirosina; la fenilalanina se acumula y daña el sistema nervioso, y la tirosina pasa a ser esencial."}, "c07_glucolisis_cori": {"title": "Glucólisis, lactato y ciclo de Cori", "formula": "1 glucosa (6 C) → 2 piruvato (3 C); gasta 2 ATP y produce 4 ATP: ganancia neta 2 ATP (en el citosol, sin oxígeno). En anaerobiosis piruvato → lactato; lactato muscular → hígado → glucosa (ciclo de Cori, con gasto de energía).", "summary": "La glucólisis rinde poca energía pero rápida; cuando faltan oxígeno o mitocondrias el piruvato se convierte en lactato, que el hígado recicla a glucosa en el ciclo de Cori."}, "c07_piruvato_acetilcoa": {"title": "Paso irreversible de piruvato a acetil-CoA y combustibles glucogénicos", "formula": "Piruvato → acetil-CoA + CO2 (mitocondria, irreversible). Pueden formar glucosa: carbohidratos, glicerol y aminoácidos glucogénicos. No pueden: ácidos grasos ni aminoácidos cetogénicos. El glicerol es ~3 de ~50 carbonos de un triglicérido (~5 % de su peso).", "summary": "Lo que llega a piruvato puede volver a glucosa, pero el acetil-CoA no; por eso la grasa casi no aporta glucosa y, sin carbohidrato, el cuerpo degrada proteína para obtenerla."}, "c07_beta_oxidacion": {"title": "Oxidación de ácidos grasos (β-oxidación)", "formula": "Ácido graso de 16 C → 8 acetil-CoA (7 vueltas, cada una libera un fragmento de 2 C); la activación inicial con CoA gasta ATP; ocurre en la mitocondria con coenzimas de riboflavina y niacina.", "summary": "Los ácidos grasos se desarman de dos en dos carbonos hasta acetil-CoA, que entra al ciclo TCA o se usa para sintetizar grasa, pero nunca para formar glucosa."}, "c07_ciclo_tca_cadena_electrones": {"title": "Ciclo TCA, cadena de transporte de electrones y rendimiento energético", "formula": "Oxalacetato (4 C) + acetil-CoA (2 C) → compuesto de 6 C → 2 CO2 por vuelta; el oxalacetato se forma sobre todo a partir de piruvato, no de grasa. Oxidación completa: 1 glucosa ≈ 30–32 ATP; 1 ácido graso de 16 C ≈ 129 ATP. Grasa 9 kcal/g; carbohidrato y proteína 4 kcal/g. Eficiencia de captura en ATP ≈ 50 %.", "summary": "Todas las vías convergen en el ciclo TCA y la cadena respiratoria, donde el oxígeno acepta los electrones y se sintetiza ATP; la oxidación completa de la grasa requiere carbohidrato para aportar oxalacetato."}, "c07_ayuno_cetosis": {"title": "Adaptación al ayuno y cetosis", "formula": "1 g de proteína → ½ g de glucosa. Primeros días de ayuno: proteína corporal ≈ 90 % de la glucosa nueva y glicerol ≈ 10 %. Cerebro y nervios ≈ la mitad de la glucosa diaria (~500 kcal). Glucógeno agotado ~24 h; hacia ~10 días los cuerpos cetónicos cubren buena parte de la energía del sistema nervioso.", "summary": "En el ayuno el cuerpo usa grasa para la mayoría de las células, degrada proteína para la glucosa de cerebro y eritrocitos, produce cuerpos cetónicos que ahorran proteína y reduce el gasto energético."}, "c07_bebida_estandar_moderacion": {"title": "Bebida estándar, moderación y consumo excesivo", "formula": "1 bebida = ½ oz de etanol puro (≈14 g según la tabla H7-3) = 12 oz de cerveza = 5 oz de vino = 10 oz de wine cooler = 1½ oz de licor de 80 grados. Moderación: ≤2 bebidas/día en hombres y ≤1 en mujeres (máximo, no promedio). Consumo intenso: >2/día en hombres y >1/día en mujeres. Atracón: ≥5 (hombres) o ≥4 (mujeres) seguidas en ~2 h. Etanol = 7 kcal/g.", "caution": "El libro se apoya en las Dietary Guidelines 2010 (hasta 1 bebida/día en mujeres y 2 en hombres). Las Dietary Guidelines 2025–2030 eliminaron los límites numéricos y solo aconsejan «consumir menos alcohol» y evitarlo en el embarazo; el WCRF/AICR (2018) recomienda no beber alcohol para prevenir el cáncer.", "summary": "Define cuánto alcohol contiene una bebida y qué se considera consumo moderado, intenso y en atracón, con la advertencia de que la moderación es un máximo diario."}, "c07_metabolismo_alcohol": {"title": "Metabolismo del alcohol: alcohol deshidrogenasa, MEOS y NAD", "formula": "Etanol → acetaldehído (alcohol deshidrogenasa) → acetato (acetaldehído deshidrogenasa) → acetil-CoA o CO2; cada paso consume NAD y genera NADH. El hígado procesa ~½ oz de etanol por hora (≈1 bebida/h); el MEOS maneja ~1/5 del alcohol; ~10 % sale por aliento y orina.", "summary": "El alcohol se absorbe sin digestión y tiene prioridad metabólica; el exceso de NADH frena el ciclo TCA y desvía el acetil-CoA hacia ácidos grasos y cuerpos cetónicos, y el MEOS inducido altera el metabolismo de fármacos."}, "c07_alcohol_consecuencias": {"title": "Daño hepático, malnutrición y signos de alcoholismo", "formula": "Progresión hepática: hígado graso (reversible) → fibrosis → cirrosis. Deficiencias típicas: folato, tiamina (síndrome de Wernicke-Korsakoff) y vitamina B6. Diagnóstico de alcoholismo en el libro (DSM-IV): ≥3 de 7 signos (tolerancia, abstinencia, control alterado, desinterés, tiempo, capacidad alterada, problemas).", "caution": "El libro usa criterios DSM-IV (1994); el DSM-5 (2013) y el DSM-5-TR (2022) los reemplazan por el trastorno por consumo de alcohol, con ≥2 de 11 criterios y gravedad graduada.", "summary": "El consumo crónico intenso daña el hígado por etapas, desplaza alimentos e interfiere con la absorción y activación de nutrientes, de modo que ninguna dieta compensa el daño."}, "c08_balance_energetico_3500": {"title": "Balance energético y regla de 3500 kcal por libra de grasa", "formula": "1 lb de grasa corporal (454 g) ≈ 87 % grasa → 454 × 0,87 = 395 g × 9 kcal/g ≈ 3500 kcal. A largo plazo el peso ganado o perdido es ~75 % grasa y ~25 % tejido magro; en inanición, mitad y mitad. Reserva grasa de un adulto sano: 50 000–200 000 kcal.", "caution": "La regla estática de 3500 kcal sobrestima la pérdida de peso a largo plazo; los modelos dinámicos (Hall y cols., Lancet 2011; NIH Body Weight Planner) la reemplazan para predecir cambios de peso.", "summary": "Si la energía que entra iguala a la que sale el peso es estable; el excedente se guarda como grasa y los cambios rápidos de peso reflejan sobre todo agua y tejido magro."}, "c08_hambre_saciacion_saciedad": {"title": "Hambre, saciación y saciedad", "summary": "El hambre inicia la ingesta, la saciación la termina durante la comida y la saciedad retrasa la siguiente; el hipotálamo integra señales del tubo digestivo (colecistocinina, grelina, GLP-1, PYY), nutrientes y factores cognitivos, y la proteína y los alimentos de baja densidad energética son los más saciantes."}, "c08_componentes_gasto_tmb": {"title": "Componentes del gasto energético y metabolismo basal", "formula": "Metabolismo basal 50–65 %, actividad física 30–50 %, efecto térmico de los alimentos ≈10 % del gasto total. Efecto térmico por nutriente: carbohidrato 5–10 %, grasa 0–5 %, proteína 20–30 %, alcohol 15–20 %. TMB rápida: hombres 1,1–1,3 kcal/min o 24 kcal/kg/día; mujeres 0,8–1,0 kcal/min o 23 kcal/kg/día. Ecuación de TMB (peso kg, talla cm, edad años): hombres (10 × peso) + (6,25 × talla) − (5 × edad) + 5; mujeres (10 × peso) + (6,25 × talla) − (5 × edad) − 161. La fiebre sube la TMB 7 % por cada °F.", "summary": "La mayor parte del gasto diario es el metabolismo basal, que aumenta con la masa magra, el crecimiento, la fiebre y el estrés y baja con la edad, el ayuno y la malnutrición; la actividad física es el componente más variable."}, "c08_eer": {"title": "Requerimiento energético estimado (EER) del adulto", "formula": "Adultos ≥19 años (edad en años, peso en kg, talla en m). Hombres: EER = [662 − (9,53 × edad)] + AF × [(15,91 × peso) + (539,6 × talla)]; AF = 1,0 sedentario, 1,11 poco activo, 1,25 activo, 1,48 muy activo. Mujeres: EER = [354 − (6,91 × edad)] + AF × [(9,36 × peso) + (726 × talla)]; AF = 1,0; 1,12; 1,27; 1,45. Requerimiento real: la mayoría dentro de EER ± 200 kcal (hombres) o ± 160 kcal (mujeres); casi todos dentro de ± 400 o ± 320 kcal.", "caution": "Son las ecuaciones DRI de 2002/2005; las ecuaciones EER de NASEM 2023 las reemplazan.", "summary": "Las ecuaciones DRI estiman la energía diaria según sexo, edad, peso, talla y nivel de actividad física, con un margen de error individual considerable."}, "c08_imc": {"title": "Índice de masa corporal y clasificación del peso", "formula": "IMC = peso (kg) / talla (m)² = peso (lb) / talla (in)² × 703. Adultos: bajo peso <18,5; saludable 18,5–24,9; sobrepeso 25–29,9; obesidad ≥30; obesidad extrema ≥40. Con IMC <17 aparecen signos de enfermedad y menor función reproductiva. Supervivencia óptima con IMC 22,5–25. Meta inicial razonable: bajar 2 unidades de IMC.", "summary": "El IMC relaciona peso y talla y se asocia con riesgo de enfermedad y mortalidad en curva en J, pero no mide grasa y puede clasificar mal a personas musculosas y a algunos grupos étnicos."}, "c08_grasa_corporal_cintura": {"title": "Porcentaje de grasa corporal y perímetro de cintura", "formula": "Grasa normal: hombres 13–21 %, mujeres 23–31 %. Riesgo cuando supera 22 % (hombres jóvenes), 25 % (hombres >40 años), 32 % (mujeres jóvenes) y 35 % (mujeres >40 años). Perímetro de cintura de alto riesgo: >88 cm (35 in) en mujeres y >102 cm (40 in) en hombres.", "summary": "La grasa visceral o central predice riesgo cardiometabólico independientemente del IMC; el perímetro de cintura es la medida clínica preferida y, junto con el IMC, sirve para valorar y seguir el riesgo."}, "c08_triada_atleta": {"title": "Tríada de la atleta femenina", "formula": "Tríada: alimentación desordenada + amenorrea + osteoporosis. Amenorrea en mujeres premenopáusicas de EE. UU.: 2–5 %, hasta 66 % en atletas. Recomendación para atletas jóvenes: 1300 mg/día de calcio.", "caution": "La ACSM (2007) ya redefinió la tríada como un espectro de baja disponibilidad energética, disfunción menstrual y baja densidad mineral ósea, y el COI propuso el síndrome RED-S (2014; actualizaciones 2018 y 2023), que incluye a hombres.", "summary": "La restricción energética y el sobreentrenamiento en deportes estéticos o de categoría de peso causan amenorrea y pérdida ósea con fracturas por estrés que pueden no revertirse, por lo que la prevención es clave."}, "c08_criterios_tca": {"title": "Criterios diagnósticos de anorexia, bulimia y trastorno por atracón", "formula": "Según DSM-IV-TR en el libro. Anorexia nerviosa: peso <85 % del esperado, miedo intenso a engordar, alteración de la imagen corporal y amenorrea de ≥3 ciclos consecutivos; tipos restrictivo y compulsivo/purgativo. Bulimia nerviosa: atracones y conductas compensatorias en promedio ≥2 veces por semana durante 3 meses; tipos purgativo y no purgativo. Trastorno por atracón (no especificado): atracones ≥2 días por semana durante 6 meses, con ≥3 de 5 rasgos, sin conductas compensatorias. Prevalencia de por vida: anorexia 0,9 % en mujeres y 0,3 % en hombres; bulimia 1,5 % y 0,5 %; atracón 3,5 % y 2 %.", "caution": "El libro usa DSM-IV-TR (2000); el DSM-5 (2013) y el DSM-5-TR (2022) eliminaron la amenorrea y el 85 % como criterio de anorexia, bajaron la frecuencia de bulimia y atracón a ≥1 vez por semana durante 3 meses, reconocieron el trastorno por atracón como diagnóstico propio y añadieron ARFID.", "summary": "Resume los criterios, las complicaciones similares a la desnutrición proteico-energética y el tratamiento multidisciplinario de los trastornos de la conducta alimentaria, que en la anorexia empieza con ingestas pequeñas (~1200 kcal/día) que se aumentan de forma gradual."}, "c09_hormonas_apetito": {"title": "Hormonas que regulan apetito y gasto (leptina, grelina, adiponectina, PYY)", "summary": "La leptina del adipocito suprime el apetito y sube con el IMC (resistencia a la leptina), la grelina gástrica lo estimula y aumenta en balance negativo, la adiponectina baja en la obesidad y protege frente a resistencia a la insulina, y el PYY intestinal señala saciedad."}, "c09_criterios_riesgo_obesidad": {"title": "Criterios de riesgo para indicar pérdida de peso", "formula": "Adultos: IMC 25,0–29,9 = sobrepeso; IMC ≥30 = obesidad; IMC <18,5 = bajo peso. Perímetro de cintura de riesgo: hombres >102 cm (>40 in), mujeres >88 cm (>35 in). Pérdida de peso indicada si hay obesidad, o sobrepeso (o cintura alta) con ≥2 factores de riesgo (HTA, tabaquismo, LDL alto, HDL bajo, intolerancia a la glucosa, antecedente familiar de cardiopatía, hombre ≥45 años, mujer ≥55 años) o con enfermedad grave (cardiopatía, diabetes tipo 2, apnea del sueño).", "summary": "El riesgo se valora combinando IMC, perímetro de cintura y perfil de enfermedad; el sobrepeso en buena salud puede manejarse solo evitando más ganancia."}, "c09_farmacos_cirugia_obesidad": {"title": "Indicaciones de fármacos y cirugía bariátrica", "formula": "Fármacos: sin respuesta a dieta y ejercicio + IMC ≥30, o IMC ≥27 con problemas de salud relacionados con el peso, sin contraindicaciones. Cirugía: sin respuesta a dieta y ejercicio + IMC ≥40, o IMC ≥35 con comorbilidad (p. ej., diabetes o HTA), sin contraindicaciones médicas ni psicológicas y con motivación para el seguimiento. El orlistat reduce la absorción de grasa dietaria en ~30 %.", "caution": "La sibutramina citada por el libro se retiró del mercado de EE. UU. en 2010; hoy se usan agonistas GLP-1 y GIP/GLP-1 (semaglutida 2021, tirzepatida 2023) y los criterios quirúrgicos ASMBS/IFSO 2022 (IMC ≥35 sin importar comorbilidad; considerar desde IMC 30–34,9 con enfermedad metabólica).", "summary": "Para obesidad grave o con comorbilidades el libro describe sibutramina, orlistat, fentermina/dietilpropión y la cirugía gástrica, que exige supervisión de por vida por deficiencias de vitaminas y minerales."}, "c09_deficit_energetico": {"title": "Déficit energético y ritmo seguro de pérdida de peso", "formula": "Déficit de 500–1000 kcal/día (dieta + actividad) → pérdida de 0,45–0,9 kg (1–2 lb)/semana. Ritmo razonable: 0,2–0,9 kg (½–2 lb)/semana o 10 % del peso corporal en 6 meses. Reducción según IMC: IMC ≥35 → 500–1000 kcal/día menos de lo habitual; IMC 27–35 → 300–500 kcal/día menos. Dietas típicas: ~1200 kcal/día en mujeres y ~1600 kcal/día en hombres; por debajo de 1200 kcal/día es difícil cubrir nutrientes. Meta inicial realista: 5–10 % del peso.", "summary": "La dieta para adelgazar debe aportar menos energía de la que se gasta sin comprometer la adecuación nutricional; las pérdidas rápidas sacrifican tejido magro y favorecen la recuperación."}, "c09_densidad_energetica": {"title": "Densidad energética de los alimentos", "formula": "Densidad energética (kcal/g) = kcal del alimento ÷ gramos. Ejemplo: zanahoria 31 kcal ÷ 72 g = 0,43 kcal/g; papas fritas 167 kcal ÷ 50 g = 3,34 kcal/g.", "summary": "Elegir alimentos ricos en agua y fibra y bajos en grasa reduce la densidad energética y permite porciones saciantes con menos kcal; los alimentos densos ayudan a ganar peso."}, "c09_actividad_fisica_peso": {"title": "Actividad física para perder y mantener peso", "formula": "Prevenir ganancia: ~60 min/día de actividad moderada además de las actividades cotidianas (DRI). Mantener una pérdida: 60–90 min/día de actividad moderada (Dietary Guidelines) o un gasto ≥2500 kcal/semana en actividad física. Actividad que gasta ≥2000 kcal/semana es especialmente útil para el control del peso. Caminar a ritmo moderado ≈ 1 kcal/milla/kg de peso.", "caution": "Las Physical Activity Guidelines for Americans, 2.ª ed. (2018), reemplazan la guía de 2008 y recomiendan 150–300 min/semana de actividad moderada (o 75–150 de vigorosa) más fortalecimiento muscular, con más actividad si se busca controlar el peso.", "summary": "Combinar dieta y ejercicio pierde más grasa, conserva músculo, mejora la adherencia y reduce la grasa abdominal y el riesgo metabólico aun sin bajar de peso."}, "c09_ganancia_peso": {"title": "Estrategia para ganar peso en el bajo peso", "formula": "Bajo peso: IMC <18,5. Aporte adicional de 500–1000 kcal/día sobre las necesidades, junto con entrenamiento de fuerza; al inicio pueden requerirse 750–800 kcal/día extra para ganar ~0,45 kg (1 lb)/semana por termogénesis adaptativa; ritmo razonable ≈ 0,45 kg (1 lb)/mes.", "summary": "Ganar peso saludable exige entrenamiento de fuerza y mayor ingesta con alimentos de alta densidad energética, tres comidas o más, porciones grandes, refrigerios y bebidas calóricas."}, "c09_dietas_moda": {"title": "Cómo reconocer una dieta de moda frente a un plan razonable", "formula": "Plan razonable: pérdida gradual ≤0,9 kg (2 lb)/semana; no menos de 1000 kcal/día en mujeres ni 1200 kcal/día en hombres; proteína entre la RDA y 2 veces la RDA; grasa 20–35 % de la energía; carbohidratos ≥100 g/día para evitar cetosis; fibra 20–30 g/día; agua ≥1 L/día o 1 mL/kcal (lo que sea mayor); actividad física que gaste ≥300 kcal/día.", "summary": "Toda dieta que restrinja la energía produce pérdida transitoria; las dietas de moda fallan por no mantener la pérdida ni la salud y por prometer resultados rápidos, productos especiales o pagos por adelantado."}, "c10_tiamina_beriberi": {"title": "Tiamina: coenzima TPP y beriberi", "formula": "RDA de tiamina (adultos): hombres 1,2 mg/día; mujeres 1,1 mg/día. Sin UL.", "summary": "La TPP interviene en la conversión de piruvato a acetil-CoA; su deficiencia causa beriberi seco (neuromuscular) o húmedo (cardiovascular con edema) y, en el alcoholismo, síndrome de Wernicke-Korsakoff."}, "c10_niacina_equivalentes": {"title": "Equivalentes de niacina y pelagra", "formula": "1 NE = 1 mg de niacina = 60 mg de triptófano. Estimación: triptófano (mg) ≈ g de proteína ÷ 100 × 1000; NE = mg triptófano ÷ 60 + mg de niacina preformada. RDA (adultos): hombres 16 mg NE/día; mujeres 14 mg NE/día. UL adultos: 35 mg/día.", "summary": "La niacina (NAD/NADP) puede sintetizarse a partir del triptófano; su deficiencia produce pelagra (dermatitis, diarrea, demencia y muerte) y el ácido nicotínico en dosis altas causa rubor y daño hepático."}, "c10_vitamina_b6": {"title": "Vitamina B6: PLP, antagonistas y neurotoxicidad", "formula": "RDA adultos (19–50 años): 1,3 mg/día. UL adultos: 100 mg/día; se describió daño neurológico con >2 g/día durante ≥2 meses.", "summary": "El PLP transfiere grupos amino y participa en la síntesis de aminoácidos no esenciales, serotonina, niacina y hemo; el alcohol y la isoniazida inducen deficiencia (depresión, confusión, convulsiones)."}, "c10_folato_dfe": {"title": "Folato: equivalentes dietéticos y prevención de defectos del tubo neural", "formula": "DFE (µg) = µg de folato natural de alimentos + 1,7 × µg de folato sintético (suplementos y alimentos fortificados). RDA adultos: 400 µg DFE/día; embarazo: 600 µg DFE/día. UL adultos: 1000 µg/día de folato de suplementos o alimentos fortificados. Mujeres que pueden embarazarse: 400 µg (0,4 mg)/día de folato; con hijo previo con defecto del tubo neural: 4 mg/día desde antes de la concepción hasta el fin del primer trimestre. Fortificación obligatoria en EE. UU.: 140 µg de folato por 100 g de grano.", "summary": "El folato (THF) es indispensable para la síntesis de ADN; su deficiencia causa anemia macrocítica y deterioro gastrointestinal, y su suplementación periconcepcional reduce los defectos del tubo neural."}, "c10_b12_anemia_perniciosa": {"title": "Vitamina B12: factor intrínseco, anemia perniciosa y enmascaramiento por folato", "formula": "RDA adultos: 2,4 µg/día. Sin UL.", "summary": "La absorción de B12 requiere ácido clorhídrico y factor intrínseco, por lo que la gastritis atrófica en mayores de 50 años causa anemia perniciosa; el folato en dosis altas corrige la anemia pero deja avanzar el daño neurológico."}, "c10_coenzimas_b": {"title": "Coenzimas de las vitaminas B en el metabolismo energético", "formula": "Tiamina → TPP; riboflavina → FMN y FAD; niacina → NAD y NADP; ácido pantoténico → CoA; biotina → coenzima de carboxilación (piruvato → oxalacetato); B6 → PLP; folato → THF; B12 → metilcobalamina y desoxiadenosilcobalamina.", "summary": "Cada vitamina B forma parte de coenzimas que hacen funcionar glucólisis, ciclo TCA, cadena de transporte de electrones y síntesis de células nuevas, por lo que una sola deficiencia altera múltiples sistemas."}, "c10_vitamina_c": {"title": "Vitamina C: recomendaciones, escorbuto y toxicidad", "formula": "RDA adultos: hombres 90 mg/día; mujeres 75 mg/día; fumadores +35 mg/día. UL adultos: 2000 mg/día. ~10 mg/día previenen el escorbuto; ~100 mg/día saturan los tejidos en el 95 % de la población; la absorción se satura hacia 200 mg/día.", "summary": "Antioxidante y cofactor de la hidroxilación del colágeno; su deficiencia causa escorbuto (encías sangrantes, petequias, mala cicatrización) y las megadosis provocan diarrea, interfieren con pruebas de glucosa y favorecen cálculos renales en predispuestos."}, "c10_criterios_suplementos": {"title": "Quién necesita suplementos y cómo elegirlos", "formula": "Si la dieta no puede corregirse: multivitamínico-mineral con 50–150 % del Valor Diario de cada nutriente; ninguna dosis diaria por encima del UL; ≤10 mg de hierro por dosis salvo prescripción; preferir sello USP (desintegración en 30–45 min). Necesitan suplemento, entre otros: ingestas <1600 kcal/día, veganos y adultos mayores con gastritis atrófica (B12), mujeres en edad fértil y embarazadas (folato, hierro).", "caution": "Los Valores Diarios usados por el libro (p. ej., vitamina C 60 mg) fueron actualizados por la regla de etiquetado de la FDA de 2016 (vigente desde 2020–2021); además, la USPSTF (2022) recomienda no usar β-caroteno ni vitamina E para prevenir ECV o cáncer.", "summary": "Los suplementos se justifican ante deficiencias, necesidades aumentadas o enfermedad; en los demás casos no sustituyen a una dieta variada y pueden causar toxicidad o interacciones."}, "c11_deficiencia_vitamina_a": {"title": "Deficiencia de vitamina A: ceguera nocturna, xeroftalmia y queratinización", "summary": "Al agotarse las reservas hepáticas, la falta de retinal impide regenerar la rodopsina (ceguera nocturna, signo temprano) y la sequedad corneal progresa de xerosis a queratomalacia y ceguera irreversible, junto con queratinización epitelial e infecciones."}, "c11_rae_vitamina_a": {"title": "Equivalentes de actividad de retinol (RAE), RDA y UL de vitamina A", "formula": "1 µg RAE = 1 µg retinol = 2 µg β-caroteno (suplemento) = 12 µg β-caroteno (dietario) = 24 µg de otros carotenoides provitamina A; 1 UI retinol = 0,3 µg retinol. RDA adultos: hombres 900 µg RAE/día, mujeres 700 µg RAE/día. UL adultos: 3000 µg/día de vitamina A preformada.", "summary": "Unidad que integra retinoides y carotenoides; el exceso de vitamina A preformada (no de betacaroteno alimentario) daña el hueso y es teratógeno, sobre todo antes de la séptima semana de gestación."}, "c11_activacion_vitamina_d": {"title": "Síntesis y activación de la vitamina D", "formula": "7-dehidrocolesterol (piel) + UV → previtamina D3 → vitamina D3 → hidroxilación hepática → 25-hidroxivitamina D (calcidiol) → hidroxilación renal → 1,25-dihidroxivitamina D (calcitriol, forma activa).", "summary": "La vitamina D actúa como hormona tras dos hidroxilaciones, por lo que la enfermedad hepática o renal puede causar deficiencia aunque la ingesta o la exposición solar sean suficientes."}, "c11_raquitismo_osteomalacia": {"title": "Raquitismo y osteomalacia", "formula": "Prevención del raquitismo (AAP): mínimo 400 UI/día de vitamina D para todos los lactantes, niños y adolescentes.", "summary": "Sin vitamina D no se sintetiza la proteína fijadora de calcio intestinal; la mineralización falla y aparecen piernas arqueadas y rosario raquítico en niños, y huesos blandos y dolorosos en adultos."}, "c11_ai_vitamina_d": {"title": "Ingesta adecuada y límite superior de vitamina D", "formula": "AI 1997 adultos: 5 µg/día (19–50 años), 10 µg/día (51–70 años), 15 µg/día (>70 años). UL adultos: 50 µg/día. Conversión: 1 UI = 0,025 µg; 1 µg = 40 UI.", "caution": "Recomendación superada: el IOM fijó en 2011 una RDA de 15 µg (600 UI)/día para adultos hasta 70 años y de 20 µg (800 UI)/día para mayores de 70, con UL de 100 µg (4000 UI)/día.", "summary": "El libro advierte que estas cifras asumen ausencia de síntesis cutánea y podrían ser insuficientes; la vitamina D es la vitamina con mayor riesgo de toxicidad (hipercalcemia y calcificación de tejidos blandos)."}, "c11_vitamina_e_antioxidante": {"title": "Vitamina E (alfa-tocoferol): función antioxidante, deficiencia y valores de referencia", "formula": "RDA adultos: 15 mg/día de alfa-tocoferol. UL adultos: 1000 mg/día. 1 UI de alfa-tocoferol natural = 0,67 mg. Equivalentes de tocoferol × 0,8 ≈ mg de alfa-tocoferol.", "summary": "Detiene la reacción en cadena de radicales libres que oxida los ácidos grasos poliinsaturados de las membranas; su deficiencia, propia de prematuros y de la malabsorción de grasas, causa hemólisis eritrocitaria y daño neuromuscular, y en dosis muy altas potencia los anticoagulantes."}, "c11_vitamina_k_coagulacion": {"title": "Vitamina K: coagulación, profilaxis neonatal y anticoagulantes", "formula": "AI adultos: hombres 120 µg/día, mujeres 90 µg/día. Sin UL establecido. Dosis única al nacer, oral o intramuscular.", "summary": "Activa la protrombina y otros factores de coagulación, además de la osteocalcina ósea; la deficiencia secundaria (recién nacidos, antibióticos, malabsorción) provoca hemorragia, y una ingesta variable altera el efecto de los anticoagulantes."}, "c11_antioxidantes_suplementos": {"title": "Radicales libres, estrés oxidativo y antioxidantes: alimentos frente a suplementos", "caution": "Guía más reciente: la USPSTF (2022) recomienda no usar suplementos de β-caroteno ni de vitamina E para prevenir enfermedad cardiovascular o cáncer.", "summary": "Las vitaminas E y C, el betacaroteno y las enzimas dependientes de selenio, cobre, manganeso y zinc frenan el daño oxidativo; la protección se asocia a frutas y verduras, mientras que los suplementos no muestran beneficio o aumentan el riesgo (betacaroteno en fumadores)."}, "c12_balance_hidrico": {"title": "Balance hídrico y recomendación de agua", "formula": "Ingresos = egresos ≈ 1450–2800 mL/día. Excreción urinaria obligatoria ≈ 500 mL/día. Recomendación: 1,0–1,5 mL/kcal gastada en adultos; 1,5 mL/kcal en lactantes y deportistas. AI de agua total: hombres 3,7 L/día, mujeres 2,7 L/día.", "summary": "El agua (≈60 % del peso adulto) entra con bebidas, alimentos y agua metabólica y sale por orina, piel, pulmones y heces; el riñón ajusta la orina para mantener el equilibrio."}, "c12_deshidratacion": {"title": "Deshidratación e intoxicación hídrica (hiponatremia)", "formula": "Pérdida de peso corporal: 1–2 % sed, fatiga, debilidad; 3–4 % menor rendimiento físico, boca seca, menos orina; 5–6 % dificultad para concentrarse, cefalea, mala termorregulación; 7–10 % mareo, espasticidad, delirio, colapso. Con sudoración intensa: limitar la ingesta a 1–1,5 L/hora.", "summary": "La sed llega tarde, sobre todo en ancianos; el exceso de agua (10–20 L en pocas horas) diluye el sodio y produce hiponatremia con confusión, convulsiones y riesgo de muerte."}, "c12_sistema_raa": {"title": "ADH y sistema renina-angiotensina-aldosterona", "formula": "↓ volumen o presión → renina (riñón) → angiotensinógeno → angiotensina I → angiotensina II (vasoconstricción) → aldosterona (retención de Na⁺ y excreción de K⁺) y ADH (reabsorción de agua).", "summary": "Con hipovolemia, hipotensión o líquidos concentrados, estas hormonas retienen agua y sodio; explica por qué las dietas altas en sodio agravan la hipertensión y el edema."}, "c12_tampon_bicarbonato": {"title": "Sistema tampón bicarbonato-ácido carbónico", "formula": "CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻", "summary": "El pH sanguíneo se mantiene en un rango estrecho gracias a los tampones, al pulmón (que regula el ácido carbónico eliminando CO₂) y al riñón (que reabsorbe o excreta bicarbonato); el vómito intenso causa alcalosis metabólica."}, "c12_sodio_potasio": {"title": "Sodio y potasio: recomendaciones e hipertensión", "formula": "Sodio, AI adultos: 1500 mg/día (19–50 años), 1300 mg/día (51–70 años), 1200 mg/día (>70 años); UL 2300 mg/día (Valor Diario de etiqueta 2400 mg). La sal tiene ≈40 % de sodio: 1 g de sal ≈ 400 mg de Na; 1 cucharadita (6 g) ≈ 2300 mg de Na. Potasio, AI adultos: 4700 mg/día.", "caution": "Referencias superadas: las DRI de NASEM (2019) reemplazaron el UL de sodio por una CDRR de 2300 mg/día, fijaron la AI de sodio en 1500 mg/día para adultos sin escalones por edad y bajaron la AI de potasio a 3400 mg/día (hombres) y 2600 mg/día (mujeres); la FDA (2016) cambió el Valor Diario de sodio a 2300 mg.", "summary": "El sodio es el principal catión extracelular y el potasio el intracelular; alrededor del 75 % del sodio proviene de alimentos procesados, que además pierden potasio, y la combinación de restricción de sodio con dieta DASH baja la presión arterial."}, "c12_regulacion_calcemia": {"title": "Regulación hormonal de la calcemia", "formula": "↓ Ca sérico → PTH → activación de vitamina D → ↑ absorción intestinal, ↑ reabsorción renal, ↑ liberación ósea (osteoclastos). ↑ Ca sérico → calcitonina → efectos opuestos.", "summary": "La calcemia se mantiene a costa del hueso aunque la dieta sea deficiente, por lo que no refleja la ingesta; la rigidez muscular por hipercalcemia y la tetania por hipocalcemia se deben a fallos de vitamina D u hormonales, no a la dieta."}, "c12_calcio_recomendaciones": {"title": "Recomendaciones, absorción y fuentes de calcio", "formula": "AI: 1300 mg/día (9–18 años), 1000 mg/día (19–50 años), 1200 mg/día (>50 años). UL: 2500 mg/día. Absorción: ≈30 % en adultos, ≈50 % en embarazo, 50–60 % en niños y adolescentes en crecimiento. 1 taza de leche ≈ 300 mg de calcio.", "caution": "Referencia superada: el IOM (2011) convirtió la AI en RDA de 1300 mg (9–18 años), 1000 mg (19–50 años y hombres de 51–70) y 1200 mg (mujeres >50 y todos >70), con UL de 2500 mg hasta 50 años y 2000 mg desde los 51.", "summary": "Las recomendaciones buscan maximizar la masa ósea pico; la vitamina D y el ácido gástrico favorecen la absorción, mientras que fitatos y oxalatos la reducen (la espinaca aporta poco calcio absorbible)."}, "c12_osteoporosis_tipos": {"title": "Osteoporosis tipo I y tipo II", "formula": "Tipo I (posmenopáusica): 50–70 años, hueso trabecular, fracturas de muñeca y columna, razón mujeres:hombres 6:1, por caída de estrógenos. Tipo II (senil): ≥70 años, hueso trabecular y cortical, fractura de cadera, razón 2:1, por menor absorción de calcio y más caídas.", "summary": "Depende de la masa ósea pico alcanzada hacia los 30 años y de la pérdida posterior; los factores modificables son calcio y vitamina D, ejercicio con carga, peso, tabaco y alcohol, y la densitometría (DEXA) permite el diagnóstico."}, "c13_homeostasis_hierro": {"title": "Homeostasis del hierro: ferritina, transferrina, hepcidina y reciclaje", "summary": "Como el hierro casi no se excreta, el balance se regula en la absorción: la ferritina almacena, la transferrina transporta, la hemosiderina guarda el exceso, la hepcidina hepática limita absorción y liberación, y el hierro de los eritrocitos viejos se recicla."}, "c13_absorcion_hierro": {"title": "Absorción del hierro hemo y no hemo", "formula": "Absorción aproximada: hierro hemo ≈25 %, hierro no hemo ≈17 %; dieta mixta ≈18 %, dieta vegetariana ≈10 % (rango 2 % en enfermedad GI a 35 % en niños en crecimiento). Hemo ≈10 % del hierro ingerido diario.", "summary": "El hierro hemo de carnes se absorbe mejor; la absorción del no hemo aumenta con factor MFP y vitamina C y disminuye con fitatos, proteínas vegetales, calcio y polifenoles, y se ajusta según las reservas corporales."}, "c13_estadios_deficiencia_hierro": {"title": "Estadios y evaluación de la deficiencia de hierro", "formula": "1) Caen las reservas: ferritina sérica baja. 2) Cae el hierro de transporte: hierro sérico bajo, transferrina alta, saturación de transferrina baja. 3) Cae la síntesis de hemoglobina: protoporfirina eritrocitaria alta, hemoglobina y hematocrito bajos (anemia microcítica hipocrómica).", "summary": "La deficiencia de hierro progresa de depleción de reservas a anemia; hemoglobina y hematocrito son marcadores tardíos, y puede haber deficiencia sin anemia con efectos sobre conducta, rendimiento y pica."}, "c13_sobrecarga_hierro": {"title": "Sobrecarga e intoxicación por hierro (hemocromatosis)", "formula": "UL de hierro en adultos: 45 mg/día (basado en molestias GI). En niños pequeños, 5 tabletas con ≈200 mg de hierro han causado muertes.", "summary": "La hemocromatosis hereditaria, ligada a falla de la hepcidina, causa depósito de hierro y daño de órganos; se evalúa con saturación de transferrina y ferritina sérica, y la ingesta accidental de suplementos es causa importante de intoxicación infantil."}, "c13_rda_hierro": {"title": "RDA de hierro y su cálculo", "formula": "RDA: hombres 8 mg/día; mujeres 19–50 años 18 mg/día; mujeres ≥51 años 8 mg/día. Vegetarianos ×1,8 (≈14 mg/día hombres; ≈32 mg/día mujeres 19–50). Mujer 19–50: pérdidas basales 1,0 mg + menstruales 0,5 mg = 1,5 mg absorbidos/día ÷ 0,18 ≈ 8 mg (EAR), más margen → RDA 18 mg.", "summary": "La RDA se deriva de las pérdidas diarias y una absorción supuesta del 18 %, con ajuste para la menor biodisponibilidad de las dietas vegetarianas."}, "c13_zinc": {"title": "Zinc: circulación enteropancreática, deficiencia y valores de referencia", "formula": "RDA: hombres 11 mg/día; mujeres 8 mg/día. UL adultos: 40 mg/día (por interferencia con el cobre). Absorción ≈15–40 % según el estado de zinc.", "summary": "La metalotioneína intestinal regula la absorción de zinc, que recircula vía secreciones pancreáticas; su deficiencia causa retraso del crecimiento, inmadurez sexual, diarrea e inmunodeficiencia, y el exceso altera cobre y hierro."}, "c13_yodo": {"title": "Yodo: bocio, cretinismo y sal yodada", "formula": "RDA adultos: 150 µg/día; UL adultos: 1100 µg/día. Sal yodada ≈60 µg de yodo por gramo; ½ cucharadita aporta la RDA.", "summary": "La deficiencia de yodo eleva la TSH y agranda la tiroides (bocio simple) y en el embarazo causa cretinismo, la principal causa prevenible de daño cerebral; el exceso también altera la tiroides."}, "c13_fluoruro": {"title": "Flúor: fluoración del agua y fluorosis", "formula": "Fluoración del agua a 1 ppm (≈1 mg/L). AI: hombres 4 mg/día, mujeres 3 mg/día; UL adultos: 10 mg/día.", "caution": "El Servicio de Salud Pública de EE. UU. bajó en 2015 la concentración recomendada de fluoración comunitaria a 0,7 mg/L.", "summary": "El flúor forma fluorapatita en huesos y dientes y la fluoración del agua previene caries, pero el exceso durante el desarrollo dental causa fluorosis irreversible."}, "c13_fitoesteroles": {"title": "Fitoesteroles y alimentos funcionales", "formula": "Margarina con 2–3 g de fitoesteroles: reducción de colesterol de hasta ≈15 % (fármacos hipolipemiantes: >30 %).", "summary": "Los fitoesteroles compiten con la absorción del colesterol y lo reducen, ejemplo de alimento funcional que actúa como fármaco y requiere consumo sostenido."}, "c14_recomendaciones_actividad_fisica": {"title": "Recomendaciones de actividad física e intensidad", "formula": "Adultos: ≥150 min/semana de intensidad moderada o 75 min/semana vigorosa (o combinación), en episodios de ≥10 min; para beneficios adicionales, 300 min moderada o 150 min vigorosa. Fortalecimiento muscular ≥2 días/semana. Moderada: 3,5–7 kcal/min (caminar 3–4,5 mph); vigorosa: >7 kcal/min.", "caution": "Las Physical Activity Guidelines for Americans, 2.ª ed. (2018), mantienen los minutos semanales pero eliminaron el requisito de episodios de al menos 10 minutos.", "summary": "Las guías de actividad física de 2008 fijan los minutos semanales de actividad aeróbica y fortalecimiento que dan beneficios sustanciales, con una relación dosis-respuesta."}, "c14_sistema_atp_cp": {"title": "Sistema ATP-fosfocreatina y combustible según intensidad y duración", "formula": "Reposo: ATP + creatina → CP; actividad: CP → ATP + creatina. CP dura ≈10 s. Extrema 8–10 s: ATP-CP (anaeróbico); 20 s–3 min: carbohidrato anaeróbico (lactato); 3–20 min: carbohidrato aeróbico; >20 min moderada: grasa aeróbica.", "summary": "La fosfocreatina repone el ATP en los primeros segundos y luego la mezcla de combustibles pasa de glucosa anaeróbica a grasa aeróbica según la intensidad y la duración."}, "c14_glucogeno_carbohidrato": {"title": "Glucógeno y carbohidrato antes, durante y después del ejercicio", "formula": "Dieta habitual de atletas de resistencia ≈8 g CHO/kg/día (≈70 % de la energía); entrenamiento intenso 8–10 g/kg/día. Durante eventos >1 h: 30–60 g CHO/h, p. ej. 0,5–1 L/h de bebida al 4–8 %. Después: ≈60 g CHO de inmediato; dentro de 15 min la síntesis de glucógeno aumenta ≈300 %. Reservas de glucógeno <2000 kcal.", "caution": "La posición conjunta AND/Dietitians of Canada/ACSM de 2016 individualiza el carbohidrato según la carga de entrenamiento (≈3–12 g/kg/día) y admite hasta ≈90 g/h en eventos de más de 2,5 h.", "summary": "Las reservas de glucógeno limitan la resistencia; una dieta alta en carbohidrato, el aporte durante eventos largos y la ingesta temprana posterior prolongan el rendimiento y aceleran la recuperación."}, "c14_carga_carbohidratos": {"title": "Carga de carbohidratos", "formula": "6 días antes: 90 min al 70 % VO2max, 5 g CHO/kg; 4–5 días: 40 min, 5 g/kg; 2–3 días: 20 min, 10 g/kg; 1 día: descanso, 10 g/kg. Útil para esfuerzos de ≥90 min.", "summary": "Reducir el entrenamiento y aumentar el carbohidrato los últimos días casi duplica el glucógeno muscular para competencias de resistencia prolongadas."}, "c14_anemia_deportiva": {"title": "Deficiencia de hierro y anemia deportiva en atletas", "summary": "Las mujeres activas, sobre todo vegetarianas y de resistencia, tienen riesgo de deficiencia de hierro que requiere suplementación, mientras que la anemia deportiva es una caída transitoria de hemoglobina por expansión plasmática que no necesita hierro."}, "c14_hidratacion_hiponatremia": {"title": "Hidratación, golpe de calor e hiponatremia", "formula": "Pérdida de agua >2 % del peso reduce la capacidad de trabajo; ≈7 % lleva al colapso. Esquema: 2–3 h antes 2–3 tazas; 15 min antes 1–2 tazas; cada 15 min ½–1 taza; después 2 tazas por cada libra perdida. Bebidas deportivas 6–8 % de carbohidrato; >8 % puede causar molestias GI. Riesgo de hiponatremia en eventos >3 h.", "summary": "La reposición de líquidos es prioritaria en el ejercicio; en eventos prolongados hay que reponer sodio para evitar la hiponatremia por sudoración intensa o por beber agua en exceso."}, "c14_dieta_rendimiento": {"title": "Dieta de rendimiento y comidas precompetencia", "formula": "Distribución: carbohidrato 60–70 % de las kcal, grasa 20–35 %, proteína 10–20 %. Comida precompetencia: 300–800 kcal, principalmente carbohidrato, baja en grasa y fibra, terminada 3–4 h antes.", "summary": "La dieta del deportista se basa en alimentos densos en nutrientes con alto carbohidrato y energía suficiente, y las comidas previas y posteriores deben ser ligeras y ricas en carbohidrato."}, "c14_ayudas_ergogenicas": {"title": "Ayudas ergogénicas: creatina, cafeína y hormonas", "formula": "Creatina: hasta 5 g/día a corto plazo considerada segura en adultos sanos. NCAA: cafeína permitida hasta 15 mg/L en orina (≈5 tazas de café pocas horas antes).", "summary": "La creatina puede mejorar esfuerzos breves y repetidos de alta intensidad y la cafeína la resistencia, mientras que la mayoría de los demás suplementos carecen de eficacia y los esteroides, la DHEA, la androstenediona y la hGH son peligrosos y están prohibidos."}, "c15_periodos_criticos": {"title": "Periodos críticos del desarrollo fetal", "formula": "Embrión: 2–8 semanas tras la concepción; feto: 8 semanas hasta el término (38–42 semanas). Periodo crítico del tubo neural: días 17–30 de gestación.", "summary": "Fases de división celular intensa en las que una deficiencia, un exceso de nutrientes o un tóxico produce daño irreversible en el órgano que se está formando."}, "c15_folato_dtn": {"title": "Folato y prevención de defectos del tubo neural", "formula": "Mujeres en edad fértil: 400 µg (0,4 mg)/día de folato sintético (alimentos fortificados o suplemento) además del folato de la dieta; RDA en embarazo: 600 µg/día; antecedente de hijo con defecto del tubo neural: 4 mg/día por indicación médica. Iniciar 1 mes antes de la concepción y mantener en el primer trimestre; dosis ≥1 mg requieren prescripción.", "summary": "La suplementación periconcepcional con folato y la fortificación de cereales reducen la espina bífida y la anencefalia, que se producen antes de que la mujer sepa que está embarazada."}, "c15_ganancia_peso_gestacional": {"title": "Ganancia de peso recomendada en el embarazo", "formula": "Feto único según IMC pregestacional: <18,5 → 12,5–18 kg (28–40 lb); 18,5–24,9 → 11,5–16 kg (25–35 lb); 25–29,9 → 7–11,5 kg (15–25 lb); ≥30 → 5–9 kg (11–20 lb). Gemelos: 17–25 kg (peso sano), 14–23 kg (sobrepeso), 11–19 kg (obesidad). Patrón en peso normal: ≈1,6 kg (3½ lb) en el primer trimestre y ≈0,45 kg (1 lb)/semana después.", "summary": "Metas de aumento de peso del IOM 2009 según el IMC previo, que predicen el peso al nacer y limitan la retención de peso posparto."}, "c15_necesidades_embarazo": {"title": "Necesidades de energía y nutrientes en el embarazo", "formula": "Energía: +0 kcal/día (1.er trimestre), +340 kcal/día (2.º), +450 kcal/día (3.º). Proteína: +25 g/día. Carbohidrato: ideal ≥175 g/día, nunca <135 g/día. RDA: folato 600 µg/día, vitamina B12 2,6 µg/día, hierro 27 mg/día (suplemento diario en 2.º y 3.er trimestre; prenatales con 30–60 mg), zinc 11 mg/día (19–50 años) o 12 mg/día (≤18 años). La AI de calcio y de vitamina D no aumenta. Intervalo óptimo entre embarazos: 18–23 meses.", "caution": "Los valores de vitamina D y calcio son los de 1997: las DRI del IOM 2011 fijaron RDA de vitamina D de 15 µg (600 UI)/día y de calcio de 1000 mg/día (1300 mg/día en ≤18 años) para el embarazo.", "summary": "Incrementos de energía y nutrientes que exige el embarazo, con el hierro como el nutriente que casi siempre requiere suplemento."}, "c15_diabetes_gestacional": {"title": "Diabetes gestacional", "formula": "Afecta ≈1 de cada 25 embarazadas. Tamizaje: de inmediato en mujeres de alto riesgo y entre las semanas 24 y 28 en riesgo promedio. Factores de riesgo: edad ≥25 años, IMC ≥25 o ganancia excesiva, DG o recién nacido macrosómico previos, prediabetes, antecedente familiar de diabetes y etnias de alto riesgo.", "summary": "Intolerancia a la glucosa de inicio o reconocimiento en el embarazo que aumenta las complicaciones del parto y la macrosomía y predispone a diabetes tipo 2 posterior; se trata con dieta, ejercicio y, si falla, insulina."}, "c15_preeclampsia": {"title": "Hipertensión gestacional y preeclampsia", "formula": "Hipertensión gestacional: PA ≥140/90 mmHg en la segunda mitad del embarazo en una mujer sin hipertensión previa. Preeclampsia: hipertensión gestacional + proteinuria, generalmente después de la semana 20; eclampsia: convulsiones.", "caution": "La definición con proteinuria obligatoria fue superada: ACOG (2013; Practice Bulletin 222, 2020) diagnostica preeclampsia sin proteinuria si hay rasgos de gravedad, y la USPSTF (2021) recomienda aspirina a dosis baja desde la semana 12 en alto riesgo.", "summary": "Complicación materna más grave del embarazo, que reduce el flujo placentario y puede progresar a eclampsia; ningún factor dietético ha demostrado prevenirla."}, "c15_lactancia_materna": {"title": "Lactancia: necesidades maternas y contraindicaciones", "formula": "Producción ≈25 oz (≈750 mL) de leche/día. Energía: +330 kcal/día (primeros 6 meses) y +400 kcal/día (segundos 6 meses), con el resto aportado por la grasa gestacional; ingesta mínima ≈1800 kcal/día. AI de agua total: 3,8 L/día (≈3,1 L de bebidas). Tras una bebida alcohólica ocasional, esperar ≥2 h para amamantar; cafeína equivalente a 1–2 tazas de café/día.", "caution": "El libro contraindica la lactancia en madres con VIH en países desarrollados; la OMS (2016) y la AAP (2024) apoyan amamantar con tratamiento antirretroviral y carga viral suprimida, mediante decisión compartida.", "summary": "Energía, líquidos y nutrientes que necesita la madre lactante, en general las carencias reducen el volumen y no la calidad de la leche, y situaciones y sustancias incompatibles con amamantar."}, "c15_sindrome_alcoholico_fetal": {"title": "Síndrome alcohólico fetal", "formula": "El daño más grave ocurre antes de completarse la placenta (≈12 semanas); no existe una dosis segura establecida: abstinencia desde que se planea el embarazo.", "summary": "Extremo grave del espectro de trastornos por exposición prenatal al alcohol (retraso del crecimiento, daño del sistema nervioso central y rasgos faciales), prevenible pero no tratable."}, "c16_energia_lactante": {"title": "Crecimiento y necesidad energética del lactante", "formula": "Peso al nacer ×2 hacia los 5 meses y ×3 al año; talla +≈25 cm (10 in) en el primer año. Energía ≈100 kcal/kg/día (≈45 kcal/lb) frente a <40 kcal/kg/día del adulto; ≈450 kcal/día en el recién nacido. El cerebro del lactante consume ≈60 % de la energía diaria.", "caution": "El ejemplo de percentiles usa las curvas CDC 2000; desde 2010 los CDC recomiendan los patrones de crecimiento OMS 2006 para menores de 2 años.", "summary": "El crecimiento es el principal indicador del estado nutricional del lactante, cuya necesidad de energía por kilo duplica la del adulto y se vigila con curvas de percentiles."}, "c16_leche_materna": {"title": "Leche materna y suplementos del lactante", "formula": "Lactancia exclusiva 6 meses y continuada con alimentos complementarios ≥12 meses (AAP, ADA, CPS); 8–12 tomas/día a demanda en las primeras semanas. Vitamina D suplementaria a todo lactante con lactancia exclusiva o que tome <1 L/día de fórmula fortificada; vitamina K en dosis única al nacer; hierro adicional desde los 6 meses; flúor desde los 6 meses si el agua tiene <0,3 ppm.", "summary": "Composición (lactosa, alfa-lactoalbúmina, DHA, hierro y zinc biodisponibles) y factores protectores (anticuerpos, oligosacáridos, lactoferrina) que hacen de la leche humana el alimento de referencia, con sus suplementos necesarios."}, "c16_alimentacion_complementaria": {"title": "Alimentación complementaria y leche de vaca", "formula": "Sólidos entre los 4 y 6 meses según madurez; alimentos de un solo ingrediente, uno nuevo cada 3–5 días (cereal de arroz primero, trigo al final). Sin miel ni jarabe de maíz antes del año (botulismo). Jugo: 4–6 oz (≈120–180 mL)/día de 1 a 6 años, diluido y en taza. Leche entera de vaca no antes de los 12 meses; leche entera de 1 a 2 años; al año, 2–3 tazas/día.", "caution": "La NIAID (2017) recomienda introducir el maní temprano (desde 4–6 meses en lactantes de riesgo) en lugar de retrasar alérgenos, y la AAP (2017) desaconseja el jugo antes de los 12 meses y lo limita a 4 oz/día entre 1 y 3 años.", "summary": "Momento, orden y selección de los primeros alimentos para cubrir hierro y vitamina C, detectar alergias y evitar la anemia por leche de vaca, el atragantamiento y el botulismo."}, "c16_necesidades_ninez": {"title": "Necesidades nutricionales en la niñez", "formula": "Energía ≈800 kcal/día a 1 año, ≈2000 kcal/día a los 10 años si es activo. Grasa: 30–40 % de la energía (1–3 años) y 25–35 % (4–18 años). AI de fibra: 19 g (1–3 años), 25 g (4–8), 31 g varones / 26 g mujeres (9–13), 38 g / 26 g (14–18). Hierro: 7–10 mg/día para prevenir la deficiencia. Vitamina D: suplemento de 10 µg (400 UI)/día si no se alcanza con leche y alimentos fortificados (AAP 2008).", "caution": "Las DRI del IOM 2011 fijaron la RDA de vitamina D en 15 µg (600 UI)/día a partir del año de edad; la cifra de 10 µg/día sigue vigente solo para lactantes (AI).", "summary": "Las necesidades totales crecen con la edad mientras las necesidades por kilo bajan; hierro y vitamina D son los nutrientes que con más frecuencia faltan."}, "c16_plomo_hierro": {"title": "Deficiencia de hierro e intoxicación por plomo", "formula": "Plomo en sangre reconocido como dañino: 10 µg/dL (con posibles efectos por debajo). Tamizaje en comunidades con muchas viviendas anteriores a 1950 o con muchos niños con plomo elevado.", "caution": "El umbral de 10 µg/dL fue reemplazado por el valor de referencia de los CDC de 5 µg/dL (2012), reducido a 3,5 µg/dL en 2021.", "summary": "La deficiencia de hierro altera la atención y el aprendizaje y aumenta la absorción de plomo, cuya anemia y síntomas inespecíficos pueden confundirse con una simple ferropenia."}, "c16_obesidad_infantil": {"title": "Obesidad infantil: definición y tratamiento", "formula": "IMC para la edad (2–20 años): sobrepeso >percentil 85; obesidad ≥percentil 95 (o IMC ≥30 si es menor); obesidad grave ≥percentil 99. <2 años: peso para la talla >percentil 95 = sobrepeso. Cirugía en adolescentes: madurez física, IMC ≥50 o ≥40 con comorbilidad importante, fracaso de un programa formal de 6 meses y capacidad de adherencia.", "caution": "La guía de práctica clínica de la AAP 2023 define la obesidad grave como ≥120 % del percentil 95, recomienda farmacoterapia desde los 12 años y evaluación quirúrgica desde los 13 años con obesidad grave; la sibutramina fue retirada en 2010.", "summary": "Criterios por percentiles de IMC y abordaje escalonado centrado en frenar la ganancia de peso mientras el niño crece, con dieta, actividad, apoyo familiar y conducta antes que fármacos o cirugía."}, "c16_hierro_calcio_adolescencia": {"title": "Hierro y calcio en la adolescencia", "formula": "RDA de hierro: varones 9–13 años 8 mg/día (10,9 en estirón), 14–18 años 11 mg/día (13,9 en estirón); mujeres 9–13 años 8 mg/día (10,5 si ya menstrúan; 11,6 con menarquia y estirón), 14–18 años 15 mg/día (16,1 en estirón). AI de calcio 9–13 años: 1300 mg/día. Vitamina D: 10 µg (400 UI)/día por suplemento si no se cubre con alimentos (AAP).", "caution": "Las DRI del IOM 2011 convirtieron el calcio en RDA de 1300 mg/día para 9–18 años y elevaron la RDA de vitamina D a 15 µg (600 UI)/día.", "summary": "El estirón, la masa magra y la menstruación elevan las necesidades de hierro, y la formación de masa ósea pico hace del calcio un nutriente crítico, sobre todo en las adolescentes."}, "c16_lipidos_pediatricos": {"title": "Colesterol en niños y adolescentes", "formula": "2–18 años, colesterol total / LDL: aceptable <170 / <110 mg/dL; limítrofe 170–199 / 110–129 mg/dL; alto ≥200 / ≥130 mg/dL. Dieta (4–18 años): grasa 25–35 % de la energía, saturada <10 %, colesterol <300 mg/día. Fármacos si la hipercolesterolemia persiste tras la dieta a partir de los 8 años.", "caution": "El libro propone tamizaje selectivo; el panel de expertos NHLBI 2011 recomienda tamizaje lipídico universal a los 9–11 y a los 17–21 años.", "summary": "Puntos de corte de colesterol pediátrico y estrategia de dieta primero y fármacos después para frenar la aterosclerosis que comienza en la niñez."}, "c17_restriccion_energetica": {"title": "Restricción energética y longevidad", "formula": "Animales: ingesta energética ≈70 % de la normal, sin malnutrición, prolonga la vida; humanos: reducir la ingesta habitual un 10–20 % mejora peso, grasa corporal, presión arterial, lípidos y respuesta insulínica.", "summary": "La restricción energética nutricionalmente adecuada alarga la vida en animales, probablemente al reducir el estrés oxidativo y modificar la expresión génica, pero en humanos solo se apoya una moderación de la ingesta."}, "c17_peso_imc_mayores": {"title": "Peso corporal e IMC en adultos mayores", "formula": "Adultos >65 años: el riesgo para la salud no se hace evidente hasta un IMC ≥27, y la relación se atenúa hasta desaparecer hacia los 75 años; en personas con bajo peso, una pérdida de solo el 5 % aumenta el riesgo de enfermedad y muerte prematura.", "summary": "En la vejez el bajo peso y la pérdida involuntaria de peso suelen ser más peligrosos que el sobrepeso moderado, aunque la obesidad sigue causando complicaciones."}, "c17_sarcopenia": {"title": "Sarcopenia", "summary": "Pérdida de masa, fuerza y calidad del músculo esquelético con la edad que favorece caídas y dependencia; se atenúa con proteína suficiente y entrenamiento de fuerza, y sus factores de riesgo incluyen pérdida de peso, sedentarismo, tabaquismo y obesidad inflamatoria."}, "c17_hidratacion_mayores": {"title": "Hidratación en el adulto mayor", "formula": "Adultos ≥51 años: bebidas ≈13 tazas/día (hombres) y ≈9 tazas/día (mujeres); como mínimo, 6 vasos de agua u otras bebidas al día.", "summary": "La menor sensación de sed y la disminución del agua corporal total hacen que la deshidratación sea frecuente en mayores y se manifieste con confusión, infecciones urinarias, neumonía o úlceras por presión."}, "c17_eer_mayores": {"title": "Estimación de las necesidades energéticas del adulto mayor", "formula": "EER (adulto >30 años) ≈ valor tabulado para 30 años (Apéndice F) − 7 kcal/día (mujeres) o − 10 kcal/día (hombres) por cada año por encima de 30. Contexto: las necesidades energéticas bajan ≈5 % por década y el metabolismo basal 1–2 % por década.", "caution": "Las ecuaciones EER de 2002/2005 en que se basan las tablas fueron reemplazadas por las ecuaciones EER de NASEM 2023.", "summary": "Como el gasto energético cae con la pérdida de masa magra y de actividad, el adulto mayor necesita menos kilocalorías y alimentos de alta densidad nutricional para cubrir requerimientos que no disminuyen."}, "c17_gastritis_atrofica_b12": {"title": "Gastritis atrófica y deficiencia de vitamina B12", "formula": "Gastritis atrófica en ≈10–30 % de los adultos >50 años; RDA de B12 igual a la de adultos jóvenes, pero obtener la mayor parte de la ingesta de alimentos fortificados o suplementos.", "summary": "La falta de ácido clorhídrico y factor intrínseco y el sobrecrecimiento bacteriano reducen la absorción de vitamina B12 (y de folato, biotina, calcio, hierro y zinc), con riesgo de anemia, deterioro cognitivo y daño neurológico."}, "c17_vitamina_d_calcio_mayores": {"title": "Vitamina D y calcio en la vejez", "formula": "Vitamina D: 10 µg/día (51–70 años) y 15 µg/día (>70 años). Calc
